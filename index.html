function openRecon(pid, aid) {
  const p = findParty(pid), a = findAcc(p, aid);
  modal('مطابقة كشف ' + p.name, `
    <div class="note">الزق كشف المورد هنا (تاريخ · بيان · مبلغ) والبرنامج يقارنه بحسابك ويطلعلك الفروق.
      من إكسل: حدد الأعمدة وانسخ، أو اكتبهم بإيدك كل سطر لوحده.</div>
    <textarea id="rcPaste" style="font-family:monospace;font-size:12px;direction:ltr;text-align:left;min-height:150px"
      placeholder="01/09/2026&#9;فاتورة طوب&#9;12500&#10;05/09/2026&#9;فاتورة أسمنت&#9;8400" oninput="reconRun('${pid}','${aid}')"></textarea>
    <div id="rcRes"></div>`,
    `<button class="btn" onclick="closeModal()">إغلاق</button>`, true);
}
function reconRun(pid, aid) {
  const a = findAcc(findParty(pid), aid);
  const txt = ($('#rcPaste').value || '').replace(/\r/g, '').trim();
  const box = $('#rcRes');
  if (!txt) { box.innerHTML = ''; return; }
  const theirs = [];
  txt.split('\n').forEach(l => {
    if (!l.trim()) return;
    const cells = l.indexOf('\t') > -1 ? l.split('\t') : l.split(/\s{2,}|,/);
    let date = '', desc = '', amt = 0;
    cells.forEach(c => {
      c = c.trim();
      const d = parseFlexibleDate(c);
      if (d && !date) { date = d; return; }
      const n = num(c);
      if (n && !amt && /^[\d.,\s]+$/.test(toEnDigits(c))) { amt = n; return; }
      if (c && !desc) desc = c;
    });
    if (amt) theirs.push({ date, desc, amt });
  });
  /* بنطابق البنود (الفواتير) — السدادات مش في كشف المورد عادة */
  const mine = a.items.map(i => ({ i, amt: itemNet(i), date: i.date, used: false }));
  const matched = [], diff = [], missing = [];
  theirs.forEach(t => {
    let m = mine.find(x => !x.used && Math.abs(x.amt - t.amt) < 1 && (!t.date || !x.date || Math.abs(daysBetween(x.date, t.date)) <= 7));
    if (m) { m.used = true; matched.push({ t, m }); return; }
    m = mine.find(x => !x.used && t.date && x.date && Math.abs(daysBetween(x.date, t.date)) <= 3 && Math.abs(x.amt - t.amt) / Math.max(x.amt, t.amt) < 0.25);
    if (m) { m.used = true; diff.push({ t, m }); return; }
    missing.push(t);
  });
  const extra = mine.filter(x => !x.used);
  const tTot = theirs.reduce((s, t) => s + t.amt, 0);
  const myTot = mine.reduce((s, x) => s + x.amt, 0);
  box.innerHTML = `
    <div class="calc-box" style="margin-top:12px">
      <div class="ln"><span>إجمالي كشفه</span><b class="num">${fmt2(tTot)}</b></div>
      <div class="ln"><span>إجمالي حسابك</span><b class="num">${fmt2(myTot)}</b></div>
      <div class="ln tot"><span>${Math.abs(tTot - myTot) < 1 ? 'مطابق ✓' : 'الفرق'}</span>
        <span class="num" style="color:${Math.abs(tTot - myTot) < 1 ? 'var(--emer)' : 'var(--red)'}">${fmt2(Math.abs(tTot - myTot))} ج.م</span></div>
    </div>
    <div style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap">
      <span class="chip emer">مطابق ${matched.length}</span>
      <span class="chip amber">مبلغ مختلف ${diff.length}</span>
      <span class="chip red">عنده وماعندكش ${missing.length}</span>
      <span class="chip blue">عندك وماعندهوش ${extra.length}</span>
    </div>
    ${diff.length ? `<div style="font-weight:700;color:var(--amber);margin-bottom:5px">فواتير المبلغ مختلف فيها</div>
      <div class="imp-prev"><table><thead><tr><th>التاريخ</th><th>البيان</th><th class="num">عنده</th><th class="num">عندك</th><th class="num">الفرق</th></tr></thead>
      <tbody>${diff.map(x => `<tr><td>${dsp(x.t.date)}</td><td>${esc(x.t.desc || x.m.i.desc)}</td>
        <td class="num">${fmt2(x.t.amt)}</td><td class="num">${fmt2(x.m.amt)}</td>
        <td class="num" style="color:var(--red)"><b>${fmt2(x.t.amt - x.m.amt)}</b></td></tr>`).join('')}</tbody></table></div>` : ''}
    ${missing.length ? `<div style="font-weight:700;color:var(--red);margin:12px 0 5px">فواتير عنده مش مسجّلة عندك</div>
      <div class="imp-prev"><table><thead><tr><th>التاريخ</th><th>البيان</th><th class="num">المبلغ</th><th style="width:90px"></th></tr></thead>
      <tbody>${missing.map((x, i) => `<tr><td>${dsp(x.date)}</td><td>${esc(x.desc)}</td><td class="num">${fmt2(x.amt)}</td>
        <td><button class="btn sm navy" onclick="addMissing('${pid}','${aid}','${esc(x.date)}','${esc((x.desc || '').replace(/'/g, ''))}',${x.amt})">أضف</button></td></tr>`).join('')}</tbody></table></div>` : ''}
    ${extra.length ? `<div style="font-weight:700;color:var(--blue);margin:12px 0 5px">فواتير عندك مش في كشفه</div>
      <div class="imp-prev"><table><thead><tr><th>التاريخ</th><th>البيان</th><th class="num">المبلغ</th></tr></thead>
      <tbody>${extra.map(x => `<tr><td>${dsp(x.date)}</td><td>${esc(x.i.desc)}</td><td class="num">${fmt2(x.amt)}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
}
function addMissing(pid, aid, date, desc, amt) {
  const a = findAcc(findParty(pid), aid);
  if (lockGuard(date, 'مينفعش تضيف فاتورة في فترة مقفولة')) return;
  snapshot();
  a.items.push({
    id: uid(), date, desc: desc || 'فاتورة من كشف المورد', loc: a.project, qty: 1, unit: '',
    price: amt, amount: amt, pct: 100, retention: 0, advanceDeduction: 0, deductions: 0, cumTo: 0, photo: '', link: ''
  });
  logAction('item', 'إضافة فاتورة من مطابقة كشف ' + findParty(pid).name + ' — ' + fmt(amt));
  save();

  toast('اتضافت ✓', 'ok');
}

/* ================= فحص البيانات =================
   الحاجات اللي بتخلي التقارير تطلع غلط من غير ما تاخد بالك. */
function badDate(d) {
  if (!d) return false;
  const y = +String(d).slice(0, 4);
  if (!y) return true;
  const now = new Date().getFullYear();
  return y < 2015 || y > now + 2;
}
function dataIssues() {
  const o = {
    badDates: [], mismatch: [], noMethod: [], noUnitItems: [], noDate: [], noProjItems: [],
    noAgree: [], mismatchProj: [], dupDesc: []
  };
  DB.parties.forEach(p => p.accounts.forEach(a => {
    if (a.refOnly || isCarry(p)) return;
    if (a.mode === 'open' && accPaid(a) > 0) o.noAgree.push({ p, a, paid: accPaid(a) });
    a.items.forEach(i => {
      if (badDate(i.date)) o.badDates.push({ p, a, k: 'w', r: i });
      else if (!i.date) o.noDate.push({ p, a, k: 'w', r: i });
      if (priceMismatch(i)) o.mismatch.push({ p, a, i });
      if (!effUnit(i) && num(i.qty) > 1) o.noUnitItems.push({ p, a, i });
    });
    a.payments.forEach(y => {
      if (badDate(y.date)) o.badDates.push({ p, a, k: 'p', r: y });
      else if (!y.date) o.noDate.push({ p, a, k: 'p', r: y });
      if (!(y.method || '').trim()) o.noMethod.push({ p, a, y });
    });
  }));
  o.noProjItems = unassignedItems();
  o.mismatchProj = projMismatchItems();
  o.total = o.badDates.length + o.mismatch.length + o.noMethod.length + o.noDate.length
    + o.noProjItems.length + o.mismatchProj.length;
  return o;
}

function openFixRate(pid, aid, iid, allToo) {

  if (!i) return;
  const q = num(i.qty), pr = num(i.price), am = num(i.amount);
  const fromAmount = Math.round(am / q * 100) / 100;
  const fromQty = Math.round(q * pr * 100) / 100;
  const n = allToo ? dataIssues().mismatch.length : 0;
  modal('بند حسابه مش مظبوط', `
    <div class="note"><b>${esc(p.name)}</b> — ${esc(i.desc || '—')}${i.date ? ' يوم ' + dsp(i.date) : ''}<br>
      مكتوب: <b class="num">${fmt2(q)}</b> × <b class="num">${fmt2(pr)}</b> = <b class="num">${fmt2(fromQty)}</b>،
      بس المبلغ المسجّل <b class="num">${fmt2(am)}</b>.</div>

      <select id="fxMode">
        <option value="price">صلّح سعر الوحدة → ${fmt2(fromAmount)} (المبلغ يفضل ${fmt2(am)}) — الأضمن</option>
        <option value="qty">صلّح الكمية → ${fmt2(Math.round(am / pr * 100) / 100)} (لو انت متأكد إن سعر الوحدة ${fmt2(pr)} صح)</option>
        <option value="amount">صلّح المبلغ → ${fmt2(fromQty)} (سعر الوحدة يفضل ${fmt2(pr)}) — ده بيغيّر الرصيد</option>
      </select></div>
    <div id="fxWarn" class="hint-k"></div>
    ${n > 1 ? `<label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:700;cursor:pointer">
      <input type="checkbox" id="fxAll" style="width:auto"> طبّق نفس الطريقة على الـ${n} بند كلهم</label>` : ''}`,
    `<button class="btn navy" onclick="doFixRate('${pid}','${aid}','${iid}')">صلّح</button>
     <button class="btn" onclick="closeModal()">إلغاء</button>`);
  const sel = $('#fxMode');
  if (sel) sel.onchange = () => {
    const w = $('#fxWarn');
    if (w) w.innerHTML = sel.value === 'amount'
      ? '<b style="color:var(--red)">تحذير: ده هيغيّر مستحقات ' + esc(p.name) + ' بـ ' + fmt2(fromQty - am) + ' ج.م</b>'
      : sel.value === 'qty'
        ? 'الرصيد مش هيتغير — بس الكمية بتتغير فالكميات المجمّعة هتتأثر.'
        : 'الرصيد مش هيتغير.';
  };
}
function doFixRate(pid, aid, iid) {
  const mode = sval('fxMode');
  const all = !!($('#fxAll') && $('#fxAll').checked);
  const list = all ? dataIssues().mismatch : (() => {
    const p = findParty(pid), a = findAcc(p, aid), i = a.items.find(x => x.id === iid);
    return i ? [{ p, a, i }] : [];
  })();
  if (!list.length) { closeModal(); return; }
  snapshot();
  let n = 0;
  list.forEach(x => {
    const q = num(x.i.qty), pr = num(x.i.price), am = num(x.i.amount);
    if (!q) return;
    if (mode === 'amount') x.i.amount = Math.round(q * pr * 100) / 100;
    else if (mode === 'qty') { if (!pr) return; x.i.qty = Math.round(am / pr * 100) / 100; }
    else x.i.price = Math.round(am / q * 100) / 100;
    n++;
  });
  logAction('item', 'تصحيح ' + n + ' بند — ' + (mode === 'amount' ? 'المبلغ من الكمية × السعر'
    : mode === 'qty' ? 'الكمية من المبلغ ÷ السعر' : 'سعر الوحدة من المبلغ ÷ الكمية'));
  save(); closeModal(); render();
  toast('اتصلّح ' + n + ' بند ✓', 'ok');
}

     <button class="btn" onclick="closeModal()">إلغاء</button>`, true);
}
function doMigMethods() {
  const g = window._mgm || [];
  const plan = [];
  g.forEach((x, k) => {
    const m = sval('mgm' + k), r = sval('mgr' + k), d = sval('mgd' + k);
    plan.push({ x, m, r, d });
  });
  if (!plan.length) { closeModal(); return; }
  const before = DB.parties.reduce((s, p) => s + partyTotals(p).rem, 0);
  const beforePaid = DB.parties.reduce((s, p) => s + partyTotals(p).paid, 0);
  snapshot();
  let n = 0;
  plan.forEach(o => {
    o.x.rows.forEach(z => {
      /* النص الأصلي يتحفظ في البيان قبل ما نغيّر الخانة — عشان مفيش معلومة تضيع */
      if (o.d === 'note') {
        const cur = (z.y.note || '').trim();
        if (cur.indexOf(o.x.raw) < 0) z.y.note = cur ? cur + ' · ' + o.x.raw : o.x.raw;
      }
      if (o.m) z.y.method = o.m;
      if (o.r) z.y.recv = o.r;
      z.y.treasury = z.y.treasury || methodTreasury(o.m);
      n++;
    });
  });
  /* فحص: الترحيل ده مالوش حق يلمس أي مبلغ */
  const after = DB.parties.reduce((s, p) => s + partyTotals(p).rem, 0);
  const afterPaid = DB.parties.reduce((s, p) => s + partyTotals(p).paid, 0);
  if (Math.abs(after - before) > 0.01 || Math.abs(afterPaid - beforePaid) > 0.01) {
    undo();
    return modal('اتلغى', `<div class="note" style="border-color:#FCA5A5;background:#FEF2F2">
      الترحيل كان هيغيّر أرقام — فالبرنامج رجّع كل حاجة زي ما كانت ومعملش حاجة.</div>`,
      '<button class="btn" onclick="closeModal()">تمام</button>');
  }
  logAction('pay', 'ترحيل طرق السداد لـ ' + n + ' حركة (' + plan.length + ' قيمة)');
  save(); closeModal(); render();
  toast('اتظبّط ' + n + ' سداد ✓ — الأرصدة زي ما هي', 'ok');
}

/* ================= تكميل الوحدة =================
   أي خانة وحدة (مربوطة بقايمة وحدات): «مق» + Tab ← «مقطوعية». */
const unitNorm = s => toEnDigits(String(s || '')).trim().replace(/\s+/g, '')
  .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/²/g, '2').replace(/³/g, '3').toLowerCase();
function unitCandidates() {
  const cnt = {};
  UNITS.forEach((u, k) => { cnt[u] = (cnt[u] || 0) + 0.001 * (UNITS.length - k); });   // ترتيب القايمة لو مفيش استخدام
  (DB.parties || []).forEach(p => (p.accounts || []).forEach(a => (a.items || []).forEach(it => {
    const u = String(it.unit || '').trim(); if (u) cnt[u] = (cnt[u] || 0) + 1;
  })));
  return Object.keys(cnt).sort((x, y) => cnt[y] - cnt[x]);
}
function completeUnit(v) {
  const n = unitNorm(v); if (!n) return v;
  const all = unitCandidates();

            ${x.open ? `<button class="btn sm" onclick="dupClose();closeModal();${x.open}">افتحه</button>` : ''}</div>`).join('')}
          ${items.length > 8 ? `<div style="padding:7px 12px;font-size:12px;color:var(--mut)">و${items.length - 8} كمان…</div>` : ''}
        </div>
        <div style="font-size:13.5px;margin-top:11px;font-weight:700">تحب تضيفه برضه؟</div>
      </div>
      <div class="modal-f">
        <button class="btn gold" id="dupYes" onclick="DUP.proceed()">أيوه، ضيفه برضه</button>
        <button class="btn" id="dupNo" onclick="dupClose()">لا، ارجع أعدّل</button>
      </div></div></div>`;
  setTimeout(() => { const b = $('#dupNo'); if (b) b.focus(); }, 30);
  return true;
}
function dupClose() { const r = $('#dupRoot'); if (r) r.innerHTML = ''; }
/* وهي مفتوحة: Esc = لا، Enter = الزرار اللي عليه التحديد — ومايوصلوش للفورم اللي ورا */
window.addEventListener('keydown', e => {
  const r = $('#dupRoot'); if (!r || !r.innerHTML) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); dupClose(); }
  else if (e.key === 'Enter') {
    e.preventDefault(); e.stopImmediatePropagation();
    const f = document.activeElement; if (f && r.contains(f) && f.tagName === 'BUTTON') f.click(); else dupClose();
  }
}, true);

/* رسائل ويندوز بتوقف البرنامج لحد ما ترد عليها — دي بديلة مش بتوقف حاجة */
function askYesNo(title, msg, onYes, yesLabel, danger) {
  window._askYes = () => { $('#modalRoot').innerHTML = ''; try { onYes(); } catch (e) { logErr('ask', e.message); showCrash(e.message); } };
  $('#modalRoot').innerHTML = `<div class="ov"><div class="modal" style="max-width:440px">
    <div class="modal-h"><span class="t">${esc(title)}</span></div>
    <div class="modal-b"><div style="font-size:14px;line-height:1.8">${msg}</div></div>
    <div class="modal-f">
      <button class="btn ${danger ? 'danger' : 'navy'}" id="askYesBtn" onclick="_askYes()">${esc(yesLabel || 'نعم')}</button>
      <button class="btn" onclick="closeModal()">إلغاء</button>
    </div></div></div>`;
  setTimeout(() => { const b = $('#askYesBtn'); if (b) b.focus(); }, 50);
}


/* ================= إضافة بند باختيار المشروع أولاً ================= */
/* الحساب "يغطي" مشروع معين لو: مشروعه نفسه (أو أحد أجزائه لو مجمّع)، أو عنده بنود مؤكد إنها للمشروع ده */
function accCoversProject(a, projName) {
  if (a.refOnly) return false;
  const tokens = splitTokens(a.project).map(canonProject);
  if (tokens.indexOf(projName) > -1) return true;
  return a.items.some(i => (i.proj || '').trim() && canonProject(i.proj) === projName);
}
function accountsForProject(p, projName) {
  return p.accounts.filter(a => accCoversProject(a, projName));
}

function qiCalc() {
  const q = mval('qiQty'), pr = mval('qiPrice');
  const amtEl = $('#qiAmount'); if (!amtEl) return;
  const auto = q && pr ? q * pr : 0;
  const typed = num(amtEl.value);
  if (auto && (typed === 0 || Math.abs(typed - (window._qiAuto || 0)) < 0.005)) amtEl.value = fmtMoney(Math.round(auto * 100) / 100);
  window._qiAuto = num(amtEl.value);
}
function qiProjChange(pid) {

    box.innerHTML = `<div class="note" style="background:#F0FDF4;border-color:#BBF7D0;color:#065F46">✓ هيتسجل في حساب: <b>${esc(matches[0].name)}</b></div>`;

  } else {

function saveQuickItem(pid) {

}

function puCalc() {

  if (auto && (typed === 0 || Math.abs(typed - (window._puAuto || 0)) < 0.005)) amtEl.value = fmtMoney(Math.round(auto * 100) / 100);

function puResolve() {

function savePurchase() {
  let sid = sval('puSup');
  const proj = sval('puProj') ? canonProject(sval('puProj')) : '';
  const desc = sval('puDesc'), amount = mval('puAmount'), date = dval('puDate');
  if (!proj) return toast('اختار المشروع', 'err');
  if (!desc) return toast('اكتب المادة', 'err');
  if (!amount) return toast('اكتب الإجمالي', 'err');
  if (lockGuard(date)) return;
  if (sid === '__new' && sval('puNewName') && dupAsk('party|' + sval('puNewName'), 'فيه اسم شبه <b>' + esc(sval('puNewName')) + '</b> متسجل — يمكن تختاره من القايمة بدل ما تعمله جديد:', simParties(sval('puNewName')), () => savePurchase())) return;
  if (sid && sid !== '__new' && dupAsk('item|' + desc + '|' + amount, 'التوريد <b>' + esc(desc) + '</b> بنفس المبلغ متسجل قبل كده عند ' + esc(findParty(sid).name) + ':', simItems(findParty(sid), desc, amount), () => savePurchase())) return;
  snapshot();
  let p;
  if (sid === '__new') {
    const nm = sval('puNewName'); if (!nm) { undoStack.pop(); return toast('اكتب اسم المورد الجديد', 'err'); }
    p = normalizeParty({ name: nm, type: 'supplier', trade: '', phone: '', note: '', accounts: [] });
    DB.parties.push(p); sid = p.id;
    logAction('party', 'مورد جديد: ' + nm);
  } else {
    if (!sid) { undoStack.pop(); return toast('اختار المورد', 'err'); }
    p = findParty(sid);
  }
  const matches = accountsForProject(p, proj);
  let aid;
  if (matches.length === 1) aid = matches[0].id;
  else if (matches.length > 1) { aid = sval('puAccSel') || matches[0].id; }
  else {
    const a = normalizeAcc({ name: 'توريد ' + proj, project: proj, mode: 'items', items: [], payments: [] });
    p.accounts.push(a); aid = a.id;
    logAction('account', 'حساب توريد جديد لـ ' + p.name + ' في ' + proj);
  }
  const a = findAcc(p, aid);
  const qty = mval('puQty'), unit = sval('puUnit'), price = mval('puPrice');
  a.items.push({
    id: uid(), date, desc, loc: '', proj, qty: qty || 1, unit, price: price || amount, amount, pct: 100,
    retention: 0, advanceDeduction: 0, deductions: 0, cumTo: 0, photo: '', link: ''
  });
  if (unit) p.lastUnit = unit;
  let paidMsg = '';
  if ($('#puPay') && $('#puPay').checked) {
    const paid = mval('puPaid');
    if (paid > 0) {
      const m = sval('puMethod');
      a.payments.push({ id: uid(), date, amount: paid, method: m, note: 'دفعة عن ' + desc, kind: 'pay', treasury: methodTreasury(m), cheque: '', photo: '', link: '' });
      paidMsg = ' ودُفع ' + fmt(paid);
    }
  }
  logAction('item', 'مشترى من ' + p.name + ' في ' + proj + ': ' + desc + ' — ' + fmt(amount) + paidMsg);
  save(); closeModal();
  go('party', sid, aid);

/* ================= صرفية اليوم =================
   سدادات لأكتر من مقاول/مورد في نفس اليوم ومن نفس الخزنة — حفظة واحدة.
   كل سطر بيتحفظ كسداد عادي في حسابه، زي ما لو سجلته من نافذة السداد. */
function batchParties() {
  return DB.parties.filter(p => p.accounts.some(a => !a.refOnly))
    .map(p => ({ p, rem: partyTotals(p).rem }))
    .sort((x, y) => y.rem - x.rem);
}
function openBatchPay() {
  const list = batchParties();

  window._bpList = list;
  window._bpRows = 0;
  modal('صرفية اليوم', `
    <div class="note">سجّل سدادات اليوم لأكتر من واحد مرة واحدة. التاريخ والخزنة وطريقة الدفع بتتكتب مرة واحدة فوق،
      وكل سطر بيروح لحسابه. البرنامج هينبهك لو سطر شكله مكرر.</div>
    <div class="grid3">
      <div class="f"><label>تاريخ الصرف</label><input id="bpDate" data-date value="${dsp(todayISO())}"></div>
      <div class="f"><label>طريقة الدفع</label><input id="bpMethod" list="bpMeth" value="نقدي باليد" oninput="bpSyncTre()">

      <table><thead><tr>
        <th style="width:34%">المقاول / المورد</th><th style="width:28%">الحساب</th>
        <th style="width:18%">المبلغ</th><th>بيان</th><th style="width:34px"></th></tr></thead>
        <tbody id="bpBody"></tbody></table>
    </div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap">
      <button type="button" class="btn sm" onclick="bpAddRow()">+ سطر</button>
      <div class="spacer" style="flex:1"></div>
      <div id="bpTot" style="font-weight:800;font-size:16px;color:var(--navy)"></div>
    </div>
    <div id="bpWarn" style="margin-top:8px"></div>`,
    `<button class="btn gold" onclick="saveBatchPay()">احفظ الصرفية كلها</button>
     <button class="btn" onclick="closeModal()">إلغاء</button>`, true);

function bpAddRow(pid) {
  const i = window._bpRows++;
  const list = window._bpList || [];
  const opts = list.map(x => `<option value="${x.p.id}" ${pid === x.p.id ? 'selected' : ''}>${esc(x.p.name)}${Math.abs(x.rem) > 0.5 ? ' — ' + balState(x.rem).txt + ' ' + fmt(Math.abs(x.rem)) : ''}</option>`).join('');
  const tb = $('#bpBody'); if (!tb) return;
  tb.insertAdjacentHTML('beforeend', `<tr id="bpR${i}">
    <td><select id="bpP${i}" onchange="bpAccs(${i});bpCalc()"><option value="">— اختار —</option>${opts}</select></td>
    <td><select id="bpA${i}" onchange="bpCalc()"><option value="">—</option></select></td>
    <td><input id="bpV${i}" class="money" data-money oninput="bpCalc()" placeholder="0"></td>
    <td><input id="bpN${i}" placeholder="تحت حساب…"></td>
    <td><button type="button" class="btn sm ghost" title="شيل السطر" onclick="bpDel(${i})">✕</button></td></tr>`);
  const row = $('#bpR' + i);
  if (row) wireInputs(row);          // الأرقام بالفواصل والمعادلات في السطر الجديد
  if (pid) bpAccs(i);
}
function bpDel(i) { const r = $('#bpR' + i); if (r) r.remove(); bpCalc(); }
function bpAccs(i) {
  const pid = ($('#bpP' + i) || {}).value, sel = $('#bpA' + i);
  if (!sel) return;
  if (!pid) { sel.innerHTML = '<option value="">—</option>'; return; }
  const p = findParty(pid);
  const accs = p.accounts.filter(a => !a.refOnly)
    .map(a => ({ a, rem: accRem(a) })).sort((x, y) => y.rem - x.rem);
  sel.innerHTML = accs.map(x => `<option value="${x.a.id}">${esc(x.a.name)}${Math.abs(x.rem) > 0.5 ? ' — باقي ' + fmt(Math.abs(x.rem)) : x.a.settled ? ' — خالص' : ''}</option>`).join('')
    || '<option value="">(مفيش حسابات)</option>';
}
function bpRows() {
  const out = [];
  for (let i = 0; i < window._bpRows; i++) {
    if (!$('#bpR' + i)) continue;
    const pid = ($('#bpP' + i) || {}).value, aid = ($('#bpA' + i) || {}).value, v = mval('bpV' + i);
    if (!pid || !aid || !v) continue;
    out.push({ i, pid, aid, amount: v, note: sval('bpN' + i) });
  }
  return out;
}
function bpCalc() {
  const rows = bpRows();
  const tot = rows.reduce((s, r) => s + r.amount, 0);
  const el = $('#bpTot');
  if (el) el.innerHTML = rows.length ? 'إجمالي الصرفية: <span class="num">' + fmt2(tot) + '</span> ج.م · ' + rows.length + ' سطر' : '';
  /* تنبيه التكرار جوه الشاشة نفسها */
  const d = dval('bpDate') || todayISO();
  const warn = [];
  const seen = {};
  rows.forEach(r => {
    const k = r.pid + ':' + r.aid + ':' + Math.round(r.amount);
    if (seen[k]) warn.push('سطرين بنفس المبلغ لنفس الحساب (' + esc(findParty(r.pid).name) + ')');
    seen[k] = 1;
    const dups = findDuplicates(r.pid, r.amount, d, null);
    if (dups.length) warn.push('فيه سداد بـ ' + fmt(r.amount) + ' لـ ' + esc(findParty(r.pid).name) +
      (dups[0].gap === 0 ? ' في نفس اليوم' : ' من ' + dups[0].gap + ' يوم') + ' (' + esc(dups[0].a.name) + ')');
  });
  const w = $('#bpWarn');
  if (w) w.innerHTML = warn.length
    ? `<div class="note" style="border-color:#FCA5A5;background:#FEF2F2;margin:0"><b>⚠ راجع دول قبل ما تحفظ:</b>
       <div style="margin-top:4px;font-size:12.5px">${[...new Set(warn)].map(x => '• ' + x).join('<br>')}</div></div>` : '';
}
function bpSyncTre() { const s = $('#bpTre'); if (s) s.value = methodTreasury(sval('bpMethod')); }
function saveBatchPay() {
  const rows = bpRows();
  if (!rows.length) return toast('مفيش ولا سطر كامل — اختار الطرف والحساب واكتب المبلغ', 'err');
  const date = dval('bpDate') || todayISO();
  if (lockGuard(date)) return;
  const method = sval('bpMethod'), tre = sval('bpTre') || methodTreasury(method);
  snapshot();
  let n = 0, tot = 0;
  rows.forEach(r => {
    const p = findParty(r.pid), a = findAcc(p, r.aid);
    if (!a) return;
    a.payments.push({
      id: uid(), date, amount: r.amount, method, note: r.note, kind: 'pay',
      treasury: tre, cheque: '', photo: '', link: ''
    });
    logAction('payment', 'صرفية اليوم — سداد لـ ' + p.name + ' / ' + a.name + ' — ' + fmt(r.amount));
    n++; tot += r.amount;
  });
  save(); closeModal(); render();
  toast('اتسجل ' + n + ' سداد بإجمالي ' + fmt(tot) + ' ج.م ✓', 'ok');
}

function wkTogglePay() {
  const on = $('#wkPay').checked;
  $('#wkPayFields').style.display = on ? 'block' : 'none';
  if (on && !num(($('#wkPaid') || {}).value)) {
    const net = mval('wkAmount') * (mval('wkPct') || 100) / 100;
    $('#wkPaid').value = fmtMoney(net);
  }
}
function wkCalc() {
  const q = mval('wkQty'), pr = mval('wkPrice'), amtEl = $('#wkAmount');
  if (!amtEl) return;
  const auto = q && pr ? q * pr : 0, typed = num(amtEl.value);
  if (auto && (typed === 0 || Math.abs(typed - (window._wkAuto || 0)) < 0.005)) amtEl.value = fmtMoney(Math.round(auto * 100) / 100);
  window._wkAuto = num(amtEl.value);
}
/* لما يختار المقاول: يجيب حساباته ويعرضها للاختيار */
function wkConChange() {
  const v = sval('wkCon');
  $('#wkNewCon').style.display = v === '__new' ? 'block' : 'none';
  const box = $('#wkAccBox'); if (!box) return;
  if (v === '__new' || !v) { wkResolveNew(); return; }
  const p = findParty(v);
  const accs = p.accounts.filter(a => !a.refOnly);
  const proj = sval('wkProj') ? canonProject(sval('wkProj')) : '';
  if (!accs.length) { wkResolveNew(); return; }
  /* رتّب: حسابات المشروع المختار الأول */
  const sorted = accs.slice().sort((a, b) => {
    const ap = proj && accCoversProject(a, proj) ? 0 : 1, bp = proj && accCoversProject(b, proj) ? 0 : 1;
    return ap - bp;
  });
  box.innerHTML = `<div class="f"><label>حساب المقاول اللي البند يتسجل فيه *</label>
    <select id="wkAcc">
      ${sorted.map(a => `<option value="${a.id}">${esc(a.name)} — ${esc(accProject(a) === UNASSIGNED ? 'غير محدد' : accProject(a))}${proj && accCoversProject(a, proj) ? ' ✓' : ''}</option>`).join('')}
      <option value="__new">+ حساب جديد لمشروع ${esc(proj || '؟')}…</option>
    </select>
    <div class="hint-k">الحسابات اللي في المشروع المختار عليها ✓ وبتظهر الأول.</div></div>`;
}
function wkResolveNew() {
  const v = sval('wkCon');
  /* نرجع لاختيار الحساب بس لو المقاول ليه حسابات — من غير الشرط ده المقاول اللي مالوش حسابات كان بيعمل لفة مالهاش آخر */
  if (v && v !== '__new') { const wp = findParty(v); if (wp && wp.accounts.some(a => !a.refOnly)) { wkConChange(); return; } }
  const box = $('#wkAccBox'); if (!box) return;
  const proj = sval('wkProj') ? canonProject(sval('wkProj')) : '';
  const nm = v === '__new' ? sval('wkNewName') : '';
  box.innerHTML = (proj && (v === '__new' ? nm : true))
    ? `<div class="note" style="background:#FFFBEB;border-color:#FDE68A;color:#78350F">هيتعمل حساب جديد «أعمال ${esc(proj)}»${v === '__new' && nm ? ' لـ ' + esc(nm) : ''}</div>` : '';
}
function saveWork() {
  let cid = sval('wkCon');
  const proj = sval('wkProj') ? canonProject(sval('wkProj')) : '';
  const desc = sval('wkDesc'), amount = mval('wkAmount'), date = dval('wkDate');
  if (!proj) return toast('اختار المشروع', 'err');
  if (!desc) return toast('اكتب البند', 'err');
  if (!amount) return toast('اكتب الإجمالي', 'err');
  if (lockGuard(date)) return;
  if (cid === '__new' && sval('wkNewName') && dupAsk('party|' + sval('wkNewName'), 'فيه اسم شبه <b>' + esc(sval('wkNewName')) + '</b> متسجل — يمكن تختاره من القايمة بدل ما تعمله جديد:', simParties(sval('wkNewName')), () => saveWork())) return;
  if (cid && cid !== '__new' && dupAsk('item|' + desc + '|' + amount, 'البند <b>' + esc(desc) + '</b> بنفس المبلغ متسجل قبل كده عند ' + esc(findParty(cid).name) + ':', simItems(findParty(cid), desc, amount), () => saveWork())) return;
  snapshot();
  let p;
  if (cid === '__new') {
    const nm = sval('wkNewName'); if (!nm) { undoStack.pop(); return toast('اكتب اسم المقاول الجديد', 'err'); }
    p = normalizeParty({ name: nm, type: 'contractor', trade: '', phone: '', note: '', accounts: [] });
    DB.parties.push(p); cid = p.id;
    logAction('party', 'مقاول جديد: ' + nm);
  } else {
    if (!cid) { undoStack.pop(); return toast('اختار المقاول', 'err'); }
    p = findParty(cid);
  }
  let aid = sval('wkAcc');
  if (!aid || aid === '__new' || !findAcc(p, aid)) {
    const a = normalizeAcc({ name: 'أعمال ' + proj, project: proj, mode: 'items', items: [], payments: [] });
    p.accounts.push(a); aid = a.id;
    logAction('account', 'حساب أعمال جديد لـ ' + p.name + ' في ' + proj);
  }
  const a = findAcc(p, aid);
  const qty = mval('wkQty'), unit = sval('wkUnit'), price = mval('wkPrice'), pct = mval('wkPct') || 100;
  a.items.push({
    id: uid(), date, desc, loc: '', proj, qty: qty || 1, unit, price: price || amount, amount, pct,
    retention: 0, advanceDeduction: 0, deductions: 0, cumTo: 0, photo: '', link: ''
  });
  if (unit) p.lastUnit = unit;
  let paidMsg = '';
  if ($('#wkPay') && $('#wkPay').checked) {
    const paid = mval('wkPaid');
    if (paid > 0) {
      const m = sval('wkMethod');
      a.payments.push({ id: uid(), date, amount: paid, method: m, note: 'دفعة عن ' + desc, kind: 'pay', treasury: methodTreasury(m), cheque: '', photo: '', link: '' });
      paidMsg = ' ودُفع ' + fmt(paid);
    }
  }
  logAction('item', 'بند أعمال لـ ' + p.name + ' في ' + proj + ': ' + desc + ' — ' + fmt(amount) + paidMsg);
  save(); closeModal();
  go('party', cid, aid);
  toast('البند اتسجل في مشروع ' + proj + paidMsg + ' ✓', 'ok');
}

function saveParty(pid) {
  const name = sval('fName'); if (!name) return toast('اكتب الاسم الأول', 'err');
  const _old = pid ? findParty(pid) : null;
  if ((!_old || _old.name !== name) && dupAsk('party|' + name, 'فيه اسم شبه <b>' + esc(name) + '</b> متسجل:', simParties(name, pid), () => saveParty(pid))) return;
  snapshot();
  if (pid) { Object.assign(findParty(pid), { name, type: sval('fType'), trade: sval('fTrade'), phone: sval('fPhone'), note: sval('fNote') }); logAction('party', 'تعديل بيانات ' + name); }
  else {
    const p = normalizeParty({ name, type: sval('fType'), trade: sval('fTrade'), phone: sval('fPhone'), note: sval('fNote'), accounts: [] });
    DB.parties.push(p); UI.pid = p.id; UI.view = 'party'; logAction('party', 'إضافة ' + (p.type === 'contractor' ? 'مقاول' : 'مورد') + ' جديد: ' + name);
  }
  save(); closeModal(); render(); toast('اتحفظ ✓', 'ok');
}
function delParty(pid) {
  const p = findParty(pid);
  askYesNo('حذف طرف', 'تحذف <b>' + esc(p.name) + '</b> وكل حساباته (' + p.accounts.length + ' حساب)؟<br><span style="color:var(--mut);font-size:12.5px">مش هيتمسح نهائي — هيروح لسلة المحذوفات وتقدر ترجّعه.</span>', () => {
    snapshot(); logAction('delete', 'حذف طرف: ' + p.name + ' (' + p.accounts.length + ' حساب)'); toTrash('party', p.name + ' — ' + p.accounts.length + ' حساب', p);
    DB.parties = DB.parties.filter(x => x.id !== pid);
    save(); go(p.type); toast('اتنقل لسلة المحذوفات', 'ok');
  }, 'حذف', true);
}

function fillFloors(n){

function priceHint(pid) {

  /* سعر الوحدة الحالي = المبلغ ÷ الكمية لو الاتنين مكتوبين، وإلا خانة سعر الوحدة */
  const q = mval('iQty'), am = mval('iAmount');
  const cur = (q > 0 && am) ? am / q : mval('iPrice');

  if (cur && Math.abs(cur - lp) > 0.005) {

function calcItem(init) {

  const amtEl = $('#iAmount'); if (!amtEl) return;
  const auto = q && pr ? q * pr : 0;

  if (auto && (init ? !typed : (typed === 0 || Math.abs(typed - window._lastAuto) < 0.005))) amtEl.value = fmtMoney(Math.round(auto * 100) / 100);
  window._lastAuto = num(amtEl.value);
  const amt = num(amtEl.value), net = amt * (pct || 0) / 100;
  const c = window._itemCtx || {};
  const a = c.aid ? findAcc(findParty(c.pid), c.aid) : null;
  let warn = '';
  if (a && a.mode === 'lump' && !($('#iExtra') && $('#iExtra').checked)) {
    const others = a.items.filter(i => i.id !== c.iid && !i.extra).reduce((s, i) => s + itemNet(i), 0);
    const over = others + net - num(a.agreed);
    if (over > 0.5) warn = `<div class="ln" style="color:var(--red);font-weight:700">⚠ البند ده هيخلي الأعمال تتجاوز الاتفاق بـ ${fmt2(over)} ج.م</div>`;

    `<div class="ln"><span>${q ? fmt2(q) + ' × ' + fmt2(pr) : 'الإجمالي المكتوب'}</span><b class="num">${fmt2(amt)}</b></div>` +

function saveItem(pid, aid, iid) {

    qty: mval('iQty'), unit: sval('iUnit'),

  if (!(a.project || '').trim() && data.proj) {

  else { a.items.push(Object.assign({ id: uid(), retention: 0, advanceDeduction: 0, deductions: 0, cumTo: 0 }, data)); logAction('item', 'بند جديد: ' + p.name + ' / ' + a.name + ' — ' + desc + ' — ' + fmt(amount)); }

/* ================= المستخلص ================= */
function openExtract(pid, aid) {
  const p = findParty(pid), a = findAcc(p, aid);
  const prevCum = a.items.reduce((m, i) => Math.max(m, num(i.cumTo)), 0);
  const prevWorks = a.items.reduce((s, i) => s + itemNet(i), 0);
  modal('مستخلص جديد — ' + p.name + ' / ' + a.name, `
    <div class="note">المستخلص بيتحسب من <b>الأعمال التراكمية لتاريخه</b>، والبرنامج يطرح اللي اتصرف في المستخلصات السابقة ويطلع مستحق الفترة.</div>
    <div class="grid2">
      <div class="f"><label>رقم / اسم المستخلص</label><input id="xDesc" value="مستخلص رقم ${a.items.filter(i => num(i.cumTo)).length + 1}"></div>

    </div>
    <div class="grid2">
      <div class="f"><label>الأعمال التراكمية لتاريخه</label><input id="xCum" class="money" data-money data-live="calcExtract" placeholder="${fmtMoney(prevCum || prevWorks)}"></div>
      <div class="f"><label>اتصرف قبل كده (تراكمي)</label><input id="xPrev" class="money" data-money data-live="calcExtract" value="${fmtMoney(Math.max(prevCum, prevWorks))}"></div>
    </div>
    <div class="grid3">
      <div class="f"><label>محتجز % <span style="color:var(--mut)">(${fmt2(a.retentionRate)}% افتراضي)</span></label><input id="xRetRate" data-money data-live="calcExtract" value="${fmtMoney(a.retentionRate)}"></div>
      <div class="f"><label>خصم سلفة</label><input id="xAdv" data-money data-live="calcExtract" placeholder="0">
        <div class="hint-k">المتبقي من السلفة: <b class="num">${fmt2(accAdvOut(a))}</b></div></div>
      <div class="f"><label>خصومات أخرى</label><input id="xDed" data-money data-live="calcExtract" placeholder="0"></div>
    </div>
    <div class="calc-box" id="xBox"></div>`,
    `<button class="btn navy" onclick="saveExtract('${pid}','${aid}')">حفظ المستخلص</button>
     <button class="btn" onclick="closeModal()">إلغاء</button>`, true);
  window._xCtx = { pid, aid }; calcExtract();
}
function calcExtract() {
  const c = window._xCtx, a = findAcc(findParty(c.pid), c.aid);
  const cum = mval('xCum'), prev = mval('xPrev');
  const works = Math.max(0, cum - prev);
  const ret = works * mval('xRetRate') / 100;
  const advMax = accAdvOut(a);
  let adv = mval('xAdv');
  const clamped = adv > advMax;
  if (clamped) adv = advMax;
  const ded = mval('xDed');
  const net = works - ret - adv - ded;
  window._xCalc = { works, ret, adv, ded, net, cum };
  $('#xBox').innerHTML =
    `<div class="ln"><span>الأعمال التراكمية لتاريخه</span><b class="num">${fmt2(cum)}</b></div>
     <div class="ln"><span>ناقص المعتمد في المستخلصات السابقة</span><b class="num">−${fmt2(prev)}</b></div>
     <div class="ln" style="border-top:1px solid #CBD5E1;padding-top:6px"><span><b>أعمال الفترة</b></span><b class="num">${fmt2(works)}</b></div>
     ${ret ? `<div class="ln"><span>ناقص محتجز</span><b class="num">−${fmt2(ret)}</b></div>` : ''}
     ${adv ? `<div class="ln"><span>ناقص استهلاك سلفة${clamped ? ' <span style="color:var(--red)">(اتظبط على المتبقي)</span>' : ''}</span><b class="num">−${fmt2(adv)}</b></div>` : ''}
     ${ded ? `<div class="ln"><span>ناقص خصومات</span><b class="num">−${fmt2(ded)}</b></div>` : ''}
     <div class="ln tot"><span>صافي المستحق في المستخلص ده</span><span class="num">${fmt2(net)} ج.م</span></div>`;

/* ================= استرداد الحسابات من إكسل ================= */
/* قارئ xlsx صغير — بيستعمل APIs المتصفح الأصلية بس (ZIP + DecompressionStream + DOMParser) */
function XR_u16(b,o){return b[o]|b[o+1]<<8}
function XR_u32(b,o){return (b[o]|b[o+1]<<8|b[o+2]<<16|b[o+3]<<24)>>>0}
async function xrInflate(buf){
  if (typeof DecompressionStream === 'undefined') throw new Error('المتصفح ده مش بيدعم فك الضغط');
  const ds = new DecompressionStream('deflate-raw');
  const w = ds.writable.getWriter(); w.write(buf); w.close();
  const parts = []; const rd = ds.readable.getReader();
  for(;;){ const {done,value} = await rd.read(); if(done) break; parts.push(value); }
  let len = parts.reduce((s,p)=>s+p.length,0), out = new Uint8Array(len), o=0;
  parts.forEach(p=>{out.set(p,o);o+=p.length});
  return out;
}
/* يفتح الـ ZIP ويرجّع {name: Uint8Array} */
async function xrUnzip(ab){
  const b = new Uint8Array(ab);
  /* ندور على End of Central Directory من الآخر */
  let eo = -1;
  for (let i = b.length-22; i >= 0 && i > b.length-66000; i--)
    if (XR_u32(b,i) === 0x06054b50){ eo = i; break; }
  if (eo < 0) throw new Error('الملف ده مش xlsx سليم');
  const n = XR_u16(b,eo+10); let p = XR_u32(b,eo+16);
  const files = {};
  for (let k=0;k<n;k++){
    if (XR_u32(b,p) !== 0x02014b50) break;
    const method = XR_u16(b,p+10), csize = XR_u32(b,p+20), usize = XR_u32(b,p+24);
    const nlen = XR_u16(b,p+28), elen = XR_u16(b,p+30), clen = XR_u16(b,p+32);
    const lho = XR_u32(b,p+42);
    const name = new TextDecoder('utf-8').decode(b.subarray(p+46, p+46+nlen));
    /* الهيدر المحلي عشان نعرف بداية البيانات */
    const lnlen = XR_u16(b,lho+26), lelen = XR_u16(b,lho+28);
    const start = lho + 30 + lnlen + lelen;
    const raw = b.subarray(start, start+csize);
    files[name] = { method, raw, usize };
    p += 46 + nlen + elen + clen;
  }
  const out = {};
  for (const k in files){
    const f = files[k];
    out[k] = f.method === 0 ? f.raw : await xrInflate(f.raw);
  }
  return out;
}
const xrTxt = u8 => new TextDecoder('utf-8').decode(u8);
function xrCol(ref){ let n=0; for (let i=0;i<ref.length;i++){ const c=ref.charCodeAt(i); if(c<65||c>90) break; n=n*26+(c-64); } return n; }
function xrRow(ref){ const m = /\d+/.exec(ref); return m ? +m[0] : 0; }
/* سيريال إكسل → ISO */
function xrSerialDate(v){
  const d = new Date(Date.UTC(1899,11,30) + Math.round(v)*86400000);
  if (isNaN(d)) return '';
  const p = x => String(x).padStart(2,'0');
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate());
}
/* يقرا الملف ويرجّع [{name, rows:[[cell,...]]}] — الخلية {v, t} */
async function xrRead(ab){
  const z = await xrUnzip(ab);
  const P = new DOMParser();
  const pick = n => z[n] ? P.parseFromString(xrTxt(z[n]),'application/xml') : null;
  /* النصوص المشتركة */
  const sstDoc = pick('xl/sharedStrings.xml');
  const sst = [];
  if (sstDoc) sstDoc.querySelectorAll('si').forEach(si=>{
    let s = ''; si.querySelectorAll('t').forEach(t=>{ s += t.textContent; });
    sst.push(s);
  });
  /* أنماط التاريخ */
  const styDoc = pick('xl/styles.xml');
  const dateFmt = {};   // numFmtId → هل تاريخ
  const BUILTIN_DATE = [14,15,16,17,22,27,30,36,45,46,47,50,57];
  BUILTIN_DATE.forEach(i=>dateFmt[i]=true);
  const xfDate = [];
  if (styDoc){
    styDoc.querySelectorAll('numFmts > numFmt').forEach(f=>{
      const id = +f.getAttribute('numFmtId'), code = f.getAttribute('formatCode')||'';
      if (/[dmyhs]/i.test(code) && !/[#0]/.test(code.replace(/\[[^\]]*\]/g,''))) dateFmt[id]=true;
    });
    const xfs = styDoc.querySelector('cellXfs');
    if (xfs) xfs.querySelectorAll('xf').forEach(xf=>xfDate.push(!!dateFmt[+(xf.getAttribute('numFmtId')||0)]));
  }
  /* أسماء الشيتات بترتيبها */
  const wbDoc = pick('xl/workbook.xml');
  const relDoc = pick('xl/_rels/workbook.xml.rels');
  const rels = {};
  if (relDoc) relDoc.querySelectorAll('Relationship').forEach(r=>{
    rels[r.getAttribute('Id')] = r.getAttribute('Target').replace(/^\/?(xl\/)?/,'');
  });
  const sheets = [];
  if (wbDoc) wbDoc.querySelectorAll('sheets > sheet').forEach(sh=>{
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    sheets.push({ name: sh.getAttribute('name'), path: 'xl/' + (rels[rid] || '') });
  });
  const out = [];
  for (const sh of sheets){
    const doc = z[sh.path] ? P.parseFromString(xrTxt(z[sh.path]),'application/xml') : null;
    if (!doc){ out.push({ name: sh.name, rows: [], merges: [] }); continue; }
    const rows = [];
    doc.querySelectorAll('sheetData > row').forEach(r=>{
      const ri = +(r.getAttribute('r')||0);
      const arr = rows[ri-1] = rows[ri-1] || [];
      r.querySelectorAll('c').forEach(c=>{
        const ref = c.getAttribute('r')||'', ci = xrCol(ref);
        const t = c.getAttribute('t'), sIdx = +(c.getAttribute('s')||-1);
        const vEl = c.querySelector('v'), isEl = c.querySelector('is');
        let v = null;
        if (t === 's' && vEl) v = sst[+vEl.textContent] || '';
        else if (t === 'inlineStr' && isEl) v = isEl.textContent;
        else if (t === 'str' && vEl) v = vEl.textContent;
        else if (vEl){
          const num = parseFloat(vEl.textContent);
          if (!isNaN(num)){
            if (sIdx >= 0 && xfDate[sIdx] && num > 20000 && num < 80000) v = xrSerialDate(num);
            else v = num;
          } else v = vEl.textContent;
        }
        if (v !== null && v !== '') arr[ci-1] = v;
      });
    });
    const merges = [];
    doc.querySelectorAll('mergeCell').forEach(m=>{
      const [a,b2] = (m.getAttribute('ref')||'').split(':');
      if (a && b2) merges.push({ r1:xrRow(a), c1:xrCol(a), r2:xrRow(b2), c2:xrCol(b2) });
    });
    out.push({ name: sh.name, rows, merges });
  }
  return out;
}

/* ================= فهم شيتات الطنطاوي =================
   كل دفتر: شيت فهرس (المقاولون/الموردين) + شيت لكل طرف باسمه.
   الشيت الواحد ممكن يكون فيه أكتر من جدول جنب بعض، وكل جدول له عناوينه.
   أي سطر مش مفهوم بيتسجل في skipped ومبيدخلش الحسابات. */
const HDR = [
  ['serial', ['م']],
  ['qty',    ['الكمية','العدد','الكميه']],
  ['price',  ['سعر الوحدة','سعر المتر','سعر البالتة','سعر الطن','سعر الشقة','السعر','سعر']],
  ['amount', ['الإجمالي','الاجمالي','اجمالي','المبلغ','القيمة']],
  ['desc',   ['البند','البيان','الصنف']],
  ['idate',  ['تاريخ الفاتورة','تاريخ التوريد','التاريخ']],
  ['pct',    ['نسبة الإنجاز','نسبة الانجاز','النسبة']],
  ['net',    ['الصافي','صافي']],
  ['pay',    ['الواصل','واصل','المدفوع','السداد']],
  ['pdate',  ['تاريخ الدفع','تاريخ السداد']],
  ['method', ['طريقة الدفع','الطريقة','طريقة']],
  ['loc',    ['المكان','الموقع']],
  ['note',   ['ملاحظات','ملاحظة']]
];
/* دول عناوين إجماليات مش أعمدة جدول */
const TOTAL_LBL = ['الواصل له','الواصل منه','اجمالي الواصل','اجمالي الحساب','الباقي','لنا','له','الإجمالي الكلي'];
const S = v => v === undefined || v === null ? '' : String(v).trim();
const norm = s => S(s).replace(/[إأآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
const isNum = v => typeof v === 'number' || (S(v) !== '' && !isNaN(parseFloat(S(v).replace(/,/g,''))));
const toNum = v => { const n = parseFloat(S(v).replace(/,/g,'')); return isNaN(n) ? 0 : n; };
const PAYWORD = ['سداد','دفعه','دفعة','توريد نقدي','سداد نقدي'];
const fmtN = n => Math.round(n).toLocaleString('en-US');
/* سطور إجماليات وحصر — دي محصلة حسابات مش حركة، لازم تتساب */
const SUMWORD = ['اجمالي','الاجمالي','الإجمالي','المجموع','مجموع','الباقي','باقي الحساب','الحساب','صافي الحساب','المتبقي','الفرق','حصر','الحصر','المسطح','المكعب'];
const looksTotal = t => { const n = norm(t); return !!n && SUMWORD.some(w => n === norm(w) || n.indexOf(norm(w)) === 0); };

function fieldOf(txt){
  const n = norm(txt);
  if (!n || n.length > 24) return null;
  if (TOTAL_LBL.some(t => norm(t) === n)) return null;
  for (const [f, alts] of HDR) if (alts.some(a => norm(a) === n)) return f;
  for (const [f, alts] of HDR) if (alts.some(a => norm(a).length > 3 && n.indexOf(norm(a)) === 0)) return f;
  return null;
}
/* يلاقي جداول الشيت: صف عناوين + مدى أعمدته.
   صف العناوين الواحد ممكن يكون فيه أكتر من جدول جنب بعض، فبنقسمه لمجموعات
   على حسب الفراغات. وكلمة زي «الواصل» وجنبها رقم دي خانة إجمالي مش عمود. */
function findBlocks(rows){
  const out = [];
  for (let r = 0; r < rows.length; r++){
    const row = rows[r] || [];
    const hits = [];
    for (let c = 0; c < row.length; c++){
      const f = fieldOf(row[c]);
      if (!f) continue;
      /* عنوان وجنبه رقم في نفس الصف = خانة إجمالي */
      if (isNum(row[c+1]) && S(row[c+1]) !== '') continue;
      hits.push({ c, f });
    }
    if (hits.length < 3) continue;
    /* قسّم على الفراغات: أكتر من عمودين فاضيين = جدول تاني */
    const groups = [];
    let g = [hits[0]];
    for (let i = 1; i < hits.length; i++){
      if (hits[i].c - hits[i-1].c > 3){ groups.push(g); g = []; }
      g.push(hits[i]);
    }
    groups.push(g);
    groups.forEach(grp => {
      if (grp.length < 3) return;
      const map = {};
      grp.forEach(h => { if (map[h.f] === undefined) map[h.f] = h.c; });
      const core = ['desc','amount','qty','pay','pdate','idate'].filter(k => map[k] !== undefined).length;
      if (core < 2) return;
      const c1 = grp[0].c, c2 = grp[grp.length-1].c;
      let data = 0;
      for (let rr = r + 1; rr < Math.min(rows.length, r + 6); rr++){
        const q = rows[rr] || [];
        for (let c = c1; c <= c2; c++) if (S(q[c]) !== '') { data++; break; }
      }
      if (data < 1) return;
      /* جدول سداد عمود فلوسه مكتوب «السعر» ومفيهوش عمود «الواصل» */
      if (map.pdate !== undefined && map.pay === undefined){
        if (map.price !== undefined){ map.pay = map.price; delete map.price; }
        else if (map.amount !== undefined){ map.pay = map.amount; delete map.amount; }
      }
      out.push({ hrow: r, c1, c2, map });
    });
  }
  /* لو جدولين في نفس الأعمدة وقريبين، ناخد الأول */
  return out.filter((b, i) => !out.some((o, j) => j < i && o.c1 <= b.c1 && o.c2 >= b.c2 && Math.abs(o.hrow - b.hrow) < 2));
}
function blockEnd(rows, b, nextH){
  let blank = 0, last = b.hrow;
  for (let r = b.hrow + 1; r < rows.length; r++){
    if (nextH && r >= nextH) break;
    const q = rows[r] || [];
    let any = false;
    for (let c = b.c1; c <= b.c2; c++) if (S(q[c]) !== '') { any = true; break; }
    if (any){ blank = 0; last = r; } else if (++blank >= 12) break;
  }
  return last;
}
const DATE_RE = /^(\d{1,4})[-\/.](\d{1,2})[-\/.](\d{1,4})/;
function toISO(v){
  const s = S(v).replace(/[;،]/g,'').trim();
  if (!s) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if (typeof v === 'number' && v > 20000 && v < 80000){
    const d = new Date(Date.UTC(1899,11,30) + Math.round(v)*86400000);
    const p = x => String(x).padStart(2,'0');
    return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate());
  }
  const m = DATE_RE.exec(s);
  if (!m) return null;
  let a = +m[1], b = +m[2], c = +m[3];
  let y, mo, d;
  if (a > 31){ y = a; mo = b; d = c; } else { d = a; mo = b; y = c; }
  if (y < 100) y += 2000;
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  const p = x => String(x).padStart(2,'0');
  return y+'-'+p(mo)+'-'+p(d);
}
/* المشروع من نص */
function projOf(txt){
  const n = norm(txt).toUpperCase().replace(/\s/g,'');
  if (/R-?12|O\.?4|O4/.test(n)) return 'R12-O.4';
  if (/R-?07|R7/.test(n)) return 'R-07';
  if (/R-?06|R6/.test(n)) return 'R-06';
  if (/VILLA|فيلا|فله/.test(n)) return 'Villa';
  return '';
}
function parseSheet(sheet, type, log, warn){
  const rows = sheet.rows || [];
  const title = S((rows[0]||[]).find(x => S(x) !== '')) || sheet.name;
  const party = S(sheet.name).replace(/^حساب\s+/,'').trim();
  const sheetProj = projOf(title) || projOf(sheet.name);
  const blocks = findBlocks(rows);
  if (/مسوده|مسودة/.test(norm(sheet.name))) warn.push({ sheet: sheet.name, row: 1, why: 'الشيت ده اسمه مسودة — اتسجل «للاطلاع فقط» ومش داخل في الأرصدة', cells: '' });
  if (!blocks.length){ log.push({ sheet: sheet.name, row: 0, why: 'مفيش جدول بعناوين مفهومة في الشيت ده', cells: title }); return []; }
  const isDraft = /مسوده|مسودة|حصر|للاطلاع|نموذج/.test(norm(sheet.name));
  const accs = [];
  blocks.forEach((b, bi) => {
    const nextH = blocks[bi+1] && blocks[bi+1].c1 <= b.c2 && blocks[bi+1].c1 >= b.c1 ? blocks[bi+1].hrow : null;
    const end = blockEnd(rows, b, nextH);
    const m = b.map;
    const items = [], pays = [], notes = [];
    let streak = 0, extra = 0;
    for (let r = b.hrow + 1; r <= end; r++){
      const q = rows[r] || [];
      const g = f => m[f] === undefined ? '' : q[m[f]];
      const cellTxt = () => { const o=[]; for(let c=b.c1;c<=b.c2;c++) if(S(q[c])!=='') o.push(S(q[c])); return o.join(' | '); };
      const txt = cellTxt();
      if (!txt) continue;
      /* سطر فيه نص واحد ممتد = ملاحظة/فاصل */
      let filled = 0; for (let c=b.c1;c<=b.c2;c++) if (S(q[c])!=='') filled++;
      const onlySerial = filled === 1 && m.serial !== undefined && S(q[m.serial]) !== '';
      if (onlySerial) continue;                       /* صف فاضي من القالب */
      const allZero = filled > 0 && (()=>{ for(let c=b.c1;c<=b.c2;c++){ const v=q[c]; if(S(v)==='') continue; if(c===m.serial) continue; if(!isNum(v)||toNum(v)!==0) return false; } return true; })();
      if (allZero) continue;                          /* صف أصفار من القالب */

      let descV = S(g('desc'));
      const qtyV = g('qty'), amtV = g('amount'), payV = g('pay');
      let descFromMerge = false;
      if (!descV){
        /* الاسم ساعات بيتكتب في خلية مدمجة بتبدأ من عمود تاني */
        const texts = [];
        for (let c = b.c1; c <= b.c2; c++){
          if (c === m.method || c === m.note || c === m.loc) continue;
          const v = q[c];
          if (S(v) !== '' && !isNum(v) && S(v).length > 3) texts.push(S(v));
        }
        if (texts.length === 1 && !PAYWORD.some(w => norm(w) === norm(texts[0]))){ descV = texts[0]; descFromMerge = true; }
      }
      const isPayWord = PAYWORD.some(w => norm(w) === norm(qtyV)) || PAYWORD.some(w => norm(w) === norm(descV));
      let did = false;
      /* ===== سداد ===== */
      const descIsNum = descV !== '' && isNum(descV);
      /* سطر إجمالي أو حصر من غير تاريخ = محصلة مش حركة */
      if (looksTotal(descV) && !toISO(g('pdate')) && !toISO(g('idate'))){
        log.push({ sheet: sheet.name, row: r+1, why: 'سطر إجمالي أو حصر («' + descV + '») مش حركة — سيبته', cells: txt });
        streak = 0; continue;
      }
      if (isNum(payV) && toNum(payV) !== 0 && !descIsNum){
        const dt = toISO(g('pdate'));
        if (dt === null){
          log.push({ sheet: sheet.name, row: r+1, why: 'سداد ' + fmtN(toNum(payV)) + ' بس خانة التاريخ فيها حاجة مش مفهومة — سيبته عشان ميغلطش', cells: txt });
        } else {
          if (!dt) warn.push({ sheet: sheet.name, row: r+1, why: 'سداد ' + fmtN(toNum(payV)) + ' من غير تاريخ في الشيت — اتسجل، حدّد تاريخه', cells: txt });
          pays.push({ amount: toNum(payV), date: dt, method: S(g('method')), note: isPayWord ? '' : descV }); did = true;
        }
      }
      /* ===== بند ===== */
      const hasAmt = isNum(amtV) && toNum(amtV) !== 0;
      const hasQP = isNum(qtyV) && toNum(qtyV) !== 0 && isNum(g('price')) && toNum(g('price')) !== 0;
      if (!isPayWord && (hasAmt || hasQP)){
        if (!descV || descIsNum){ log.push({ sheet: sheet.name, row: r+1, why: 'مبلغ من غير اسم بند واضح — مش عارف هو إيه', cells: txt }); }
        else {
          const dt = toISO(g('idate'));
          if (dt === null){ log.push({ sheet: sheet.name, row: r+1, why: 'بند «' + descV + '» خانة تاريخه فيها حاجة مش مفهومة — سيبته عشان ميغلطش', cells: txt }); }
          else {
            if (!dt) warn.push({ sheet: sheet.name, row: r+1, why: 'بند «' + descV + '» من غير تاريخ في الشيت — اتسجل، حدّد تاريخه', cells: txt });
            let pct = 100;
            const pv = g('pct');
            if (isNum(pv)){ const n2 = toNum(pv); pct = n2 > 0 && n2 <= 1.0001 ? n2*100 : n2; }
            const amount = hasAmt ? toNum(amtV) : toNum(qtyV)*toNum(g('price'));
            if (hasAmt && hasQP && Math.abs(toNum(qtyV)*toNum(g('price')) - amount) > Math.max(2, amount*0.02))
              warn.push({ sheet: sheet.name, row: r+1, why: 'الكمية × السعر مش بتطلع الإجمالي المكتوب — اتسجل بالإجمالي، راجعه', cells: txt });
            if (descFromMerge) warn.push({ sheet: sheet.name, row: r+1, why: 'اسم البند «' + descV + '» كان مكتوب في خانة مدمجة — اتقرأ كده، راجعه', cells: txt });
            items.push({ date: dt, desc: descV, qty: isNum(qtyV) ? toNum(qtyV) : 0, price: toNum(g('price')), amount,
              pct, loc: S(g('loc')), proj: projOf(descV) || projOf(g('loc')) || sheetProj });
            did = true;
          }
        }
      }
      if (did){ streak = 0; continue; }
      /* ===== ملاحظة/فاصل ===== */
      const merged = (sheet.merges||[]).some(mg => mg.r1 === r+1 && mg.c2 > mg.c1);
      let longTxt = 0, bigNum = 0;
      for (let c=b.c1;c<=b.c2;c++){
        const v = q[c]; if (S(v)==='') continue;
        if (isNum(v)){ if (toNum(v) >= 1000 || !Number.isInteger(toNum(v))) bigNum++; }
        else if (S(v).length > 6) longTxt++;
      }
      if (!bigNum && longTxt >= 1 && (merged || filled <= 3)){ notes.push({ row: r+1, txt }); streak = 0; continue; }
      streak++;
      if (streak <= 4) log.push({ sheet: sheet.name, row: r+1, why: 'السطر ده مش واضح — مش عارف بند ولا سداد', cells: txt });
      else extra++;
    }
    if (extra) log.push({ sheet: sheet.name, row: b.hrow+1, why: 'و' + extra + ' سطر تاني في الجدول ده مش مفهوم (غالباً جدول حصر أو مسودة تحته) — كلهم اتسابوا', cells: '' });
    if (!items.length && !pays.length) return;
    /* شيت فيه بنود ومفيهوش عمود واصل خالص = السداد مش مسجّل في الشيت */
    if (items.length && m.pay === undefined)
      warn.push({ sheet: sheet.name, row: b.hrow+1, why: 'الجدول ده مفيهوش عمود «واصل» — البنود بس اللي اتسجلت، السداد لازم تدخّله بإيدك', cells: '' });
    /* ===== التجميع لحسابات ===== */
    const blockTitle = (()=>{
      for (let r = b.hrow - 1; r >= 0 && r >= b.hrow - 2; r--){
        const q = rows[r] || [];
        for (let c = b.c1; c <= b.c2; c++){ const v = S(q[c]); if (v && !isNum(v) && v.length > 3) return v; }
      }
      return '';
    })() || title;
    const payOnly = !items.length && pays.some(p => p.note);
    if (payOnly){
      const by = {};
      pays.forEach(p => { const k = p.note || 'تحت الحساب'; (by[k] = by[k] || []).push(p); });
      Object.keys(by).forEach(k => accs.push({
        name: k, project: projOf(k) || sheetProj, mode: 'open', agreed: 0, refOnly: isDraft,
        items: [], payments: by[k].map(p => ({ ...p, note: k })), notes
      }));
    } else {
      accs.push({
        name: blockTitle.replace(/^حساب\s+/,'').trim() || sheet.name,
        project: projOf(blockTitle) || sheetProj, mode: items.length ? 'items' : 'open', agreed: 0, refOnly: isDraft,
        items, payments: pays, notes
      });
    }
  });
  return [{ name: party, type, accounts: accs }];
}
function xrParse(sheets, type){
  const log = [], warn = [], parties = [];
  const idx = sheets.find(s => /^(المقاولون|الموردين|المقاولين|الموردون)$/.test(norm(s.name)));
  const listed = [];
  if (idx) (idx.rows||[]).forEach(r => { const v = S((r||[])[1]); if (v && norm(v) !== 'المقاولون' && norm(v) !== 'المورد' && norm(v) !== 'الموردين') listed.push(v); });
  sheets.forEach(s => {
    if (idx && s.name === idx.name) return;
    const r = parseSheet(s, type, log, warn);
    r.forEach(p => { if (p.accounts.length) parties.push(p); });
  });
  return { parties, skipped: log, warnings: warn, listed };
}

/* ---------- حالة الشاشة ---------- */
let XL = null;    /* { files:[{name,type,R}], pick:{} } */

function viewXlImport(){
  if (!XL) return `
  <div class="topbar"><div><h1 class="page">استرداد الحسابات من إكسل</h1>
    <p class="sub">اختار دفتر الإكسل والبرنامج يقراه ويفهمه — المقاولين والموردين والمشاريع والبنود والسداد</p></div></div>
  <div class="card pad">
    <div class="note">البرنامج بيقرا شكل شيتاتك: دفتر فيه شيت فهرس (<b>المقاولون</b> أو <b>الموردين</b>) وشيت لكل طرف باسمه،
      وجواه جدول فيه البنود والسداد. يعرف المقاول من المورد لوحده من اسم الفهرس.</div>
    <div class="f"><label>ملف الإكسل (تقدر تختار أكتر من ملف مع بعض)</label>
      <input type="file" id="xlFile" accept=".xlsx" multiple onchange="xlLoad(this)"></div>
    <div id="xlState" class="hint-k"></div>

      • سطور الإجماليات والحصر بيعرفها ويسيبها، مبيحسبهاش حركة.<br>

async function xlLoad(input){
  const fs2 = [...(input.files||[])];
  if (!fs2.length) return;
  const st = $('#xlState');
  if (st) st.innerHTML = 'بيقرا الملفات…';
  const files = [];
  for (const f of fs2){
    try {
      const ab = await f.arrayBuffer();
      const sheets = await xrRead(ab);
      /* نوع الدفتر من شيت الفهرس */
      let type = null;
      sheets.forEach(sh => {
        const n = String(sh.name||'').replace(/[إأآ]/g,'ا').replace(/ة/g,'ه').trim();
        if (/^(المقاولون|المقاولين)$/.test(n)) type = 'contractor';
        if (/^(الموردين|الموردون)$/.test(n)) type = 'supplier';
      });
      if (!type) type = /مورد/.test(f.name) ? 'supplier' : 'contractor';
      const R = xrParse(sheets, type);
      files.push({ name: f.name, type, R, auto: true });
    } catch(e){
      logErr('xlsx', e.message);
      files.push({ name: f.name, type: null, R: null, err: e.message });
    }
  }
  XL = { files, pick: {} };
  /* الافتراضي: كل الأطراف متحددة */
  files.forEach((f,fi) => { if (f.R) f.R.parties.forEach((p,pi) => XL.pick[fi+':'+pi] = true); });
  render();
}
function xlReset(){ XL = null; render(); }

/* بصمة الحركة — عشان ما نكررش حاجة موجودة */
const xlSigItem = i => 'w|' + (i.date||'') + '|' + Math.round(num(i.amount)*100) + '|' + String(i.desc||'').trim();
const xlSigPay  = y => 'p|' + (y.date||'') + '|' + Math.round(num(y.amount)*100) + '|' + String(y.note||'').trim();
const xlNorm = s2 => String(s2||'').replace(/[إأآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();

/* يحسب إيه الجديد وإيه الموجود */
function xlPlan(){
  const addP = [], addA = [], addI = [], addY = [], dupI = [], dupY = [];
  (XL.files||[]).forEach((f,fi) => {
    if (!f.R) return;
    f.R.parties.forEach((p,pi) => {
      if (!XL.pick[fi+':'+pi]) return;
      const exP = DB.parties.find(x => xlNorm(x.name) === xlNorm(p.name) && x.type === f.type);
      if (!exP) addP.push(p.name);
      p.accounts.forEach(a => {
        const exA = exP ? exP.accounts.find(x => xlNorm(x.name) === xlNorm(a.name)) : null;
        if (!exA) addA.push(p.name + ' / ' + a.name);
        const sigs = new Set();
        if (exA){ exA.items.forEach(i => sigs.add(xlSigItem(i))); exA.payments.forEach(y => sigs.add(xlSigPay(y))); }
        a.items.forEach(i => (sigs.has(xlSigItem(i)) ? dupI : addI).push(i));
        a.payments.forEach(y => (sigs.has(xlSigPay(y)) ? dupY : addY).push(y));
      });
    });
  });
  /* خطر التكرار: الطرف موجود وفيه حسابات، بس ولا اسم حساب متطابق */
  const clash = [];
  (XL.files||[]).forEach((f,fi) => {
    if (!f.R) return;
    f.R.parties.forEach((p,pi) => {
      if (!XL.pick[fi+':'+pi]) return;
      const exP = DB.parties.find(x => xlNorm(x.name) === xlNorm(p.name) && x.type === f.type);
      if (!exP || !exP.accounts.length) return;
      const hit = p.accounts.some(a => exP.accounts.some(x => xlNorm(x.name) === xlNorm(a.name)));
      if (!hit) clash.push({ name: p.name, have: exP.accounts.length, add: p.accounts.length });
    });
  });
  return { addP, addA, addI, addY, dupI, dupY, clash };
}

const APP_TITLE = document.title;
const safeFileName = s => String(s).replace(/[\\/:*?"<>|]/g, '-').replace(/\s+/g, ' ').trim();
/* قبل أي طباعة: نقيس كل جدول على عرض ورقة A4 (210 مم − هوامش) ونصغّر خطه لحد ما يدخل.
   180 مم أقل شوية من مساحة الكتابة في الورقة (184 مم) — عشان يفضل فيه هامش أمان. */
function fitPrint() {
  const A = $('#printArea'); if (!A) return;
  A.querySelectorAll('table').forEach(t => { if (t.querySelector('thead')) t.classList.add('pt'); });
  A.querySelectorAll('.sign-row').forEach(r => { const pv = r.previousElementSibling; if (pv && !pv.matches('table,div:has(> table)')) pv.classList.add('keepnext'); });
  A.querySelectorAll('td').forEach(td => { if (/^\s*\d{1,2}-\d{1,2}-\d{4}\s*$/.test(td.textContent)) td.classList.add('dt'); });
  const oldW = A.style.width;
  A.style.width = '180mm';
  try {
    const W = A.clientWidth;
    A.querySelectorAll('table').forEach(t => {
      t.classList.remove('pf1', 'pf2', 'pf3', 'pf4');
      for (let lv = 1; lv <= 4 && t.offsetWidth > W + 1; lv++) {
        t.classList.remove('pf' + (lv - 1)); t.classList.add('pf' + lv);
        if (lv === 4) t.classList.add('pf3');
      }
    });
  } catch (e) { logErr('fitPrint', e.message); }
  A.style.width = oldW;
}
function printAs(name) {

  fitPrint();
  flushSave();
  /* نسخة الويندوز: بنعمل ملف PDF على طول ونفتحه — ده أضمن من إن الطباعة
     تعتمد على طابعة متظبطة على الجهاز. وزرار الطابعة موجود جوه النافذة. */

      .then(r => {

        if (r && r.ok) { toast('اتحفظ ✓ — ' + (r.name || 'PDF'), 'ok'); return; }
        if (r && r.reason === 'cancelled') return;
        logErr('pdf', (r && r.reason) || 'فشل غير معروف');
        askPrintFallback(name, (r && r.reason) || '');
      })
      .catch(e => { unstick(); logErr('pdf', e.message); askPrintFallback(name, e.message); });
    return;
  }

  setTimeout(() => {
    try { window.print(); } catch (e) { logErr('print', e.message); showCrash('الطباعة مش متاحة'); }
    setTimeout(unstick, 800);
  }, 60);
}

  const key = kind + ':' + id;
  if (e.shiftKey && lastSelIdx > -1) {
    const order = window._rowOrder || [];
    const a = Math.min(lastSelIdx, idx), b = Math.max(lastSelIdx, idx);
    for (let i = a; i <= b; i++) if (order[i] && UI.sel.indexOf(order[i]) < 0) UI.sel.push(order[i]);
  } else if (e.ctrlKey || e.metaKey) {
    const i = UI.sel.indexOf(key);
    i > -1 ? UI.sel.splice(i, 1) : UI.sel.push(key);
    lastSelIdx = idx;
  } else {
    UI.sel = UI.sel.length === 1 && UI.sel[0] === key ? [] : [key];
    lastSelIdx = idx;
  }
  render();
}

function bulkDelete(pid, aid) {
  let picked = selectedRows(pid, aid);
  if (!picked.length) return;
  const lockedRows = picked.filter(x => isLocked(x.row.date)).length;
  picked = picked.filter(x => !isLocked(x.row.date));
  if (!picked.length) return toast('كل اللي محدد في فترة مقفولة', 'err');
  if (lockedRows) toast(lockedRows + ' سطر في فترة مقفولة هيتجاهلوا', 'err');
  const p = findParty(pid), a = findAcc(p, aid);
  const total = picked.reduce((s, x) => s + num(x.row.amount), 0);
  const linked = picked.filter(x => x.row.link).length;
  askYesNo('حذف ' + picked.length + ' سطر',
    'هيتحذف <b>' + picked.length + '</b> سطر بإجمالي <b>' + fmt2(total) + '</b> ج.م من حساب «' + esc(a.name) + '».' +
    (linked ? '<div class="note" style="margin-top:8px">' + linked + ' منهم جزء من تحويل بين حسابين — الطرف التاني هيفضل من غير مقابل.</div>' : '') +
    '<div style="color:var(--mut);font-size:12.5px;margin-top:8px">كله هيروح لسلة المحذوفات وتقدر ترجّعه.</div>',
    () => {
      snapshot();
      picked.forEach(x => {
        toTrash(x.kind === 'w' ? 'item' : 'payment',
          p.name + ' / ' + a.name + ' — ' + (x.row.desc || x.row.note || '') + ' — ' + fmt(x.row.amount),
          { pid, aid, kind: x.kind, row: x.row });
      });
      const del = picked.map(x => x.row.id);
      a.items = a.items.filter(x => del.indexOf(x.id) < 0);
      a.payments = a.payments.filter(x => del.indexOf(x.id) < 0);
      logAction('delete', 'حذف ' + picked.length + ' سطر من ' + p.name + ' / ' + a.name + ' — إجمالي ' + fmt(total));
      UI.sel = []; save(); render(); toast(picked.length + ' سطر اتنقلوا لسلة المحذوفات', 'ok');
    }, 'حذف ' + picked.length + ' سطر', true);

function dupSelected() {
  const c = window._rowCtx || {};
  if (!c.pid || !c.aid || !UI.sel.length) { toast('حدد السطر اللي عايز تكرره الأول', 'err'); return; }
  const picked = selectedRows(c.pid, c.aid);
  if (!picked.length) return;
  if (picked.length === 1) return dupRow(c.pid, c.aid, picked[0].kind, picked[0].row.id);
  const a = findAcc(findParty(c.pid), c.aid);
  snapshot();
  const keys = [];
  picked.forEach(x => {
    const copy = JSON.parse(JSON.stringify(x.row));
    copy.id = uid(); copy.date = todayISO(); copy.link = ''; copy.cumTo = 0;
    (x.kind === 'w' ? a.items : a.payments).push(copy);
    keys.push(x.kind + ':' + copy.id);
  });
  UI.sel = keys;
  logAction('item', 'تكرار ' + picked.length + ' حركة في ' + findParty(c.pid).name + ' / ' + a.name);
  save(); render();
  toast(picked.length + ' حركة اتكررت بتاريخ النهاردة — عدّلها', 'ok');
}
function dupRow(pid, aid, kind, id) {
  const a = findAcc(findParty(pid), aid);
  const src = (kind === 'w' ? a.items : a.payments).find(x => x.id === id);
  if (!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid(); copy.date = todayISO(); copy.link = '';
  snapshot();
  (kind === 'w' ? a.items : a.payments).push(copy);
  UI.sel = [kind + ':' + copy.id];
  save(); render();
  toast('اتكرر بتاريخ النهاردة — عدّله لو محتاج', 'ok');
  setTimeout(() => kind === 'w' ? openItem(pid, aid, copy.id) : openPay(pid, aid, copy.id), 150);
}
function selRowsText(pid, aid) {
  const a = findAcc(findParty(pid), aid);
  const picked = selectedRows(pid, aid);
  return picked.map(x => {
    const r = x.row;
    return [dsp(r.date), (r.desc || r.note || ''), x.kind === 'w' ? fmt2(num(r.amount) * (num(r.pct) || 100) / 100) : '',
    x.kind === 'p' ? fmt2(r.amount) : '', r.method || ''].join('\t');

const IMP_FIELDS = [
  { k: 'date', t: 'التاريخ', hints: ['تاريخ', 'التاريخ', 'date'] },
  { k: 'desc', t: 'البند / الصنف', hints: ['بند', 'صنف', 'بيان', 'وصف', 'اسم'] },
  { k: 'loc', t: 'المكان', hints: ['مكان', 'موقع', 'مشروع'] },
  { k: 'qty', t: 'العدد / الكمية', hints: ['عدد', 'كمية', 'كميه'] },
  { k: 'price', t: 'سعر الوحدة', hints: ['سعرالوحدة', 'سعر'] },
  { k: 'unit', t: 'الوحدة', hints: ['الوحدة', 'وحده', 'وحدةالقياس'] },
  { k: 'amount', t: 'الإجمالي المستحق', hints: ['اجمالي', 'إجمالي', 'قيمة', 'مستحق'] },
  { k: 'paid', t: 'الواصل / السداد', hints: ['واصل', 'سداد', 'مدفوع', 'دفع'] },
  { k: 'pdate', t: 'تاريخ الدفع', hints: ['تاريخ الدفع', 'تاريخ السداد'] },
  { k: 'method', t: 'طريقة الدفع', hints: ['طريقة', 'طريقه'] }
];
function openImport(pid, aid) {
  const p = findParty(pid), a = findAcc(p, aid);
  window._impCtx = { pid, aid, rows: [], head: [], map: {} };
  modal('استيراد من إكسل — ' + p.name + ' / ' + a.name, `
    <div class="note">افتح الشيت في إكسل، حدّد الصفوف اللي عايزها <b>بعناوين الأعمدة</b>، انسخها (Ctrl+C)، والزقها هنا (Ctrl+V).</div>
    <div class="imp-tabs">
      <button class="on" id="impT1" onclick="impTab(1)">لصق من إكسل</button>
      <button id="impT2" onclick="impTab(2)">ملف CSV</button>
    </div>
    <div id="impBox1">
      <textarea id="impPaste" placeholder="الزق هنا…" oninput="impParse()"></textarea>
    </div>
    <div id="impBox2" style="display:none">
      <input type="file" accept=".csv,text/csv" onchange="impFile(this)">

    </div>
    <div id="impResult"></div>`,
    `<button class="btn navy" id="impBtn" onclick="doImport()" disabled>استيراد</button>
     <button class="btn" onclick="closeModal()">إلغاء</button>`, true);
}
function impTab(n) {
  $('#impT1').className = n === 1 ? 'on' : '';
  $('#impT2').className = n === 2 ? 'on' : '';
  $('#impBox1').style.display = n === 1 ? '' : 'none';
  $('#impBox2').style.display = n === 2 ? '' : 'none';
}
function impFile(input) {
  const f = input.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { $('#impPaste').value = rd.result; impParse(); };
  rd.readAsText(f, 'utf-8');
}
function splitLine(line) {
  if (line.indexOf('\t') > -1) return line.split('\t');
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (c === ',' && !q) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur); return out;
}
function impParse() {
  const txt = ($('#impPaste').value || '').replace(/\r/g, '').trim();
  const box = $('#impResult');
  if (!txt) { box.innerHTML = ''; $('#impBtn').disabled = true; return; }
  const lines = txt.split('\n').filter(l => l.trim());
  if (lines.length < 2) { box.innerHTML = '<div class="note">محتاج سطر عناوين وسطر بيانات على الأقل.</div>'; $('#impBtn').disabled = true; return; }
  const head = splitLine(lines[0]).map(h => h.trim());
  const rows = lines.slice(1).map(splitLine);
  const c = window._impCtx; c.head = head; c.rows = rows;
  /* تخمين الأعمدة من العناوين */
  const map = {};
  head.forEach((h, i) => {
    const hh = h.replace(/\s+/g, '');
    for (const f of IMP_FIELDS) {
      if (map[f.k] !== undefined) continue;
      if (f.k === 'unit' && hh.includes('سعر')) continue;          // «سعر الوحدة» مش «الوحدة»
      if (f.k === 'date' && hh.includes('الدفع')) continue;         // «تاريخ الدفع» ليها خانتها
      if (f.hints.some(x => hh.includes(x.replace(/\s+/g, '')))) { map[f.k] = i; break; }
    }
  });
  c.map = map;
  box.innerHTML = `
    <div style="font-weight:700;color:var(--navy);margin:14px 0 8px">اربط الأعمدة <span style="font-weight:400;color:var(--mut);font-size:12px">— ${rows.length} سطر اتقرا</span></div>
    ${IMP_FIELDS.map(f => `<div class="map-row"><span>${f.t}</span>
      <select onchange="_impCtx.map['${f.k}']=this.value===''?undefined:+this.value;impPreview()">
        <option value="">— مش موجود —</option>
        ${head.map((h, i) => `<option value="${i}" ${map[f.k] === i ? 'selected' : ''}>${esc(h || 'عمود ' + (i + 1))}</option>`).join('')}
      </select></div>`).join('')}
    <div id="impPrev"></div>`;
  impPreview();
}
function impPreview() {
  const c = window._impCtx, m = c.map;
  const get = (r, k) => m[k] === undefined ? '' : (r[m[k]] || '').trim();
  let items = 0, pays = 0, bad = 0;
  const prev = c.rows.slice(0, 8).map(r => {
    const amount = num(get(r, 'amount')) || (num(get(r, 'qty')) * num(get(r, 'price')));
    const paid = num(get(r, 'paid'));
    if (amount) items++; if (paid) pays++;
    if (!amount && !paid) bad++;
    return { d: parseFlexibleDate(get(r, 'date')), desc: get(r, 'desc'), amount, paid, meth: get(r, 'method') };
  });
  let ti = 0, tp = 0, tbad = 0;
  c.rows.forEach(r => {
    const amount = num(get(r, 'amount')) || (num(get(r, 'qty')) * num(get(r, 'price')));
    const paid = num(get(r, 'paid'));
    if (amount) ti++; if (paid) tp++;
    if (!amount && !paid) tbad++;
  });
  $('#impPrev').innerHTML = `
    <div class="calc-box" style="margin-top:10px">
      <div class="ln"><span>بنود أعمال / فواتير هتتضاف</span><b>${ti}</b></div>
      <div class="ln"><span>سدادات هتتضاف</span><b>${tp}</b></div>
      ${tbad ? `<div class="ln" style="color:var(--amber)"><span>صفوف هتتجاهل (مفيهاش مبلغ)</span><b>${tbad}</b></div>` : ''}
    </div>
    <div class="imp-prev"><table><thead><tr><th>التاريخ</th><th>البند</th><th class="num">مستحق</th><th class="num">واصل</th><th>الدفع</th></tr></thead>
    <tbody>${prev.map(x => `<tr><td>${x.d ? dsp(x.d) : '—'}</td><td>${esc(x.desc)}</td>
      <td class="num">${x.amount ? fmt2(x.amount) : ''}</td><td class="num">${x.paid ? fmt2(x.paid) : ''}</td>
      <td>${esc(x.meth)}</td></tr>`).join('')}</tbody></table></div>
    ${c.rows.length > 8 ? `<div class="hint-k">معاينة أول 8 صفوف من ${c.rows.length}</div>` : ''}`;
  $('#impBtn').disabled = (ti + tp) === 0;
}
function doImport() {
  const c = window._impCtx, m = c.map;
  const a = findAcc(findParty(c.pid), c.aid);
  const get = (r, k) => m[k] === undefined ? '' : (r[m[k]] || '').trim();
  snapshot();
  let ni = 0, np = 0;
  c.rows.forEach(r => {
    const qty = num(get(r, 'qty')), price = num(get(r, 'price'));
    const amount = num(get(r, 'amount')) || (qty * price);
    const paid = num(get(r, 'paid'));
    const d = parseFlexibleDate(get(r, 'date'));
    if (amount) {
      a.items.push({
        id: uid(), date: d, desc: get(r, 'desc') || 'بند مستورد', loc: get(r, 'loc'),
        proj: (function () { const v = get(r, 'loc'); const c = v ? canonProject(v) : ''; return (c && c !== UNASSIGNED) ? c : (accProject(a) === UNASSIGNED ? '' : accProject(a)); })(),
        qty: qty || 1, unit: get(r, 'unit'), price: price || amount, amount, pct: 100,
        retention: 0, advanceDeduction: 0, deductions: 0, cumTo: 0, photo: '', link: ''
      });
      ni++;
    }
    if (paid) {
      const pd = parseFlexibleDate(get(r, 'pdate')) || d;
      const meth = get(r, 'method');
      a.payments.push({
        id: uid(), date: pd, amount: paid, method: meth, note: get(r, 'desc') || 'سداد',
        kind: 'pay', treasury: methodTreasury(meth), cheque: '', photo: '', link: ''
      });
      np++;
    }
  });
  logAction('import', 'استيراد من إكسل لـ ' + findParty(c.pid).name + ' / ' + a.name + ': ' + ni + ' بند و ' + np + ' سداد');
  save(); closeModal(); render();
  toast('اتضاف ' + ni + ' بند و ' + np + ' سداد ✓', 'ok');
}

function extDir() { return (DB.settings && DB.settings.extDir) || ''; }
async function pickExtFolder() {

  if (!r || !r.ok) return;
  snapshot();
  DB.settings.extDir = r.dir;
  logAction('system', 'تحديد مجلد النسخ الخارجي: ' + r.dir);
  save(true); render(); toast('اتحدد المجلد ✓ — النسخ هتتاخد تلقائي', 'ok');
  extBackupNow(true);
}
function clearExtFolder() {
  askYesNo('إيقاف النسخ الخارجي', 'توقف النسخ التلقائي على المجلد الخارجي؟<br><span style="color:var(--mut);font-size:12.5px">النسخ القديمة هتفضل مكانها.</span>', () => {
    snapshot(); DB.settings.extDir = ''; DB.settings.extLast = '';
    save(true); render(); toast('اتوقف', 'ok');
  }, 'إيقاف', true);
}
async function extBackupNow(silent) {
  const dir = extDir();
  if (!dir) { if (!silent) toast('حدد المجلد الأول', 'err'); return false; }
  if (!window.tantawyFS || !window.tantawyFS.extBackup) return false;
  try {
    const json = JSON.stringify({ v: 3, at: new Date().toISOString(), parties: DB.parties, trash: DB.trash, settings: DB.settings, audit: DB.audit || [] });
    const r = await window.tantawyFS.extBackup(dir, json);
    if (r && r.ok) {
      DB.settings.extLast = r.at;
      DB.settings.extErr = '';
      mobileExport(true);          /* ملف الموبايل يتحدّث مع كل نسخة */
      if (!silent) { toast('اتنسخت برة الجهاز ✓', 'ok'); render(); }
      return true;
    }
    DB.settings.extErr = (r && r.error) || 'فشل';
    logErr('extBackup', DB.settings.extErr);
    if (!silent) toast('النسخ فشل: ' + DB.settings.extErr, 'err');
    return false;
  } catch (e) { logErr('extBackup', e.message); return false; }
}

async function mobileExport(silent){
  const dir = extDir();
  if (!dir || !window.tantawyFS) return false;
  let okAny = false;
  try {
    if (window.tantawyFS.extFile){
      const r = await window.tantawyFS.extFile(dir, 'حسابات-الطنطاوي-للموبايل.html', mobileHTML(true));
      if (r && r.ok) okAny = true; else if (r && r.error) logErr('mobHtml', r.error);
    }
    if (window.tantawyFS.extPdf){
      const r2 = await window.tantawyFS.extPdf(dir, 'حسابات-الطنطاوي-للموبايل.pdf', mobilePdfHTML());
      if (r2 && r2.ok) okAny = true; else if (r2 && r2.error) logErr('mobPdf', r2.error);
    }
    if (okAny){ DB.settings.mobLast = new Date().toISOString(); if (!silent) toast('ملف الموبايل اتحدّث على الدرايف ✓', 'ok'); }
    else if (!silent) toast('مقدرتش أكتب ملف الموبايل — شوف «حالة البرنامج»', 'err');
    return okAny;
  } catch (e) { logErr('mobileExport', e.message); return false; }
}

function mobilePreview(mode){

  catch (e) { logErr('mobilePreview', e.message); return toast('مش قادر يجهّز المعاينة — ' + e.message, 'err'); }
  const old = document.getElementById('mobPrev');
  if (old) old.remove();
  const phone = mode !== 'full';
  const d = document.createElement('div');
  d.id = 'mobPrev';
  d.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.72);display:flex;flex-direction:column';
  d.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--navy);color:#fff">

  document.body.appendChild(d);

  try { fr.srcdoc = html; }
  catch (e) {
    try { fr.src = URL.createObjectURL(new Blob([html], { type: 'text/html' })); }
    catch (e2) { d.remove(); return toast('المعاينة مش راضية تفتح — ' + e2.message, 'err'); }

/* ---------- تقرير مشروع واحد ---------- */
/* ================= التقرير المفصّل للمشروع =================
   كل حركة على المشروع بتاريخها ومبلغها — بنود المقاولين والموردين، السدادات،
   المصروفات العمومية، والعمالة اليومية — مع فلتر فترة، والإجماليات في الآخر. */
function itemTargets(a, i) {
  const base = accProject(a);
  const baseTokens = splitTokens(a.project).map(canonProject);
  const raw = (i.proj || '').trim();
  if (raw) return [canonProject(raw)];
  if (baseTokens.length > 1) {
    const locTokens = splitTokens(i.loc).map(canonProject);
    const hits = baseTokens.filter(t => locTokens.indexOf(t) > -1);
    return hits.length ? hits : [base];
  }
  return [base];
}
function inPeriod(d, from, to) {
  if (!from && !to) return true;
  if (!d) return !from && !to;
  if (from && d < from) return false;
  if (to && d > to) return false;
  return true;
}
function projectReportData(name, from, to) {
  const accs = [];
  DB.parties.forEach(p => p.accounts.forEach(a => {
    if (a.refOnly) return;
    const split = accProjectSplit(a);
    if (split[name] === undefined) return;
    const items = [];
    let allShare = 0;
    a.items.forEach(i => {
      const tg = itemTargets(a, i);
      if (tg.indexOf(name) < 0) return;
      const sh = itemNet(i) / tg.length;
      allShare += sh;
      if (!inPeriod(i.date, from, to)) return;
      items.push({ i, share: sh });
    });
    /* الفرق بين تكلفة المشروع من الحساب ده والبنود المسجّلة:
       مقطوعية اتفقت عليها من غير ما تفصّلها بنود، أو حساب «تحت الحساب» بيتحسب بالمصروف عليه. */
    const gapVal = split[name] - allShare;
    if (gapVal > 0.5 && inPeriod('', from, to)) {
      items.push({
        synth: true, share: gapVal,
        i: { date: '', loc: '', qty: 0, price: 0, extra: false,
          desc: a.mode === 'lump' ? 'قيمة الاتفاق — مش مفصّلة ببنود' : 'تحت الحساب — محسوب بالمصروف عليه' }
      });
    }
    if (!items.length) return;
    accs.push({ p, a, items, cost: items.reduce((t, x) => t + x.share, 0) });
  }));
  accs.sort((x, y) => (x.p.type === y.p.type ? y.cost - x.cost : x.p.type === 'contractor' ? -1 : 1));
  const exps = (DB.expenses || []).filter(x => canonProject(x.project) === name && inPeriod(x.date, from, to));
  const labs = [];
  (DB.labor || []).forEach(w => (w.days || []).forEach(dd => {
    if (canonProject(dd.project || w.project) !== name) return;
    if (!inPeriod(dd.date, from, to)) return;
    labs.push({ w, d: dd, amount: num(dd.amount) || num(dd.days) * num(dd.rate) });
  }));
  return { accs, exps, labs };
}

function prPeriod(kind) {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth();
  const pad = n => String(n).padStart(2, '0');
  const iso = (yy, mm, dd) => yy + '-' + pad(mm + 1) + '-' + pad(dd);
  const lastDay = (yy, mm) => new Date(yy, mm + 1, 0).getDate();
  let from = '', to = '';
  if (kind === 'month') { from = iso(y, m, 1); to = iso(y, m, lastDay(y, m)); }
  else if (kind === 'last') {
    const ly = m === 0 ? y - 1 : y, lm = m === 0 ? 11 : m - 1;
    from = iso(ly, lm, 1); to = iso(ly, lm, lastDay(ly, lm));
  }
  else if (kind === 'year') { from = iso(y, 0, 1); to = ''; }
  window._prFrom = from; window._prTo = to;
  const f = $('#prFrom'), t = $('#prTo');
  if (f) f.value = from ? dsp(from) : '';
  if (t) t.value = to ? dsp(to) : '';
  prInfo();
}

  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;

}
