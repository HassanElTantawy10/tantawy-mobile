<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حسابات الطنطاوي">
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>حسابات الطنطاوي</title>
<style>
:root{
  --navy:#1B3A5C; --navy-2:#24507D; --gold:#C9A227; --gold-soft:#F5E9C0;
  --slate:#0F172A; --slate-2:#1E293B; --bg:#F1F5F9; --line:#E2E8F0;
  --ink:#0F172A; --mut:#64748B; --amber:#B45309; --amber-bg:#FEF3C7;
  --emer:#047857; --emer-bg:#D1FAE5; --blue:#1D4ED8; --blue-bg:#DBEAFE;
  --red:#B91C1C; --red-bg:#FEE2E2;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.num{direction:ltr; text-align:left; font-variant-numeric:tabular-nums; unicode-bidi:isolate}
.app{display:flex; min-height:100vh}

/* ---------- الشريط الجانبي ---------- */
.sidebar{background:var(--slate); color:#fff; width:250px; flex:0 0 250px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column}
.side-head{display:flex; align-items:center; gap:11px; padding:16px 16px; border-bottom:1px solid var(--slate-2)}
.side-logo{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:9px;padding:3px;flex:0 0 46px}
.side-name{font-weight:700;font-size:14.5px;line-height:1.3}
.side-sub{font-size:10.5px;color:#94A3B8}
.back-btn{display:none;align-items:center;gap:8px;margin:10px 12px 0;padding:8px 12px;border:1px solid #334155;
  background:var(--slate-2);color:#CBD5E1;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600}
.back-btn:hover{background:#334155;color:#fff}
.nav{padding:10px 10px; overflow-y:auto; flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:3px;color:#CBD5E1;text-decoration:none;border-radius:9px;font-size:13.5px;cursor:pointer;transition:.15s;border:none;background:none;width:100%;text-align:right}
.nav a:hover{background:var(--slate-2);color:#fff}
.nav a.on{background:var(--navy);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
.nav .ico{width:19px;text-align:center;opacity:.9;font-size:15px}
.nav .badge{margin-inline-start:auto;background:#334155;color:#E2E8F0;border-radius:20px;padding:0 7px;font-size:11px;font-weight:600}
.side-foot{padding:10px 14px;border-top:1px solid var(--slate-2);font-size:11px;color:#64748B;display:flex;justify-content:space-between;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#22C55E;display:inline-block}

/* ---------- المحتوى ---------- */
.main{flex:1; min-width:0; padding:20px 24px 60px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1.page{font-size:22px;font-weight:800;color:var(--navy);margin:0}
.sub{color:var(--mut);font-size:12.5px;margin:2px 0 0}
.spacer{flex:1}

.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#CBD5E1;background:#F8FAFC}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3F2E00}
.btn.gold:hover{background:#B8931F}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.navy:hover{background:#16304C}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut);padding:6px 9px}
.btn.ghost:hover{background:#E2E8F0;color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--red);border-color:#FCA5A5}
.btn.danger:hover{background:var(--red-bg)}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card.pad{padding:16px 18px}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-t{font-weight:700;color:var(--navy);font-size:14.5px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px;position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--gold)}
.kpi.amber:after{background:#D97706}.kpi.emer:after{background:#059669}.kpi.blue:after{background:#2563EB}.kpi.navy:after{background:var(--navy)}
.kpi .lbl{font-size:12px;color:var(--mut);font-weight:600;margin-bottom:4px}
.kpi .val{font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-.4px}
.kpi .hint{font-size:11.5px;color:var(--mut);margin-top:3px}
.cur{font-size:13px;font-weight:600;color:var(--mut);margin-inline-start:3px}

table{width:100%;border-collapse:collapse}
thead th{background:var(--navy);color:#fff;padding:10px 12px;text-align:right;font-size:12.5px;font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:2}
thead th.num{text-align:left}
tbody td{padding:9px 12px;border-top:1px solid var(--line);font-size:13px;vertical-align:middle}
tbody tr:nth-child(even){background:#F8FAFC}
tbody tr:hover{background:#F1F5F9}
tbody tr.clk{cursor:pointer}
.tbl-wrap{overflow:auto;border-radius:0 0 14px 14px;max-height:70vh}
tfoot td{padding:10px 12px;border-top:2px solid var(--navy);font-weight:800;background:#F8FAFC;font-size:13.5px}

.chip{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.emer{background:var(--emer-bg);color:var(--emer)}
.chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.red{background:var(--red-bg);color:var(--red)}
.chip.gray{background:#F1F5F9;color:var(--mut)}
.chip.gold{background:var(--gold-soft);color:#7A5C00}

.search{position:relative;flex:0 0 300px;max-width:100%}
.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 36px 9px 12px;background:#fff}
.search:before{content:"⌕";position:absolute;inset-inline-start:12px;top:6px;font-size:18px;color:var(--mut)}
input,select,textarea{border:1px solid #CBD5E1;border-radius:9px;padding:8px 11px;background:#fff;width:100%;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.18)}
label{display:block;font-size:12.5px;font-weight:600;color:#334155;margin-bottom:5px}
.f{margin-bottom:13px}
.money{font-size:17px;font-weight:700;text-align:left;direction:ltr;padding:10px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ---------- كارت الطرف ---------- */
.party-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.avatar{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;flex:0 0 56px}
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px;margin-bottom:18px}
.acc{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer;transition:.15s;position:relative}
.acc:hover{border-color:var(--gold);box-shadow:0 3px 10px rgba(15,23,42,.07)}
.acc.on{border-color:var(--navy);box-shadow:0 0 0 2px rgba(27,58,92,.13)}
.acc .an{font-weight:700;color:var(--navy);font-size:13.5px;margin-bottom:3px}
.acc .am{font-size:11.5px;color:var(--mut);margin-bottom:9px}
.acc .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px}
.acc .row b{font-weight:700}
.bar{height:6px;background:#E2E8F0;border-radius:4px;overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#E0BC4A)}
.bar.done>i{background:linear-gradient(90deg,#059669,#34D399)}
.bar.prog>i{background:linear-gradient(90deg,#1D4ED8,#60A5FA)}
.bar.over>i{background:linear-gradient(90deg,#DC2626,#F87171)}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:9px 15px;cursor:pointer;font-weight:600;font-size:13px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:8px 8px 0 0}
.tabs button:hover{background:#F1F5F9;color:var(--ink)}
.tabs button.on{color:var(--navy);border-bottom-color:var(--gold);background:#fff}

.empty{text-align:center;padding:44px 20px;color:var(--mut)}
.empty .big{font-size:36px;opacity:.35;margin-bottom:8px}

/* ---------- المودال ---------- */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:80;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 22px 50px rgba(0,0,0,.28);animation:pop .16s ease-out}
.modal.wide{max-width:880px}
@keyframes pop{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:2px solid var(--gold)}
.modal-h .t{font-weight:800;color:var(--navy);font-size:16px;flex:1}
.modal-b{padding:18px 20px;max-height:66vh;overflow-y:auto}
.modal-f{display:flex;gap:9px;justify-content:flex-start;padding:13px 20px;border-top:1px solid var(--line);background:#F8FAFC;border-radius:0 0 16px 16px}
.x{border:none;background:#F1F5F9;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;color:var(--mut);line-height:1}
.x:hover{background:#E2E8F0;color:var(--ink)}

.calc-box{background:#F8FAFC;border:1px dashed #CBD5E1;border-radius:10px;padding:11px 14px;margin-top:10px;font-size:13px}
.calc-box .ln{display:flex;justify-content:space-between;padding:3px 0}
.calc-box .ln.tot{border-top:1px solid #CBD5E1;margin-top:5px;padding-top:7px;font-weight:800;color:var(--navy);font-size:15px}

.toast{position:fixed;bottom:22px;inset-inline-start:22px;background:var(--slate);color:#fff;padding:11px 18px;border-radius:11px;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:99;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:9px;animation:pop .18s}
.toast.ok{background:#065F46}.toast.err{background:#991B1B}

.note{background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:9px 13px;font-size:12.5px;color:#78350F;margin-bottom:12px}
.hint-k{font-size:11.5px;color:var(--mut);margin-top:4px}
kbd{background:#F1F5F9;border:1px solid #CBD5E1;border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-size:11px;font-family:inherit;color:#334155}


/* ---------- إضافات ---------- */
.nav .badge.red{background:#B91C1C;color:#fff}
.kpi.gold:after{background:var(--gold)}
.alert{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border-radius:9px;margin-bottom:5px;cursor:pointer;font-size:13px;border-inline-start:3px solid transparent;transition:.15s}
.alert:hover{background:#F1F5F9}
.alert.red{background:#FEF2F2;border-color:#DC2626;color:#7F1D1D}
.alert.amber{background:#FFFBEB;border-color:#D97706;color:#78350F}
.alert.blue{background:#EFF6FF;border-color:#2563EB;color:#1E3A8A}
.mini-l{font-size:11.5px;color:var(--mut);font-weight:600}
.mini-v{font-size:18px;font-weight:800}
.res{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.res:hover,.res.on{background:#F1F5F9;border-color:var(--line)}
.res .t{flex:1;min-width:0}
.res .t b{display:block;color:var(--navy)}
.res .t span{font-size:11.5px;color:var(--mut)}



/* ---------- شاشة القفل ---------- */
.lock{position:fixed;inset:0;background:linear-gradient(135deg,#0F172A,#1B3A5C);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.lock-box{background:#fff;border-radius:18px;padding:34px 38px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.lock-box img{width:84px;margin-bottom:14px}
.lock-box h2{margin:0 0 4px;font-size:18px;color:var(--navy)}
.lock-box p{margin:0 0 18px;font-size:12.5px;color:var(--mut)}
.lock-box input{text-align:center;font-size:18px;letter-spacing:3px;padding:11px}
.lock-err{color:var(--red);font-size:12.5px;margin-top:9px;min-height:18px;font-weight:600}
.crash{position:fixed;inset-inline:16px;bottom:16px;background:#7F1D1D;color:#fff;border-radius:12px;padding:13px 17px;z-index:150;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.crash button{margin-inline-start:10px;background:#fff;color:#7F1D1D;border:none;border-radius:8px;padding:5px 13px;font-weight:700;cursor:pointer;font-family:inherit}
.proj-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px}
.proj-card .h{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.proj-card .h b{font-size:15px;color:var(--navy)}
.proj-row{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px dashed #E2E8F0}
.proj-row:last-child{border:none}


/* ---------- التحديد المتعدد وقائمة الزر الأيمن ---------- */
tbody tr.selrow,tbody tr.selrow:nth-child(even){background:#DBEAFE !important}
tbody tr.selrow td{border-top-color:#93C5FD}
tbody tr.selrow td:first-child{box-shadow:inset 3px 0 0 #1D4ED8 !important}
tbody tr.selectable{cursor:default;user-select:none}
.selbar{position:sticky;top:62px;z-index:19;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:#1D4ED8;color:#fff;padding:9px 18px;font-size:13px;font-weight:600;
  box-shadow:0 2px 8px rgba(29,78,216,.25)}
.selbar b{font-size:15px}
.selbar .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}
.selbar .btn:hover{background:rgba(255,255,255,.28)}
.selbar .btn.danger{background:#fff;color:#B91C1C;border-color:#fff}
.ctx{position:fixed;z-index:300;background:#fff;border:1px solid var(--line);border-radius:11px;
  box-shadow:0 12px 34px rgba(15,23,42,.22);padding:5px;min-width:230px;overflow:hidden}
.ctx .ctx-h{padding:7px 12px;font-size:11.5px;color:var(--mut);font-weight:700;border-bottom:1px solid var(--line);margin-bottom:4px}
.ctx button{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;text-align:right;
  padding:8px 12px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--ink)}
.ctx button:hover{background:#F1F5F9}
.ctx button.danger{color:var(--red)}
.ctx button.danger:hover{background:var(--red-bg)}
.ctx button:disabled{opacity:.35;cursor:default}
.ctx button:disabled:hover{background:none}
.ctx .sep{height:1px;background:var(--line);margin:4px 0}
.ctx .k{margin-inline-start:auto;font-size:11px;color:var(--mut)}

/* ---------- تمييز السداد ---------- */
.chip.pay{background:#047857;color:#fff;font-weight:800;letter-spacing:.3px;padding:2px 11px;box-shadow:0 1px 2px rgba(4,120,87,.3)}
.chip.pay:before{content:"●";font-size:8px;margin-inline-end:2px;opacity:.8}
.chip.adv{background:#B45309;color:#fff;font-weight:800;padding:2px 11px}
.chip.late{background:#1D4ED8;color:#fff;font-weight:800;padding:2px 11px}
.chip.nodate{background:#F1F5F9;color:#94A3B8;font-weight:600;border:1px dashed #CBD5E1}
tbody tr.payrow,tbody tr.payrow:nth-child(even){background:#F0FDF4}
tbody tr.inrow,tbody tr.inrow:nth-child(even){background:#ECFDF5}
tbody tr.inrow td:first-child{box-shadow:inset 3px 0 0 #059669}
tbody tr.payrow:hover{background:#DCFCE7}
tbody tr.payrow td{border-top-color:#BBF7D0}
tbody tr.payrow td:first-child{box-shadow:inset 3px 0 0 #047857}
tbody tr.payrow .paid-cell{color:#047857;font-weight:800;font-size:13.5px}
tbody tr.basisrow,tbody tr.basisrow:nth-child(even){background:#FAFAF9}
tbody tr.basisrow td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
tbody tr.adjrow,tbody tr.adjrow:nth-child(even){background:#EFF6FF;font-style:italic}


/* شريط آخر الحركات فوق الدفتر */
.last-bar{display:flex;gap:0;align-items:stretch;flex-wrap:wrap;background:#F8FAFC;border-bottom:1px solid var(--line);padding:0 8px}
.last-cell{padding:10px 14px;border-inline-end:1px solid var(--line);min-width:160px}
.last-cell:last-of-type{border-inline-end:none}
.last-cell.paid{background:#F0FDF4}
.last-l{font-size:11px;color:var(--mut);font-weight:700;margin-bottom:2px}
.last-v{font-size:13.5px;color:var(--ink)}
.last-d{font-size:11px;color:var(--mut);margin-top:2px}

/* شريط الإجمالي الثابت فوق */
.acc-sticky{position:sticky;top:0;z-index:20;background:#F8FAFC;border-bottom:1px solid var(--line);
  box-shadow:0 2px 8px rgba(15,23,42,.06)}

/* الاستيراد */
.imp-tabs{display:flex;gap:4px;margin-bottom:12px}
.imp-tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px;cursor:pointer;font-weight:600;font-size:13px}
.imp-tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#impPaste{font-family:monospace;font-size:12px;direction:ltr;text-align:left;min-height:150px}
.imp-prev{max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.imp-prev table{font-size:12px}
.imp-prev td,.imp-prev th{padding:5px 8px}
.map-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;margin-bottom:6px;font-size:12.5px}

/* ---------- سند الصرف ---------- */
.voucher{border:2px solid var(--navy);border-radius:10px;padding:16px 18px}
.v-tbl{margin-bottom:12px}
.v-tbl td{border:1px solid var(--line);padding:8px 11px;font-size:13.5px}
.v-l{width:105px;background:#F8FAFC;font-weight:700;color:var(--navy);white-space:nowrap}
.v-amt{display:inline-block;background:var(--gold-soft);border:1px solid var(--gold);border-radius:7px;padding:3px 14px;font-size:20px;font-weight:800;color:#3F2E00}
.v-bal{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#F8FAFC;border:1px solid var(--line);border-radius:8px;padding:8px 13px;font-size:12.5px;color:#334155}
.cutline{border-top:2px dashed #94A3B8;margin-top:22px;padding-top:6px;text-align:center;font-size:10.5px;color:#94A3B8}

/* ---------- الطباعة ---------- */
.letterhead{display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--gold);padding-bottom:14px;margin-bottom:20px}
.lh-logo{width:88px;height:auto;object-fit:contain}
.lh-ar{font-weight:800;font-size:18px;color:var(--navy);line-height:1.35}
.lh-en{font-size:10px;color:#94A3B8;letter-spacing:.04em;margin-top:3px}
.doc-title{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;border-radius:8px;padding:10px 16px;margin-bottom:18px;font-weight:700}
.doc-ref{font-size:11px;opacity:.85;font-weight:400}
.sign-row{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:46px;break-inside:avoid}
.sign-line{border-top:1px solid #94A3B8;padding-top:8px;color:#64748B;font-size:13px;text-align:center}
.doc-footer{text-align:center;font-size:10.5px;color:#94A3B8;margin-top:26px}

<script>
/* ================= نسخة الموبايل — التخزين على التليفون =================
   الملف ده بيتحط قبل كود البرنامج الأصلي. بيعمل حاجتين:
   ١. تخزين على التليفون (IndexedDB) بدل ملف data.json بتاع اللاب.
   ٢. البرنامج الأصلي بيقرا البيانات من هنا كأنها «تخزين دائم» عادي.

   اللي متخزن على التليفون:
   - base   : آخر نسخة جت من اللاب (زي ما هي بالظبط)
   - outbox : السدادات اللي اتسجلت على الموبايل ولسه اللاب مأكدش إنه دخّلها
   - cfg    : رابط الربط وكود الربط
   والبيانات اللي بتتعرض = base + outbox فوقها. */
window.MOBILE = true;

const IDB = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('tantawy-mobile', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this._db = r.result; res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const q = db.transaction('kv').objectStore('kv').get(k);
      q.onsuccess = () => res(q.result === undefined ? null : q.result);
      q.onerror = () => rej(q.error);
    });
  },
  async set(k, v) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(v, k);
      tx.oncomplete = () => res(true);
      tx.onerror = () => rej(tx.error);
    });
  }
};

/* دمج السدادات اللي على الموبايل فوق نسخة اللاب — من غير ما نلمس أي حاجة تانية.
   لو السداد موجود في نسخة اللاب بنفس الرقم، النسخة اللي على الموبايل هي اللي بتتعرض
   (لأنها ممكن تكون اتعدلت بعد ما اتبعتت). */
/* الحركة نوعين: سداد (kind 'pay' — e.pay) أو بند (kind 'item' — e.item) */
function mobCompose(baseStr, outbox) {
  const d = JSON.parse(baseStr);
  const parties = d.parties || [];
  (outbox || []).forEach(e => {
    e.orphan = false;
    const isItem = e.kind === 'item', key = isItem ? 'items' : 'payments';
    let at = null;                                    // البند بيفضل في مكانه في الدفتر لو اتعدل
    parties.forEach(p => (p.accounts || []).forEach(a => {
      const arr = a[key] || [];
      const i = arr.findIndex(y => y.id === e.id);
      if (i > -1) { if (a.id === e.aid) at = i; arr.splice(i, 1); }
      a[key] = arr;
    }));
    if (e.del) return;
    const p = parties.find(x => x.id === e.pid);
    const a = p && (p.accounts || []).find(x => x.id === e.aid);
    if (!a) { e.orphan = true; return; }
    const row = JSON.parse(JSON.stringify(isItem ? e.item : e.pay));
    if (isItem && at !== null) a.items.splice(at, 0, row); else a[key].push(row);
  });
  return JSON.stringify(d);
}

/* البرنامج الأصلي بيدوّر على window.storage — بنديله واحد شغال على IndexedDB.
   الحفظ نفسه (save) بيتعمل من mob_post.js، فهنا بنقرا بس. */
window.storage = {
  async list() { await IDB.open(); return []; },
  async get(k) {
    if (k !== 'tantawy_accounts_v1') return null;
    const base = await IDB.get('base');
    if (!base) return null;
    const outbox = (await IDB.get('outbox')) || [];
    return { value: mobCompose(base, outbox) };
  },
  async set(k, v) { return true; }   // مفيش كتابة مباشرة — كله بيعدّي على mobSave
};

function tafqeet(n) {
  n = Math.round(num(n) * 100) / 100;
  if (!n) return 'صفر جنيه فقط لا غير';

  const tens = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
  const huns = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];
  function below1000(x) {
    const out = [];
    if (x >= 100) { out.push(huns[Math.floor(x / 100)]); x %= 100; }
    if (x >= 20) { const u = x % 10, t = tens[Math.floor(x / 10)]; out.push(u ? ones[u] + ' و' + t : t); }
    else if (x > 0) out.push(ones[x]);
    return out.join(' و');
  }
  function group(x, one, two, plural) {
    if (!x) return '';
    if (x === 1) return one;
    if (x === 2) return two;
    if (x <= 10) return below1000(x) + ' ' + plural;
    return below1000(x) + ' ' + one;
  }
  const parts = [];
  const mil = Math.floor(pounds / 1e6), th = Math.floor((pounds % 1e6) / 1000), rest = pounds % 1000;
  if (mil) parts.push(group(mil, 'مليون', 'مليونان', 'ملايين'));
  if (th) parts.push(group(th, 'ألف', 'ألفان', 'آلاف'));
  if (rest) parts.push(below1000(rest));
  let s = parts.filter(Boolean).join(' و') + ' جنيه';
  if (piast) s += ' و' + below1000(piast) + ' قرش';
  return (neg ? 'سالب ' : '') + s + ' فقط لا غير';
}

/* توزيع تكلفة الحساب على المشاريع — المورد أو المقاول الواحد ممكن يشتغل في أكتر من مشروع.

/* الحساب المتعلّم عليه «خالص»: الفرق بين قيمته واللي اتدفع فعلاً اتنازلت عنه

function accWriteOff(a) {

/* ================= اقتراح مشروع البند =================

/* توزيع واصل الحساب الواحد على مشاريعه.

function accPaidSplit(a) {
  const split = accProjectSplit(a);
  const keys = Object.keys(split);
  const out = {};
  keys.forEach(k => { out[k] = 0; });
  if (!keys.length) return out;
  const paid = accPaid(a);
  const total = keys.reduce((t, k) => t + split[k], 0);
  if (total <= 0) { out[keys[0]] = paid; return out; }

  keys.forEach(k => { const v = Math.min(split[k], paid * split[k] / total); out[k] = v; left -= v; });
  for (let guard = 0; guard < 8 && left > 0.005; guard++) {
    const un = keys.filter(k => split[k] - out[k] > 0.005);
    if (!un.length) break;

    const take = Math.min(left, room);
    un.forEach(k => { out[k] += take * (split[k] - out[k]) / room; });
    left -= take;

  if (left > 0.005) {
    const big = keys.slice().sort((x, y) => split[y] - split[x])[0];

}

function projectNames() {
  const reg = (DB && DB.settings && DB.settings.projects) || [];

    DB.parties.forEach(p => p.accounts.forEach(a => {
      if (a.refOnly) return;

function projectStats(name) {

  DB.parties.forEach(p => p.accounts.forEach(a => {
    if (a.refOnly) return;
    const split = accProjectSplit(a);          // { مشروع: تكلفة بنوده }
    if (split[name] === undefined) return;

  });
  const merged = normalizeAcc({
    name: grp.base || first.name, project: grp.project, mode: 'items', agreed: 0,
    retentionRate: num(first.retentionRate), settled: false, refOnly: false,
    note: grp.accs.map(z => z.a.note).filter(Boolean).join(' · '),
    floors, items, payments, adjust: 0
  });
  /* نظبط التسوية عشان الرصيد يطلع نفس مجموع أرصدة الحسابات القديمة */
  const d = accDues(merged), pd = accPaid(merged);
  merged.adjust = Math.round((grp.rem - ((d === null ? 0 : d) - pd)) * 100) / 100;
  /* علامة إن التسوية دي من الدمج نفسه مش تنازل — عشان متخصمش من تكلفة المشروع */
  if (Math.abs(merged.adjust) > 0.005) merged.adjustKind = 'merge';
  return merged;
}

function doMergeFloors(){
  const { pid, groups } = window._mgCtx;
  const p = findParty(pid);
  const picked = groups.filter((g, i) => window._mgPick[i]);
  if (!picked.length) return toast('حدد مجموعة على الأقل', 'err');
  const beforeRem = partyTotals(p).rem, beforeCost = p.accounts.reduce((t, a) => t + accCost(a), 0);
  snapshot();
  let done = 0, failed = [];
  picked.forEach(g => {
    const merged = buildMerged(g);
    const okRem = Math.abs(accRem(merged) - g.rem) < 0.5;
    const okCost = Math.abs(accCost(merged) - g.cost) < 1;
    if (!okRem || !okCost){ failed.push(g.base + (okRem ? ' (التكلفة)' : ' (الرصيد)')); return; }
    const ids = g.accs.map(z => z.a.id);
    g.accs.forEach(z => toTrash('account', p.name + ' / ' + z.a.name + ' — اتدمج في «' + g.base + '»', { pid, acc: z.a }));
    p.accounts = p.accounts.filter(a => ids.indexOf(a.id) < 0);
    p.accounts.push(merged);
    UI.aid = merged.id;
    done++;
  });
  /* فحص أخير على الطرف كله */
  const afterRem = partyTotals(p).rem, afterCost = p.accounts.reduce((t, a) => t + accCost(a), 0);
  if (Math.abs(afterRem - beforeRem) > 1 || Math.abs(afterCost - beforeCost) > 2){
    undo();
    return modal('اتلغى الدمج', `<div class="note" style="border-color:#FCA5A5;background:#FEF2F2">
      الدمج كان هيغيّر أرقام ${esc(p.name)} (الرصيد من ${fmt(beforeRem)} لـ ${fmt(afterRem)}) — فالبرنامج رجّع كل حاجة زي ما كانت ومعملش حاجة.</div>`,
      '<button class="btn" onclick="closeModal()">تمام</button>');
  }
  logAction('account', 'دمج حسابات أدوار لـ ' + p.name + ': ' + done + ' مجموعة');
  save(); closeModal(); render();
  if (failed.length) modal('فيه مجموعات اتسابت', `<div class="note" style="border-color:#FCA5A5;background:#FEF2F2">
    المجموعات دي الأرقام فيها مكانتش هتطلع مظبوطة فسيبتها زي ما هي:<br><b>${failed.map(esc).join(' · ')}</b></div>`,
    '<button class="btn" onclick="closeModal()">تمام</button>');
  else toast('اتدمج ' + done + ' مجموعة — الأرصدة زي ما هي ✓', 'ok');
}

/* دفتر الحساب */
/* تأثير بند الأعمال على الرصيد: في المقطوعية البنود بتخصم بس،
   إلا الشغل الإضافي (أمر تغيير) فبيتزاد فوق الاتفاق. */
function wDelta(a, r) {
  if (a.mode !== 'lump') return num(r.net);
  return r.extra ? num(r.net) : -(num(r.retention) + num(r.advanceDeduction) + num(r.deductions));
}
function ledger(a) {
  const rows = [];
  a.items.forEach(i => {
    const ret = a.retentionReleased ? 0 : num(i.retention);
    rows.push({
      k: 'w', id: i.id, date: i.date, desc: i.desc, loc: i.loc, qty: i.qty, unit: i.unit, price: i.price,
      pct: i.pct, proj: i.proj, gross: num(i.amount), amount: itemNet(i),
      retention: num(i.retention), advanceDeduction: num(i.advanceDeduction), deductions: num(i.deductions),
      net: itemNet(i) - ret - num(i.advanceDeduction) - num(i.deductions), photo: i.photo, cumTo: i.cumTo,
      floor: i.floor || '', extra: !!i.extra, extraOk: !!i.extraOk, extraRef: i.extraRef || ''
    });
  });
  a.payments.forEach(p => rows.push({
    k: 'p', id: p.id, date: p.date, kind: p.kind, cheque: p.cheque, photo: p.photo, floor: p.floor || '',
    desc: p.note || (p.kind === 'advance' ? 'سلفة' : p.kind === 'sched' ? 'مستحق مؤجل' : 'سداد'),
    method: p.method, recv: p.recv || '', amount: num(p.amount)
  }));
  /* البنود من غير تاريخ دي أساس الاتفاق/الحصر فبتيجي فوق،
     وبعدها كل الحركات مرتبة زمنياً مهما كان نوعها */
  const key = r => r.date || (r.k === 'w' ? '0000-00-00' : '9998-00-00');
  rows.sort((x, y) => key(x).localeCompare(key(y)) || (x.k === 'w' ? -1 : 1));
  let bal = a.mode === 'lump' ? num(a.agreed) : 0;
  rows.forEach(r => {
    if (r.k === 'w') bal += wDelta(a, r);
    else if (r.kind === 'pay') bal -= r.amount;
    r.bal = bal;
  });
  if (num(a.adjust)) {
    bal += num(a.adjust);
    rows.push({ k: 'adj', id: 'adj', date: '', desc: 'تسوية / فروق على الحساب', amount: num(a.adjust), bal });
  }
  return rows;
}
function allMoves(filter) {
  const out = [];
  DB.parties.forEach(p => p.accounts.forEach(a => {
    if (a.refOnly) return;
    a.items.forEach(i => out.push({ k: 'w', p, a, date: i.date, desc: i.desc, amount: itemNet(i), ref: i }));
    a.payments.forEach(y => out.push({ k: 'p', p, a, date: y.date, desc: y.note || 'سداد', method: y.method, amount: num(y.amount), kind: y.kind, ref: y }));
  }));
  out.sort((x, y) => (y.date || '0000').localeCompare(x.date || '0000'));
  return filter ? out.filter(filter) : out;
}

    const tr = projectTradeStats(n);
    Object.keys(bs.b.lines || {}).forEach(t => {

  return out.sort((x, y) => x.sort - y.sort);
}



/* ================= الإيرادات والخزنة ================= */
const INCOME_CATS = ['قسط عميل', 'مقدم حجز وحدة', 'دفعة تعاقد', 'بيع وحدة', 'تحصيل', 'تمويل / رأس مال', 'قرض', 'إيراد آخر'];
function normalizeIncome(x) {
  return {
    id: x.id || uid(), date: x.date || '', cat: x.cat || 'تحصيل', desc: x.desc || '',
    amount: num(x.amount), project: x.project || '', client: x.client || '',
    method: x.method || '', treasury: x.treasury || methodTreasury(x.method),
    note: x.note || '', photo: x.photo || ''
  };
}
/* أرصدة افتتاحية للخزن (نقدية / محفظة / بنك) — أول ما تبدأ تستخدم البرنامج */
function openingBal(tre) {
  const o = (DB.settings && DB.settings.opening) || {};
  return num(o[tre]);
}
function setOpening(tre, v) {
  DB.settings.opening = DB.settings.opening || {};
  DB.settings.opening[tre] = num(v);
}
/* حركة كل خزنة: افتتاحي + الوارد − الصادر */
function treasuryFlow() {
  const f = {};
  TREASURIES.forEach(t => f[t] = { opening: openingBal(t), in: 0, out: 0 });
  const ensure = t => { if (!f[t]) f[t] = { opening: 0, in: 0, out: 0 }; return f[t]; };
  /* الوارد: الإيرادات */
  (DB.income || []).forEach(x => { ensure(x.treasury || methodTreasury(x.method)).in += num(x.amount); });
  /* الصادر: سدادات المقاولين والموردين (اللي فعلاً خرجت — مش المؤجل) */
  DB.parties.forEach(p => p.accounts.forEach(a => {
    if (a.refOnly) return;
    a.payments.forEach(y => { if (y.kind === 'sched') return; ensure(y.treasury || methodTreasury(y.method)).out += num(y.amount); });
  }));
  /* الصادر: المصروفات المباشرة (اللي مش من عهدة) + تمويل العُهد */
  (DB.expenses || []).forEach(x => { if (x.custodyId) return; ensure(x.treasury || methodTreasury(x.method)).out += num(x.amount); });
  (DB.custody || []).forEach(c => c.funds.forEach(fn => ensure(fn.treasury || methodTreasury(fn.method)).out += num(fn.amount)));
  (DB.custody || []).forEach(c => c.returns.forEach(r => ensure('نقدية').in += num(r.amount)));   // الراجع من العهدة يرجع نقدي
  /* الصادر: سداد العمالة */
  (DB.labor || []).forEach(w => w.payments.forEach(y => ensure(y.treasury || methodTreasury(y.method)).out += num(y.amount)));
  Object.keys(f).forEach(t => f[t].balance = f[t].opening + f[t].in - f[t].out);
  return f;
}
function totalCashOnHand() {
  const f = treasuryFlow();
  return Object.keys(f).reduce((s, t) => s + f[t].balance, 0);
}
function totalIncome() { return (DB.income || []).reduce((s, x) => s + num(x.amount), 0); }

/* المستحق علينا (كل اللي لسه هندفعه) والمستحق لينا */
function companyPosition() {
  let owePay = 0, oweGet = 0, ret = 0, sched = 0, labor = 0;
  DB.parties.forEach(p => {
    const t = partyTotals(p);
    if (t.rem > 0) owePay += t.rem; else oweGet += -t.rem;
    ret += t.ret; sched += t.sched;
  });
  (DB.labor || []).forEach(w => { const r = workerRem(w); if (r > 0) labor += r; });
  return { owePay, oweGet, ret, sched, labor, cash: totalCashOnHand() };
}

const EXPENSE_CATS = ['نقل ومواصلات', 'وقود', 'إيجار معدات', 'رسوم حكومية وتراخيص', 'مرافق الموقع', 'أدوات ومستهلكات', 'ضيافة وإكراميات', 'صيانة', 'مصاريف إدارية', 'متنوع'];

/* حسابات العمالة */
const workerDue = w => w.days.reduce((s, d) => s + (num(d.amount) || num(d.days) * num(d.rate)), 0);
const workerPaid = w => w.payments.reduce((s, y) => s + num(y.amount), 0);
const workerRem = w => workerDue(w) - workerPaid(w);
/* حسابات العُهد */
const custodyFunded = c => c.funds.reduce((s, f) => s + num(f.amount), 0);
const custodySpent = c => (DB.expenses || []).filter(x => x.custodyId === c.id).reduce((s, x) => s + num(x.amount), 0);
const custodyReturned = c => c.returns.reduce((s, r) => s + num(r.amount), 0);
const custodyBalance = c => custodyFunded(c) - custodySpent(c) - custodyReturned(c);
/* كل المصروف من الخزنة: عهدة اتصرفت + مصروف مباشر (مش من عهدة) + سداد عمالة */
function expenseCashOut(x) { return x.custodyId ? 0 : num(x.amount); }

/* تجميع المصروفات والعمالة على المشاريع */
function projectExtras(name) {
  const exp = (DB.expenses || []).filter(x => canonProject(x.project) === name);
  const expTotal = exp.reduce((s, x) => s + num(x.amount), 0);
  let labTotal = 0, labPaid = 0;
  (DB.labor || []).forEach(w => w.days.forEach(d => {
    if (canonProject(d.project || w.project) !== name) return;
    labTotal += num(d.amount) || num(d.days) * num(d.rate);
  }));
  (DB.labor || []).forEach(w => {
    const share = w.days.filter(d => canonProject(d.project || w.project) === name)
      .reduce((s, d) => s + (num(d.amount) || num(d.days) * num(d.rate)), 0);
    const all = workerDue(w);
    if (all > 0) labPaid += workerPaid(w) * share / all;
  });
  return { expTotal, expCount: exp.length, labTotal, labPaid };
}

/* ================= تصفية الحساب =================
   التصفية بتقفل الحركات القديمة عند رقم متفق عليه وتخفيها من الشاشة،
   والحساب بيكمّل من الرقم ده. مفيش أي حاجة بتتمسح — الحساب القديم راجع بضغطة.
   الطي بيتعمل بأرقام الحركات نفسها (مش بالتاريخ بس)، عشان لو سجّلت بعدين
   حركة بتاريخ قديم تفضل ظاهرة ومحسوبة بدل ما تغيّر الرصيد من ورا ظهرك. */
const rkey = r => r.k + ':' + r.id;
function lastClosing(a) { return (a.closings && a.closings.length) ? a.closings[a.closings.length - 1] : null; }
/* تأثير الحركة الواحدة على الرصيد — نفس حسابات الدفتر بالظبط */
function rowDelta(a, r) {
  if (r.k === 'w') return wDelta(a, r);
  if (r.k === 'p') return r.kind === 'pay' ? -num(r.amount) : 0;
  if (r.k === 'adj') return num(r.amount);
  return 0;
}
/* رصيد الحساب لغاية تاريخ معيّن (سيبها فاضية = لغاية دلوقتي) */
function balAt(a, date) {
  let bal = a.mode === 'lump' ? num(a.agreed) : 0;
  ledger(a).forEach(r => {
    if (r.k === 'adj') return;
    if (date && r.date && r.date > date) return;
    bal += rowDelta(a, r);
  });
  return bal + num(a.adjust);
}
/* مين ينفع يتصفّى: لازم يكون ليه رصيد محدد أصلاً.
   «تحت الحساب» مالوش رصيد محسوب في البرنامج كله، والخالص رصيده صفر. */
function canClose(a) { return !a.refOnly && !a.settled && accGross(a) !== null; }
function whyNoClose(a) {
  if (a.refOnly) return 'الحساب ده للاطلاع بس ومش داخل في الأرصدة.';
  if (a.settled) return 'الحساب ده متعلّم عليه «خالص» — رصيده صفر أصلاً. شيل علامة خالص الأول لو عايز تصفّيه.';
  if (accGross(a) === null) return 'الحساب ده «تحت الحساب» ومفيهوش قيمة اتفاق، فمفيش رصيد محسوب يتصفّى. حدّد قيمة الاتفاق أو سجّل البنود الأول.';
  if (!a.items.length && !a.payments.length) return 'الحساب لسه فاضي مفيهوش حركات. لو عايز تبدأه برصيد قديم، استخدم زرار «⇄ رصيد أول المدة».';
  return '';
}
/* الحركات اللي هتتطوى لو صفّينا لغاية التاريخ ده */
function foldCount(a, date) {
  return ledger(a).filter(r => r.k !== 'adj' && (!r.date || !date || r.date <= date)).length;
}
function foldKeys(a, date) {
  const keys = ledger(a).filter(r => !r.date || !date || r.date <= date).map(rkey);
  /* سطر التسوية العامة بيتطوى دايماً — لأنه داخل أصلاً في الرقم المرحّل */
  if (keys.indexOf('adj:adj') < 0) keys.push('adj:adj');
  return keys;
}
/* الدفتر بعد التصفية: المرحّل + اللي بعده بس */
function openLedger(a) {
  const cl = lastClosing(a), all = ledger(a);
  if (!cl) return { rows: all, cl: null, hidden: 0, carried: 0 };
  const folded = new Set(cl.rows || []);
  const rows = all.filter(r => !folded.has(rkey(r))).map(r => Object.assign({}, r));
  let bal = num(cl.carried);
  rows.forEach(r => {
    bal += rowDelta(a, r);
    r.bal = bal;
    /* حركة قديمة اتسجلت بعد ما الحساب اتصفّى */
    r.late = !!(r.date && cl.date && r.date <= cl.date);
  });
  /* لو التسوية العامة على الحساب اتغيّرت بعد التصفية، نوريها كسطر لوحدها */
  const extra = num(a.adjust) - num(cl.adjAt);
  if (folded.has('adj:adj') && Math.abs(extra) > 0.5) {
    bal += extra;
    rows.push({ k: 'adj', id: 'adj2', date: '', desc: 'تسوية اتسجلت بعد التصفية', amount: extra, bal, late: true });
  }
  const hidden = all.filter(r => r.k !== 'adj' && folded.has(rkey(r))).length;
  return { rows, cl, hidden, carried: num(cl.carried) };
}
/* رصيد أول المدة: رصيد الحساب قبل ما يدخل البرنامج — بيتحط في أول الدفتر
   من غير ما يلمس أي حركة مسجّلة. */
function openAccOpening(pid, aid) {
  const p = findParty(pid), a = findAcc(p, aid);
  if (!a) return toast('الحساب مش موجود', 'err');
  if (lastClosing(a)) return toast('الحساب ده فيه رصيد مرحّل بالفعل — افتح «فك التصفية» لو عايز تغيّره', 'err');
  const dates = ledger(a).map(r => r.date).filter(Boolean).sort();

  modal('رصيد أول المدة — ' + a.name, `
    <div class="note">لو ${esc(p.name)} ليه حساب قديم معاك قبل البرنامج، اكتب رصيده هنا.
      هيظهر كسطر «رصيد مرحّل» في أول الدفتر، وكل الحركات المسجّلة تكمّل بعده.</div>
    ${first ? `<div class="hint-k" style="margin-bottom:9px">أول حركة مسجّلة في الحساب يوم <b>${dsp(first)}</b> — خلي تاريخ الرصيد قبلها.</div>` : ''}
    <div class="grid3">

     <button class="btn" onclick="closeModal()">إلغاء</button>`);

function shiftDays(iso, n) {
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d)) return todayISO();
  d.setDate(d.getDate() + n);
  const p = x => String(x).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function saveAccOpening(pid, aid) {

function closingCalc() {

/* كشف عن فترة: الرصيد الافتتاحي + الحركات داخل الفترة */
function ledgerPeriod(a, from, to) {
  const all = ledger(a);
  if (!from && !to) return { rows: all, opening: 0, hasPeriod: false };
  const inR = d => (!from || (d && d >= from)) && (!to || (d && d <= to));
  let opening = a.mode === 'lump' ? num(a.agreed) : 0;
  const rows = [];
  all.forEach(r => {
    const d = r.date || '';
    const before = from && (!d || d < from);
    if (before) {
      if (r.k === 'w') opening += wDelta(a, r);
      else if (r.kind === 'pay') opening -= r.amount;
      else if (r.k === 'adj') opening += r.amount;
      return;
    }
    if (inR(d) || (!d && !from)) rows.push(r);
  });
  let bal = opening;
  rows.forEach(r => {
    if (r.k === 'w') bal += wDelta(a, r);
    else if (r.kind === 'pay') bal -= r.amount;
    else if (r.k === 'adj') bal += r.amount;
    r.bal = bal;
  });
  return { rows, opening, closing: bal, hasPeriod: true };
}

/* كشف الازدواج: سداد بنفس المبلغ لنفس الطرف خلال 10 أيام */
function findDuplicates(pid, amount, date, excludeId) {
  if (!amount || !date) return [];
  const p = findParty(pid); if (!p) return [];
  const out = [];
  p.accounts.forEach(a => a.payments.forEach(y => {
    if (y.id === excludeId || y.kind === 'sched') return;
    if (Math.abs(num(y.amount) - amount) > 0.5) return;
    if (!y.date) return;
    const gap = Math.abs(daysBetween(y.date, date));
    if (gap <= 10) out.push({ a, y, gap });
  }));
  return out.sort((x, y) => x.gap - y.gap);
}

/* سعر الوحدة: تجميع البنود اللي لها كمية ووحدة */
function unitRates() {
  const map = {};
  DB.parties.forEach(p => p.accounts.forEach(a => {
    if (a.refOnly) return;
    a.items.forEach(i => {
      const q = num(i.qty), amt = itemNet(i);
      if (!q || !amt || !i.desc) return;
      const unit = (i.unit || '').trim();
      const key = i.desc.trim() + (unit ? ' / ' + unit : '');
      if (!map[key]) map[key] = { desc: i.desc.trim(), unit, rows: [] };
      map[key].rows.push({
        party: p.name, pid: p.id, type: p.type, project: a.project || '',
        qty: q, rate: amt / q, amount: amt, date: i.date, acc: a.name
      });
    });
  }));
  Object.values(map).forEach(g => {
    const rs = g.rows.map(r => r.rate);
    g.min = Math.min(...rs); g.max = Math.max(...rs);
    g.avg = rs.reduce((s, x) => s + x, 0) / rs.length;
    g.qty = g.rows.reduce((s, r) => s + r.qty, 0);
    g.total = g.rows.reduce((s, r) => s + r.amount, 0);
    g.wavg = g.qty ? g.total / g.qty : 0;
    g.last = g.rows.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0];
  });
  return map;
}
/* تكلفة المتر لكل مشروع على بند معيّن */
function rateByProject(desc, unit) {
  const out = {};
  DB.parties.forEach(p => p.accounts.forEach(a => {
    if (a.refOnly) return;
    a.items.forEach(i => {
      if ((i.desc || '').trim() !== desc || (i.unit || '').trim() !== unit) return;
      const q = num(i.qty), amt = itemNet(i);
      if (!q || !amt) return;
      const pr = a.project || 'غير محدد';
      out[pr] = out[pr] || { qty: 0, amount: 0 };
      out[pr].qty += q; out[pr].amount += amt;
    });
  }));
  Object.values(out).forEach(x => x.rate = x.qty ? x.amount / x.qty : 0);
  return out;
}

/* جودة البيانات — اللي ناقص ومحتاج يتكمّل */
function dataGaps() {
  const g = { noAgree: [], noDate: [], noRate: [], noBudget: [], noUnits: [], overPaid: [] };
  DB.parties.forEach(p => p.accounts.forEach(a => {
    if (a.refOnly) return;
    if (a.mode === 'open' && accPaid(a) > 0) g.noAgree.push({ p, a, paid: accPaid(a) });
    a.items.forEach(i => {
      if (!i.date) g.noDate.push({ p, a, kind: 'w', row: i, label: i.desc, amount: itemNet(i) });
      if (!num(i.qty) || !num(i.price)) g.noRate.push({ p, a, row: i });
    });
    a.payments.forEach(y => { if (!y.date) g.noDate.push({ p, a, kind: 'p', row: y, label: y.note || 'سداد', amount: num(y.amount) }); });
    if (a.mode === 'lump' && accPaid(a) - num(a.agreed) > 0.5) g.overPaid.push({ p, a, over: accPaid(a) - num(a.agreed) });
  }));
  (DB.expenses || []).forEach(x => { if (!x.date) g.noDate.push({ exp: x, label: x.desc, amount: num(x.amount) }); });
  projectNames().forEach(n => {
    const b = projBudget(n), s = projectStats(n);
    if (s.gross > 0 && !b.total) g.noBudget.push({ n, gross: s.gross });
    if (s.gross > 0 && !b.units) g.noUnits.push({ n, gross: s.gross });
  });
  g.score = 0;
  const totalIssues = g.noAgree.length + g.noDate.length + g.noBudget.length + g.noUnits.length + g.overPaid.length;
  g.total = totalIssues;
  return g;
}

/* ================= الملخص الأسبوعي ================= */
function weekRange(offset) {
  const end = new Date(); end.setDate(end.getDate() - (offset || 0) * 7);
  const start = new Date(end); start.setDate(start.getDate() - 6);
  return { from: start.toISOString().slice(0, 10), to: end.toISOString().slice(0, 10) };
}
function weeklyReport(offset) {
  const r = weekRange(offset);
  const inRange = d => d && d >= r.from && d <= r.to;
  const pays = [], items = [], sched = [];
  const byParty = {}, byTre = {}, byProject = {};
  DB.parties.forEach(p => p.accounts.forEach(a => {
    if (a.refOnly) return;
    a.payments.forEach(y => {
      if (y.kind === 'sched') {
        const d7 = daysBetween(todayISO(), y.date);
        if (d7 >= 0 && d7 <= 7) sched.push({ p, a, y, d: d7 });
        return;
      }
      if (!inRange(y.date)) return;
      pays.push({ p, a, y });
      byParty[p.name] = (byParty[p.name] || 0) + num(y.amount);
      const t = y.treasury || methodTreasury(y.method);
      byTre[t] = (byTre[t] || 0) + num(y.amount);
      const pr = a.project || 'غير محدد';
      byProject[pr] = (byProject[pr] || 0) + num(y.amount);
    });
    a.items.forEach(i => { if (inRange(i.date)) items.push({ p, a, i }); });
  }));
  const paidTotal = pays.reduce((s, x) => s + num(x.y.amount), 0);
  const newCommit = items.reduce((s, x) => s + itemNet(x.i), 0);
  const schedTotal = sched.reduce((s, x) => s + num(x.y.amount), 0);
  let totalDue = 0;
  DB.parties.forEach(p => { const t = partyTotals(p); if (t.rem > 0) totalDue += t.rem; });
  const prev = offset === undefined ? weeklyReport(1) : null;
  return {
    range: r, pays, items, sched, byParty, byTre, byProject,
    paidTotal, newCommit, schedTotal, totalDue,
    prevPaid: prev ? prev.paidTotal : null
  };
}

function save(now) {

    if (t.rem > 0) rem += t.rem; else they += -t.rem;

  return { dues, paid, rem, they, ret, adv, sched };
}

function projectAgg() {
  const m = {};
  DB.parties.forEach(p => p.accounts.forEach(a => {
    if (a.refOnly) return;
    const k = a.project || 'غير محدد';
    m[k] = m[k] || { dues: 0, paid: 0, rem: 0, accs: 0 };
    const d = accDues(a);
    m[k].dues += d === null ? 0 : d; m[k].paid += accCashOut(a); m[k].rem += accRem(a); m[k].accs++;
  }));

}

/* ================= القوائم ================= */
const PARTY_SORTS = { rem: 'الأعلى مستحق', name: 'أبجدي', paid: 'الأكثر صرفاً', recent: 'آخر حركة', accs: 'عدد الحسابات' };
const PARTY_FILTERS = { all: 'الكل', due: 'عليهم مستحق', settled: 'خالص', they: 'لينا عندهم', quiet: 'ساكن +45 يوم' };
/* إجمالي طرف واحد داخل مشروع واحد — بنفس قاعدة توزيع الواصل اللي في projectStats
   عشان مجموع الأطراف في المشروع يساوي إجمالي المشروع بالظبط */
function partyProjTotals(p, name) {
  let gross = 0, paid = 0;
  let off = 0, adj = 0;
  p.accounts.forEach(a => {
    if (a.refOnly) return;
    const split = accProjectSplit(a);
    if (split[name] === undefined) return;
    gross += split[name];
    paid += accPaidSplit(a)[name] || 0;
    off += projWriteOff(a, name);
    adj += accAdjSplit(a)[name] || 0;
  });
  return { gross, dues: gross, paid, off, adj, rem: gross - paid - off + adj };
}
/* المشاريع اللي الطرف ده شغال فيها */
function partyProjects(p) {
  const out = [];
  p.accounts.forEach(a => {
    if (a.refOnly) return;
    Object.keys(accProjectSplit(a)).forEach(k => { if (out.indexOf(k) < 0) out.push(k); });
  });
  return out;
}
/* إجمالي كل مشروع لنوع واحد (مقاولين أو موردين) */
function projTotalsByType(type) {
  const out = {};
  DB.parties.forEach(p => {
    if (p.type !== type || p._carry) return;
    partyProjects(p).forEach(n => {
      const t = partyProjTotals(p, n);
      if (t.gross <= 0 && Math.abs(t.rem) < 0.5) return;
      const o = out[n] = out[n] || { gross: 0, paid: 0, rem: 0, off: 0, parties: 0 };
      o.gross += t.gross; o.paid += t.paid; o.off += t.off; o.rem += t.rem; o.parties++;
    });
  });
  return out;
}
function listRows() {
  const type = UI.view, q = (UI.q || '').trim();
  let arr = DB.parties.filter(p => p.type === type && !p._carry);
  if (q) arr = arr.filter(p => (p.name + ' ' + p.trade + ' ' + p.note + ' ' + p.accounts.map(a => a.name + a.project).join(' ')).includes(q));
  const pf = UI.filterProject || '';
  if (pf) arr = arr.filter(p => partyProjects(p).indexOf(pf) > -1);
  /* لما تختار مشروع، كل الأرقام في الشاشة بتبقى بتاعة المشروع ده بس */
  arr = arr.map(p => ({ p, t: pf ? partyProjTotals(p, pf) : partyTotals(p), last: lastMoveDate(p) }));
  const f = UI.filterParty;
  if (f === 'due') arr = arr.filter(x => x.t.rem > 0.5);
  else if (f === 'settled') arr = arr.filter(x => Math.abs(x.t.rem) < 0.5);
  else if (f === 'they') arr = arr.filter(x => x.t.rem < -0.5);
  else if (f === 'quiet') arr = arr.filter(x => x.t.rem > 0.5 && x.last && daysBetween(x.last, todayISO()) >= 45);
  const s = UI.sortParty;
  arr.sort((a, b) =>
    s === 'name' ? a.p.name.localeCompare(b.p.name, 'ar')
      : s === 'paid' ? b.t.paid - a.t.paid
        : s === 'recent' ? (b.last || '').localeCompare(a.last || '')
          : s === 'accs' ? b.p.accounts.length - a.p.accounts.length
            : b.t.rem - a.t.rem);
  if (!arr.length) return '<tr><td colspan="6" class="empty"><div class="big">🔍</div>مفيش نتائج</td></tr>';
  window._partyOrder = arr.map(o => o.p.id);

      <td><b style="color:var(--navy)">${on ? '☑ ' : ''}${esc(o.p.name)}</b><div style="font-size:11.5px;color:var(--mut)">${esc(o.p.trade || '—')}</div></td>
      <td>${o.p.accounts.filter(a => !a.refOnly).length} <span style="color:var(--mut);font-size:12px">حساب</span>
        <div style="font-size:11px;color:var(--mut);margin-top:2px">${partyProjects(o.p).map(n => `<span class="chip ${n === UNASSIGNED ? 'red' : 'gray'}" style="font-size:9.5px;padding:1px 5px">${esc(n)}</span>`).join(' ')}</div></td>
      <td class="num">${fmt(o.t.dues)}</td><td class="num">${fmt(o.t.paid)}</td>
      <td class="num"><b>${fmt(b.v)}</b></td><td><span class="chip ${b.cls}">${b.txt}</span></td></tr>`;

function bulkPartyDelete() {

  let accs = 0, moves = 0, rem = 0;
  ps.forEach(p => {
    accs += p.accounts.length; rem += partyTotals(p).rem;
    p.accounts.forEach(a => { moves += a.items.length + a.payments.length; });
  });
  askYesNo('حذف ' + ps.length + ' ' + (UI.view === 'contractor' ? 'مقاول' : 'مورد'),
    'هيتحذفوا بكل حساباتهم: <b>' + accs + '</b> حساب و<b>' + moves + '</b> حركة' +
    (Math.abs(rem) > 0.5 ? '، وفيهم أرصدة مفتوحة بإجمالي <b>' + fmt2(Math.abs(rem)) + '</b> ج.م' : '') + '.' +
    '<div style="margin-top:8px;font-size:12.5px;color:var(--mut)">' + ps.map(p => esc(p.name)).join(' · ') + '</div>' +
    '<div class="note" style="margin-top:8px">كله هيروح لسلة المحذوفات وتقدر ترجّعه.</div>',
    () => {
      snapshot();
      ps.forEach(p => {
        logAction('delete', 'حذف طرف: ' + p.name + ' (' + p.accounts.length + ' حساب)');
        toTrash('party', p.name + ' — ' + p.accounts.length + ' حساب', p);

      DB.parties = DB.parties.filter(x => ids.indexOf(x.id) < 0);

function bulkPartyExport() {

const ACC_SORTS = { rem: 'الأكبر باقي', name: 'أبجدي', recent: 'آخر حركة', project: 'المشروع', gross: 'أكبر قيمة' };
const ACC_FILTERS = { all: 'كل الحسابات', open: 'الجارية بس', settled: 'الخالصة', due: 'اللي فيها باقي', ref: 'للاطلاع' };
function accList(p) {
  let arr = p.accounts.slice();
  const f = UI.filterAcc;
  if (f === 'open') arr = arr.filter(a => !a.settled && !a.refOnly);
  else if (f === 'settled') arr = arr.filter(a => a.settled);
  else if (f === 'due') arr = arr.filter(a => !a.refOnly && Math.abs(accRem(a)) > 0.5);
  else if (f === 'ref') arr = arr.filter(a => a.refOnly);
  const s = UI.sortAcc;
  arr.sort((x, y) =>
    s === 'name' ? x.name.localeCompare(y.name, 'ar')
      : s === 'recent' ? (lastAccMove(y) || '').localeCompare(lastAccMove(x) || '')
        : s === 'project' ? (x.project || 'يي').localeCompare(y.project || 'يي', 'ar')
          : s === 'gross' ? (accGross(y) || 0) - (accGross(x) || 0)
            : Math.abs(accRem(y)) - Math.abs(accRem(x)));
  return arr;
}

/* ================= كل الحركات ================= */
function viewMoves() {
  const q = (UI.q || '').trim();
  let mv = allMoves();
  const projOfMove = m => m.k === 'w' ? (itemProjects(m.a, m.ref)[0] || UNASSIGNED) : accProject(m.a);
  if (UI.filterProject) mv = mv.filter(m => projOfMove(m) === UI.filterProject);
  if (UI.tab === 'pay') mv = mv.filter(m => m.k === 'p');
  else if (UI.tab === 'work') mv = mv.filter(m => m.k === 'w');
  if (q) mv = mv.filter(m => (m.p.name + ' ' + m.a.name + ' ' + m.desc + ' ' + (m.method || '')).includes(q));
  const projects = projectNames();
  const LIM = 250;
  const work = m => m.k === 'w' ? m.amount : 0, pay = m => m.k === 'p' && m.kind !== 'sched' ? m.amount : 0;
  /* الجدول بيعرض أول 250 حركة في كل مشروع — الإجماليات محسوبة على الكل */
  const groups = projGroups(mv, projOfMove);
  const shown = new Set(); groups.forEach(([, rs]) => rs.slice(0, LIM).forEach(m => shown.add(m)));
  const t = projTable(mv, projOfMove, m => shown.has(m) ? `<tr class="clk ${m.k === 'p' ? 'payrow' : ''}" onclick="go('party','${m.p.id}','${m.a.id}')">
      <td style="white-space:nowrap">${dsp(m.date)}</td><td><b>${esc(m.p.name)}</b></td>
      <td style="font-size:12.5px;color:var(--mut)">${esc(m.a.name)}</td><td>${esc(m.desc || '—')}</td>
      <td>${moveChip(m)}</td><td style="font-size:12px">${esc(m.method || '')}</td>
      <td class="num">${m.k === 'w' ? '<b>' + fmt2(m.amount) + '</b>' : ''}</td>
      <td class="num paid-cell">${m.k === 'p' ? '<b>' + fmt2(m.amount) + '</b>' : ''}</td></tr>` : '',
    [null, null, null, null, null, null, work, pay], { unit: 'حركة', empty: '<tr><td colspan="8" class="empty">مفيش حركات</td></tr>' });
  return `
  <div class="topbar">
    <div><h1 class="page">كل الحركات${UI.filterProject ? ' — ' + esc(UI.filterProject) : ''}</h1><p class="sub">${mv.length} حركة — كل مشروع لوحده</p></div>
    <div class="spacer"></div>
    <div class="search no-print"><input id="searchBox" placeholder="دور في كل الحركات…"></div>
    <select class="no-print" style="width:auto" onchange="UI.filterProject=this.value;render()">
      <option value="">كل المشاريع</option>${projects.map(x => `<option ${UI.filterProject === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
    <button class="btn no-print" onclick="exportCSV()">CSV</button>
    <button class="btn no-print" onclick="exportExcel()">Excel</button>
  </div>
  <div class="tabs no-print">
    <button class="${UI.tab === 'all' ? 'on' : ''}" onclick="UI.tab='all';render()">الكل</button>
    <button class="${UI.tab === 'work' ? 'on' : ''}" onclick="UI.tab='work';render()">أعمال وتوريدات</button>
    <button class="${UI.tab === 'pay' ? 'on' : ''}" onclick="UI.tab='pay';render()">سدادات</button>
  </div>
  <div class="card"><div class="tbl-wrap"><table>
    <thead><tr><th style="width:95px">التاريخ</th><th>الطرف</th><th>الحساب</th><th>البند</th><th>النوع</th><th>طريقة الدفع</th><th class="num">أعمال / توريد</th><th class="num">سداد</th></tr></thead>
    <tbody>${t.body}</tbody>
    <tfoot>${t.foot}</tfoot>
  </table></div>
  ${groups.some(([, rs]) => rs.length > LIM) ? `<div class="hint-k" style="padding:9px 18px">معروض أول ${LIM} حركة في كل مشروع — الإجماليات محسوبة على كل الحركات. استخدم البحث للتصفية.</div>` : ''}</div>`;
}

  const bs = budgetSummary(name), tr = projectTradeStats(name), b = bs.b;
  const trades = [...new Set(Object.keys(tr).concat(Object.keys(b.lines || {})))].sort((a, c) => (tr[c] ? tr[c].gross : 0) - (tr[a] ? tr[a].gross : 0));
  const sumLines = trades.reduce((t, x) => t + num((b.lines || {})[x]), 0);
  return `<div class="card" style="margin-top:16px">
    <div class="card-h"><span class="card-t">ميزانية مشروع ${esc(name)} مقابل الفعلي</span>

      ${b.units ? `<span class="chip gold">${b.units} ${esc(b.unitLabel)}</span>` : ''}
      <button class="btn sm no-print" onclick="openBudget('${esc(name).replace(/'/g, "\\'")}')">تعديل</button></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>البند</th><th>الأطراف</th><th class="num">الميزانية</th><th class="num">التكلفة المسجّلة</th><th class="num">المصروف</th><th class="num">المتاح</th><th class="num">%</th>${b.units ? `<th class="num">لكل ${esc(b.unitLabel)}</th>` : ''}</tr></thead>
      <tbody>${trades.map(t => {
        const bl = num((b.lines || {})[t]), a = tr[t] || { gross: 0, paid: 0, names: [] };
        const av = bl ? bl - a.gross : null, pc = bl ? a.gross / bl * 100 : 0;

          <td style="font-size:11.5px;color:var(--mut)">${esc(a.names.slice(0, 3).join('، ') || '—')}</td>
          <td class="num">${bl ? fmt(bl) : '—'}</td><td class="num">${fmt(a.gross)}</td><td class="num">${fmt(a.paid)}</td>
          <td class="num" style="color:${av === null ? 'var(--mut)' : av < 0 ? 'var(--red)' : 'var(--emer)'}">${av === null ? '—' : (av < 0 ? '−' : '') + fmt(Math.abs(av))}</td>

/* ================= أسعار المواد ================= */
/* ================= الوحدة وسعر الوحدة =================
   سعر الوحدة الحقيقي = المبلغ ÷ الكمية. خانة «سعر الوحدة» ممكن تكون غلط (حصل في الاستيراد)،
   فبنعتمد على المبلغ لأنه هو اللي بيدخل في الحساب فعلاً. */
function unitPrice(i) {
  const q = num(i.qty), am = num(i.amount);
  if (q > 0) return Math.round(am / q * 100) / 100;
  return num(i.price);
}
/* البند اللي الكمية × السعر فيه مش بتطلع المبلغ */
function priceMismatch(i) {
  const q = num(i.qty), pr = num(i.price), am = num(i.amount);
  if (!q || !pr) return false;
  return Math.abs(q * pr - am) > 1;
}
const UNIT_WORDS = [
  ['طن', /(^|\s)طن/],
  ['بالتة', /بالت[هة]/],
  ['نقلة', /نقل[هة]/],
  ['ساعة', /(^|\s)(س|ساع[هة])(\s|$)/],
  ['يوم', /(^|\s)يوم/],
  ['م3', /خرسان[هة]|لبش[هة]|مسلح[هة]|عادي[هة]|سقف|عمدان|أعمد[هة]|اعمد[هة]|ميد[هة]|قواعد|صبّ|مون/],
  ['م2', /محار[هة]|سافيتو|شق[هة]|بلاط|سيراميك|عزل|نقاش[هة]|دهان|تخشيب/],
  ['م', /هاندريل|ماسور[هة]|كابل|سلك|وزر|درابزين/],
  ['عدد', /كوع|جلب[هة]|بيب[هة]|محبس|صماد|لمب[هة]|كشاف|باب|شباك|مفتاح|بريز/]
];
/* الأوصاف دي أعمال أو تسويات مش بضاعة — ممنوع نخمّن لها وحدة
   («توقيع سقف الأرضي» مش ٢ متر مكعب خرسانة) */
const NO_UNIT_RE = /توقيع|تسليم|اكسات|اكسا|فرق |باقي|مقدم|فاتور|مقطوع|تسوي[هة]|عطل[هة]|دفع[هة]|مصروف|نثري|رصيد|حساب قديم|تحت الحساب/;
function guessUnit(desc) {
  const t = String(desc || '').replace(/[إأآ]/g, 'ا');
  if (NO_UNIT_RE.test(t)) return '';
  for (let k = 0; k < UNIT_WORDS.length; k++) if (UNIT_WORDS[k][1].test(t)) return UNIT_WORDS[k][0];
  return '';
}
/* وحدة البند: المكتوبة فيه، وإلا المحفوظة لنفس الوصف، وإلا تخمين من الوصف */
function unitOverrides() { DB.settings.units = DB.settings.units || {}; return DB.settings.units; }
function effUnit(i) {
  const u = (i.unit || '').trim();

function matGroups() {
  const m = {};

    if (a.refOnly || isCarry(p)) return;     // الرصيد المرحّل رقم إجمالي، مالوش سعر وحدة
    a.items.forEach(i => {
      const d = (i.desc || '').trim();
      if (!d) return;
      const k = descKey(d);
      if (!k) return;
      const g = m[k] = m[k] || { key: k, desc: d, rows: [], qty: 0, money: 0, parties: {}, projects: {}, units: {} };
      const q = num(i.qty), am = num(i.amount), u = effUnit(i);
      g.rows.push({ p, a, i, qty: q, amount: am, up: unitPrice(i), date: i.date || '', unit: u, guess: unitIsGuess(i) });
      g.qty += q; g.money += am;
      g.parties[p.name] = (g.parties[p.name] || 0) + am;
      const pr = (i.proj || '').trim() ? canonProject(i.proj) : accProject(a);
      g.projects[pr] = (g.projects[pr] || 0) + q;
      if (u) g.units[u] = (g.units[u] || 0) + 1;
    });
  }));
  return Object.keys(m).map(k => {
    const g = m[k];
    g.rows.sort((x, y) => (y.date || '').localeCompare(x.date || ''));
    const ups = g.rows.map(r => r.up).filter(v => v > 0);
    g.unit = Object.keys(g.units).sort((a, b) => g.units[b] - g.units[a])[0] || '';
    g.avg = g.qty > 0 ? g.money / g.qty : 0;
    g.min = ups.length ? Math.min.apply(null, ups) : 0;
    g.max = ups.length ? Math.max.apply(null, ups) : 0;
    /* تطور السعر بيتحسب لكل طرف لوحده — سعر المحطة للخرسانة حاجة
       وسعر المقاول للصبّ حاجة تانية خالص، فمقارنتهم بتضلّل */
    g.byParty = {};

      const b = g.byParty[r.p.name] = g.byParty[r.p.name] || { pid: r.p.id, rows: [], qty: 0, money: 0 };
      b.rows.push(r); b.qty += r.qty; b.money += r.amount;

    Object.keys(g.byParty).forEach(pn => {
      const b = g.byParty[pn];
      const dd = b.rows.filter(r => r.date);
      b.last = dd[0] || b.rows[0] || null;
      b.prev = null;
      for (let z = 1; z < dd.length; z++) if (Math.abs(dd[z].up - b.last.up) > 0.005) { b.prev = dd[z]; break; }
      b.chg = (b.last && b.prev && b.prev.up) ? (b.last.up - b.prev.up) / b.prev.up * 100 : null;
      b.avg = b.qty > 0 ? b.money / b.qty : 0;

    const dated = g.rows.filter(r => r.date);
    g.last = dated[0] || g.rows[0] || null;
    /* التغيّر المعروض = تغيّر سعر نفس الطرف اللي آخر حركة بتاعته */
    const lb = g.last ? g.byParty[g.last.p.name] : null;

    g.chg = lb ? lb.chg : null;

  { key: 'steel', name: 'حديد', unit: 'طن', re: /حديد/ },
  { key: 'cement', name: 'أسمنت', unit: 'طن', re: /اسمنت|أسمنت/ },
  { key: 'brick', name: 'طوب', unit: 'بالتة', re: /طوب|بالت/ },
  { key: 'sand', name: 'رملة وزلط وحيبة', unit: 'نقلة', re: /رمل|زلط|حيب/ },
  { key: 'plaster', name: 'محارة', unit: 'م2', re: /محار|سافيتو/ }

function projMaterials() {

    if (a.refOnly || isCarry(p)) return;
    a.items.forEach(i => {
      const u = effUnit(i), f = matFamOf(i.desc, u);
      if (!f) return;
      const pr = (i.proj || '').trim() ? canonProject(i.proj) : accProject(a);
      const o = out[pr] = out[pr] || {};
      const c = o[f.key] = o[f.key] || { name: f.name, unit: f.unit, qty: 0, money: 0, n: 0, sup: 0, con: 0, supM: 0, conM: 0 };
      const q = num(i.qty), am = num(i.amount);
      c.qty += q; c.money += am; c.n++;

function tgSave() {

    t.time = String(Math.min(23, +p[0])).padStart(2, '0') + ':' + String(Math.min(59, +p[1])).padStart(2, '0');

/* ================= تصفح النسخ الاحتياطية القديمة ================= */
/* بيوري كل نسخة بالتاريخ وعدد البنود جواها — عشان تحدد بالظبط امتى بند اختفى وترجعه */
async function listAllBackups() {
  const out = [];
  if (window.tantawyFS && window.tantawyFS.listBackups) {
    const local = await window.tantawyFS.listBackups();
    (local || []).forEach(b => out.push(Object.assign({ src: 'local' }, b)));
  }
  if (window.tantawyFS && extDir() && window.tantawyFS.listExtBackups) {
    const ext = await window.tantawyFS.listExtBackups(extDir());
    (ext || []).forEach(b => out.push(Object.assign({ src: 'ext' }, b)));
  }
  out.sort((a, b) => b.at.localeCompare(a.at));
  return out;
}
async function readBackupContent(b) {
  if (b.src === 'ext') return window.tantawyFS.readExtBackup(extDir(), b.name);
  return window.tantawyFS.readBackup(b.name);
}
async function openBackupBrowser() {
  if (!window.tantawyFS || !window.tantawyFS.listBackups) {
    modal('تصفح النسخ', '<div class="note">الخاصية دي في نسخة الـ EXE بس — نسخة المتصفح بتحتفظ بنسخة واحدة فقط.</div>', '<button class="btn" onclick="closeModal()">إغلاق</button>');
    return;
  }
  modal('تصفح النسخ الاحتياطية', `<div id="bkList" class="empty" style="padding:30px"><div class="big">⏳</div>بيجمع القايمة…</div>`,
    `<button class="btn" onclick="closeModal()">إغلاق</button>`, true);
  const list = await listAllBackups();
  const box = $('#bkList'); if (!box) return;
  if (!list.length) { box.innerHTML = '<div class="empty" style="padding:30px"><div class="big">🕐</div>مفيش نسخ محفوظة لسه</div>'; return; }
  const curCount = stateCounts(fullState());
  box.innerHTML = `
    <div class="note">الأرقام هنا من كل نسخة — قارنها بعدد البنود الحالي (<b>${curCount['حسابات']} حساب</b>) عشان تلاقي امتى حصل نقص.
      دوس على أي نسخة تشوف تفاصيلها، أو «استرجاع» ترجع البرنامج كله لحالتها.</div>
    <div class="tbl-wrap" style="max-height:380px;border:1px solid var(--line);border-radius:10px">
    <table style="font-size:12.5px"><thead><tr><th>التاريخ والوقت</th><th>المصدر</th><th class="num">الحجم</th><th class="no-print" style="width:170px"></th></tr></thead>
    <tbody>${list.map((b, i) => `<tr id="bkRow${i}">
      <td><b>${dsp(b.at.slice(0, 10))}</b> <span class="num" style="color:var(--mut)">${b.at.slice(11, 16)}</span></td>
      <td><span class="chip ${b.src === 'ext' ? 'blue' : 'gray'}">${b.src === 'ext' ? 'المجلد الخارجي' : 'داخلي'}</span></td>
      <td class="num">${(b.size / 1024).toFixed(0)} ك.ب</td>
      <td class="no-print"><button class="btn sm" onclick="previewBackup(${i})">عرض التفاصيل</button>
        <button class="btn sm navy" onclick="restoreBackup(${i})">استرجاع</button></td></tr>`).join('')}</tbody>
    </table></div>`;
  window._bkList = list;
}
async function previewBackup(i) {
  const b = window._bkList[i];
  const raw = await readBackupContent(b);
  if (!raw) return toast('مقدرتش أقرا النسخة دي', 'err');
  let d; try { d = JSON.parse(raw); } catch (e) { return toast('الملف تالف', 'err'); }
  const c = stateCounts(d), cur = stateCounts(fullState());
  modal('تفاصيل نسخة ' + dsp(b.at.slice(0, 10)) + ' — ' + b.at.slice(11, 16), `
    <table><thead><tr><th></th><th class="num">في النسخة دي</th><th class="num">عندك دلوقتي</th><th class="num">الفرق</th></tr></thead>
    <tbody>${Object.keys(c).map(k => { const diff = c[k] - cur[k]; return `<tr><td>${k}</td><td class="num">${c[k]}</td><td class="num">${cur[k]}</td>
      <td class="num" style="color:${diff > 0 ? 'var(--emer)' : diff < 0 ? 'var(--red)' : 'var(--mut)'}">${diff > 0 ? '+' : ''}${diff}</td></tr>`; }).join('')}</tbody></table>
    <div class="hint-k" style="margin-top:10px">لو «حسابات» أو بنودها كانت أكتر في النسخة دي، يبقى النقص حصل بعد التاريخ ده.</div>`,
    `<button class="btn navy" onclick="restoreBackup(${i})">استرجاع النسخة دي بالكامل</button>
     <button class="btn" onclick="exportBackupFile(${i})">⤓ تحميل كملف لوحده</button>
     <button class="btn" onclick="closeModal();openBackupBrowser()">رجوع للقايمة</button>`, true);
}
async function exportBackupFile(i) {
  const b = window._bkList[i];
  const raw = await readBackupContent(b);
  if (!raw) return toast('مقدرتش أقرا النسخة دي', 'err');
  download('نسخة-' + b.at.slice(0, 16).replace(/[:T]/g, '-') + '.json', raw);

/* ================= القاعدة: كل مشروع لوحده — والإجمالي لكل المشاريع تحت خالص =================
   أي جدول فيه فلوس في البرنامج بيتقسم بالأداة دي: عنوان لكل مشروع، سطوره، إجماليه —
   وفي الآخر سطر «الإجمالي لكل المشاريع». «غير محدد» دايماً آخر مشروع. */
const jsq = v => String(v).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
function projGroups(rows, projOf) {
  const order = {}; projectNames().forEach((n, i) => { order[n] = i; });
  const m = new Map();
  rows.forEach(r => { const n = canonProject(projOf(r)); if (!m.has(n)) m.set(n, []); m.get(n).push(r); });
  return [...m.entries()].sort((a, b) => ((a[0] === UNASSIGNED) - (b[0] === UNASSIGNED))
    || ((order[a[0]] === undefined ? 999 : order[a[0]]) - (order[b[0]] === undefined ? 999 : order[b[0]]))
    || a[0].localeCompare(b[0], 'ar'));
}
/* سطر إجمالي بنفس أعمدة الجدول. cols: لكل عمود null (مالوش إجمالي) أو دالة بترجع رقم السطر أو 'np' (عمود مش بيتطبع) */
function projSumRow(label, rows, cols, cls) {
  const first = cols.findIndex(c => typeof c === 'function');
  let h = `<tr class="${cls || ''}"><td colspan="${Math.max(1, first)}">${label}</td>`;
  for (let i = Math.max(1, first); i < cols.length; i++) {
    const c = cols[i];
    if (c === 'np') h += '<td class="no-print"></td>';
    else if (typeof c === 'function') h += `<td class="num">${fmt2(rows.reduce((t, r) => t + num(c(r)), 0))}</td>`;
    else h += '<td></td>';
  }
  return h + '</tr>';
}
/* الجدول مقسوم على المشاريع → { body, foot } */
function projTable(rows, projOf, rowHtml, cols, opt) {
  opt = opt || {};
  if (!rows.length) return { body: opt.empty || '', foot: '' };
  const groups = projGroups(rows, projOf);
  let body = '';
  groups.forEach(([n, rs]) => {
    body += `<tr class="projhead"><td colspan="${cols.length}">🏗 ${n === UNASSIGNED ? '<span style="color:var(--red)">مالوش مشروع</span>' : '<bdi>' + esc(n) + '</bdi>'}<span class="pc">(${rs.length} ${opt.unit || 'سطر'})</span></td></tr>`;
    body += rs.map(rowHtml).join('');
    if (groups.length > 1) body += projSumRow('إجمالي ' + (n === UNASSIGNED ? 'اللي مالوش مشروع' : 'مشروع ' + esc(n)), rs, cols, 'projsub');
  });
  const foot = projSumRow(groups.length > 1 ? 'الإجمالي لكل المشاريع (' + groups.length + ' مشروع)'
    : 'الإجمالي — ' + (groups[0][0] === UNASSIGNED ? 'مالوش مشروع' : 'مشروع ' + esc(groups[0][0])), rows, cols, 'projgrand');
  return { body, foot };
}
/* ملخص فوق الشاشة: سطر لكل مشروع، والإجمالي لكل المشاريع تحت. cols: [{t: العنوان, f: دالة الرقم | cnt: true}] */
function projSummary(title, rows, projOf, cols, opt) {
  opt = opt || {};
  const g = projGroups(rows, projOf);
  if (!g.length) return '';
  const cell = (rs, c) => `<td class="num">${c.cnt ? rs.length : (c.fmt || fmt2)(rs.reduce((t, r) => t + num(c.f(r)), 0))}</td>`;
  const pick = n => opt.filter ? ` class="clk${UI.filterProject === n ? ' selrow' : ''}" onclick="UI.filterProject='${jsq(n)}';render()"` : '';
  return `<div class="card projsum" style="margin-bottom:16px"><div class="card-h"><span class="card-t">${title}</span>
      <span class="chip gray">كل مشروع لوحده</span>${opt.filter && UI.filterProject ? `<div class="spacer"></div><button class="btn sm no-print" onclick="UI.filterProject='';render()">اعرض كل المشاريع</button>` : ''}</div>
    <div class="tbl-wrap"><table><thead><tr><th>المشروع</th>${cols.map(c => `<th class="num">${c.t}</th>`).join('')}</tr></thead>

/* العمالة: نصيب كل عامل في كل مشروع — أيامه ومستحقه فيه، والمدفوع متوزع بنسبة المستحق
   (نفس حسبة projectExtras اللي شاشة المشاريع بتحسب بيها) */
function laborShares(list) {
  const out = [];
  (list || DB.labor || []).forEach(w => {
    const all = workerDue(w), paid = workerPaid(w), by = new Map();
    w.days.forEach(d => {
      const n = canonProject(d.project || w.project);
      if (!by.has(n)) by.set(n, { w, proj: n, days: 0, due: 0, week: 0 });
      const x = by.get(n), v = num(d.amount) || num(d.days) * num(d.rate);
      x.days += num(d.days); x.due += v;
    });
    const wk = weekRange();
    w.days.forEach(d => { if (d.date >= wk.from && d.date <= wk.to) by.get(canonProject(d.project || w.project)).week += num(d.amount) || num(d.days) * num(d.rate); });
    if (!by.size) by.set(canonProject(w.project), { w, proj: canonProject(w.project), days: 0, due: 0, week: 0 });
    const parts = [...by.values()];
    parts.forEach(x => { x.paid = all > 0 ? paid * x.due / all : (x === parts[0] ? paid : 0); x.rem = x.due - x.paid; });
    out.push(...parts);
  });
  return out;
}

/* الملخص الأسبوعي: كل مشروع لوحده */
function weeklyProjSummary(w) {
  const rows = [];
  w.pays.forEach(x => rows.push({ proj: accProject(x.a), paid: num(x.y.amount), commit: 0, sched: 0, owe: 0 }));
  w.items.forEach(x => rows.push({ proj: itemProjects(x.a, x.i)[0], paid: 0, commit: itemNet(x.i), sched: 0, owe: 0 }));
  w.sched.forEach(x => rows.push({ proj: accProject(x.a), paid: 0, commit: 0, sched: num(x.y.amount), owe: 0 }));
  DB.parties.forEach(p => p.accounts.forEach(a => {
    if (a.refOnly || a.settled) return;
    const r = accRem(a); if (r > 0.5) rows.push({ proj: accProject(a), paid: 0, commit: 0, sched: 0, owe: r });
  }));
  return projSummary('الأسبوع ده — كل مشروع لوحده', rows, r => r.proj, [
    { t: 'اتصرف الأسبوع ده', f: r => r.paid, fmt },
    { t: 'التزامات جديدة', f: r => r.commit, fmt },
    { t: 'مستحق الأسبوع الجاي', f: r => r.sched, fmt },
    { t: 'إجمالي اللي عليّ', f: r => r.owe, fmt }]);
}
/* لوحة التحكم: كل مشروع لوحده — اللي عليّ للمقاولين والموردين، والمدفوع والمحصّل الشهر ده، والمحتجز والمؤجل */
function dashProjSummary() {
  const mo = todayISO().slice(0, 7), rows = [];
  DB.parties.forEach(p => p.accounts.forEach(a => {
    if (a.refOnly) return;
    const r = a.settled ? 0 : accRem(a), owe = r > 0.5 ? r : 0, isCon = p.type === 'contractor' && !isCarry(p);
    rows.push({ proj: accProject(a), con: isCon ? owe : 0, sup: isCon ? 0 : owe,
      paid: a.payments.filter(y => y.kind !== 'sched' && (y.date || '').slice(0, 7) === mo).reduce((t, y) => t + num(y.amount), 0),
      sched: a.payments.filter(y => y.kind === 'sched').reduce((t, y) => t + num(y.amount), 0),
      ret: accRetHeld(a), inc: 0 });
  }));
  (DB.income || []).filter(x => (x.date || '').slice(0, 7) === mo).forEach(x => rows.push({ proj: x.project, con: 0, sup: 0, paid: 0, sched: 0, ret: 0, inc: num(x.amount) }));
  const any = k => rows.some(r => Math.abs(r[k]) > 0.5);
  const cols = [
    { t: 'مستحق للمقاولين', f: r => r.con, fmt },
    { t: 'مستحق للموردين', f: r => r.sup, fmt },
    { t: 'إجمالي اللي عليّ', f: r => r.con + r.sup, fmt },
    { t: 'اتدفع الشهر ده', f: r => r.paid, fmt },
    { t: 'اتحصّل الشهر ده', f: r => r.inc, fmt }];
  if (any('ret')) cols.push({ t: 'محتجز عندي', f: r => r.ret, fmt });
  if (any('sched')) cols.push({ t: 'مؤجل / شيكات', f: r => r.sched, fmt });
  return projSummary('كل مشروع لوحده', rows.filter(r => cols.some(c => Math.abs(c.f(r)) > 0.5)), r => r.proj, cols);
}

function gridAddRows() {

    tr.innerHTML = `<td><input id="g${i}d" data-date style="min-width:110px"></td>

function gridRows() {
  const c = window._gridCtx, out = [];
  for (let i = 0; i < c.rows; i++) {
    const n = sval('g' + i + 'n'), q = mval('g' + i + 'q'), pr = mval('g' + i + 'p');
    let amt = mval('g' + i + 'a');
    const paid = mval('g' + i + 'y');
    if (!amt && q && pr) amt = q * pr;
    if (!n && !amt && !paid) continue;
    out.push({ i, date: dval('g' + i + 'd'), desc: n, qty: q, unit: sval('g' + i + 'u'), price: pr, amount: amt, paid, method: sval('g' + i + 'm') });
  }
  return out;
}
function gridCalc() {
  const c = window._gridCtx; if (!c) return;
  /* الإجمالي = العدد × السعر — بيتحدث مع كل حرف. data-auto=1 يعني البرنامج اللي حسبه؛
     لو انت كتبت إجمالي بإيدك بيتساب، ولو مسحته يرجع يتحسب. */
  for (let i = 0; i < c.rows; i++) {
    const el = $('#g' + i + 'a'); if (!el) continue;
    if (document.activeElement === el) { el.dataset.auto = num(el.value) ? '0' : ''; continue; }
    if (el.dataset.auto === '0' && num(el.value)) continue;
    const q = mval('g' + i + 'q'), pr = mval('g' + i + 'p');
    if (q && pr) { el.value = fmtMoney(Math.round(q * pr * 100) / 100); el.dataset.auto = '1'; }
    else if (el.dataset.auto === '1') { el.value = ''; el.dataset.auto = ''; }
  }
  const rows = gridRows();
  const ti = rows.filter(r => r.amount).length, tp = rows.filter(r => r.paid).length;
  const si = rows.reduce((s, r) => s + r.amount, 0), sp = rows.reduce((s, r) => s + r.paid, 0);
  const box = $('#gridBox'); if (!box) return;
  box.innerHTML =
    `<div class="ln"><span>بنود هتتسجل</span><b>${ti}</b><b class="num">${fmt2(si)}</b></div>
     <div class="ln"><span>سدادات هتتسجل</span><b>${tp}</b><b class="num">${fmt2(sp)}</b></div>
     <div class="ln tot"><span>صافي التأثير على الحساب</span><span class="num">${fmt2(si - sp)} ج.م</span></div>`;
}
function saveGrid(pid, aid) {
  const p = findParty(pid), a = findAcc(p, aid);
  const rows = gridRows();
  if (!rows.length) return toast('مفيش سطور مكتوبة', 'err');
  const bad = rows.find(r => isLocked(r.date));
  if (bad) return toast('سطر تاريخه في فترة مقفولة (' + dsp(bad.date) + ')', 'err');
  /* تكرار: سطر شبه بند متسجل قبل كده، أو نفس السطر مكتوب مرتين في الجدول */
  const _dups = [];
  rows.forEach((r, k) => {
    if (!r.amount) return;
    simItems(p, r.desc || 'بند', r.amount).forEach(x => _dups.push({ t: 'سطر ' + (r.i + 1) + ': ' + (r.desc || 'بند') + ' — ' + fmt2(r.amount), s: 'زي: ' + x.t + ' · ' + x.s }));
    const twin = rows.find((o, j) => j < k && o.amount && Math.abs(o.amount - r.amount) <= 0.5 && simName(o.desc || 'بند', r.desc || 'بند'));
    if (twin) _dups.push({ t: 'سطر ' + (r.i + 1) + ': ' + (r.desc || 'بند') + ' — ' + fmt2(r.amount), s: 'مكتوب مرتين — زي سطر ' + (twin.i + 1) });
  });
  if (dupAsk('grid|' + rows.map(r => r.desc + r.amount).join('|'), 'فيه سطور شكلها متسجلة قبل كده:', _dups, () => saveGrid(pid, aid))) return;
  snapshot();
  let ni = 0, np = 0;
  rows.forEach(r => {
    if (r.amount) {
      a.items.push({
        id: uid(), date: r.date, desc: r.desc || 'بند', loc: '', proj: accProject(a) === UNASSIGNED ? '' : accProject(a), qty: r.qty || 1, unit: r.unit,
        price: r.price || r.amount, amount: r.amount, pct: 100,
        retention: 0, advanceDeduction: 0, deductions: 0, cumTo: 0, photo: '', link: ''
      });
      ni++;
      if (r.unit) p.lastUnit = r.unit;
    }
    if (r.paid) {
      a.payments.push({
        id: uid(), date: r.date, amount: r.paid, method: r.method, note: r.desc || 'سداد',
        kind: 'pay', treasury: methodTreasury(r.method), cheque: '', photo: '', link: ''
      });
      np++;
    }
  });
  logAction('import', 'إدخال جماعي في ' + p.name + ' / ' + a.name + ': ' + ni + ' بند و ' + np + ' سداد');
  save(); closeModal(); render();
  toast('اتسجل ' + ni + ' بند و ' + np + ' سداد ✓', 'ok');
}

function ratesFor(unit, desc) {
  const out = [];
  DB.parties.forEach(p => p.accounts.forEach(a => a.items.forEach(i => {
    if (!num(i.price) || !num(i.qty) || num(i.qty) <= 1) return;
    if (unit && (i.unit || '') !== unit) return;
    if (desc && (i.desc || '').trim() !== desc.trim()) return;
    out.push({ p, a, i, rate: num(i.price) });
  })));
  return out.sort((x, y) => x.rate - y.rate);
}
