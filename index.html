/* ================= قفل البرنامج بكلمة سر ================= */
/* ملاحظة: ده قفل شاشة للخصوصية — مش تشفير للملف نفسه */
function hashPass(pass, salt) {
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  const s = salt + '|' + pass + '|tantawy';
  for (let round = 0; round < 5000; round++) {
    for (let i = 0; i < s.length; i++) {
      const c = s.charCodeAt(i) + round;
      h1 = ((h1 ^ c) * 16777619) >>> 0;
      h2 = ((h2 + c) * 2654435761 ^ h1) >>> 0;
    }
  }
  return h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0');
}
let locked = false;
function isLockSet() { return !!(DB && DB.settings && DB.settings.lock && DB.settings.lock.hash); }
function lockNow() {
  if (!isLockSet()) return openPassSetup();
  locked = true;
  showLockScreen();
}
function showLockScreen() {
  $('#lockRoot').innerHTML = `<div class="lock"><div class="lock-box">
    <img src="${LOGO}" alt="شعار الشركة">
    <h2>شركة الطنطاوي</h2>
    <p>البرنامج مقفول — اكتب كلمة السر عشان تكمل</p>
    <input id="lockPass" type="password" placeholder="كلمة السر" autocomplete="off">
    <div class="lock-err" id="lockErr"></div>
    <button class="btn navy" style="width:100%;justify-content:center;margin-top:6px" onclick="tryUnlock()">فتح</button>
  </div></div>`;
  const el = $('#lockPass');
  el.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
  setTimeout(() => el.focus(), 60);
}
function tryUnlock() {
  const v = $('#lockPass').value;
  const L = DB.settings.lock;
  if (hashPass(v, L.salt) !== L.hash) {
    $('#lockErr').textContent = 'كلمة السر غلط';
    $('#lockPass').value = ''; $('#lockPass').focus();
    return;
  }
  locked = false;
  $('#lockRoot').innerHTML = '';
  try { render(); try { applyPendingOps(); } catch (e2) { logErr('pendingOps', e2.message); } }
  catch (e) {
    logErr('unlock/render', e.message);
    $('#view').innerHTML = '<div class="card pad"><b>حصلت مشكلة في فتح الشاشة</b><p>' + esc(e.message) + '</p>' +
      '<button class="btn navy" onclick="go(\'diag\')">اعرض التفاصيل</button></div>';
  }
}

    <div class="note">كلمة السر بتقفل شاشة البرنامج عشان محدش يفتحه غيرك. خد بالك إنها <b>مش بتشفّر الملف نفسه</b>، ونسخة الـ JSON الاحتياطية بتفضل مفتوحة.</div>

function savePass() {

}
function removePass() {
  const L = DB.settings.lock;

function openProject(name) {
  const u = name ? projectUsage(name) : 0;
  modal(name ? 'تعديل مشروع: ' + name : 'مشروع جديد', `
    <div class="f"><label>اسم المشروع *</label><input id="prName" value="${esc(name || '')}" placeholder="مثال: R-08"></div>
    ${name && u ? `<div class="note">المشروع ده مربوط بـ <b>${u}</b> حساب. لما تغيّر الاسم، هيتغيّر في الحسابات دي كلها تلقائي.</div>` : ''}
    ${!name ? '<div class="hint-k">بعد ما تضيفه هتلاقيه في قايمة المشاريع وانت بتعمل حساب جديد.</div>' : ''}`,
    `<button class="btn navy" onclick="saveProject(${name ? "'" + esc(name).replace(/'/g, "\\'") + "'" : 'null'})">حفظ</button>
     <button class="btn" onclick="closeModal()">إلغاء</button>`);
}
function saveProject(oldName) {
  const nm = sval('prName');
  if (!nm) return toast('اكتب اسم المشروع', 'err');
  const nmCanon = canonProject(nm);
  /* لو الاسم الجديد بيطابق مشروع تاني موجود بالفعل، ده دمج مقصود ومسموح.
     الممنوع بس إنشاء مشروع جديد بنفس اسم موجود. */
  if (!oldName && projectNames().indexOf(nmCanon) > -1) return toast('فيه مشروع بنفس الاسم', 'err');
  if (!oldName && dupAsk('proj|' + nm, 'فيه مشروع اسمه شبه <b>' + esc(nm) + '</b>:', simProjects(nm), () => saveProject(oldName))) return;
  snapshot();
  DB.settings.projects = DB.settings.projects || [];
  if (oldName) {
    const oldCanon = canonProject(oldName);
    let n = 0, ni = 0;
    const replaceTok = (str) => {
      const toks = splitTokens(str);
      if (!toks.length) return str;
      let changed = false;
      const nt = toks.map(t => { if (canonProject(t) === oldCanon) { changed = true; return nm; } return t; });
      return changed ? [...new Set(nt)].join(' / ') : str;
    };
    DB.parties.forEach(p => p.accounts.forEach(a => {
      const toks = splitTokens(a.project);
      if (toks.length > 1) {
        const nt = replaceTok(a.project);
        if (nt !== a.project) { a.project = nt; n++; }
      } else if (canonProject(a.project) === oldCanon) { a.project = nm; n++; }
      /* البند: مشروعه لو محدد، وإلا المكان لو بيشاور على نفس المشروع القديم (زي الحسابات المجمّعة قديماً) */
      a.items.forEach(i => {
        if ((i.proj || '').trim() && canonProject(i.proj) === oldCanon) { i.proj = nm; ni++; }
        if (i.loc) { const rl = replaceTok(i.loc); if (rl !== i.loc) i.loc = rl; }
      });
    }));
    (DB.expenses || []).forEach(x => { if (canonProject(x.project) === oldCanon) x.project = nm; });
    (DB.labor || []).forEach(w => {
      if (canonProject(w.project) === oldCanon) w.project = nm;
      w.days.forEach(d => { if (canonProject(d.project || w.project) === oldCanon) d.project = nm; });
    });
    DB.settings.projects = DB.settings.projects.filter(x => canonProject(x) !== oldCanon);
    DB.settings.projects.push(nm);
    logAction('project', 'تغيير اسم مشروع «' + oldName + '» إلى «' + nm + '» — ' + n + ' حساب و' + ni + ' بند');
    save(); closeModal(); render();
    return toast((n || ni) ? 'اتوحّد الاسم في ' + n + ' حساب و' + ni + ' بند ✓' : 'اتحفظ ✓', 'ok');
  }
  DB.settings.projects.push(nm);
  logAction('project', 'مشروع جديد: ' + nm);
  save(); closeModal(); render(); toast('المشروع اتضاف ✓', 'ok');
}
function delProject(name) {
  const u = projectUsage(name);
  if (u) {
    const others = projectNames().filter(x => x !== name);
    return modal('حذف مشروع: ' + name, `
      <div class="note">المشروع ده مربوط بـ <b>${u}</b> حساب، فمينفعش يتشال كده وسيبهم من غير مشروع.</div>

        <option value="">— من غير مشروع —</option>${others.map(x => `<option>${esc(x)}</option>`).join('')}</select></div>`,
      `<button class="btn danger" onclick="doDelProject('${esc(name).replace(/'/g, "\\'")}')">انقل واحذف</button>
       <button class="btn" onclick="closeModal()">إلغاء</button>`);
  }
  askYesNo('حذف مشروع', 'تحذف مشروع <b>' + esc(name) + '</b>؟', () => doDelProject(name), 'حذف', true);
}
function doDelProject(name) {
  const to = $('#prMove') ? sval('prMove') : '';
  snapshot();
  let n = 0;
  DB.parties.forEach(p => p.accounts.forEach(a => { if ((a.project || '') === name) { a.project = to; n++; } }));
  DB.settings.projects = (DB.settings.projects || []).filter(x => x !== name);
  save(); closeModal(); render();
  toast(n ? 'اتحذف واتنقل ' + n + ' حساب' + (to ? ' لـ ' + to : '') : 'المشروع اتحذف ✓', 'ok');
}

}
function qsRun() {

/* التاريخ بتوقيت الجهاز (todayISO بتوقيت جرينتش — عندنا اليوم كان بيبدأ 3 الفجر) */
function tgDay(n) { return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0'); }

const tgEsc = x => String(x == null ? '' : x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
/* نص التقرير — كل مشروع لوحده، ومفيش إجمالي مجمّع على المشاريع */

    if (I.noMethod.length) w.push('• ' + I.noMethod.length + ' سداد من غير طريقة');

    let stale = 0;

/* تليجرام بتقبل 4096 حرف في الرسالة — بنقسّم على سطور كاملة */
function tgChunks(text, max) {
  const lim = max || 3900, out = [];
  let cur = '';
  String(text).split('\n').forEach(ln => {
    if ((cur + '\n' + ln).length > lim) { if (cur) out.push(cur); cur = ln; }
    else cur = cur ? cur + '\n' + ln : ln;
  });
  if (cur) out.push(cur);
  return out;
}
function tgReady() {
  const t = tgCfg();
  return !!(window.tantawyFS && window.tantawyFS.tgSend && (t.token || '').trim() && (t.chat || '').trim());
}
/* الإرسال الفعلي — بيرجع {ok, offline, error} */
async function tgDeliver(text, forDate, withPdf) {
  const t = tgCfg();
  const fs2 = window.tantawyFS;
  if (!fs2 || !fs2.tgSend) return { ok: false, offline: false, error: 'الإرسال شغال في نسخة البرنامج المثبّتة بس' };
  const parts = tgChunks(text);
  for (let i = 0; i < parts.length; i++) {
    const r = await fs2.tgSend(t.token, t.chat, parts[i]);
    if (!r || !r.ok) return r || { ok: false, error: 'مفيش رد' };
  }
  if (withPdf && t.withPdf && typeof mobilePdfHTML === 'function') {
    try {
      const r2 = await fs2.tgPdf(t.token, t.chat, mobilePdfHTML(),
        'حسابات-الطنطاوي-' + (forDate || todayISO()) + '.pdf', 'كل الحسابات بالتفصيل — ' + dsp(forDate || todayISO()));
      if (!r2 || !r2.ok) return { ok: true, pdfFail: (r2 && r2.error) || 'المرفق مروحش' };
    } catch (e) { return { ok: true, pdfFail: String(e.message || e) }; }
  }
  return { ok: true };
}
/* تقرير يوم معيّن: يروح دلوقتي أو يستنى في الطابور */
async function tgSendDay(forDate, manual, late) {
  const t = tgCfg();
  const d = forDate || tgToday();
  const text = tgReportText(d) + (late ? '\n<i>(تقرير متأخر — الساعة ' + tgEsc(t.time || '15:00') + ' اللاب ماكانش فاتح أو مكانش فيه نت)</i>' : '');
  if (!tgReady()) {
    if (manual) toast('اكمّل إعدادات التليجرام الأول', 'err');
    return { ok: false, error: 'الإعدادات ناقصة' };
  }
  const r = await tgDeliver(text, d, true);
  if (r.ok) {
    t.last = d;
    /* بس الإرسال المجدول هو اللي بيقفل اليوم */
    if (!manual) t.lastSched = d;
    tgLog((manual ? 'تقرير تجربة ' : 'تقرير ') + dsp(d) + ' اتبعت'
      + (r.pdfFail ? ' (من غير المرفق: ' + r.pdfFail + ')' : ''), true);
    save();
    if (manual) toast('التقرير اتبعت ✓ — وده مش هيمنع تقرير الميعاد', 'ok');
    return r;
  }
  /* فشل: لو السبب النت، نحطه في الطابور */
  if (r.offline) {
    if (!t.queue.some(q => q.date === d)) t.queue.push({ date: d, text, at: new Date().toISOString() });
    tgLog('تقرير ' + dsp(d) + ' مستني النت', false);
    save();
    if (manual) toast('مفيش نت — التقرير في الطابور وهيروح أول ما النت يرجع', 'err');
  } else {
    tgLog('فشل إرسال ' + dsp(d) + ': ' + (r.error || ''), false);
    save();
    if (manual) toast('مروحش: ' + (r.error || ''), 'err');
  }
  return r;
}
/* الطابور — بيتجرب كل شوية */
let _tgBusy = false;
async function tgFlush() {
  const t = tgCfg();
  if (_tgBusy || !t.on || !t.queue.length || !tgReady()) return;
  _tgBusy = true;
  try {
    while (t.queue.length) {
      const q = t.queue[0];
      /* بنكتبه من جديد وقت الإرسال عشان الأرقام تبقى آخر حاجة */
      const r = await tgDeliver(tgReportText(q.date) + '\n\n<i>(تقرير متأخر — كان مستني النت)</i>', q.date, true);
      if (!r.ok) break;
      t.queue.shift();
      t.last = q.date > (t.last || '') ? q.date : t.last;
      t.lastSched = q.date > (t.lastSched || '') ? q.date : t.lastSched;
      tgLog('تقرير ' + dsp(q.date) + ' المتأخر اتبعت', true);
      save();
    }
  } catch (e) { } finally { _tgBusy = false; }
}
/* الجدولة: بتتشيك كل دقيقة. ولو اللاب كان مقفول وقت الميعاد، بتبعت أول ما يفتح. */
async function tgTick() {
  const t = tgCfg();
  if (!t.on || !tgReady()) return;
  await tgFlush();
  const now = new Date();
  const hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  const today = tgToday();
  /* التقرير اللي عليه الدور: بتاع النهاردة لو عدّى الميعاد، وإلا بتاع امبارح (لو ماراحش — اللاب كان مقفول أو مفيش نت) */
  const due = hhmm >= (t.time || '17:00') ? today : tgYesterday();
  if ((t.lastSched || '') >= due) return;
  if (t.queue.some(q => q.date >= due)) return;          // مستني النت في الطابور — بيتجرب لوحده كل دقيقة
  await tgSendDay(due, false, due !== today);
}

  (DB.expenses || []).forEach(x => { if (x.custodyId) return; const m = (x.date || '').slice(0, 7); if (m) { byMonth[m] = byMonth[m] || { in: 0, out: 0 }; byMonth[m].out += num(x.amount); } });

      <div class="lbl">المتوقع بعد استحقاقات ٣٠ يوم</div><div class="val" style="${afterDues < 0 ? 'color:var(--red)' : ''}">${eg(afterDues)}</div>

    <div style="font-size:13px;color:#7F1D1D;margin-top:3px">المستحقات الجاية خلال ٣٠ يوم (${fmt(next30 + overdue)}) أكبر من اللي معاك (${fmt(onHand)}). محتاج تحصّل ${fmt(-afterDues)} ج.م قبل ما تقدر تسددها كلها.</div>

        ${pos.sched > 0.5 ? `<div class="proj-row"><span>شيكات ومؤجلات</span><b class="num" style="color:var(--blue)">${fmt(pos.sched)}</b></div>` : ''}

function incSyncTre() { const s = $('#nTre'); if (s) s.value = methodTreasury(sval('nMethod')); }
function saveIncome(id) {
  const desc = sval('nDesc'), amount = mval('nAmount');
  if (!desc) return toast('اكتب البيان', 'err');
  if (!amount) return toast('اكتب المبلغ', 'err');
  if (lockGuard(dval('nDate'))) return;
  if (!id && dupAsk('inc|' + desc + '|' + amount, 'فيه إيراد بنفس المبلغ وبيان شبهه في نفس الأيام:', simMoves(DB.income, desc, amount, dval('nDate'), id, 'income'), () => saveIncome(id))) return;
  snapshot();
  DB.income = DB.income || [];
  const projIn = sval('nProj');
  const data = normalizeIncome({
    id, date: dval('nDate'), cat: sval('nCat') || 'تحصيل', desc, amount,
    project: projIn ? (canonProject(projIn) === UNASSIGNED ? projIn : canonProject(projIn)) : '',
    client: sval('nClient'), method: sval('nMethod'), treasury: sval('nTre') || methodTreasury(sval('nMethod')),
    note: sval('nNote'), photo: sval('nPhoto')
  });
  if (id) { const i = DB.income.findIndex(e => e.id === id); DB.income[i] = data; logAction('income', 'تعديل إيراد: ' + desc + ' — ' + fmt(amount)); }
  else { DB.income.push(data); logAction('income', 'إيراد: ' + desc + ' — ' + fmt(amount) + (data.client ? ' من ' + data.client : '')); }
  save(); closeModal(); render(); toast('اتسجل ✓', 'ok');
}
function delIncome(id) {
  const x = (DB.income || []).find(e => e.id === id); if (!x) return;
  if (lockGuard(x.date, 'مينفعش الحذف')) return;
  askYesNo('حذف إيراد', 'تحذف <b>' + esc(x.desc) + '</b> بمبلغ <b>' + fmt(x.amount) + '</b> ج.م؟', () => {
    snapshot(); toTrash('item', 'إيراد: ' + x.desc + ' — ' + fmt(x.amount), { income: x });

}

const PENDING_OPS = [
  { id: 'tg-3pm-2026-10-23', label: 'التقرير اليومي', run() {
    /* «أول ما اللاب يفتح» اتلغى بطلبه — والتقرير اللي راح 12:57 بالليل يتحسب بتاع 22-10، فبتاع النهاردة يروح الساعة 3 */

function applyPendingOps() {
  if (!window.tantawyFS) return;                       // اللاب بس
  DB.settings.appliedOps = DB.settings.appliedOps || [];
  const todo = PENDING_OPS.filter(o => DB.settings.appliedOps.indexOf(o.id) < 0);
  if (!todo.length) return;
  snapshot();

    try {
      const msg = o.run();
      DB.settings.appliedOps.push(o.id);
      logAction('budget', o.label + ': ' + msg);
      toast(o.label + ' اتسجلت ✓ — ' + msg, 'ok');

  });
  save(true); render();
}
async function boot() {

/* ================= الرجوع للشاشة اللي قبلها ================= */
window.__goBack = function () {
  if ($('#ctxRoot') && $('#ctxRoot').innerHTML) { closeCtx(); return; }
  if ($('#modalRoot').innerHTML) { closeModal(); return; }
  goBackNav();
};
window.addEventListener('popstate', () => { window.__goBack(); });
window.addEventListener('mouseup', e => { if (e.button === 3) { e.preventDefault(); window.__goBack(); } });
window.addEventListener('auxclick', e => { if (e.button === 3) { e.preventDefault(); window.__goBack(); } });
window.addEventListener('mousedown', e => { if (e.button === 3) e.preventDefault(); });

document.addEventListener('keydown', e => {
  if (locked) return;
  if (e.key === 'F5') { e.preventDefault(); if (!window.tantawyFS) location.reload(); return; }
  /* Alt + سهم لليمين (الرجوع في العربي) أو Alt + يسار */
  if (e.altKey && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); window.__goBack(); return; }
  if (e.key === 'Backspace' && !/input|textarea|select/i.test(document.activeElement.tagName)
    && !$('#modalRoot').innerHTML) { e.preventDefault(); window.__goBack(); return; }
  const code = e.code || '';
  const k = (e.key || '').toLowerCase();
  const ctrl = e.ctrlKey || e.metaKey;
  if (e.key === 'Escape') {
    if ($('#ctxRoot').innerHTML) { closeCtx(); return; }
    if (!$('#modalRoot').innerHTML && UI.sel.length) { clearSel(); return; }
    if (!$('#modalRoot').innerHTML && UI.selP.length) { clearPartySel(); return; }
    closeModal(); return;
  }
  /* Del لحذف المحدد من المقاولين/الموردين */
  if ((e.key === 'Delete' || e.key === 'Del') && UI.selP.length && !$('#modalRoot').innerHTML
    && (UI.view === 'contractor' || UI.view === 'supplier')
    && !/input|textarea|select/i.test(document.activeElement.tagName)) {
    e.preventDefault(); bulkPartyDelete(); return;
  }
  /* Del لحذف المحدد */
  if ((e.key === 'Delete' || e.key === 'Del') && UI.sel.length && !$('#modalRoot').innerHTML && !locked
    && !/input|textarea|select/i.test(document.activeElement.tagName)) {
    const c = window._rowCtx;
    if (c) { e.preventDefault(); bulkDelete(c.pid, c.aid); return; }
  }
  if (!ctrl) return;
  if (code === 'KeyA' || k === 'a' || k === 'ش') {
    const c = window._rowCtx;
    if (c && UI.view === 'party' && !$('#modalRoot').innerHTML && !/input|textarea/i.test(document.activeElement.tagName)) {
      e.preventDefault(); selAll(c.pid, c.aid); return;
    }
    if ((UI.view === 'contractor' || UI.view === 'supplier') && !$('#modalRoot').innerHTML
      && !/input|textarea/i.test(document.activeElement.tagName)) {
      e.preventDefault(); selAllParties(); return;
    }
  }
  if (code === 'KeyS' || k === 's' || k === 'س') { e.preventDefault(); manualSave(); }
  else if (code === 'KeyF' || k === 'f' || k === 'ب') {
    e.preventDefault();
    const s = $('#searchBox');
    if (s && !$('#modalRoot').innerHTML) { s.focus(); s.select(); } else openSearch();
  }
  else if (code === 'KeyZ' || k === 'z' || k === 'ء') {
    if (/input|textarea/i.test(document.activeElement.tagName)) return;
    e.preventDefault(); undo();
  }
  else if (code === 'KeyR' || k === 'r' || k === 'ق') { e.preventDefault(); if (!window.tantawyFS) location.reload(); }
  else if (code === 'KeyL' || k === 'l' || k === 'م') { e.preventDefault(); lockNow(); }
  else if (code === 'KeyP' || k === 'p' || k === 'ح') {
    if (UI.view === 'party' && UI.pid) { e.preventDefault(); printStatement(UI.pid); }
  }
  /* تكرار الحركة المحددة */
  else if (code === 'KeyD' || k === 'd' || k === 'ي') {
    if ($('#modalRoot').innerHTML || /input|textarea/i.test(document.activeElement.tagName)) return;
    e.preventDefault(); dupSelected();
  }
});

function printLabor() {
  const wk = weekRange();
  const rows = [];
  (DB.labor || []).forEach(w => {
    const by = new Map();
    w.days.filter(x => x.date >= wk.from && x.date <= wk.to).forEach(d => {
      const n = canonProject(d.project || w.project);
      if (!by.has(n)) by.set(n, { w, proj: n, days: 0, amount: 0 });
      const x = by.get(n); x.days += num(d.days); x.amount += num(d.amount) || num(d.days) * num(d.rate);
    });
    const parts = [...by.values()];
    /* الباقي الكلي للعامل بيتكتب مرة واحدة — في أول مشروع ليه — عشان مايتجمعش مرتين */
    if (!parts.length && workerRem(w) > 0.5) parts.push({ w, proj: canonProject(w.project), days: 0, amount: 0 });
    parts.forEach((x, i) => { x.rem = i === 0 ? workerRem(w) : 0; rows.push(x); });
  });
  const rowsF = UI.filterProject ? rows.filter(x => x.proj === UI.filterProject) : rows;
  const t = projTable(rowsF, x => x.proj, r => `<tr><td><b>${esc(r.w.name)}</b></td><td>${esc(r.w.role || '')}</td>
      <td class="num">${fmt2(r.w.rate)}</td><td class="num">${fmt2(r.days)}</td>
      <td class="num">${fmt2(r.amount)}</td><td class="num">${r.rem ? fmt2(r.rem) : ''}</td><td></td></tr>`,
    [null, null, null, r => r.days, r => r.amount, r => r.rem, null], { unit: 'عامل' });
  printReport('كشف العمالة اليومية — من ' + dsp(wk.from) + ' إلى ' + dsp(wk.to) + (UI.filterProject ? ' — ' + UI.filterProject : ''), `
    <table><thead><tr><th>الاسم</th><th>الشغلانة</th><th class="num">اليومية</th><th class="num">أيام الأسبوع</th>
      <th class="num">مستحق الأسبوع</th><th class="num">الباقي الكلي</th><th style="width:110px">التوقيع</th></tr></thead>
    <tbody>${t.body || '<tr><td colspan="7" style="text-align:center;color:#94A3B8">لا يوجد</td></tr>'}</tbody>

    <div class="sign-row"><div><div class="sign-line">الملاحظ</div></div><div><div class="sign-line">الإدارة</div></div></div>`);
}

      <tr><td style="font-weight:700;background:#F8FAFC">مشاريع من غير ميزانية</td><td class="num">${g.noBudget.length}</td>
          <td style="font-weight:700;background:#F8FAFC">حسابات الواصل زاد فيها</td><td class="num">${g.overPaid.length}</td></tr>
    </tbody></table>
    <div style="font-weight:800;color:var(--navy);margin:12px 0 6px">حسابات مدفوع فيها من غير رقم اتفاق</div>
    <table><thead><tr><th>الطرف</th><th>الحساب</th><th>المشروع</th><th class="num">المدفوع</th></tr></thead>
    <tbody>${g.noAgree.sort((a, b) => b.paid - a.paid).map(x => `<tr><td>${esc(x.p.name)}</td><td>${esc(x.a.name)}</td>
      <td>${esc(x.a.project || '—')}</td><td class="num">${fmt2(x.paid)}</td></tr>`).join('') || '<tr><td colspan="4" style="text-align:center;color:#94A3B8">لا يوجد</td></tr>'}</tbody>
    <tfoot><tr><td colspan="3">الإجمالي</td><td class="num">${fmt2(g.noAgree.reduce((s, x) => s + x.paid, 0))}</td></tr></tfoot></table>`);
}
function printRates() {
  const map = unitRates();
  const keys = Object.keys(map).sort((a, b) => map[b].total - map[a].total);
  printReport('تحليل أسعار الوحدة', `
    <table><thead><tr><th>البند</th><th>الوحدة</th><th class="num">الكمية</th><th class="num">الإجمالي</th>
      <th class="num">أقل</th><th class="num">متوسط مرجّح</th><th class="num">أعلى</th><th class="num">الفرق</th></tr></thead>
    <tbody>${keys.map(k => { const g = map[k];
      return `<tr><td><b>${esc(g.desc)}</b></td><td>${esc(g.unit || '—')}</td>
      <td class="num">${fmt2(g.qty)}</td><td class="num">${fmt2(g.total)}</td>
      <td class="num">${fmt2(g.min)}</td><td class="num"><b>${fmt2(g.wavg)}</b></td>
      <td class="num">${fmt2(g.max)}</td><td class="num">${fmt2(g.max - g.min)}</td></tr>`; }).join('')
      || '<tr><td colspan="8" style="text-align:center;color:#94A3B8">لا يوجد</td></tr>'}</tbody></table>
    <div class="sign-row"><div><div class="sign-line">المهندس المسؤول</div></div><div><div class="sign-line">الإدارة</div></div></div>`);
}

</script>
<script>
/* ================= نسخة الموبايل — بعد كود البرنامج الأصلي =================
   كود الحسابات نفسه (الأرصدة والتكلفة والتوزيع) هو نفس كود اللاب بالحرف — مفيش ولا معادلة اتكتبت هنا.
   الملف ده بيعمل:
   ١. حارس: على الموبايل مسموح تضيف/تعدّل/تمسح سداد أو بند. أي تعديل تاني (حسابات، أطراف، مصروفات…) بيترجع.
   ٢. المزامنة مع اللاب عن طريق سكربت جوجل (Apps Script) اللي في حسابك.
   ٣. شكل الموبايل: شريط فوق، تبويب تحت، الجداول كروت. */

/* «Script error.» من غير أي تفاصيل = خطأ من برة البرنامج (سفاري أو إضافة فيه) — بنسجّله بس من غير ما نطلّع بانر */
const _showCrash = showCrash;
showCrash = function (msg, err) {
  if (!err && /^Script error\.?$/i.test(String(msg || ''))) { try { logErr('external', String(msg)); } catch (e) { } return; }
  return _showCrash.apply(this, arguments);
};

/* ---------- حاجات اللاب بس ---------- */
allowUnload = true;                       // من غير رسالة «متأكد إنك عايز تقفل؟» على الموبايل
tgTick = async function () { };           // التليجرام بيتبعت من اللاب
tgFlush = async function () { };
autoBackup = async function () { };       // النسخة الأصلية على اللاب
extBackupNow = async function () { return false; };
mobileExport = async function () { return false; };

const MOB_VER = '2026-10-16a';
const MOB = {
  loaded: false, base: null, baseAt: '', outbox: [], cfg: null,
  refState: null, refPayIds: null, good: null,
  lastPull: '', lastErr: '', busy: false, online: navigator.onLine
};
MOB.ready = (async () => {
  try {
    MOB.base = await IDB.get('base');
    MOB.baseAt = (await IDB.get('baseAt')) || '';
    MOB.outbox = (await IDB.get('outbox')) || [];
    MOB.cfg = await IDB.get('cfg');
    MOB.lastPull = (await IDB.get('lastPull')) || '';
  } catch (e) { MOB.lastErr = 'التخزين على التليفون مش شغال: ' + e.message; }
  MOB.loaded = true;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
})();

/* ---------- الحارس ---------- */
function mobAllPays(st) {
  const out = [];
  (st.parties || []).forEach(p => (p.accounts || []).forEach(a => (a.payments || []).forEach(y => out.push({ p, a, y }))));
  return out;
}
/* كل الحركات اللي مسموح تتعمل على الموبايل: السدادات والبنود */
function mobAllRows(st) {
  const out = [];
  (st.parties || []).forEach(p => (p.accounts || []).forEach(a => {
    (a.payments || []).forEach(y => out.push({ p, a, y, kind: 'pay' }));
    (a.items || []).forEach(y => out.push({ p, a, y, kind: 'item' }));
  }));
  return out;
}
const mobRowOf = e => e.kind === 'item' ? e.item : e.pay;
/* رقم النسخة لازم يكبر دايماً حتى لو الحركة اتشالت من الطابور ورجعت تاني (تعديل/مسح حركة اتعملت من الموبايل قبل كده) —
   اللاب بيتجاهل أي نسخة رقمها مش أكبر من اللي طبّقه. فبنستخدم الوقت. */
const mobNextRev = r => Math.max((r || 0) + 1, Date.now());
/* الجزء اللي ممنوع يتغير على الموبايل = كل البيانات ما عدا السدادات والبنود
   (الجديدة والقديمة — تتضاف وتتعدل وتتمسح من الموبايل، واللاب بيطبّق).
   «آخر وحدة» بتاعة الطرف بتتغير لوحدها مع البند — مش محسوبة. */
function mobDataPart(st) {
  const parties = (st.parties || []).map(p => Object.assign({}, p, { lastUnit: '',
    accounts: (p.accounts || []).map(a => Object.assign({}, a, { payments: [], items: [] }))
  }));
  return JSON.stringify([parties, st.expenses || [], st.labor || [], st.custody || [], st.templates || [], st.income || []]);
}
function mobCaptureRef() {
  const st = JSON.parse(JSON.stringify(fullState()));
  const ob = new Set(MOB.outbox.map(e => e.id));
  MOB.refState = st;
  MOB.refData = mobDataPart(st);
  /* نسخة اللاب من كل سداد (اللي مالوش تعديل على الموبايل) — عشان نعرف اتغير ولا لأ */
  MOB.refBase = new Map();
  mobAllRows(st).forEach(({ p, a, y, kind }) => {
    if (!ob.has(y.id)) MOB.refBase.set(y.id, { kind, pid: p.id, aid: a.id, pname: p.name, aname: a.name, row: y, json: JSON.stringify(y) });
  });
  MOB.good = JSON.stringify(st);
}
function mobRevert(msg) {
  try { applyState(JSON.parse(MOB.good)); } catch (e) { logErr('mobRevert', e.message); }
  closeModal(); render();
  toast(msg || 'التعديل ده بيتعمل من اللاب بس — على الموبايل تقدر تضيف أو تعدّل أو تمسح سداد أو بند', 'err');
}
save = function () {
  dirty = false;
  if (!MOB.base || !MOB.refState) return;
  let cur;
  try { cur = JSON.parse(JSON.stringify(fullState())); } catch (e) { logErr('mobSave', e.message); return; }
  /* البند الأول في حساب مالوش مشروع بيربط الحساب بمشروعه (زي اللاب بالظبط — واللاب بيعمل نفس الحاجة لما يطبّقه) */
  const _cmp = JSON.parse(JSON.stringify(cur));
  (_cmp.parties || []).forEach(p => (p.accounts || []).forEach(a => {
    const rp = (MOB.refState.parties || []).find(x => x.id === p.id), ra = rp && (rp.accounts || []).find(x => x.id === a.id);
    if (ra && !(ra.project || '').trim()) a.project = ra.project;
  }));
  if (mobDataPart(_cmp) !== MOB.refData) return mobRevert();

  const now = new Date().toISOString();
  const seen = new Set();
  mobAllRows(cur).forEach(({ p, a, y, kind }) => {
    seen.add(y.id);
    const row = JSON.parse(JSON.stringify(y)), json = JSON.stringify(row);
    let e = MOB.outbox.find(z => z.id === y.id);
    if (!e) {
      const b = MOB.refBase.get(y.id);
      if (b && b.json === json && b.aid === a.id) return;          // حركة من اللاب ماتغيرتش
      e = { id: y.id, kind, rev: 0, sentRev: -1, base: !!b, created: now };
      MOB.outbox.push(e);
    }
    if (e.del || e.pid !== p.id || e.aid !== a.id || JSON.stringify(mobRowOf(e)) !== json) {
      Object.assign(e, { kind, pid: p.id, aid: a.id, pname: p.name, aname: a.name, del: false, rev: mobNextRev(e.rev), at: now });
      if (kind === 'item') { e.item = row; delete e.pay; } else { e.pay = row; delete e.item; }
      if (kind === 'item') e.aproj = a.project || '';
    }
  });
  /* اللي اتمسح */
  MOB.outbox = MOB.outbox.filter(e => {
    if (seen.has(e.id) || e.del) return true;
    if (!e.base && e.sentRev < 0) return false;            // جديد واتمسح قبل ما يتبعت — يتشال وخلاص
    Object.assign(e, { del: true, rev: mobNextRev(e.rev), at: now });
    return true;
  });
  MOB.refBase.forEach((b, id) => {
    if (seen.has(id) || MOB.outbox.some(e => e.id === id)) return;
    const e = { id, kind: b.kind, rev: mobNextRev(0), sentRev: -1, base: true, del: true, created: now, at: now,
      pid: b.pid, aid: b.aid, pname: b.pname, aname: b.aname };
    if (b.kind === 'item') e.item = b.row; else e.pay = b.row;
    MOB.outbox.push(e);
  });
  MOB.good = JSON.stringify(cur);
  IDB.set('outbox', MOB.outbox).catch(e => toast('مقدرتش أحفظ على التليفون: ' + e.message, 'err'));
  mobPaint();
  setTimeout(mobSync, 300);
};
manualSave = function () { mobSync(true); };

/* «تسجيل بند أعمال» و«تسجيل مشترى» و«بند سريع» شغالين على الموبايل — بس على مقاول/مورد وحساب موجودين.
   المقاول/المورد الجديد أو الحساب الجديد بيتعمل من اللاب، فبنقول كده قبل الحفظ والفورم يفضل مفتوح زي ما هو. */
const MOB_NEW_PARTY = 'المقاول أو المورد الجديد بيتضاف من اللاب — اختار واحد موجود';
const MOB_NEW_ACC = 'مفيش حساب للطرف ده في المشروع ده — الحساب الجديد بيتعمل من اللاب. اختار مشروع ليه حساب، أو ضيف البند من جوه الحساب';
const _mobSaveWork = saveWork;
saveWork = function () {
  const cid = sval('wkCon');
  if (cid === '__new') return toast(MOB_NEW_PARTY, 'err');
  const p = cid && findParty(cid);
  if (p) { const aid = sval('wkAcc'); if (!aid || aid === '__new' || !findAcc(p, aid)) return toast(MOB_NEW_ACC, 'err'); }
  return _mobSaveWork.apply(this, arguments);
};
const _mobSavePurchase = savePurchase;
savePurchase = function () {
  const sid = sval('puSup');
  if (sid === '__new') return toast(MOB_NEW_PARTY, 'err');
  const p = sid && findParty(sid), proj = sval('puProj') ? canonProject(sval('puProj')) : '';
  if (p && proj && !accountsForProject(p, proj).length) return toast(MOB_NEW_ACC, 'err');
  return _mobSavePurchase.apply(this, arguments);
};
const _mobSaveQuickItem = saveQuickItem;
saveQuickItem = function (pid) {
  const p = findParty(pid), raw = sval('qiProj');
  if (p && raw && !accountsForProject(p, canonProject(raw)).length) return toast(MOB_NEW_ACC, 'err');
  return _mobSaveQuickItem.apply(this, arguments);
};

/* ---------- المزامنة ---------- */
/* جوجل ساعات بيرد بصفحة خطأ مؤقتة بدل الرد — نجرّب تاني مرة كمان بعد ثانيتين */
async function mobCall(op, body, cfg) {
  try { return await mobCall1(op, body, cfg); }
  catch (e) {
    if (!/رد مش مفهوم|السيرفر رد/.test(e.message)) throw e;
    await new Promise(r => setTimeout(r, 2000));
    return mobCall1(op, body, cfg);
  }
}
async function mobCall1(op, body, cfg) {
  cfg = cfg || MOB.cfg;
  if (!cfg || !cfg.url) throw new Error('الموبايل مش مربوط');
  let r;
  /* مهلة ٤٠ ثانية: الآيفون ساعات بيوقف الطلب لما البرنامج يروح للخلفية ومايرجعش أبداً */
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const tm = setTimeout(() => { try { ctl && ctl.abort(); } catch (e) { } }, 40000);
  try { r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify(Object.assign({ op, key: cfg.key }, body || {})), signal: ctl ? ctl.signal : undefined }); }
  catch (e) { throw new Error(e && e.name === 'AbortError' ? 'سكربت جوجل اتأخر في الرد' : 'مفيش اتصال بسكربت جوجل (' + (e.message || e) + ')'); }
  finally { clearTimeout(tm); }
  if (!r.ok) throw new Error('السيرفر رد بـ ' + r.status);
  let j; try { j = await r.json(); } catch (e) { throw new Error('رد مش مفهوم — اتأكد من الرابط'); }
  if (!j.ok) throw new Error(j.error || 'رد غلط');
  return j;
}
/* اللي لسه ما اتبعتش من التليفون (مفيش نت مثلاً) — اللي اتبعت خلاص بيتطبّق على اللاب لوحده */
function mobPendingCount() { return MOB.outbox.filter(e => e.sentRev < e.rev).length; }
/* البرنامج على اللاب بيعرف يدخّل بنود من الموبايل؟ (بيقول كده في النسخة اللي بيبعتها) */
function mobLapItems() { return !!(MOB.base && MOB.base.indexOf('"mobCaps":["item"') > -1); }

/* نسخة جديدة من اللاب: نشيل من الطابور اللي اللاب دخّله، ونرسم من جديد */
/* نشيل من الطابور اللي اللاب طبّقه فعلاً.
   اللاب بيبعت مع كل نسخة قايمة بالحركات اللي طبّقها (mobApplied) — أي حركة اتطبّقت بيبقى اللاب هو المرجع ليها،
   حتى لو اتعدلت أو اتمسحت على اللاب بعد كده. */
function mobPrune(data, at) {
  const d = JSON.parse(data);
  const applied = d.mobApplied;
  const inBase = new Map();
  mobAllRows(d).forEach(({ a, y }) => inBase.set(y.id, { aid: a.id, y }));
  const n = MOB.outbox.length;
  MOB.outbox = MOB.outbox.filter(e => {
    if (e.sentRev !== e.rev) return true;                  // لسه فيه تعديل مابعتناهوش
    if (applied) return !((applied[e.id] || 0) >= e.rev);  // اللاب طبّقه → نسخة اللاب هي الصح
    /* نسخة قديمة من اللاب من غير القايمة دي */
    const b = inBase.get(e.id);
    if (e.del) return !!b;
    return !b;
  });
  return MOB.outbox.length !== n;
}
async function mobSetBase(data, at) {
  mobPrune(data, at);
  MOB.base = data; MOB.baseAt = at;
  await IDB.set('base', data); await IDB.set('baseAt', at); await IDB.set('outbox', MOB.outbox);
}
function mobReload() {
  const composed = mobCompose(MOB.base, MOB.outbox);
  applyState(JSON.parse(composed));
  mobCaptureRef();
  if (!locked) render();
}
async function mobSync(manual) {
  if (MOB.busy && Date.now() - (MOB.busySince || 0) < 90000) return;   // مزامنة شغالة فعلاً
  if (!MOB.cfg || MOB.connecting) return;
  if (!navigator.onLine) { MOB.online = false; mobPaint(); if (manual) toast('مفيش نت — هيتبعت أول ما النت يرجع', 'err'); return; }
  MOB.busy = true; MOB.busySince = Date.now(); mobPaint();
  try {
    /* ١. نبعت الحركات. البنود بتستنى لحد ما البرنامج على اللاب يبقى بالنسخة اللي بتعرف تدخّلها */
    const send = MOB.outbox.filter(e => e.sentRev < e.rev && (e.kind !== 'item' || mobLapItems()));
    if (send.length) {
      await mobCall('pay_put', { items: send.map(e => ({ id: e.id, kind: e.kind || 'pay', rev: e.rev, pid: e.pid, aid: e.aid, pname: e.pname, aname: e.aname, aproj: e.aproj, pay: e.pay, item: e.item, del: !!e.del, at: e.at })) });
      send.forEach(e => { e.sentRev = e.rev; e.sentAt = new Date().toISOString(); });
      mobPrune(MOB.base, MOB.baseAt);                                   // مسح اتبعت لسداد اللاب ماشافهوش أصلاً
      await IDB.set('outbox', MOB.outbox);
    }
    /* ٢. نجيب آخر نسخة من اللاب لو فيه أحدث */
    const j = await mobCall('snap_get', { have: MOB.baseAt });
    if (j.data && j.at !== MOB.baseAt) {
      const modalOpen = !!$('#modalRoot').innerHTML;
      await mobSetBase(j.data, j.at);
      if (!modalOpen) mobReload(); else MOB.reloadAfterModal = true;
    }
    MOB.lastPull = new Date().toISOString(); IDB.set('lastPull', MOB.lastPull);
    MOB.lastErr = ''; MOB.online = true;
    if (manual) toast('اتزامن ✓', 'ok');
  } catch (e) {
    MOB.lastErr = String(e.message || e);
    MOB.online = navigator.onLine;
    if (manual) toast('المزامنة فشلت: ' + MOB.lastErr, 'err');
  } finally { MOB.busy = false; mobPaint(); mobDiag(); }
}
/* تشخيص: حالة المزامنة بتتبعت لسكربت جوجل (عدد وحالة الحركات بس) — مرة كل دقيقتين بالكتير */
function mobDiag() {
  if (!MOB.cfg || Date.now() - (MOB.lastDiag || 0) < 120000) return;
  MOB.lastDiag = Date.now();
  const d = {
    at: new Date().toISOString(), ver: MOB_VER, baseAt: MOB.baseAt, lastPull: MOB.lastPull, lastErr: MOB.lastErr,
    online: navigator.onLine, standalone: !!(navigator.standalone || matchMedia('(display-mode: standalone)').matches),
    errs: (typeof errLog !== 'undefined' ? errLog : []).slice(0, 6).map(e => e.at.slice(11, 19) + ' ' + e.where + ': ' + String(e.msg).slice(0, 160)),
    outbox: MOB.outbox.slice(0, 25).map(e => ({ id: e.id, k: e.kind || 'pay', rev: e.rev, sent: e.sentRev, del: !!e.del, base: !!e.base, orphan: !!e.orphan, a: e.aname, amt: (mobRowOf(e) || {}).amount }))
  };
  mobCall('diag', { who: 'phone', d }).catch(() => { });
}
setInterval(() => { if (!document.hidden) mobSync(); }, 60000);
window.addEventListener('online', () => { MOB.online = true; mobSync(); });
window.addEventListener('offline', () => { MOB.online = false; mobPaint(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) mobSync(); });

/* ---------- الربط أول مرة ---------- */
function viewSetup() {
  const c = MOB.cfg || {};
  return `<div class="msetup card pad">
    <img src="${LOGO}" alt="">
    <h2 style="text-align:center;margin:0 0 6px;color:var(--navy)">ربط الموبايل باللاب</h2>
    <p style="text-align:center;color:var(--mut);font-size:13.5px;margin:0 0 14px">افتح البرنامج على اللاب ← «نسخة احتياطية» ← «ربط الموبايل»، وانسخ «كود الموبايل» من هناك.</p>
    <div class="f"><label>كود الموبايل (الصقه هنا)</label><input id="mUrl" dir="ltr" value="${esc(c.url ? c.url + '#' + c.key : '')}" placeholder="https://script.google.com/macros/s/…/exec#…" autocomplete="off"></div>
    <input id="mKey" type="hidden" value="">
    <div id="mSetErr" style="color:var(--red);font-size:13px;min-height:18px"></div>
    <button class="btn navy" style="width:100%;justify-content:center" onclick="mobConnect()">اربط وهات الحسابات</button>
  </div>`;
}
/* رابط الربط: لو البرنامج اتفتح من رابط آخره #c=… بيتربط لوحده من غير ما تلصق حاجة.
   ولو اتضاف للشاشة الرئيسية من الرابط ده، الأيقونة نفسها بتفتح بيه. */
function mobCodeFromUrl() {
  const m = /[#&]c=([^&]+)/.exec(location.hash || '');
  if (!m) return '';
  try { return decodeURIComponent(m[1]); } catch (e) { return ''; }
}
function mobConnect() { return mobConnectWith(($('#mUrl').value || '').trim(), ($('#mKey').value || '').trim()); }
async function mobConnectWith(url, key) {
  url = url || ''; key = key || '';
  /* كود الموبايل من اللاب = الرابط#الكود في سطر واحد */
  if (url.indexOf('#') > -1) { key = url.slice(url.indexOf('#') + 1).trim(); url = url.slice(0, url.indexOf('#')).trim(); }
  /* الرسالة بتظهر تحت الخانة، ولو الشاشة اتغيرت بتطلع كرسالة عادية */
  const err = t => { const el = document.getElementById('mSetErr'); if (el) el.textContent = t; else toast(t, 'err'); if (t !== 'بيوصل…') logErr('mobConnect', t); };
  if (!/^https:\/\//.test(url) && !/^http:\/\/localhost[:/]/.test(url)) return err('الرابط لازم يبدأ بـ https://');
  if (key.length < 8) return err('الكود ناقص');
  err('بيوصل…');
  const cfg = { url, key };
  MOB.connecting = true;
  let step = 'الاتصال';
  try {
    const j = await mobCall('snap_get', { have: '' }, cfg);
    if (!j.data) return err('اتربط، بس اللاب لسه مابعتش نسخة — افتح البرنامج على اللاب الأول');
    step = 'الحفظ على التليفون';
    await IDB.set('cfg', cfg);
    await mobSetBase(j.data, j.at);
    MOB.cfg = cfg;
    location.reload();
  } catch (e) { err('مقدرتش أكمّل (' + step + '): ' + (e && e.message || e)); }
  finally { MOB.connecting = false; }
}

async function mobResetToLaptop() {
  const unsent = MOB.outbox.filter(e => e.sentRev < e.rev).length;

function mobHideDenied(root) {
  root.querySelectorAll('[onclick],[onchange],[ondblclick]').forEach(el => {
    if (el.closest('.mbar,.mtabs,.mdrawer')) return;
    const code = (el.getAttribute('onclick') || '') + ' ' + (el.getAttribute('onchange') || '') + ' ' + (el.getAttribute('ondblclick') || '');
    const fns = code.match(/[A-Za-z_]\w*(?=\s*\()/g) || [];
    const payDel = /delRow\(\s*'[^']*'\s*,\s*'[^']*'\s*,\s*'p'/.test(code) && !fns.some(f => f !== 'delRow' && f !== 'closeModal' && MOB_DENY.has(f));
    if (!payDel && fns.some(f => MOB_DENY.has(f))) {
      if (el.matches('button,.btn,a,label,select,input[type=checkbox]') || el.closest('.modal-f,.ctx,#ctxRoot')) el.classList.add('mob-hide');
      else el.removeAttribute('ondblclick');

/* الجداول اللي فيها أكتر من ٣ أعمدة بتبقى كروت: كل خانة جنبها اسم العمود */
function mobCards(root) {
  root.querySelectorAll('table:not(.mcards):not(.mkeep)').forEach(t => {
    const ths = t.tHead ? [...t.tHead.rows[t.tHead.rows.length - 1].cells] : [];
    if (ths.length <= 3) return;
    const labels = []; ths.forEach(th => { for (let i = 0; i < (th.colSpan || 1); i++) labels.push(th.textContent.trim()); });
    [...t.tBodies, t.tFoot].filter(Boolean).forEach(b => [...b.rows].forEach(r => {
      let c = 0;
      [...r.cells].forEach(td => { if (labels[c] && !td.hasAttribute('data-label')) td.setAttribute('data-label', labels[c]); c += td.colSpan || 1; });
    }));
    t.classList.add('mcards');
  });
}

/* ================= كلمة سر الموبايل =================
   كلمة سر خاصة بالموبايل (مش بتاعة اللاب) — بتتطلب كل ما الموقع يتفتح، وكل ما ترجعله بعد دقيقتين برة،
   وقبلها مفيش أي رقم بيترسم على الشاشة. متخزنة على التليفون بس (مش بتتبعت لجوجل ولا للاب)،
   ومتشفّرة (PBKDF2) — يعني حتى اللي يفتح ملفات التليفون مايقدرش يعرفها. */
const PL = { rec: null, ok: false, hiddenAt: 0, AWAY: 2 * 60 * 1000 };
PL.ready = MOB.ready.then(async () => { try { PL.rec = await IDB.get('plock'); } catch (e) { PL.rec = null; } });
async function plHash(pass, salt, iter) {
  const enc = new TextEncoder();
  const k = await crypto.subtle.importKey('raw', enc.encode(String(pass)), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt), iterations: iter }, k, 256);
  return Array.from(new Uint8Array(bits), b => b.toString(16).padStart(2, '0')).join('');
}
async function plMake(pass) {
  const salt = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
  const iter = 150000;
  return { salt, iter, hash: await plHash(pass, salt, iter), at: new Date().toISOString() };
}
/* على الموبايل: الشاشة مقفولة لحد ما كلمة سر الموبايل تتكتب (كلمة سر اللاب مالهاش دعوة هنا) */
isLockSet = function () { return !PL.ok; };
lockNow = function () { if (!PL.rec) return openPassSetup(); PL.ok = false; locked = true; showLockScreen(); };

}
showLockScreen = async function () {

  if (!PL.rec) return plBox('اعمل كلمة سر للموبايل', 'كلمة سر خاصة بالموبايل — غير كلمة سر البرنامج على اللاب.<br>هتتطلب كل ما تفتح الحسابات من هنا.', `
    <input id="plNew" type="password" placeholder="كلمة السر (4 حروف أو أرقام على الأقل)" autocomplete="new-password">

    <button class="btn navy" style="width:100%;justify-content:center;margin-top:8px" onclick="tryUnlock()">فتح</button>

function plOpen() {
  PL.ok = true; locked = false; $('#lockRoot').innerHTML = '';
  PL.hiddenAt = 0;
  try { render(); } catch (e) { logErr('mobUnlock', e.message); }
}
async function plSetFirst() {
  const a = $('#plNew').value, b = $('#plNew2').value;
  if (a.length < 4) { $('#lockErr').textContent = 'كلمة السر لازم 4 حروف أو أرقام على الأقل'; return; }
  if (a !== b) { $('#lockErr').textContent = 'التأكيد مش زي كلمة السر'; $('#plNew2').value = ''; return; }
  try { PL.rec = await plMake(a); await IDB.set('plock', PL.rec); }
  catch (e) { $('#lockErr').textContent = 'مقدرتش أحفظها على التليفون: ' + e.message; return; }
  plOpen(); toast('كلمة سر الموبايل اتحفظت ✓', 'ok');
}
tryUnlock = async function () {
  const el = $('#lockPass'); if (!el) return;
  const v = el.value;
  let good = false;
  try { good = !!PL.rec && (await plHash(v, PL.rec.salt, PL.rec.iter)) === PL.rec.hash; } catch (e) { logErr('mobUnlock', e.message); }
  if (!good) { $('#lockErr').textContent = 'كلمة السر غلط'; el.value = ''; el.focus(); return; }
  plOpen();

    ${PL.rec ? '<div class="f"><label>كلمة السر الحالية *</label><input id="pOld" type="password" autocomplete="current-password"></div>' : ''}
    <div class="f"><label>كلمة السر الجديدة *</label><input id="pNew" type="password" autocomplete="new-password"></div>
    <div class="f"><label>تأكيدها *</label><input id="pNew2" type="password" autocomplete="new-password"></div>`,

async function plChange() {
  if (PL.rec && (await plHash(sval('pOld'), PL.rec.salt, PL.rec.iter)) !== PL.rec.hash) return toast('كلمة السر الحالية غلط', 'err');

function plSettings() { openPassSetup(); }
function plLockNow() { lockNow(); }
/* نسيت كلمة السر: نمسح نسخة الحسابات اللي على التليفون بس (اللاب مالوش دعوة)، وتتربط تاني من الأيقونة أو الرابط */
function plForgot() {
  const unsent = MOB.outbox.filter(e => e.sentRev < e.rev).length;
  plBox('نسيت كلمة السر؟', `مفيش طريقة نعرفها — بس الحسابات كلها محفوظة على اللاب.<br>
    هنمسح نسخة الحسابات اللي على التليفون ده، وبعدين افتح الموقع من الأيقونة أو رابط الربط تاني وهيتربط ويطلب كلمة سر جديدة.
    ${unsent ? `<br><b style="color:var(--red)">⚠ فيه ${unsent} حركة اتسجلت هنا ولسه ما وصلتش اللاب — هتضيع لو مسحت.</b>` : ''}`, `
    <input id="plWipe" placeholder="اكتب: امسح" style="letter-spacing:0">
    <button class="btn danger" style="width:100%;justify-content:center;margin-top:8px" onclick="plWipe()">امسح نسخة التليفون</button>
    <a href="javascript:void 0" onclick="showLockScreen()" style="display:block;margin-top:14px;font-size:12.5px;color:var(--mut)">رجوع</a>`);
}
async function plWipe() {
  if (($('#plWipe').value || '').trim() !== 'امسح') { $('#lockErr').textContent = 'اكتب كلمة «امسح» الأول'; return; }
  for (const k of ['base', 'baseAt', 'outbox', 'cfg', 'plock', 'lastPull']) { try { await IDB.set(k, null); } catch (e) { } }
  location.reload();
}
/* بعد دقيقتين برة الموقع (التليفون اتقفل أو فتحت حاجة تانية) بيطلب كلمة السر تاني */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (PL.ok) PL.hiddenAt = Date.now(); return; }
  if (PL.ok && PL.rec && PL.hiddenAt && Date.now() - PL.hiddenAt > PL.AWAY) { PL.ok = false; locked = true; showLockScreen(); }
});
MOB.ready.then(() => {
  mobPaint();
  if (MOB.cfg) setTimeout(mobSync, 800);
  else { const c = mobCodeFromUrl(); if (c) setTimeout(() => mobConnectWith(c, ''), 300); }
});

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
