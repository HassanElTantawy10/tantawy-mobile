<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الميزانية">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>ميزانية Hassan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  --navy:#1B3A5C; --navy-2:#24507D; --gold:#C9A227; --gold-soft:#F5E9C0;
  --slate:#0F172A; --slate-2:#1E293B; --bg:#F1F5F9; --line:#E2E8F0;
  --ink:#0F172A; --mut:#64748B; --amber:#B45309; --amber-bg:#FEF3C7;
  --emer:#047857; --emer-bg:#D1FAE5; --blue:#1D4ED8; --blue-bg:#DBEAFE;
  --red:#B91C1C; --red-bg:#FEE2E2;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.num{direction:ltr;text-align:left;font-variant-numeric:tabular-nums;unicode-bidi:isolate}
bdi.n{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}
.app{display:flex;min-height:100vh}
[hidden]{display:none!important}

/* ---------- الشريط الجانبي ---------- */
.sidebar{background:var(--slate);color:#fff;width:250px;flex:0 0 250px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side-head{display:flex;align-items:center;gap:11px;padding:16px;border-bottom:1px solid var(--slate-2)}
.side-logo{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:9px;padding:3px;flex:0 0 46px}
.side-name{font-weight:700;font-size:14.5px;line-height:1.3}
.side-sub{font-size:10.5px;color:#94A3B8}
.nav{padding:10px;overflow-y:auto;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:3px;color:#CBD5E1;text-decoration:none;border-radius:9px;font-size:13.5px;cursor:pointer;transition:.15s;border:none;background:none;width:100%;text-align:right}
.nav a:hover{background:var(--slate-2);color:#fff}
.nav a.on{background:var(--navy);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
.nav .ico{width:19px;text-align:center;opacity:.9;font-size:15px}
.nav .badge{margin-inline-start:auto;background:#334155;color:#E2E8F0;border-radius:20px;padding:0 7px;font-size:11px;font-weight:600}
.nav .badge.red{background:#B91C1C;color:#fff}
.nav .sep{height:1px;background:var(--slate-2);margin:8px 4px}
.side-foot{padding:10px 14px;border-top:1px solid var(--slate-2);font-size:11px;color:#94A3B8;display:flex;justify-content:space-between;align-items:center;gap:6px;cursor:pointer}
.dot{width:7px;height:7px;border-radius:50%;background:#22C55E;display:inline-block;flex:0 0 7px}
.dot.warn{background:var(--gold)}.dot.bad{background:#EF4444}.dot.off{background:#64748B}

/* ---------- المحتوى ---------- */
.main{flex:1;min-width:0;padding:20px 24px 60px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1.page{font-size:22px;font-weight:800;color:var(--navy);margin:0}
.sub{color:var(--mut);font-size:12.5px;margin:2px 0 0}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#CBD5E1;background:#F8FAFC}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3F2E00}
.btn.gold:hover{background:#B8931F}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.navy:hover{background:#16304C}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut);padding:6px 9px}
.btn.ghost:hover{background:#E2E8F0;color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--red);border-color:#FCA5A5}
.btn.danger:hover{background:var(--red-bg)}
.btn.emer{background:var(--emer);border-color:var(--emer);color:#fff}
.btn:disabled{opacity:.45;cursor:default}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.04);margin-bottom:14px;min-width:0}
.card.pad{padding:16px 18px}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-t{font-weight:700;color:var(--navy);font-size:14.5px}
.card-b{padding:14px 18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.grid2>.card{margin-bottom:0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gap{height:14px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px;position:relative;overflow:hidden;min-width:0}
.kpi:after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--gold)}
.kpi.amber:after{background:#D97706}.kpi.emer:after{background:#059669}.kpi.blue:after{background:#2563EB}.kpi.navy:after{background:var(--navy)}.kpi.red:after{background:#DC2626}.kpi.gold:after{background:var(--gold)}
.kpi .lbl{font-size:12px;color:var(--mut);font-weight:600;margin-bottom:4px}
.kpi .val{font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val.neg{color:var(--red)}.kpi .val.pos{color:var(--emer)}
.kpi .hint{font-size:11.5px;color:var(--mut);margin-top:3px}
.cur{font-size:13px;font-weight:600;color:var(--mut);margin-inline-start:3px}

table{width:100%;border-collapse:collapse}
thead th{background:var(--navy);color:#fff;padding:10px 12px;text-align:right;font-size:12.5px;font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:2}
thead th.num{text-align:left}
tbody td{padding:9px 12px;border-top:1px solid var(--line);font-size:13px;vertical-align:middle}
tbody tr:nth-child(even){background:#F8FAFC}
tbody tr:hover{background:#F1F5F9}
tbody tr.clk{cursor:pointer}
td.dt{white-space:nowrap;direction:ltr;text-align:right;unicode-bidi:isolate}
td.acts{white-space:nowrap;text-align:left;width:1%}
.tbl-wrap{overflow:auto;border-radius:0 0 14px 14px;max-height:70vh}
.tbl-wrap.free{max-height:none}
tfoot td{padding:10px 12px;border-top:2px solid var(--navy);font-weight:800;background:#F8FAFC;font-size:13.5px}
td small,.small{font-size:11.5px;color:var(--mut)}
.amt-in{color:var(--emer);font-weight:700}.amt-out{color:var(--ink);font-weight:700}.amt-x{color:var(--blue);font-weight:700}

.chip{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.emer{background:var(--emer-bg);color:var(--emer)}
.chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.red{background:var(--red-bg);color:var(--red)}
.chip.gray{background:#F1F5F9;color:var(--mut)}
.chip.gold{background:var(--gold-soft);color:#7A5C00}
.chip.pay{background:#047857;color:#fff;font-weight:800;padding:2px 11px}
.chip.pay:before{content:"●";font-size:8px;margin-inline-end:2px;opacity:.8}

.search{position:relative;flex:0 1 260px;min-width:150px}
.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 34px 8px 12px;background:#fff}
.search:before{content:"⌕";position:absolute;inset-inline-start:12px;top:5px;font-size:18px;color:var(--mut)}
input,select,textarea{border:1px solid #CBD5E1;border-radius:9px;padding:8px 11px;background:#fff;width:100%;outline:none;transition:.15s;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.18)}
input[type=checkbox]{width:auto;accent-color:var(--navy);transform:scale(1.15)}
label{display:block;font-size:12.5px;font-weight:600;color:#334155;margin-bottom:5px}
label.inl{display:flex;align-items:center;gap:8px;margin:0;cursor:pointer;font-weight:600}
.f{margin-bottom:13px;min-width:0}
.money{font-size:17px;font-weight:700;text-align:left;direction:ltr;padding:10px 12px}
.money.big{font-size:24px;padding:12px 14px}
input[data-date]{direction:ltr;text-align:left}
.hint-k{font-size:11.5px;color:var(--mut);margin-top:4px}
kbd{background:#F1F5F9;border:1px solid #CBD5E1;border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-size:11px;font-family:inherit;color:#334155}

/* اختيار بالأزرار (نوع الحركة، القسم، الحساب) */
.seg{display:flex;background:#F1F5F9;border-radius:10px;padding:3px;gap:3px;margin-bottom:13px}
.seg button{flex:1;border:none;background:none;padding:8px 6px;border-radius:8px;font-weight:700;color:var(--mut);cursor:pointer;font-size:13px}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.seg button.on.exp{color:var(--navy)}.seg button.on.inc{color:var(--emer)}.seg button.on.xfer{color:var(--blue)}.seg button.on.save{color:#7A5C00}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:12.5px;color:#334155;display:inline-flex;align-items:center;gap:5px}
.pick:hover{border-color:var(--gold)}
.pick.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:inset 0 -2px 0 var(--gold)}
.quick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.quick button{border:1px dashed #CBD5E1;background:#F8FAFC;border-radius:7px;padding:3px 9px;font-size:11.5px;cursor:pointer;color:var(--mut)}
.quick button:hover{border-color:var(--gold);color:var(--ink)}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:9px 15px;cursor:pointer;font-weight:600;font-size:13px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:8px 8px 0 0}
.tabs button:hover{background:#E2E8F0;color:var(--ink)}
.tabs button.on{color:var(--navy);border-bottom-color:var(--gold);background:#fff}

.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty .big{font-size:36px;opacity:.35;margin-bottom:8px}

/* مؤشر الشهر */
.cyclenav{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
.cyclenav b{min-width:150px;text-align:center;color:var(--navy);font-size:13.5px}
.cyclenav button{border:none;background:#F1F5F9;border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:14px;color:var(--navy)}
.cyclenav button:hover{background:var(--gold-soft)}

/* شريط التقدم */
.bar{height:6px;background:#E2E8F0;border-radius:4px;overflow:hidden;margin-top:6px;min-width:60px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#E0BC4A)}
.bar.done>i{background:linear-gradient(90deg,#059669,#34D399)}
.bar.prog>i{background:linear-gradient(90deg,#1D4ED8,#60A5FA)}
.bar.over>i{background:linear-gradient(90deg,#DC2626,#F87171)}
.bar.warn>i{background:linear-gradient(90deg,#D97706,#FBBF24)}

/* كروت (حسابات/مصادر دخل/أهداف) */
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.acc{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px;transition:.15s;position:relative}
.acc:hover{border-color:var(--gold);box-shadow:0 3px 10px rgba(15,23,42,.07)}
.acc .an{font-weight:700;color:var(--navy);font-size:14px;margin-bottom:2px;display:flex;align-items:center;gap:7px}
.acc .an .ic{font-size:18px}
.acc .am{font-size:11.5px;color:var(--mut);margin-bottom:8px}
.acc .big{font-size:21px;font-weight:800;color:var(--navy)}
.acc .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px;gap:8px}
.acc .row b{font-weight:700}
.acc .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

.alert{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border-radius:9px;margin-bottom:5px;cursor:pointer;font-size:13px;border-inline-start:3px solid transparent;transition:.15s}
.alert:hover{filter:brightness(.98)}
.alert.red{background:#FEF2F2;border-color:#DC2626;color:#7F1D1D}
.alert.amber{background:#FFFBEB;border-color:#D97706;color:#78350F}
.alert.blue{background:#EFF6FF;border-color:#2563EB;color:#1E3A8A}
.note{background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:9px 13px;font-size:12.5px;color:#78350F;margin-bottom:12px}
.note.blue{background:#EFF6FF;border-color:#BFDBFE;color:#1E3A8A}
.note.emer{background:#ECFDF5;border-color:#A7F3D0;color:#064E3B}
.mini-l{font-size:11.5px;color:var(--mut);font-weight:600}
.mini-v{font-size:18px;font-weight:800}
.steps{margin:0;padding-inline-start:20px}
.steps li{margin-bottom:8px}

/* سطور الجدول */
tbody tr.inrow,tbody tr.inrow:nth-child(even){background:#ECFDF5}
tbody tr.inrow td:first-child{box-shadow:inset 3px 0 0 #059669}
tbody tr.payrow,tbody tr.payrow:nth-child(even){background:#F0FDF4}
tbody tr.payrow td:first-child{box-shadow:inset 3px 0 0 #047857}
tbody tr.basisrow,tbody tr.basisrow:nth-child(even){background:#FAFAF9}
tbody tr.basisrow td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
tbody tr.adjrow,tbody tr.adjrow:nth-child(even){background:#EFF6FF;font-style:italic}
tbody tr.selrow,tbody tr.selrow:nth-child(even){background:#DBEAFE!important}
tbody tr.selrow td:first-child{box-shadow:inset 3px 0 0 #1D4ED8!important}
tr.dayhead td{background:#EEF2F7!important;color:var(--navy);font-weight:800;font-size:12.5px;padding-top:6px;padding-bottom:6px;border-top:2px solid var(--gold)}
tr.dayhead td .pc{font-weight:500;color:var(--mut);margin-inline-start:8px}
@keyframes flashrow{0%,45%{background:#FDE68A}100%{background:transparent}}
tr.flashrow td{animation:flashrow 2.4s ease-out}
.acc.flash{animation:flashcard 2.4s ease-out}
@keyframes flashcard{0%,45%{box-shadow:0 0 0 3px #FDE68A}100%{box-shadow:none}}
.selbar{position:sticky;top:0;z-index:19;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#1D4ED8;color:#fff;padding:9px 18px;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(29,78,216,.25);border-radius:12px;margin-bottom:10px}
.selbar b{font-size:15px}
.selbar .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}
.selbar .btn.danger{background:#fff;color:#B91C1C;border-color:#fff}
.ctx{position:fixed;z-index:300;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 12px 34px rgba(15,23,42,.22);padding:5px;min-width:210px}
.ctx button{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;text-align:right;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink)}
.ctx button:hover{background:#F1F5F9}
.ctx button.danger{color:var(--red)}
.ctx .k{margin-inline-start:auto;font-size:11px;color:var(--mut)}
.ctx .sep{height:1px;background:var(--line);margin:4px 0}

/* ---------- الرسومات ---------- */
.chart{width:100%;direction:ltr}
.chart svg{display:block;width:100%;height:auto;max-height:290px;overflow:visible}
.chart text{font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;fill:#64748B;font-size:11px}
.chart .gl{stroke:#E2E8F0;stroke-width:1}
.chart .zero{stroke:#94A3B8;stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:#334155;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.legend i.dash{height:0;border-top:2px dashed currentColor;width:14px;border-radius:0}
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut-wrap .chart{width:190px;flex:0 0 190px}
.donut-list{flex:1;min-width:180px}
.donut-list .li{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.donut-list .li:last-child{border:none}
.donut-list .li i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.donut-list .li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tip{position:fixed;z-index:400;background:var(--slate);color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;pointer-events:none;white-space:pre;box-shadow:0 6px 16px rgba(0,0,0,.25);direction:rtl;text-align:right}

/* ---------- المودال ---------- */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:80;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 22px 50px rgba(0,0,0,.28);animation:pop .16s ease-out}
.modal.wide{max-width:880px}
@keyframes pop{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:2px solid var(--gold)}
.modal-h .t{font-weight:800;color:var(--navy);font-size:16px;flex:1}
.modal-b{padding:18px 20px;max-height:66vh;overflow-y:auto}
.modal-f{display:flex;gap:9px;justify-content:flex-start;padding:13px 20px;border-top:1px solid var(--line);background:#F8FAFC;border-radius:0 0 16px 16px;flex-wrap:wrap}
.x{border:none;background:#F1F5F9;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;color:var(--mut);line-height:1}
.x:hover{background:#E2E8F0;color:var(--ink)}
.modal.dup{border-top:4px solid var(--gold)}
.calc-box{background:#F8FAFC;border:1px dashed #CBD5E1;border-radius:10px;padding:11px 14px;margin-top:10px;font-size:13px}
.calc-box .ln{display:flex;justify-content:space-between;padding:3px 0;gap:10px}
.calc-box .ln.tot{border-top:1px solid #CBD5E1;margin-top:5px;padding-top:7px;font-weight:800;color:var(--navy);font-size:15px}

.toast{position:fixed;bottom:22px;inset-inline-start:22px;background:var(--slate);color:#fff;padding:11px 18px;border-radius:11px;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:99;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:12px;animation:pop .18s;max-width:calc(100vw - 32px)}
.toast.ok{background:#065F46}.toast.err{background:#991B1B}
.toast button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:4px 11px;font-weight:700;cursor:pointer;font-family:inherit}
.crash{position:fixed;inset-inline:16px;bottom:16px;background:#7F1D1D;color:#fff;border-radius:12px;padding:13px 17px;z-index:150;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.crash button{margin-inline-start:10px;background:#fff;color:#7F1D1D;border:none;border-radius:8px;padding:5px 13px;font-weight:700;cursor:pointer;font-family:inherit}

/* ---------- شاشة القفل ---------- */
.lock{position:fixed;inset:0;background:linear-gradient(135deg,#0F172A,#1B3A5C);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.lock-box{background:#fff;border-radius:18px;padding:34px 38px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.lock-box img{width:84px;margin-bottom:14px}
.lock-box h2{margin:0 0 4px;font-size:18px;color:var(--navy)}
.lock-box p{margin:0 0 18px;font-size:12.5px;color:var(--mut)}
.lock-box input{text-align:center;font-size:18px;letter-spacing:3px;padding:11px;margin-bottom:10px}
.lock-err{color:var(--red);font-size:12.5px;margin-top:9px;min-height:18px;font-weight:600}

/* ---------- الموبايل: شريط فوق + تبويبات تحت + درج «المزيد» ---------- */
.mbar,.mtabs,.mdrawer,.fab{display:none}
@media(max-width:900px){
  .sidebar{display:none}
  .app{flex-direction:column}
  .mbar{display:flex;position:sticky;top:0;z-index:30;background:var(--slate);color:#fff;align-items:center;gap:10px;padding:calc(8px + var(--sat)) 14px 8px;min-height:calc(54px + var(--sat));border-bottom:2px solid var(--gold)}
  .mbar img{width:36px;height:36px;object-fit:contain;background:#fff;border-radius:8px;padding:2px}
  .mbar .tt{font-weight:800;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbar .st{display:flex;align-items:center;gap:6px;font-size:11px;color:#CBD5E1;cursor:pointer;background:var(--slate-2);padding:5px 10px;border-radius:20px}
  .main{padding:14px 12px calc(96px + var(--sab))}
  .mtabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:4px 4px var(--sab);height:calc(62px + var(--sab));box-shadow:0 -4px 14px rgba(15,23,42,.06)}
  .mtabs button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;font-weight:700;color:var(--mut);cursor:pointer;padding:4px 2px;position:relative}
  .mtabs button .i{font-size:20px;line-height:1.1}
  .mtabs button.on{color:var(--navy)}
  .mtabs button.on:after{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
  .mtabs .badge{position:absolute;top:3px;inset-inline-end:22%;background:#B91C1C;color:#fff;border-radius:10px;font-size:9.5px;padding:0 5px;line-height:15px}
  .mtabs .add{flex:0 0 64px}
  .mtabs .add span{width:52px;height:52px;border-radius:50%;background:var(--gold);color:#3F2E00;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 6px 16px rgba(201,162,39,.45);border:3px solid #fff}
  .mdrawer{display:block;position:fixed;inset:0;z-index:70;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.2s}
  .mdrawer.open{opacity:1;pointer-events:auto}
  .mdrawer .pane{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + var(--sab));transform:translateY(100%);transition:.22s;border-top:3px solid var(--gold)}
  .mdrawer.open .pane{transform:none}
  .mdrawer .grip{width:42px;height:4px;border-radius:4px;background:#CBD5E1;margin:0 auto 12px}
  .mdrawer .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mdrawer .g button{border:1px solid var(--line);background:#F8FAFC;border-radius:12px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:12px;color:#334155;cursor:pointer;position:relative}
  .mdrawer .g button.on{border-color:var(--navy);background:#fff;color:var(--navy);box-shadow:inset 0 -3px 0 var(--gold)}
  .mdrawer .g button .i{font-size:22px}
  .ov{padding:0;align-items:flex-end}
  .modal,.modal.wide{max-width:none;border-radius:18px 18px 0 0;animation:up .2s ease-out}
  .modal-b{max-height:calc(84vh - 120px)}
  .modal-f{border-radius:0;padding-bottom:calc(13px + var(--sab))}
  .modal-f .btn{min-height:42px;flex:1}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  input,select,textarea{font-size:16px}
  .btn{min-height:38px}
  .btn.sm{min-height:32px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .grid2>.card{margin-bottom:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px 13px}
  .kpi .val{font-size:19px}
  .topbar{margin-bottom:12px}
  h1.page{font-size:19px}
  .topbar .btn.hide-m{display:none}
  .hide-sm{display:none}
  tbody td,thead th{padding:8px 8px}
  .card-h{padding:11px 13px}.card-b{padding:12px 13px}.card.pad{padding:13px}
  .toast{bottom:calc(76px + var(--sab));inset-inline-start:12px;inset-inline-end:12px}
  .cyclenav b{min-width:120px;font-size:12.5px}
  .search{flex:1 1 100%}
}

/* ---------- الطباعة ---------- */
#printArea{display:none}
.letterhead{display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--gold);padding-bottom:14px;margin-bottom:20px}
.lh-logo{width:88px;height:auto;object-fit:contain}
.lh-ar{font-weight:800;font-size:18px;color:var(--navy);line-height:1.35}
.lh-en{font-size:10px;color:#94A3B8;letter-spacing:.04em;margin-top:3px}
.doc-title{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;border-radius:8px;padding:10px 16px;margin-bottom:18px;font-weight:700}
.doc-ref{font-size:11px;opacity:.85;font-weight:400}
.doc-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.doc-kpis div{border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.doc-kpis span{display:block;font-size:10px;color:var(--mut)}
.doc-kpis b{font-size:14px;color:var(--navy)}
.sign-row{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:40px;break-inside:avoid}
.sign-line{border-top:1px solid #94A3B8;padding-top:8px;color:#64748B;font-size:13px;text-align:center}
.doc-footer{text-align:center;font-size:10.5px;color:#94A3B8;margin-top:26px}
#printArea h3{color:var(--navy);font-size:13px;margin:16px 0 6px}
#printArea table.pt{width:100%;border-collapse:collapse;font-size:10.5px}
#printArea table.pt thead th{position:static;padding:5px 6px;font-size:10px;white-space:normal}
#printArea table.pt tbody td{padding:4px 6px;font-size:10.5px}
#printArea table.pt tfoot td{padding:5px 6px;font-size:11px}
#printArea .num,#printArea td.dt{white-space:nowrap}
#printArea .keepnext{break-after:avoid}
body.printing .app,body.printing .mtabs,body.printing .mdrawer{display:none!important}
body.printing #printArea{display:block!important;padding:0;background:#fff}
body.printing{background:#fff}
body.printing #modalRoot,body.printing #toastRoot,body.printing #ctxRoot{display:none!important}
@page{size:A4;margin:13mm}
@media print{
  body{background:#fff}
  .app,.mtabs,.mdrawer,#modalRoot,#toastRoot,#ctxRoot{display:none!important}
  #printArea{display:block!important;padding:0}
  thead th{background:var(--navy)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tbody tr:nth-child(even){background:#F8FAFC!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc-title,.chip,tr.inrow,tr.inrow td,tr.dayhead td,.bar,.bar>i,.chart{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr,.avoid-break{break-inside:avoid}
  thead{display:table-header-group}
  tfoot{display:table-row-group}
  h1,h2,h3,.doc-title{break-after:avoid}
}
.hide-m-inline{display:none}
@media(max-width:900px){.hide-m-inline{display:inline}}

<script>
/* ================= core.js — المنطق المشترك بين البرنامج وسكربت جوجل =================
   نفس الكود بالظبط بيتنسخ في index.html وفي Code.gs (build.py) — عشان الحسابات والتوقعات
   وقراءة رسايل التليجرام تطلع نفس النتيجة في الموبايل وفي البوت. مفيش أي حاجة هنا بتلمس الشاشة. */

var CORE_VERSION = 1;

/* ---------- أرقام ونصوص ---------- */
function toEnDigits(s) {
  return String(s == null ? '' : s)
    .replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 0x0660; })
    .replace(/[۰-۹]/g, function (d) { return d.charCodeAt(0) - 0x06F0; })
    .replace(/[٫]/g, '.').replace(/[٬،]/g, ',');
}
function num(v) { if (typeof v === 'number') return isFinite(v) ? v : 0; var n = parseFloat(toEnDigits(v).replace(/,/g, '')); return isNaN(n) ? 0 : n; }
function r2(x) { return Math.round((+x || 0) * 100) / 100; }
function fmtMoney(n) { var v = r2(n); var s = Math.abs(v % 1) > 0.004 ? 2 : 0; return v.toLocaleString('en-US', { minimumFractionDigits: s, maximumFractionDigits: 2 }); }
function fmt0(n) { return Math.round(+n || 0).toLocaleString('en-US'); }
/* توحيد الحروف عشان «أكل» = «اكل» و«بقالة» = «بقاله» */
function normAr(s) {
  return toEnDigits(s).toLowerCase()
    .replace(/[ً-ٰٟـ]/g, '')
    .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
    .replace(/\s+/g, ' ').trim();
}

/* معادلة آمنة: =15000*3+2000 — parser صغير مش eval */
function safeEvalFormula(expr) {
  var s = toEnDigits(expr).replace(/[×x]/g, '*').replace(/÷/g, '/').replace(/,/g, '').replace(/[^0-9+\-*/(). ]/g, '');
  var i = 0;
  function peek() { return s[i]; }
  function skip() { while (s[i] === ' ') i++; }
  function pExpr() { skip(); var v = pTerm(); skip(); while (peek() === '+' || peek() === '-') { var op = s[i++]; var r = pTerm(); v = op === '+' ? v + r : v - r; skip(); } return v; }
  function pTerm() { skip(); var v = pFac(); skip(); while (peek() === '*' || peek() === '/') { var op = s[i++]; var r = pFac(); v = op === '*' ? v * r : (r === 0 ? 0 : v / r); skip(); } return v; }
  function pFac() { skip(); if (peek() === '+') { i++; return pFac(); } if (peek() === '-') { i++; return -pFac(); } if (peek() === '(') { i++; var v = pExpr(); skip(); if (peek() === ')') i++; return v; } var st = i; while (i < s.length && /[0-9.]/.test(s[i])) i++; var n = parseFloat(s.slice(st, i)); return isNaN(n) ? 0 : n; }
  try { var r = pExpr(); return isFinite(r) ? r : 0; } catch (e) { return 0; }
}

/* ---------- تواريخ (كلها نص ISO وحساب UTC عشان مفيش لعب في التوقيت) ---------- */
function d2(iso) { return new Date(iso + 'T00:00:00Z'); }
function isoOf(dt) { return dt.toISOString().slice(0, 10); }
function addDays(iso, n) { var d = d2(iso); d.setUTCDate(d.getUTCDate() + n); return isoOf(d); }
function dim(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }            // m = 1..12
function ymd(y, m, d) { return y + '-' + String(m).padStart(2, '0') + '-' + String(Math.min(d, dim(y, m))).padStart(2, '0'); }
function addMonths(iso, n) { var p = iso.split('-').map(Number); var t = p[0] * 12 + (p[1] - 1) + n; return ymd(Math.floor(t / 12), t % 12 + 1, p[2]); }
function daysBetween(a, b) { return Math.round((d2(b) - d2(a)) / 86400000); }
/* العرض: يوم-شهر-سنة معزول باتجاه شمال←يمين عشان مايتقلبش جوه الكلام العربي */
function dsp(iso) { return iso ? '\u2066' + String(iso).slice(0, 10).split('-').reverse().join('-') + '\u2069' : '—'; }
var MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
var WDAYS = ['الأحد', 'الاتنين', 'التلات', 'الأربع', 'الخميس', 'الجمعة', 'السبت'];
function monthName(ym) { if (!ym) return '—'; var p = String(ym).split('-'); return MONTHS[+p[1] - 1] + ' ' + p[0]; }
function weekday(iso) { return WDAYS[d2(iso).getUTCDay()]; }
function shortDate(iso) { var p = iso.split('-'); return (+p[2]) + ' ' + MONTHS[+p[1] - 1]; }

/* 01022026 / 1-2-2026 / 2026-02-01 / ١/٢/٢٠٢٦ → 2026-02-01 */
function parseFlexibleDate(input) {
  var s = toEnDigits(input).replace(/[\u200e\u200f\u2066-\u2069]/g, '').trim();
  if (!s) return '';
  var hasSep = /[/\-.\s]/.test(s), digits = s.replace(/\D/g, ''), dd, mm, yyyy;
  if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)) { var t = s.split('-'); yyyy = t[0]; mm = t[1]; dd = t[2]; }
  else if (!hasSep && digits.length === 8) { dd = digits.slice(0, 2); mm = digits.slice(2, 4); yyyy = digits.slice(4); }
  else if (!hasSep && digits.length === 6) { dd = digits.slice(0, 2); mm = digits.slice(2, 4); yyyy = '20' + digits.slice(4); }
  else {
    var parts = s.split(/[/\-.\s]+/).filter(Boolean);
    if (parts.length !== 3) return '';
    dd = parts[0]; mm = parts[1]; yyyy = parts[2];
    if (dd.length === 4) { var tt = dd; dd = yyyy; yyyy = tt; }
    if (yyyy.length === 2) yyyy = '20' + yyyy;
  }
  var d = +dd, m = +mm, y = +yyyy;
  if (!(y >= 1900 && y <= 2200 && m >= 1 && m <= 12 && d >= 1 && d <= dim(y, m))) return '';
  return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}

/* ---------- دورة الميزانية: من يوم المرتب لليوم اللي قبله في الشهر اللي بعده ---------- */
function cycleDayOf(D) { var c = Math.round(num(D && D.settings && D.settings.cycleDay)); return c >= 1 && c <= 28 ? c : 1; }
function cycleOf(iso, cd) {
  cd = cd || 1;
  var p = iso.split('-').map(Number), y = p[0], m = p[1];
  if (p[2] < cd) { m--; if (!m) { m = 12; y--; } }
  var start = ymd(y, m, cd), end = addDays(addMonths(start, 1), -1);
  return { key: start.slice(0, 7), start: start, end: end };
}
function cycleShift(c, n, cd) { return cycleOf(addMonths(c.start, n), cd); }
function cycleLabel(c, cd) { return cd > 1 ? shortDate(c.start) + ' ← ' + shortDate(c.end) : monthName(c.key); }
function cycleName(c, cd) { return cd > 1 ? 'دورة ' + monthName(c.key) : monthName(c.key); }

/* ---------- البيانات ---------- */
function uid(p) { return (p || 'x') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function defaultState() {
  var u = 1;
  function cat(id, name, kind, icon, kw, budget) { return { id: id, name: name, kind: kind, icon: icon, kw: kw, budget: budget || 0, u: u }; }
  return {
    schema: 1,
    settings: { cycleDay: 1, defAcc: 'a_cash', alerts: { morning: 9, evening: 21, daily: true, bills: true, budget: true, monthly: true, weekly: true, unusual: true, lowBal: 0 } },
    accounts: [
      { id: 'a_cash', name: 'كاش', type: 'cash', icon: '💵', opening: 0, kw: 'كاش, نقدي, محفظتي', u: u },
      { id: 'a_bank', name: 'البنك', type: 'bank', icon: '🏦', opening: 0, kw: 'بنك, فيزا, كارت, حساب', u: u },
      { id: 'a_wallet', name: 'محفظة موبايل', type: 'wallet', icon: '📱', opening: 0, kw: 'فودافون كاش, انستاباي, انستا, محفظه, اورنج كاش', u: u }
    ],
    cats: [
      cat('c_food', 'أكل وبقالة', 'exp', '🛒', 'اكل, بقاله, سوبرماركت, خضار, فاكهه, لحمه, فراخ, سمك, عيش, لبن, جبنه, بيض, رز, زيت, سكر, عطاره, فطار'),
      cat('c_out', 'أكل برة', 'exp', '🍔', 'مطعم, كافيه, قهوه, دليفري, طلبات, شاورما, بيتزا, كشري, فول, سندوتشات, حلويات'),
      cat('c_car', 'عربية ومواصلات', 'exp', '🚗', 'بنزين, سولار, اوبر, كريم, تاكسي, مواصلات, ميكروباص, مترو, جراج, غسيل, زيت عربيه, كاوتش, ميكانيكي, مخالفه, رخصه'),
      cat('c_home', 'السكن', 'exp', '🏠', 'ايجار, صيانه, سباك, كهربائي, نقاش, عفش, اجهزه'),
      cat('c_bills', 'فواتير', 'exp', '💡', 'كهربا, كهرباء, ميه, غاز, نت, انترنت, موبايل, شحن, كارت, فودافون, اورنج, اتصالات, وي, تليفون'),
      cat('c_health', 'صحة', 'exp', '🩺', 'دكتور, دوا, صيدليه, تحاليل, اشعه, مستشفي, كشف, اسنان'),
      cat('c_edu', 'تعليم', 'exp', '🎓', 'مدرسه, دروس, درس, كورس, كتب, جامعه, مصاريف دراسه'),
      cat('c_clothes', 'لبس', 'exp', '👕', 'لبس, هدوم, جزمه, شنطه, قميص, بنطلون'),
      cat('c_family', 'البيت والعيلة', 'exp', '👨‍👩‍👧', 'منظفات, ادوات, عيال, مصروف, بامبرز, لعب'),
      cat('c_gift', 'مناسبات وهدايا', 'exp', '🎁', 'هديه, فرح, عزومه, نقطه, عيديه, عيد ميلاد'),
      cat('c_charity', 'صدقة وزكاة', 'exp', '🤲', 'صدقه, زكاه, تبرع'),
      cat('c_fun', 'ترفيه واشتراكات', 'exp', '🎬', 'خروجه, خروج, سينما, رحله, مصيف, اشتراك, نتفليكس, شاهد, يوتيوب, جيم, نادي'),
      cat('c_debt', 'أقساط وجمعيات', 'exp', '💳', 'قسط, قرض, جمعيه, تقسيط'),
      cat('c_misc', 'متفرقات', 'exp', '📦', ''),
      cat('c_salary', 'المرتب', 'inc', '💼', 'مرتب, راتب, قبضت, قبض'),
      cat('c_biz', 'أرباح الشغل', 'inc', '🏗', 'ارباح, ربح, مستخلص, مقاوله, شغل, عمولة, عموله'),
      cat('c_rent', 'إيجارات', 'inc', '🏘', 'ايجار, ايجارات'),
      cat('c_oinc', 'دخل تاني', 'inc', '💵', 'هديه, عيديه, رجعلي, استرداد')
    ],
    tx: [], rec: [], goals: [], debts: [], members: [], invites: [], trash: [],
    meta: { rev: 0, created: new Date().toISOString().slice(0, 19) }
  };
}
var COLS = ['accounts', 'cats', 'tx', 'rec', 'goals', 'debts', 'members', 'invites'];   // members/invites = شركاء البوت
function ensureShape(D) {
  var d = D && typeof D === 'object' ? D : defaultState();
  COLS.concat(['trash']).forEach(function (c) { if (!Array.isArray(d[c])) d[c] = []; });
  d.settings = d.settings || {}; d.settings.alerts = d.settings.alerts || {};
  var def = defaultState().settings;
  Object.keys(def).forEach(function (k) { if (d.settings[k] === undefined) d.settings[k] = def[k]; });
  Object.keys(def.alerts).forEach(function (k) { if (d.settings.alerts[k] === undefined) d.settings.alerts[k] = def.alerts[k]; });
  d.meta = d.meta || { rev: 0 };
  return d;
}
function byId(arr, id) { for (var i = 0; i < (arr || []).length; i++) if (arr[i].id === id) return arr[i]; return null; }
function catOf(D, id) { return byId(D.cats, id) || { id: id, name: id ? 'قسم ممسوح' : 'من غير قسم', icon: '❔', kind: 'exp', budget: 0 }; }

/* ---------- العمليات (المزامنة كلها عمليات صغيرة: put / del / restore / set) ----------
   كل عنصر عليه u = وقت آخر تعديل؛ الأحدث هو اللي يكسب لو نفس العنصر اتعدل من مكانين. */
function applyOp(D, op) {
  if (!op || !op.act) return false;
  if (op.act === 'set') {                       // الإعدادات
    var s = op.item || {};
    if ((D.settings._u || 0) > (op.u || 0)) return false;
    Object.keys(s).forEach(function (k) { if (k === 'alerts') { D.settings.alerts = Object.assign({}, D.settings.alerts, s.alerts); } else D.settings[k] = s[k]; });
    D.settings._u = op.u || Date.now();
    return true;
  }
  var col = op.col;
  if (COLS.indexOf(col) < 0) return false;
  var arr = D[col];
  if (op.act === 'put') {
    var it = op.item; if (!it || !it.id) return false;
    for (var i = 0; i < arr.length; i++) if (arr[i].id === it.id) {
      if ((arr[i].u || 0) > (it.u || 0)) return false;
      arr[i] = it; return true;
    }
    // لو كان في السلة وجاله تعديل أحدث، يرجع
    D.trash = D.trash.filter(function (t) { return !(t.col === col && t.item && t.item.id === it.id); });
    arr.push(it); return true;
  }
  if (op.act === 'del') {
    for (var j = 0; j < arr.length; j++) if (arr[j].id === op.id) {
      var gone = arr.splice(j, 1)[0];
      D.trash.unshift({ col: col, item: gone, at: op.at || new Date().toISOString().slice(0, 19) });
      if (D.trash.length > 800) D.trash.length = 800;
      return true;
    }
    return false;
  }
  if (op.act === 'restore') {
    for (var k = 0; k < D.trash.length; k++) { var t = D.trash[k]; if (t.col === col && t.item && t.item.id === op.id) {
      D.trash.splice(k, 1);
      if (!byId(arr, op.id)) { t.item.u = op.u || Date.now(); arr.push(t.item); }
      return true;
    } }
    return false;
  }
  return false;
}

/* ---------- الأرصدة ---------- */
function txSign(t, accId) {           // أثر الحركة على حساب معيّن
  var a = r2(t.amount);
  if (t.kind === 'inc' || t.kind === 'unsave') return t.acc === accId ? a : 0;
  if (t.kind === 'exp' || t.kind === 'save') return t.acc === accId ? -a : 0;
  if (t.kind === 'xfer') return (t.acc === accId ? -a : 0) + (t.to === accId ? a : 0);
  if (t.kind === 'adj') return t.acc === accId ? a : 0;            // تسوية رصيد (بالإشارة) — مالهاش دعوة بالمصروف
  return 0;
}
function balances(D, uptoISO) {
  var out = {};
  D.accounts.forEach(function (a) { out[a.id] = r2(a.opening); });
  D.tx.forEach(function (t) {
    if (uptoISO && t.date > uptoISO) return;
    if (t.acc && out[t.acc] === undefined) out[t.acc] = 0;
    if (t.to && out[t.to] === undefined) out[t.to] = 0;
    if (t.acc) out[t.acc] = r2(out[t.acc] + txSign(t, t.acc));
    if (t.kind === 'xfer' && t.to) out[t.to] = r2(out[t.to] + r2(t.amount));
  });
  return out;
}
function totalBalance(D, uptoISO) { var b = balances(D, uptoISO), s = 0; D.accounts.forEach(function (a) { if (!a.archived) s += b[a.id] || 0; }); return r2(s); }

function debtLeft(d) { var p = 0; (d.pays || []).forEach(function (x) { p += r2(x.amount); }); return r2(r2(d.amount) - p); }

/* ---------- ملخص دورة ---------- */
function txIn(D, start, end) { return D.tx.filter(function (t) { return t.date >= start && t.date <= end; }); }

  txIn(D, start, end).forEach(function (t) {
    var a = r2(t.amount); s.n++;
    if (t.kind === 'inc') { s.inc += a; s.byIncCat[t.cat] = r2((s.byIncCat[t.cat] || 0) + a); }
    else if (t.kind === 'exp') { s.exp += a; s.byCat[t.cat] = r2((s.byCat[t.cat] || 0) + a); s.byDay[t.date] = r2((s.byDay[t.date] || 0) + a); if (t.rec) s.fixedExp += a; }
    else if (t.kind === 'save') s.save += a;
    else if (t.kind === 'unsave') s.save -= a;
  });
  s.inc = r2(s.inc); s.exp = r2(s.exp); s.save = r2(s.save); s.fixedExp = r2(s.fixedExp);
  s.net = r2(s.inc - s.exp);
  s.rate = s.inc > 0 ? Math.round((s.inc - s.exp) / s.inc * 100) : null;
  return s;
}
function totalBudget(D) { var b = 0; D.cats.forEach(function (c) { if (c.kind === 'exp' && !c.archived) b += num(c.budget); }); return r2(b); }

  var s = summarize(D, c.start, c.end);
  return D.cats.filter(function (x) { return x.kind === 'exp' && (!x.archived || s.byCat[x.id]); }).map(function (x) {
    var spent = s.byCat[x.id] || 0, b = num(x.budget);
    return { cat: x, spent: spent, budget: b, left: r2(b - spent), pct: b > 0 ? Math.round(spent / b * 100) : (spent > 0 ? null : 0) };
  }).sort(function (a, b) { return (b.budget > 0) - (a.budget > 0) || b.spent - a.spent; });
}

/* ---------- الالتزامات والدخل المتكرر ---------- */
var FREQ = { m: 'كل شهر', y: 'كل سنة', w: 'كل أسبوع', q: 'كل 3 شهور', once: 'مرة واحدة' };
function recOccurrences(r, from, to) {
  if (!r || r.active === false) return [];
  var start = r.start || '2000-01-01', out = [], n = 0, maxN = r.count ? Math.round(num(r.count)) : 0;
  function push(d) { if (r.end && d > r.end) return false; n++; if (maxN && n > maxN) return false; if (d >= from && d <= to && d >= start) out.push(d); return true; }
  if (r.freq === 'once') { if (start >= from && start <= to) out.push(start); return out; }
  if (r.freq === 'w') {
    var d = start; for (var g = 0; g < 1200 && d <= to; g++) { if (!push(d)) break; d = addDays(d, 7); }
    return out;
  }
  var step = r.freq === 'y' ? 12 : r.freq === 'q' ? 3 : 1;
  var sp = start.split('-').map(Number), day = r.freq === 'm' || r.freq === 'q' ? (Math.round(num(r.day)) || sp[2]) : sp[2];
  var first = ymd(sp[0], sp[1], day);
  if (first < start) first = addMonths(first, step);     // أول استحقاق بعد تاريخ البداية
  for (var k = 0; k < 600; k++) {
    var p = first.split('-').map(Number), t = p[0] * 12 + (p[1] - 1) + k * step;
    var dd = ymd(Math.floor(t / 12), t % 12 + 1, day);
    if (dd > to) break;
    if (!push(dd)) break;
  }
  return out;
}
function recPaid(D, r, due) {
  for (var i = 0; i < D.tx.length; i++) { var t = D.tx[i]; if (t.rec === r.id && (t.due === due || (!t.due && Math.abs(daysBetween(t.date, due)) <= 10))) return t; }
  return null;
}
/* كل استحقاقات الفترة، ومين اتدفع ومين لأ */
function dueList(D, from, to) {
  var out = [];
  D.rec.forEach(function (r) {
    recOccurrences(r, from, to).forEach(function (d) { out.push({ rec: r, due: d, paid: recPaid(D, r, d) }); });
  });
  return out.sort(function (a, b) { return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });
}

/* ---------- التوقعات ---------- */
function median(a) { if (!a.length) return 0; var s = a.slice().sort(function (x, y) { return x - y; }), m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
/* متوسط مرجّح للشهور الأحدث، والقيم الشاذة متقصوصة عند ضعف الوسيط */
function robustAvg(vals) {

  var med = median(vals), cap = med > 0 ? med * 2 : Infinity, ws = 0, s = 0, sporadic = !(med > 0);

  vals.forEach(function (v, i) { var w = sporadic ? 1 : Math.max(1, 6 - i); s += Math.min(v, cap) * w; ws += w; });

  var sd = Math.sqrt(varr / vals.length);
  sd = Math.max(sd, avg * 0.08);
  return { avg: Math.round(avg), lo: Math.round(Math.max(0, avg - sd)), hi: Math.round(avg + sd), sporadic: sporadic };
}
function trendPct(vals) {            // vals: الأحدث الأول
  if (vals.length < 3) return null;
  var v = vals.slice().reverse(), n = v.length, mx = (n - 1) / 2, my = 0;
  v.forEach(function (y) { my += y; }); my /= n;
  var a = 0, b = 0; v.forEach(function (y, x) { a += (x - mx) * (y - my); b += (x - mx) * (x - mx); });
  if (!b || !my) return null;
  return Math.round((a / b) / my * 100);
}
/* بيقيس آخر 6 دورات كاملة لكل قسم — من غير المصاريف الثابتة (دي بتتحسب من الالتزامات بالظبط) */
function cycleHistory(D, today, nBack) {

  var firstTx = D.tx.reduce(function (m, t) { return !m || t.date < m ? t.date : m; }, '');
  for (var i = 1; i <= (nBack || 6); i++) {

      var a = r2(t.amount);
      if (t.kind === 'exp') { if (t.rec) rows.fixExp += a; else rows.varCat[t.cat] = r2((rows.varCat[t.cat] || 0) + a); }
      else if (t.kind === 'inc') { if (t.rec) rows.fixInc += a; else rows.varInc[t.cat] = r2((rows.varInc[t.cat] || 0) + a); }
    });
    out.push(rows);
  }

function forecastCycle(D, c, today) {

  // ١) الثابت: من الالتزامات والدخل المتكرر
  var dues = dueList(D, c.start, c.end); res.dues = dues;
  var fixedByCat = {};
  dues.forEach(function (x) {
    var a = r2(x.rec.amount);
    if (x.rec.kind === 'inc') { res.fixedInc += a; incs[x.rec.cat] = incs[x.rec.cat] || { fixed: 0, v: { avg: 0, lo: 0, hi: 0 } }; incs[x.rec.cat].fixed += a; }
    else { res.fixedExp += a; fixedByCat[x.rec.cat] = r2((fixedByCat[x.rec.cat] || 0) + a); }
  });

  D.cats.forEach(function (k) {

      var est = hist.length ? robustAvg(vals) : { avg: num(k.budget), lo: num(k.budget) * 0.85, hi: num(k.budget) * 1.15 };
      var fixed = fixedByCat[k.id] || 0;

function goalMonthly(D, g, fromISO) {

/* الدورة الحالية: اللي اتصرف + اللي فاضل من الالتزامات + المتغير على حسب المعدل */
function projectCurrent(D, today) {

/* «تقدر تصرف كام في اليوم لحد آخر الدورة» */
function safeToSpend(D, today) {

/* خط الرصيد المتوقع يوم بيوم: الالتزامات في مواعيدها + المتغير موزع على الأيام */

/* ---------- التنبيهات (نفس القايمة في البرنامج وفي البوت) ---------- */
function alertsFor(D, today) {
  var out = [], A = D.settings.alerts || {}, cd = cycleDayOf(D), c = cycleOf(today, cd);
  // ميزانية
  budgetRows(D, c).forEach(function (r) {
    if (r.budget > 0 && r.spent > r.budget) out.push({ lvl: 'red', key: 'over_' + r.cat.id, txt: r.cat.icon + ' ' + r.cat.name + ': عدّيت الميزانية بـ ' + fmtMoney(r.spent - r.budget), go: 'budget' });
    else if (r.budget > 0 && r.pct >= 80) out.push({ lvl: 'amber', key: 'near_' + r.cat.id, txt: r.cat.icon + ' ' + r.cat.name + ': صرفت ' + r.pct + '% من الميزانية — فاضل ' + fmtMoney(r.left), go: 'budget' });

    if (r.kind === 'inc') {
      if (n < -2) out.push({ lvl: 'amber', key: 'inc_' + r.id + x.due, txt: '💼 ' + r.name + ' كان المفروض ييجي ' + dsp(x.due) + ' ولسه ما اتسجلش', go: 'income', rec: r.id, due: x.due });
      else if (n <= 0) out.push({ lvl: 'blue', key: 'inc_' + r.id + x.due, txt: '💼 ' + r.name + ' (' + fmtMoney(r.amount) + ') ميعاده ' + (n === 0 ? 'النهارده' : dsp(x.due)) + ' — سجله لما ييجي', go: 'income', rec: r.id, due: x.due });

/* مصروف غريب: أكبر من 3 أضعاف المعتاد في نفس القسم */
function isUnusual(D, t) {

/* ---------- قراءة رسالة التليجرام: «150 بنزين» / «صرفت 2 الف ايجار من البنك» / «+12000 مرتب» ---------- */
var INC_WORDS = ['قبضت', 'استلمت', 'جالي', 'جاني', 'دخل', 'دخلي', 'اتحولي', 'وصلني', 'حصلت', 'كسبت'];
var EXP_WORDS = ['صرفت', 'دفعت', 'اشتريت', 'جبت', 'سددت', 'خرج'];
var STOP = ['صرفت', 'دفعت', 'اشتريت', 'جبت', 'سددت', 'قبضت', 'استلمت', 'جالي', 'جاني', 'على', 'علي', 'عل', 'في', 'من', 'ل', 'لل', 'ب', 'جنيه', 'جنية', 'ج', 'جم', 'ج.م', 'egp', 'le', 'النهارده', 'امبارح', 'امس', 'اول', 'حق', 'تمن', 'ثمن', 'بتاع', 'بتاعت', 'دخل', 'اتحولي', 'وصلني', 'حولت', 'حول', 'تحويل'];

    w = normAr(w); if (!w || w.length < 2) return;
    var re = new RegExp('(^|[\\s،,.+\\-])(ال|بال|وال|لل|و|ب)?' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[\\s،,.!?؟])');
    if (re.test(textN)) best = Math.max(best, w.length + 2);

}
function parseBotText(D, text, today) {
  var raw = toEnDigits(text).trim();
  if (!raw) return null;
  var t = normAr(raw);
  // المبلغ: أول رقم أو معادلة (150 / 1,500 / 150+75 / 2.5 الف / 3k)
  var m = /(^|[^0-9a-z])([+\-]?\s*[0-9][0-9.,]*(?:\s*[+\-*/×x]\s*[0-9][0-9.,]*)*)\s*(الف|ك|k|الاف)?(?![0-9])/i.exec(t);
  if (!m) return null;
  var expr = m[2].replace(/\s+/g, ''), plus = /^\+/.test(expr);
  expr = expr.replace(/^[+\-]/, '');
  // 1,500 = ألف وخمسمية مش 1.5
  var amount = /[+\-*/×x]/.test(expr) ? safeEvalFormula(expr) : num(expr);
  if (m[3]) amount *= 1000;
  if (!/[0-9]/.test(expr) || amount <= 0) return null;
  amount = r2(amount);
  var rest = (t.slice(0, m.index + m[1].length) + ' ' + t.slice(m.index + m[0].length)).replace(/\s+/g, ' ').trim();
  // التاريخ
  var date = today;
  if (/(^|\s)اول امبارح(\s|$)/.test(t)) date = addDays(today, -2);
  else if (/(^|\s)(امبارح|امس)(\s|$)/.test(t)) date = addDays(today, -1);
  var dm = /(^|\s)(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?(\s|$)/.exec(rest);
  if (dm) { var y = dm[4] ? (dm[4].length === 2 ? '20' + dm[4] : dm[4]) : today.slice(0, 4); var pd = parseFlexibleDate(dm[2] + '-' + dm[3] + '-' + y); if (pd) { date = pd; rest = rest.replace(dm[0], ' ').trim(); } }
  // نوع الحركة
  var kind = 'exp';
  var xferM = /(حولت|حول|تحويل)/.test(t);
  if (plus || INC_WORDS.some(function (w) { return new RegExp('(^|\\s)' + w + '(\\s|$)').test(t); })) kind = 'inc';
  // الحساب
  var acc = null, accScore = 0, to = null;
  if (xferM) {
    var fm = /من\s+(.+?)\s+(لل|ل|الي|الى|علي|على)\s*(.+)$/.exec(rest);
    if (fm) {
      var fa = bestAcc(D, fm[1]), ta = bestAcc(D, fm[3]);
      if (fa && ta && fa.id !== ta.id) return { kind: 'xfer', amount: amount, acc: fa.id, to: ta.id, date: date, cat: '', note: '', guessed: false };
    }
  }
  D.accounts.forEach(function (a) {
    if (a.archived) return;
    var s = matchScore(t, [a.name].concat(String(a.kw || '').split(/[,،]/)));
    if (s > accScore) { accScore = s; acc = a.id; }
  });
  // القسم
  var best = null, bs = 0;
  D.cats.forEach(function (c) {
    if (c.archived) return;
    var s = matchScore(rest, [c.name].concat(String(c.kw || '').split(/[,،]/)));
    if (c.kind !== kind) s = s ? s - 1 : 0;           // نفضّل القسم من نفس النوع
    if (s > bs) { bs = s; best = c; }
  });
  if (best && best.kind !== kind) {
    // «مرتب 12000» من غير «قبضت»: القسم بيحدد النوع
    if (!plus && !INC_WORDS.some(function (w) { return t.indexOf(w) >= 0; }) && !EXP_WORDS.some(function (w) { return t.indexOf(w) >= 0; })) kind = best.kind;
    else best = null;
  }
  var accWords = [];
  if (acc) { var aa = byId(D.accounts, acc); accWords = [aa.name].concat(String(aa.kw || '').split(/[,،]/)).map(function (w) { return normAr(w).replace(/^ال/, ''); }).filter(Boolean); }
  var guessed = !best;
  if (!best) best = byId(D.cats, kind === 'inc' ? 'c_oinc' : 'c_misc') || D.cats.filter(function (c) { return c.kind === kind; })[0];
  // الملاحظة: باقي الكلام من غير كلمات الحشو
  var note = raw.replace(/[+]?\s*[0-9][0-9.,]*(\s*[+\-*/×x]\s*[0-9][0-9.,]*)*\s*(الف|ألف|ك|k|آلاف|الاف)?(?![0-9])/i, ' ')
    .replace(/(^|\s)\d{1,2}[\/\-]\d{1,2}([\/\-]\d{2,4})?(?=\s|$)/g, ' ')
    .split(/\s+/).filter(function (w) { var n = normAr(w); return w && STOP.indexOf(n) < 0 && accWords.indexOf(n.replace(/^(ال|بال|لل)/, '')) < 0; }).join(' ').trim();
  return { kind: kind, amount: amount, cat: best ? best.id : '', acc: acc || D.settings.defAcc || (D.accounts[0] && D.accounts[0].id) || '', date: date, note: note.slice(0, 120), guessed: guessed };
}
function bestAcc(D, txt) {
  var n = normAr(txt), best = null, bs = 0;
  D.accounts.forEach(function (a) { var s = matchScore(n, [a.name].concat(String(a.kw || '').split(/[,،]/))); if (s > bs) { bs = s; best = a; } });
  return best;
}

const SYNC = { rev: LS.get('rev') || 0, outbox: LS.get('outbox') || [], busy: false, err: null, lastOk: LS.get('lastOk') || '', saving: false };
let UNDO = [];
const UI = { view: 'home', off: 0, filt: { kind: '', cat: '', acc: '', q: '', by: '' }, sel: new Set(), flash: null, lastAdd: null, repTab: 'month' };

function persist() {
  const ok = LS.set('data', D);
  LS.set('outbox', SYNC.outbox); LS.set('rev', SYNC.rev);
  return ok;
}
function put(col, item) { return { act: 'put', col, item: Object.assign({}, item, { u: Date.now() }) }; }
function del(col, id) { return { act: 'del', col, id }; }
function setOp(obj) { return { act: 'set', item: obj, u: Date.now() }; }
function invertOp(op) {
  if (op.act === 'put') { const ex = byId(D[op.col], op.item.id); return ex ? { act: 'put', col: op.col, item: clone(ex) } : { act: 'del', col: op.col, id: op.item.id }; }
  if (op.act === 'del') return { act: 'restore', col: op.col, id: op.id };
  if (op.act === 'restore') return { act: 'del', col: op.col, id: op.id };
  if (op.act === 'set') { const prev = {}; Object.keys(op.item).forEach(k => prev[k] = clone(D.settings[k] === undefined ? null : D.settings[k])); return { act: 'set', item: prev }; }
  return null;
}
function commit(ops, msg, opt) {
  opt = opt || {};
  ops = ops.filter(Boolean);
  if (!ops.length) return;
  const inv = ops.map(invertOp).reverse();
  ops.forEach(o => { o.oid = uid('o'); o.at = nowLocal(); if (!o.u) o.u = Date.now(); applyOp(D, o); SYNC.outbox.push(o); });
  if (opt.undo !== false) { UNDO.push({ msg, inv }); if (UNDO.length > 20) UNDO.shift(); }
  if (opt.flash) UI.flash = opt.flash;
  persist();
  if (msg) toast(msg, 'ok', opt.undo !== false);
  scheduleSync();
  if (opt.render !== false) render();
}
function undo() {
  const u = UNDO.pop();
  if (!u) { toast('مفيش حاجة نرجع فيها'); return; }
  const ops = u.inv.map(o => { const c = clone(o); c.u = Date.now(); if (c.item && c.act === 'put') c.item.u = Date.now(); return c; });
  commit(ops, '', { undo: false });
  toast('↩ رجعت: ' + (u.msg || 'آخر تغيير'), 'ok');
}

/* ================= المزامنة مع سكربت جوجل ================= */
function parseCode(raw) {
  raw = String(raw || '').trim();
  const m = /^(https:\/\/script\.google\.com\/macros\/s\/[^#?\s]+\/exec)(?:\?[^#]*)?#(.+)$/.exec(raw);
  return m ? { url: m[1], key: decodeURIComponent(m[2]) } : null;
}
async function api(op, body, cfg) {
  cfg = cfg || CFG;
  if (!cfg || !cfg.url) throw { code: 'no_cfg', message: 'البرنامج مش مربوط بسكربت جوجل' };
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 45000);
  let r;
  try { r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify(Object.assign({ op, key: cfg.key }, body || {})), signal: ctl.signal }); }
  catch (e) { throw { code: 'offline', message: e && e.name === 'AbortError' ? 'سكربت جوجل اتأخر في الرد' : 'مفيش اتصال بسكربت جوجل (Failed to fetch)' }; }
  finally { clearTimeout(tm); }
  if (!r.ok) throw { code: 'http', message: 'السيرفر رد بـ ' + r.status };
  let j; try { j = await r.json(); } catch (e) { throw { code: 'bad_reply', message: 'رد مش مفهوم — اتأكد إن السكربت منشور «Anyone»' }; }
  if (!j.ok) throw { code: j.code || 'script', message: j.error || 'رد غلط' };
  return j;
}
let syncTimer = null;
function scheduleSync(ms) { clearTimeout(syncTimer); if (!CFG) { syncState(); return; } SYNC.saving = true; syncState(); syncTimer = setTimeout(() => sync(), ms == null ? 1200 : ms); }
function rebase(data) {
  D = ensureShape(data);
  SYNC.outbox.forEach(o => applyOp(D, o));   // اللي لسه ما اتبعتش يتطبق فوق
}
async function sync(manual) {
  if (!CFG) { syncState(); if (manual) toast('البرنامج شغال على الجهاز ده بس — اربطه من الإعدادات'); return; }
  if (SYNC.busy) { scheduleSync(1500); return; }
  SYNC.busy = true; syncState();
  const before = JSON.stringify([D.tx.length, D.meta.rev]);
  try {
    let j;
    if (SYNC.outbox.length) {
      const send = SYNC.outbox.slice(0, 400);
      j = await api('push', { ops: send, have: SYNC.rev });
      const done = new Set(j.applied || []);
      SYNC.outbox = SYNC.outbox.filter(o => !done.has(o.oid));
    } else j = await api('pull', { have: SYNC.rev });
    if (j.data) rebase(j.data);
    SYNC.rev = j.rev; SYNC.err = null; SYNC.lastOk = nowLocal(); LS.set('lastOk', SYNC.lastOk);
    persist();
    if (SYNC.outbox.length) { SYNC.busy = false; return sync(manual); }
    if (manual) toast('اتزامن ✓', 'ok');
    if (j.data && JSON.stringify([D.tx.length, D.meta.rev]) !== before && !modalOpen()) render(true);
  } catch (e) {
    SYNC.err = e; logErr('sync', e.message || e.code);
    if (e.code === 'key') { if (manual) toast('كود الربط غلط — حط الكود الجديد من الإعدادات', 'err'); }
    else if (manual) toast(e.code === 'offline' ? 'مفيش نت — هيتبعت لوحده أول ما يرجع' : 'ما اتزامنش: ' + (e.message || e.code), 'err');
    clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(), e.code === 'offline' ? 30000 : 90000);
  } finally { SYNC.busy = false; SYNC.saving = false; syncState(); }
}
function syncState() {
  let dot = 'ok', txt = 'محفوظ ✓';
  const n = SYNC.outbox.length;
  if (!CFG) { dot = 'off'; txt = 'على الجهاز ده بس'; }
  else if (SYNC.busy || SYNC.saving) { dot = 'warn'; txt = 'بيحفظ…'; }
  else if (SYNC.err) { dot = SYNC.err.code === 'offline' ? 'warn' : 'bad'; txt = SYNC.err.code === 'offline' ? 'من غير نت' + (n ? ' · ' + n + ' مستني' : '') : SYNC.err.code === 'key' ? 'كود الربط غلط' : 'مشكلة مزامنة'; }
  else if (n) { dot = 'warn'; txt = n + ' مستني يتبعت'; }
  $$('.syncbox').forEach(el => el.innerHTML = `<span class="dot ${dot}"></span><span>${esc(txt)}</span>`);
}
window.addEventListener('online', () => scheduleSync(300));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { checkAutoLock(); scheduleSync(200); } else { LS.set('hiddenAt', Date.now()); } });
setInterval(() => { if (document.visibilityState === 'visible' && CFG && !SYNC.busy) sync(); }, 120000);

/* ================= الرسومات (SVG من غير مكتبات) ================= */
const PAL = ['#1B3A5C', '#C9A227', '#047857', '#1D4ED8', '#B45309', '#24507D', '#7A5C00', '#059669', '#2563EB', '#64748B', '#D97706', '#0F766E'];
const C_INC = '#059669', C_EXP = '#1B3A5C', C_GOLD = '#C9A227';
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function kfmt(v) { const a = Math.abs(v); return a >= 1e6 ? (v / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M' : a >= 1e3 ? (v / 1e3).toFixed(a >= 1e4 ? 0 : 1) + 'K' : String(Math.round(v)); }
const tipA = s => `data-tip="${esc(s)}"`;
function niceRange(mn, mx) {
  if (mx <= mn) mx = mn + 1;
  const step = niceMax((mx - mn) / 4);
  return [Math.floor(mn / step) * step, Math.ceil(mx / step) * step, step];
}
function axisY(W, H, pl, pt, pb, min, max) {
  let g = ''; const steps = Math.round((max - min) / niceRange(min, max)[2]) || 4;
  for (let i = 0; i <= steps; i++) {
    const v = min + (max - min) * i / steps, y = H - pb - (H - pt - pb) * i / steps;
    g += `<line class="${v === 0 && min < 0 ? 'zero' : 'gl'}" x1="${pl}" x2="${W - 6}" y1="${y}" y2="${y}"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end">${kfmt(v)}</text>`;
  }
  return g;
}
/* أعمدة: مجموعات أو متراكبة */
function barChart(o) {
  const W = 640, H = o.h || 230, pl = 44, pt = 10, pb = 28, n = o.labels.length;
  if (!n) return '';
  let mx = 0, mn = 0;
  o.labels.forEach((_, i) => {
    if (o.stacked) { let s = 0; o.series.forEach(se => s += Math.max(0, se.vals[i] || 0)); mx = Math.max(mx, s); }
    else o.series.forEach(se => { mx = Math.max(mx, se.vals[i] || 0); mn = Math.min(mn, se.vals[i] || 0); });
    if (o.line) { mx = Math.max(mx, o.line.vals[i] || 0); mn = Math.min(mn, o.line.vals[i] || 0); }
  });
  [mn, mx] = niceRange(Math.min(0, mn), Math.max(mx, 1));
  const y = v => H - pb - (H - pt - pb) * (v - mn) / (mx - mn), gw = (W - pl - 8) / n;
  let s = axisY(W, H, pl, pt, pb, mn, mx);
  o.labels.forEach((lb, i) => {
    const x0 = pl + gw * i, inner = gw * 0.72, ox = x0 + (gw - inner) / 2;
    if (o.stacked) {
      let acc = 0;
      o.series.forEach(se => { const v = Math.max(0, se.vals[i] || 0); if (!v) return; const y1 = y(acc + v), y2 = y(acc); s += `<rect x="${ox}" y="${y1}" width="${inner}" height="${Math.max(0.5, y2 - y1)}" fill="${se.color}" ${tipA(lb + '\n' + se.name + ': ' + fmtMoney(v))}/>`; acc += v; });
    } else {
      const bw = inner / o.series.length;
      o.series.forEach((se, k) => { const v = se.vals[i] || 0, y1 = y(Math.max(0, v)), y2 = y(Math.min(0, v)); s += `<rect x="${ox + bw * k + 1}" y="${y1}" width="${Math.max(1, bw - 2)}" height="${Math.max(0.5, y2 - y1)}" rx="2" fill="${se.color}" opacity="${o.hi === i || o.hi == null ? 1 : .55}" ${tipA(lb + '\n' + se.name + ': ' + fmtMoney(v))}/>`; });
    }
    if (n <= 14 || i % 2 === 0) s += `<text x="${x0 + gw / 2}" y="${H - 9}" text-anchor="middle" ${o.hi === i ? 'style="fill:#1B3A5C;font-weight:700"' : ''}>${esc(lb)}</text>`;
  });
  if (o.line) {
    const pts = o.line.vals.map((v, i) => `${pl + gw * i + gw / 2},${y(v || 0)}`).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="${o.line.color}" stroke-width="2.2" stroke-linejoin="round"/>`;
    o.line.vals.forEach((v, i) => s += `<circle cx="${pl + gw * i + gw / 2}" cy="${y(v || 0)}" r="3.2" fill="#fff" stroke="${o.line.color}" stroke-width="2" ${tipA(o.labels[i] + '\n' + o.line.name + ': ' + fmtMoney(v || 0))}/>`);
  }
  const lg = o.series.map(se => `<span><i style="background:${se.color}"></i>${esc(se.name)}</span>`).join('') + (o.line ? `<span><i style="background:${o.line.color}"></i>${esc(o.line.name)}</span>` : '');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${s}</svg></div><div class="legend">${lg}</div>`;
}
/* خطوط: x رقمي (أيام)، وممكن خط متقطع ومنطقة */
function lineChart(o) {
  const W = 640, H = o.h || 220, pl = 48, pt = 12, pb = 28, n = o.n;
  let mx = -Infinity, mn = Infinity;
  o.series.forEach(se => se.pts.forEach(p => { if (p[1] == null) return; mx = Math.max(mx, p[1]); mn = Math.min(mn, p[1]); }));
  if (!isFinite(mx)) return '';
  [mn, mx] = niceRange(Math.min(0, mn), Math.max(mx, 1));
  const x = i => pl + (W - pl - 10) * (n > 1 ? i / (n - 1) : 0.5), y = v => H - pb - (H - pt - pb) * (v - mn) / (mx - mn);
  let s = axisY(W, H, pl, pt, pb, mn, mx);
  (o.xlabels || []).forEach(l => { s += `<text x="${x(l[0])}" y="${H - 9}" text-anchor="middle">${esc(l[1])}</text>`; });
  if (o.marker != null) s += `<line x1="${x(o.marker)}" x2="${x(o.marker)}" y1="${pt}" y2="${H - pb}" stroke="#C9A227" stroke-dasharray="3 3"/>`;
  o.series.forEach(se => {
    const pts = se.pts.filter(p => p[1] != null);
    if (!pts.length) return;
    const d = pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join(' ');
    if (se.fill) s += `<path d="${d} L${x(pts[pts.length - 1][0])} ${y(Math.max(0, mn))} L${x(pts[0][0])} ${y(Math.max(0, mn))} Z" fill="${se.color}" opacity=".10"/>`;
    s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.w || 2.4}" ${se.dash ? 'stroke-dasharray="6 5"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if (se.tips) pts.forEach(p => { if (p[2]) s += `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="7" fill="transparent" ${tipA(p[2])}/>`; });
  });
  (o.dots || []).forEach(dt => s += `<circle cx="${x(dt[0])}" cy="${y(dt[1])}" r="4.5" fill="${dt[2]}" stroke="#fff" stroke-width="2" ${dt[3] ? tipA(dt[3]) : ''}/>`);
  const lg = o.series.filter(se => se.name).map(se => `<span style="color:${se.color}"><i class="${se.dash ? 'dash' : ''}" style="background:${se.dash ? 'transparent' : se.color}"></i><b style="color:#334155;font-weight:500">${esc(se.name)}</b></span>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${s}</svg></div><div class="legend">${lg}</div>`;
}
function donut(segs, top, bottom) {
  const tot = segs.reduce((a, s) => a + s.v, 0);
  if (!tot) return '';
  const R = 80, r = 52, cx = 95, cy = 95;
  let a0 = -Math.PI / 2, s = '';
  segs.forEach(sg => {
    const a1 = a0 + 2 * Math.PI * sg.v / tot, large = a1 - a0 > Math.PI ? 1 : 0;
    if (sg.v / tot > 0.9999) { s += `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${sg.c}" stroke-width="${R - r}" ${tipA(sg.l + ': ' + fmtMoney(sg.v))}/>`; }
    else {
      const p = (rad, a) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)].map(v => v.toFixed(2)).join(' ');
      s += `<path d="M${p(R, a0)} A${R} ${R} 0 ${large} 1 ${p(R, a1)} L${p(r, a1)} A${r} ${r} 0 ${large} 0 ${p(r, a0)} Z" fill="${sg.c}" stroke="#fff" stroke-width="1.5" ${tipA(sg.l + ': ' + fmtMoney(sg.v) + ' (' + Math.round(sg.v / tot * 100) + '%)')}/>`;
    }
    a0 = a1;
  });
  s += `<text x="${cx}" y="${cy - 2}" text-anchor="middle" style="font-size:17px;font-weight:800;fill:#1B3A5C">${esc(top || kfmt(tot))}</text><text x="${cx}" y="${cy + 16}" text-anchor="middle" style="font-size:10.5px">${esc(bottom || '')}</text>`;
  return `<div class="chart"><svg viewBox="0 0 190 190" role="img">${s}</svg></div>`;
}
/* tooltip للرسومات: hover على الكمبيوتر، ولمسة على الموبايل */
(function () {
  let tip = null;
  function show(el, x, y) {
    if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; document.body.appendChild(tip); }
    tip.textContent = el.getAttribute('data-tip'); tip.style.display = 'block';
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(innerWidth - w - 8, Math.max(8, x - w / 2)) + 'px'; tip.style.top = Math.max(8, y - h - 14) + 'px';
  }
  function hide() { if (tip) tip.style.display = 'none'; }
  document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && e.pointerType === 'mouse') show(el, e.clientX, e.clientY); else if (e.pointerType === 'mouse') hide(); });
  document.addEventListener('pointerdown', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && e.pointerType !== 'mouse') show(el, e.clientX, e.clientY); else hide(); });
  document.addEventListener('scroll', hide, true);
})();

const pctBar = (spent, budget) => { if (!budget) return ''; const p = spent / budget * 100; return `<div class="bar ${p > 100 ? 'over' : p >= 80 ? 'warn' : 'done'}"><i style="width:${Math.min(100, p).toFixed(1)}%"></i></div>`; };
const catLabel = id => { const k = catOf(D, id); return `${k.icon} ${esc(k.name)}`; };

function onboarding() {

  return `<div class="card pad" style="border-color:var(--gold)"><div class="card-t" style="margin-bottom:8px">👋 ابدأ في 4 خطوات</div><ol class="steps">
    ${step(hasOpen, 'حط الفلوس اللي معاك دلوقتي في كل حساب (كاش، بنك، محفظة)', `<button class="btn sm" onclick="go('accounts')">الحسابات</button>`)}
    ${step(hasInc, 'سجّل مرتبك أو دخلك الثابت وميعاده', `<button class="btn sm" onclick="recModal(null,'inc')">+ مصدر دخل</button>`)}
    ${step(D.rec.some(r => r.kind === 'exp'), 'سجّل الالتزامات الثابتة (إيجار، نت، أقساط، جمعية…)', `<button class="btn sm" onclick="recModal(null,'exp')">+ التزام</button>`)}
    ${step(hasBud, 'حدد ميزانية لكل قسم — أو خلّي البرنامج يقترح بعد شهر', `<button class="btn sm" onclick="go('budget')">الميزانية</button>`)}
  </ol><div class="small" style="margin-top:6px">ولو عايز تسجل من التليجرام برسالة زي «150 بنزين»: الإعدادات ← بوت التليجرام.</div></div>`;
}
function insights(t) {
  const out = [], c = cycleOf(t, cd()), p = projectCurrent(D, t), hist = cycleHistory(D, t, 3);
  // قسم ماشي أعلى من المعتاد
  if (hist.length >= 2 && p.gone >= 7) {
    const s = summarize(D, c.start, t), factor = p.total / p.gone;
    let best = null;
    D.cats.filter(k => k.kind === 'exp').forEach(k => {
      const avg = hist.reduce((a, h) => a + (h.varCat[k.id] || 0), 0) / hist.length;
      let cur = 0; txIn(D, c.start, t).forEach(x => { if (x.kind === 'exp' && x.cat === k.id && !x.rec) cur += r2(x.amount); });
      const proj = cur * factor;
      if (avg > 300 && proj > avg * 1.3 && (!best || proj - avg > best.d)) best = { k, d: proj - avg, pct: Math.round((proj / avg - 1) * 100) };
    });
    if (best) out.push({ lvl: 'blue', key: 'ins_up', txt: `📈 ${best.k.icon} ${best.k.name} ماشي أعلى من المعتاد بحوالي ${best.pct}% الشهر ده`, go: 'forecast' });
  }
  // المرتب الجاي
  const nx = D.rec.filter(r => r.kind === 'inc').map(r => ({ r, d: recOccurrences(r, addDays(t, 1), addDays(t, 60))[0] })).filter(x => x.d).sort((a, b) => a.d < b.d ? -1 : 1)[0];
  if (nx) { const n = daysBetween(t, nx.d); if (n <= 10) out.push({ lvl: 'blue', key: 'ins_sal', txt: `💼 ${nx.r.name} الجاي بعد ${n === 1 ? 'يوم' : n + ' أيام'} (${shortDate(nx.d)}) — ${fmtMoney(nx.r.amount)}`, go: 'income' }); }
  return out;
}
function catDonut(s, clickable) {
  const ents = Object.keys(s.byCat).map(k => [k, s.byCat[k]]).sort((a, b) => b[1] - a[1]);
  if (!ents.length) return emptyBox('🍰', 'لسه مفيش مصروف في الشهر ده');
  const top = ents.slice(0, 8), rest = ents.slice(8).reduce((a, x) => a + x[1], 0);
  const segs = top.map((x, i) => ({ l: catOf(D, x[0]).name, v: x[1], c: PAL[i % PAL.length], id: x[0] }));
  if (rest > 0) segs.push({ l: 'باقي الأقسام', v: rest, c: '#CBD5E1' });
  return `<div class="donut-wrap">${donut(segs, kfmt(s.exp), 'ج.م مصروف')}<div class="donut-list">${segs.map(sg => `<div class="li" onclick="${sg.id ? `UI.filt.cat='${sg.id}';UI.filt.kind='exp';UI.view='tx';render()` : ''}"><i style="background:${sg.c}"></i><span>${esc(sg.l)}</span><bdi class="n">${fmtMoney(sg.v)}</bdi><small style="width:34px;text-align:left">${Math.round(sg.v / s.exp * 100)}%</small></div>`).join('')}</div></div>`;
}
function cumChart(c, t) {
  const N = daysBetween(c.start, c.end) + 1, bud = totalBudget(D), s = summarize(D, c.start, c.end);
  const upto = t < c.start ? -1 : Math.min(N - 1, daysBetween(c.start, t));
  const act = []; let cum = 0;
  for (let i = 0; i <= upto; i++) { const d = addDays(c.start, i); cum += s.byDay[d] || 0; act.push([i, r2(cum), dsp(d) + '\nلحد اليوم ده: ' + fmtMoney(cum) + (s.byDay[d] ? '\nفي اليوم ده: ' + fmtMoney(s.byDay[d]) : '')]); }
  const series = [];
  if (bud) series.push({ name: 'الميزانية', color: '#C9A227', pts: [[0, 0], [N - 1, bud]], dash: true, w: 1.8 });
  series.push({ name: 'اللي اتصرف', color: C_EXP, pts: act, fill: true, tips: true });
  const isCur = t >= c.start && t <= c.end;
  if (isCur && upto < N - 1 && D.tx.length) { const p = projectCurrent(D, t); series.push({ name: 'المتوقع لآخر الشهر', color: '#B45309', pts: [[upto, r2(cum)], [N - 1, p.expEnd]], dash: true, w: 2 }); }
  if (!act.length && !bud) return emptyBox('📈', 'الرسمة هتظهر لما تسجل مصروف');
  const xl = [[0, shortDate(c.start)], [Math.round((N - 1) / 2), shortDate(addDays(c.start, Math.round((N - 1) / 2)))], [N - 1, shortDate(c.end)]];
  return lineChart({ n: N, series, xlabels: xl, marker: isCur ? upto : null, h: 210 });
}
function monthsChart(n) {
  const cur = curCycle(), first = D.tx.reduce((m, x) => !m || x.date < m ? x.date : m, '');
  const labels = [], inc = [], exp = [], net = [];
  for (let i = n - 1; i >= 0; i--) {
    const c = cycleShift(cur, -i, cd());
    if (first && c.end < first && i > 2) continue;
    const s = summarize(D, c.start, c.end);
    labels.push(MONTHS[+c.key.slice(5) - 1]); inc.push(s.inc); exp.push(s.exp); net.push(s.net);
  }
  if (!D.tx.length) return emptyBox('📊', 'الرسمة هتظهر لما تسجل دخل ومصروف');
  return barChart({ labels, series: [{ name: 'الدخل', color: C_INC, vals: inc }, { name: 'المصروف', color: C_EXP, vals: exp }], line: { name: 'الفاضل', color: C_GOLD, vals: net }, hi: labels.length - 1 });
}

  if (q) L = L.filter(x => normAr([x.note, catOf(D, x.cat).name, accOf(D, x.acc).name, fmtMoney(x.amount), String(x.amount), dsp(x.date)].join(' ')).includes(q));

let selAnchor = null;
function rowClick(e, id) {
  if (IS_TOUCH || UI.view !== 'tx') { txModal(id); return; }
  if (e.ctrlKey || e.metaKey) { UI.sel.has(id) ? UI.sel.delete(id) : UI.sel.add(id); selAnchor = id; }
  else if (e.shiftKey && selAnchor) {
    const ids = $$('#main tr[data-id]').map(r => r.dataset.id), a = ids.indexOf(selAnchor), b = ids.indexOf(id);
    if (a >= 0 && b >= 0) { UI.sel.clear(); ids.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(x => UI.sel.add(x)); }
  } else { const only = UI.sel.size === 1 && UI.sel.has(id); UI.sel.clear(); if (!only) UI.sel.add(id); selAnchor = id; }
  render();
}
function rowCtx(e, id) {
  e.preventDefault();
  if (!UI.sel.has(id)) { UI.sel.clear(); UI.sel.add(id); render(); }
  const r = $('#ctxRoot');
  r.innerHTML = `<div class="ctx" style="top:${Math.min(e.clientY, innerHeight - 170)}px;left:${Math.min(e.clientX, innerWidth - 230)}px">
    <button onclick="ctxClose();txModal('${id}')">✎ تعديل</button>
    <button onclick="ctxClose();dupTx('${id}')">⧉ تكرار<span class="k">Ctrl+D</span></button>
    <button onclick="ctxClose();bulkCat()">🏷 غيّر القسم</button>
    <div class="sep"></div><button class="danger" onclick="ctxClose();delTx(Array.from(UI.sel))">🗑 مسح<span class="k">Del</span></button></div>`;
  setTimeout(() => document.addEventListener('click', ctxClose, { once: true }), 0);
}
function ctxClose() { $('#ctxRoot').innerHTML = ''; }
function delTx(ids) {
  ids = ids.filter(id => byId(D.tx, id));
  if (!ids.length) return;
  const go = () => { UI.sel.clear(); commit(ids.map(id => del('tx', id)), ids.length > 1 ? `اتمسح ${ids.length} حركات (في السلة)` : 'اتمسحت (في سلة المحذوفات)'); };
  if (ids.length > 1) askYesNo('مسح حركات', `هتمسح <b>${ids.length}</b> حركات. هيروحوا سلة المحذوفات وتقدر ترجعهم.`, go, '🗑 امسح', true);

    ${f.rows.map(r => `<tr><td>${r.cat.icon} ${esc(r.cat.name)}</td><td class="num">${r.fixed ? fmtMoney(r.fixed) : '—'}</td><td class="num">${fmtMoney(r.v.avg)}</td><td class="num hide-sm small">${fmtMoney(r.v.lo)} – ${fmtMoney(r.v.hi)}</td><td class="num"><b>${fmtMoney(r.total)}</b></td><td class="num hide-sm" style="color:${r.budget && r.total > r.budget ? 'var(--red)' : 'inherit'}">${r.budget ? fmtMoney(r.budget) : '—'}</td><td class="hide-sm">${r.trend == null ? '' : r.trend > 8 ? `<span class="chip red">↑ ${r.trend}%</span>` : r.trend < -8 ? `<span class="chip emer">↓ ${-r.trend}%</span>` : '<span class="chip gray">ثابت</span>'}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>المصروف</td><td class="num">${fmtMoney(f.fixedExp)}</td><td class="num">${fmtMoney(f.varExp)}</td><td class="num hide-sm small">${fmtMoney(f.lo)} – ${fmtMoney(f.hi)}</td><td class="num">${fmtMoney(f.exp)}</td><td class="num hide-sm">${fmtMoney(totalBudget(D))}</td><td class="hide-sm"></td></tr></tfoot></table></div>
    ${f.incRows.length ? `<div class="tbl-wrap free" style="margin-top:12px"><table><thead><tr><th>الدخل</th><th class="num">ثابت</th><th class="num">متغير (بحذر)</th><th class="num">المتوقع</th></tr></thead><tbody>${f.incRows.map(r => `<tr class="inrow"><td>${r.cat.icon} ${esc(r.cat.name)}</td><td class="num">${r.fixed ? fmtMoney(r.fixed) : '—'}</td><td class="num">${fmtMoney(r.v.avg)}</td><td class="num"><b>${fmtMoney(r.total)}</b></td></tr>`).join('')}</tbody></table></div>` : ''}

  const dueDots = dueList(D, addDays(t, 1), addDays(t, 60)).filter(x => !x.paid).map(x => { const i = daysBetween(t, x.due); return [i, tl.pts[i] ? tl.pts[i].v : 0, x.rec.kind === 'inc' ? '#059669' : '#B45309', dsp(x.due) + '\n' + x.rec.name + ': ' + (x.rec.kind === 'inc' ? '+' : '−') + fmtMoney(x.rec.amount)]; });

    ${tl.lowest.v < 0 ? `<div class="note" style="background:#FEF2F2;border-color:#FECACA;color:#7F1D1D">📉 على المعدل ده الرصيد هيبقى بالسالب حوالي ${dsp(tl.lowest.d)} (${fmtMoney(tl.lowest.v)}). يا إما تقلل المتغير، يا إما تأجل حاجة.</div>` : `<div class="note emer">✓ أقل رصيد متوقع ${fmtMoney(tl.lowest.v)} يوم ${dsp(tl.lowest.d)} — مفيش عجز متوقع.</div>`}
    ${lineChart({ n: N, series: [{ name: 'الرصيد المتوقع', color: C_EXP, pts: tl.pts.map((p, i) => [i, p.v, dsp(p.d) + '\n' + fmtMoney(p.v)]), fill: true, tips: true }], xlabels: xl, dots: dueDots, h: 220 })}

};
function forecastTips(f) {
  const tips = [];
  if (f.net < 0) {
    const up = f.rows.filter(r => r.trend > 8 && r.v.avg > 200).sort((a, b) => b.v.avg - a.v.avg).slice(0, 3);
    tips.push(`⚠ المتوقع إن المصروف يزيد عن الدخل بـ ${fmtMoney(-f.net)}.` + (up.length ? ' أكتر حاجات بتزيد: ' + up.map(r => r.cat.name + ' (↑' + r.trend + '%)').join('، ') + '.' : ''));
  }
  const over = f.rows.filter(r => r.budget && r.total > r.budget * 1.1);
  if (over.length) tips.push('🎯 متوقع تعدّي ميزانية: ' + over.map(r => r.cat.name).join('، ') + ' — يا إما تزوّد الميزانية يا إما تقلل.');
  if (f.net > 0 && f.inc) tips.push(`💡 لو حطيت ${fmtMoney(Math.floor(f.net * 0.7 / 50) * 50)} في هدف أول ما المرتب ينزل، هيفضلك احتياطي ${fmtMoney(f.net - Math.floor(f.net * 0.7 / 50) * 50)}.`);
  return tips.length ? `<div style="margin-top:12px">${tips.map(x => `<div class="alert ${x.startsWith('⚠') ? 'red' : x.startsWith('🎯') ? 'amber' : 'blue'}" style="cursor:default">${esc(x)}</div>`).join('')}</div>` : '';
}

let M = null, M_EX = null;

  M = M_EX ? clone(M_EX) : Object.assign({ kind: 'exp', acc: D.settings.defAcc || (D.accounts[0] || {}).id, date: defaultDate() }, preset || {});

function budgetHint(catId) {

  const left = r.budget - spent;
  return `<span class="chip ${left < 0 ? 'red' : left < r.budget * .2 ? 'amber' : 'emer'}" style="margin-inline-start:6px">فاضل في الميزانية ${fmtMoney(left)}</span>`;
}
function saveTx(again) {
  syncM();
  const err = m => { toast(m, 'err'); };
  if (!(M.amount > 0) && M.kind !== 'adj') return err('اكتب المبلغ');
  if (M.kind === 'adj' && !M.amount) return err('اكتب مبلغ التسوية');
  if (!M.date) return err('التاريخ مش مظبوط — اكتبه زي 25102026');
  if ((M.kind === 'exp' || M.kind === 'inc') && !M.cat) return err('اختار القسم');
  if (!M.acc) return err('اختار الحساب');
  if (M.kind === 'xfer' && (!M.to || M.to === M.acc)) return err('اختار الحساب اللي هتحوّل له');
  if ((M.kind === 'save' || M.kind === 'unsave') && !M.goal) return err('اختار الهدف');
  const it = { id: M.id || uid('t'), date: M.date, kind: M.kind, amount: r2(M.amount), acc: M.acc, note: M.note || '', via: M_EX ? (M_EX.via || 'app') : 'app', at: M_EX ? M_EX.at : nowLocal() };
  if (M.kind === 'exp' || M.kind === 'inc') it.cat = M.cat;
  if (M.kind === 'xfer') it.to = M.to;
  if (M.kind === 'save' || M.kind === 'unsave') it.goal = M.goal;
  if (M.rec) { it.rec = M.rec; if (M.due) it.due = M.due; }
  const doSave = () => {
    let msg = M_EX ? 'اتعدلت ✓' : 'اتحفظ ✓';
    if (it.kind === 'exp' && it.cat) {
      const tmp = clone(D); applyOp(tmp, put('tx', it));
      const r = budgetRows(tmp, cycleOf(it.date, cd())).find(x => x.cat.id === it.cat);
      if (r && r.budget) msg += r.left < 0 ? ` — عدّيت ميزانية ${r.cat.name} بـ ${fmtMoney(-r.left)}` : ` — فاضل في ${r.cat.name} ${fmtMoney(r.left)}`;
    }
    const keep = { kind: it.kind, acc: it.acc, date: it.date };
    if (!M_EX) UI.lastAdd = { date: it.date, t: Date.now() };
    closeModal();
    commit([put('tx', it)], msg, { flash: it.id });
    if (again) txModal(null, keep);
  };
  if (!M_EX) {
    const sim = D.tx.filter(x => x.kind === it.kind && r2(x.amount) === it.amount && x.date === it.date && (x.cat || '') === (it.cat || '') && x.acc === it.acc);
    if (sim.length) return dupAsk(sim.map(x => ({ html: `${dsp(x.date)} — ${catLabel(x.cat)} — <b>${fmtMoney(x.amount)}</b> ${esc(x.note || '')}`, id: x.id })), doSave, s => txModal(s.id));
  }
  doSave();
}

function monthReport() {
  const c = cyc(), s = summarize(D, c.start, c.end), t = todayISO(), hist = cycleHistory(D, c.end < t ? addDays(c.end, 1) : t, 3);
  const rows = Object.keys(s.byCat).map(k => ({ k: catOf(D, k), v: s.byCat[k], avg: hist.length ? hist.reduce((a, x) => a + (x.varCat[k] || 0) + 0, 0) / hist.length : null })).sort((a, b) => b.v - a.v);
  const top = txIn(D, c.start, c.end).filter(x => x.kind === 'exp').sort((a, b) => b.amount - a.amount).slice(0, 10);
  let h = `<div class="card"><div class="card-h">${cycleNav()}</div><div class="card-b">
    <div class="kpis">${kpi('emer', 'الدخل', money(s.inc))}${kpi('navy', 'المصروف', money(s.exp), s.fixedExp ? 'منه ثابت ' + fmtMoney(s.fixedExp) : '')}${kpi(s.net < 0 ? 'red' : 'gold', s.net < 0 ? 'العجز' : 'الفاضل', money(Math.abs(s.net)), s.rate !== null ? 'ادخار ' + s.rate + '%' : '', s.net < 0 ? 'neg' : '')}${kpi('blue', 'للأهداف', money(s.save), s.n + ' حركة')}</div>
