<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1B3A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="لوحة المدير">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>لوحة المدير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: navy letterhead band → section tabs → one working column of ledgers; on a phone the tabs move to a bottom bar */
:root{
  --navy:#1B3A5C; --navy-2:#24496f; --gold:#C9A227; --gold-soft:#F4E9C4;
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF2F7; --ink:#14202E; --muted:#5B6878; --line:#D9E0E8;
  --late:#B42318; --late-bg:#FDECEA; --ok:#0F7A4B; --ok-bg:#E6F4EC; --soon:#A15C07; --soon-bg:#FFF3DC;
  --info:#1D5FA8; --info-bg:#E5EFFA;
  --display:"Amiri","Tajawal",serif; --body:"Tajawal","Segoe UI",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#16314e; --navy-2:#1e3d60; --gold:#D8B23A; --gold-soft:#3a3218;
  --bg:#0E1622; --surface:#152131; --surface-2:#1C2B3E; --ink:#E6EDF5; --muted:#9AAABD; --line:#2A3A50;
  --late:#FF8A7A; --late-bg:#3A1A18; --ok:#5FD39A; --ok-bg:#12301F; --soon:#F2B65A; --soon-bg:#3A2A10;
  --info:#7DB3F0; --info-bg:#132C47; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#16314e; --navy-2:#1e3d60; --gold:#D8B23A; --gold-soft:#3a3218;
  --bg:#0E1622; --surface:#152131; --surface-2:#1C2B3E; --ink:#E6EDF5; --muted:#9AAABD; --line:#2A3A50;
  --late:#FF8A7A; --late-bg:#3A1A18; --ok:#5FD39A; --ok-bg:#12301F; --soon:#F2B65A; --soon-bg:#3A2A10;
  --info:#7DB3F0; --info-bg:#132C47; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.num,.money,td.n,.kpi b{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;border-bottom:2px solid var(--gold)}
header.band .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
header.band img{height:46px;width:auto;border-radius:6px;background:#fff;padding:2px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--display);font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:#C9D4E2;font-size:11.5px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:#DCE5F0;flex-wrap:wrap;justify-content:flex-end}
.dot{width:9px;height:9px;border-radius:50%;background:#9AA8B8;display:inline-block}
.dot.ok{background:#4ADE80}.dot.warn{background:#FBBF24}.dot.bad{background:#F87171}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 14px;font-weight:700;min-height:40px}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B1B1B}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff;text-decoration:none;white-space:nowrap}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn.small{padding:5px 10px;min-height:34px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;color:var(--muted);padding:12px 14px;font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--navy);border-bottom-color:var(--gold)}
:root[data-theme="dark"] nav.tabs button[aria-current="page"]{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-current="page"]{color:var(--ink)}}
main{padding-block:18px 96px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{color:var(--muted);font-size:13px}
.kpi b{font-size:23px;line-height:1.25;font-weight:800}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi.late b{color:var(--late)}.kpi.ok b{color:var(--ok)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>h2,.panel>.ph{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph h2{margin:0;font-size:16px}
.panel .pb{padding:12px 16px}
.two{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--surface-2);color:var(--muted);font-weight:700;font-size:12.5px;text-align:right;padding:8px 10px;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:left;direction:ltr;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
tr.group td{background:var(--gold-soft);font-weight:800;color:var(--ink)}
tr.total td{background:var(--navy);color:#fff;font-weight:800}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-late{background:var(--late-bg);color:var(--late)}.p-paid{background:var(--ok-bg);color:var(--ok)}
.p-soon,.p-partial{background:var(--soon-bg);color:var(--soon)}.p-future{background:var(--surface-2);color:var(--muted)}
.p-pend{background:var(--info-bg);color:var(--info)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .grow small{color:var(--muted)}
.row .amt{font-weight:800;direction:ltr;white-space:nowrap}
.row button.linkish{all:unset;cursor:pointer;flex:1;min-width:0;display:block}
.row button.linkish b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row button.linkish small{display:block;color:var(--muted)}
td.unit{white-space:nowrap}
@media (max-width:700px){.hide-sm{display:none}td,th{padding:8px 7px}}
.muted{color:var(--muted)}
bdi.d,bdi.u{white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.search{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-height:42px;width:100%}
.search input{flex:1;min-width:0}
input.money{font-size:19px;font-weight:800;text-align:left;direction:ltr}
input.date{text-align:left;direction:ltr}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:13.5px;color:var(--muted)}
.form{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form .full{grid-column:1/-1}
@media (max-width:560px){.form{grid-template-columns:minmax(0,1fr)}}
.client-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.client-head h2{margin:0;font-family:var(--display);font-size:24px;line-height:1.3}
.client-head .acts{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
.facts div{background:var(--surface);padding:10px 12px;min-width:0}
.facts span{display:block;color:var(--muted);font-size:12.5px}
.facts b{font-size:17px;direction:ltr;display:block;text-align:right}
@media (max-width:760px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.banner{border-radius:var(--r);padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.banner.info{background:var(--info-bg);color:var(--info)}
.banner.warn{background:var(--soon-bg);color:var(--soon)}
.banner.bad{background:var(--late-bg);color:var(--late)}
.monthbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.monthbar h2{margin:0;font-family:var(--display);font-size:22px;min-width:150px;text-align:center}
.sheet-back{position:fixed;inset:0;background:rgba(8,15,26,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:3px solid var(--gold)}
@media (min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0 0 4px;font-family:var(--display);font-size:22px}
.sheet .sub{color:var(--muted);margin-bottom:14px}
.sheet .foot{display:flex;gap:10px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);font-weight:700;border-inline-start:4px solid var(--gold)}
.loading{display:flex;flex-direction:column;gap:10px;align-items:center;padding:60px 16px;color:var(--muted);text-align:center}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.note{font-size:12.5px;color:var(--muted)}
[hidden]{display:none!important}
.lock{max-width:420px;margin:24px auto}
.lockbox{display:grid;gap:12px;text-align:center}
.lockbox h2{margin:0;font-family:var(--display);font-size:23px}
.lockbox p{margin:0}
.lockbox input{font-size:18px;text-align:center;letter-spacing:2px}
.lockbox .btn{width:100%;min-height:46px;font-size:16px}
.dchips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center}
.dchip{font:inherit;font-size:13px;min-height:34px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer}
.dchip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1B3A5C;font-weight:700}
.dcustom{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dcustom input{width:84px;min-height:34px;font:inherit;font-size:16px;padding:3px 8px;border-radius:10px;border:1px solid var(--line);background:transparent;color:inherit;text-align:center}
.sep{height:14px}
@media (max-width:700px){
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.tabs .wrap{justify-content:space-around;gap:0}
  nav.tabs button{padding:10px 6px;font-size:12.5px;border-bottom:0;border-top:3px solid transparent;flex:1}
  nav.tabs button[aria-current="page"]{border-top-color:var(--gold)}
  header.band img{height:38px}
  .brand b{font-size:17px}
  .brand small{display:none}
}

/* الوحدات والأبراج */
.ufilters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ulegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:4px 0 2px}
.ulegend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;border:1px solid var(--line)}
.ulegend i.u-available{background:var(--ok-bg);border-color:var(--ok)}
.ulegend i.u-sold{background:var(--surface-2)}
.ufloor+.ufloor{margin-top:12px}
.ufloor h3{margin:0 0 7px;font-size:14px;color:var(--navy)}
:root[data-theme="dark"] .ufloor h3{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ufloor h3{color:var(--ink)}}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.utile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);min-width:0;min-height:74px}
.utile b{font-size:17px;line-height:1.25}
.utile small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.utile .uwho{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.utile.u-available{background:var(--ok-bg);border-color:var(--ok)}
.utile.u-available .uwho{color:var(--ok)}
.utile.u-sold{background:var(--surface-2)}
.utile.u-sold .uwho{color:var(--ink)}
.utile.u-reserved{background:var(--soon-bg);border-color:var(--soon)}
.utile.u-reserved .uwho{color:var(--soon)}
.utile.udup{border-style:dashed;opacity:.92}
.utile .dupmark{font-size:11.5px;font-weight:700;color:var(--muted)}
.utile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.utile:hover{border-color:var(--gold)}
.ubar{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;min-width:60px;margin-top:4px}
.ubar>i{display:block;height:100%;background:var(--gold)}
.ufacts{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.ufacts b{direction:rtl!important;font-size:15px!important}
@media (max-width:520px){.ugrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* مبيعات */
.tabbadge{display:inline-block;min-width:18px;padding:0 5px;margin-inline-start:4px;border-radius:999px;background:var(--late);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:800}
.p-pend{background:var(--info-bg);color:var(--info)}
.sheet h4{margin:16px 0 6px;font-size:15px}
.row .btn.small{flex:none}
.ulegend i.u-reserved{background:var(--soon-bg);border-color:var(--soon)}
.utile b small{font-size:11px;color:var(--muted);font-weight:700}

.dhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}.dhead h2{margin:0;font-family:var(--display);font-size:22px}.dhead .btn{margin-inline-start:auto}
.kpi b.money{direction:ltr;text-align:right}
</style>
</head>

<script>
"use strict";
/* ---------- لوحة المدير ----------
   صفحة واحدة بتجمع من كل البرامج: الحسابات (الخزنة والمقاولين والموردين والمشاريع)، والأقساط، والمبيعات.
   كل برنامج بيتقري من سكربت جوجل بتاعه بكود الربط بتاعه — قراية بس، الصفحة دي عمرها ما بتبعت أي تعديل.
   أكواد الربط وكلمات السر بتتحفظ على التليفون ده بس، ومتشفّرة برقم سري اللوحة. */
const LS = {get(k){try{return JSON.parse(localStorage.getItem("boss_"+k));}catch(e){return null;}},set(k,v){try{localStorage.setItem("boss_"+k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem("boss_"+k);}catch(e){}}};
const MONTHS = ["","يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => (Math.round((+n||0))).toLocaleString("en-US");
const short = n => {n=+n||0;const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(a>=1e7?1:2).replace(/\.?0+$/,"")+" مليون":a>=1e3?Math.round(n/1e3).toLocaleString("en-US")+" ألف":money(n);};
const dmy = iso => iso ? String(iso).slice(0,10).split("-").reverse().join("-") : "—";
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function parseCode(raw){raw=String(raw||"").trim();const m=/^(https:\/\/script\.google\.com\/macros\/s\/[^#?\s]+\/exec)(?:\?[^#]*)?#(.+)$/.exec(raw);return m?{url:m[1],key:decodeURIComponent(m[2])}:null;}
const SOURCES = {acc:"الحسابات",aqsat:"الأقساط",sales:"المبيعات"};

/* ---------- الخزنة المشفّرة على التليفون ---------- */
const te=new TextEncoder(),td=new TextDecoder();
function b64(u8){let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function deriveKey(pw,salt){const base=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
let V=null,VKEY=null,VSALT=null;   // V = {links:{acc,aqsat,sales}, pws:{aqsat,sales}, res:{...آخر أرقام}}
async function openVault(pin){const s=LS.get("vault");if(!s){VSALT=crypto.getRandomValues(new Uint8Array(16));VKEY=await deriveKey(pin,VSALT);V={links:{},pws:{},res:{}};return "new";}
  const salt=unb64(s.salt),k=await deriveKey(pin,salt);try{const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(s.iv)},k,unb64(s.ct));VSALT=salt;VKEY=k;V=Object.assign({links:{},pws:{},res:{}},JSON.parse(td.decode(pt)));return "ok";}catch(e){return "bad";}}
let saving=Promise.resolve();
function persist(){if(!VKEY)return saving;const txt=JSON.stringify(V),k=VKEY,salt=VSALT;
  saving=saving.then(async()=>{const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,te.encode(txt));LS.set("vault",{salt:b64(salt),iv:b64(iv),ct:b64(new Uint8Array(ct))});}).catch(()=>{});return saving;}

/* ---------- سكربتات جوجل (قراية بس) ---------- */
async function call(cfg,op,body){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),45000);let r;
  try{r=await fetch(cfg.url,{method:"POST",body:JSON.stringify(Object.assign({op,key:cfg.key},body||{})),signal:ctl.signal});}
  catch(e){throw new Error(e&&e.name==="AbortError"?"السكربت اتأخر في الرد":"مفيش نت");}finally{clearTimeout(tm);}
  if(!r.ok)throw new Error("السيرفر رد بـ "+r.status);
  let j;try{j=await r.json();}catch(e){throw new Error("رد مش مفهوم — اتأكد من كود الربط");}
  if(!j.ok)throw new Error(j.error||"رد غلط");return j;
}

/* ---------- حسبة الحسابات: بنفس كود برنامج الحسابات بالظبط ----------
   بنجيب صفحة الحسابات نفسها (../index.html) ونشغّلها في إطار مقفول (sandbox من غير تخزين ولا نت)،
   ونحط فيه البيانات وناخد الأرقام من دوالها هي. كده أي تعديل في حسبة الحسابات بيوصل هنا لوحده. */
const BRIDGE = `<script>
window.addEventListener("message",function(ev){
  var out;
  try{
    if(typeof DB==="undefined"||!DB)DB={parties:[],settings:{},audit:[]};
    applyState(JSON.parse(ev.data.state));
    var flow=treasuryFlow(),pos=companyPosition(),con=0,sup=0,top=[];
    DB.parties.forEach(function(p){var t=partyTotals(p);var k=partyKind(p);if(t.rem>0.5){if(k==="contractor")con+=t.rem;else if(k==="supplier")sup+=t.rem;top.push({name:p.name,kind:partyKindName(p),rem:t.rem});}});
    top.sort(function(a,b){return b.rem-a.rem;});
    var projects=projectNames().map(function(n){var s=projectStats(n),g=projectProgress(n),b=projBudget(n);return {name:n,cost:s.gross,paid:s.paid,rem:s.rem,progress:g.progress,spend:g.spend,budget:b.total};}).filter(function(p){return p.cost>0||p.budget>0;});
    out={ok:true,treasuries:Object.keys(flow).map(function(t){return {name:t,balance:flow[t].balance};}),cash:pos.cash,owePay:pos.owePay,oweGet:pos.oweGet,labor:pos.labor,sched:pos.sched,con:con,sup:sup,top:top.slice(0,6),projects:projects};
  }catch(e){out={ok:false,error:String(e&&e.message||e)};}
  parent.postMessage({calc:out,id:ev.data.id},"*");
});
parent.postMessage({ready:true},"*");
<\/script>`;
let calcFrame=null,calcReady=null;
function accCalc(state){
  if(!calcReady)calcReady=(async()=>{
    const r=await fetch("../index.html",{cache:"no-cache"});if(!r.ok)throw new Error("مش قادر أجيب صفحة الحسابات");
    let html=await r.text();const at=html.toLowerCase().lastIndexOf("</body>");html=at>-1?html.slice(0,at)+BRIDGE+html.slice(at):html+BRIDGE;   // آخر </body> بس (فيه نصوص جوه الكود فيها </body>)
    calcFrame=document.createElement("iframe");calcFrame.setAttribute("sandbox","allow-scripts");calcFrame.setAttribute("aria-hidden","true");calcFrame.tabIndex=-1;
    calcFrame.style.cssText="position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0;pointer-events:none";
    await new Promise((res,rej)=>{const tm=setTimeout(()=>rej(new Error("حسبة الحسابات ماشتغلتش")),30000);
      const on=ev=>{if(ev.source===calcFrame.contentWindow&&ev.data&&ev.data.ready){clearTimeout(tm);window.removeEventListener("message",on);res();}};
      window.addEventListener("message",on);calcFrame.srcdoc=html;document.body.appendChild(calcFrame);});
  })();
  return calcReady.then(()=>new Promise((res,rej)=>{const id=Math.random().toString(36).slice(2);const tm=setTimeout(()=>rej(new Error("حسبة الحسابات اتأخرت")),30000);
    const on=ev=>{if(ev.source===calcFrame.contentWindow&&ev.data&&ev.data.id===id){clearTimeout(tm);window.removeEventListener("message",on);ev.data.calc.ok?res(ev.data.calc):rej(new Error(ev.data.calc.error));}};
    window.addEventListener("message",on);calcFrame.contentWindow.postMessage({state,id},"*");}));
}

/* ---------- حسبة الأقساط (نفس قواعد برنامج الأقساط) ---------- */
const left = i => Math.max(Math.round(((+i.amount||0)-(+i.paidAmount||0))*100)/100,0);
function aqsatCalc(D){
  const t=todayISO(),ym=t.slice(0,7);
  const ins=D.installments||[];
  const month=ins.filter(i=>(i.dueDate||"").slice(0,7)===ym);
  const late=ins.filter(i=>(i.dueDate||"")<t&&left(i)>0.005);
  const lateClients=new Set(late.map(i=>i.clientId));
  let collected=0;
  for(const i of ins)for(const p of (i.payments||[]))if(String(p.date||"").slice(0,7)===ym)collected+=+p.amount||0;
  for(const c of D.clients||[])for(const p of (c.downPayments||[]))if(String(p.date||"").slice(0,7)===ym)collected+=+p.amount||0;
  const cheq=(D.cheques||[]).filter(c=>c.status==="held"||c.status==="deposited");
  const contractDate=c=>{const ds=(c.downPayments||[]).map(p=>p.date).filter(Boolean).sort();return ds[0]||c.startDate||c.createdAt||"";};
  const newC=(D.clients||[]).filter(c=>String(contractDate(c)).slice(0,7)===ym);
  const sold=new Set((D.clients||[]).map(c=>c.unitId).filter(Boolean));
  const units=D.units||[];
  const st=u=>sold.has(u.id)||u.status==="sold"?"sold":u.status==="reserved"?"reserved":"available";
  return {
    monthDue:month.reduce((s,i)=>s+(+i.amount||0),0),monthPaid:month.reduce((s,i)=>s+Math.min(+i.paidAmount||0,+i.amount||0),0),monthLeft:month.reduce((s,i)=>s+left(i),0),monthCount:month.length,
    late:late.reduce((s,i)=>s+left(i),0),lateCount:late.length,lateClients:lateClients.size,collected,
    cheques:cheq.reduce((s,c)=>s+(+c.amount||0),0),chequeCount:cheq.length,
    newContracts:newC.length,newValue:newC.reduce((s,c)=>s+(+c.total||0),0),
    units:{all:units.length,available:units.filter(u=>st(u)==="available").length,reserved:units.filter(u=>st(u)==="reserved").length,sold:units.filter(u=>st(u)==="sold").length},
    towers:(D.towers||[]).map(tw=>{const us=units.filter(u=>u.towerId===tw.id);return {name:tw.name,all:us.length,sold:us.filter(u=>st(u)==="sold").length,available:us.filter(u=>st(u)==="available").length};}),
    savedAt:(D._meta&&D._meta.savedAt)||""
  };
}
/* ---------- حسبة المبيعات ---------- */
const OPEN=["new","called","visited","waiting","reserved"];
function salesCalc(S){
  const t=todayISO(),ym=t.slice(0,7),L=S.leads||[];
  const due=L.filter(l=>OPEN.includes(l.stage)&&l.next&&l.next.date&&l.next.date<=t);
  const units=S.units||[];
  return {open:L.filter(l=>OPEN.includes(l.stage)).length,due:due.length,late:due.filter(l=>l.next.date<t).length,
    newLeads:L.filter(l=>String(l.createdAt||"").slice(0,7)===ym).length,
    bought:L.filter(l=>(l.history||[]).some(h=>h.stage==="bought"&&String(h.at||"").slice(0,7)===ym)).length,
    quotes:(S.quotes||[]).filter(q=>String(q.at||"").slice(0,7)===ym).length,
    units:{all:units.length,available:units.filter(u=>u.state==="available").length,reserved:units.filter(u=>u.state==="reserved").length,sold:units.filter(u=>u.state==="sold").length},
    savedAt:(S._meta&&S._meta.savedAt)||""};
}

/* ---------- التحميل ---------- */
let BUSY=false,ERR={},locked=true,lockMsg="",editing=false;
async function load(manual){
  if(BUSY||locked)return;BUSY=true;ERR={};render();
  const L=V.links||{},P=V.pws||{};
  const jobs=[];
  if(L.acc)jobs.push((async()=>{const j=await call(L.acc,"snap_get",{have:""});if(!j.data)throw new Error("اللاب لسه مابعتش نسخة");V.res.acc=Object.assign(await accCalc(j.data),{at:j.at||""});})().catch(e=>ERR.acc=e.message));
  if(L.aqsat)jobs.push((async()=>{const j=await call(L.aqsat,"snap_get",Object.assign({have:""},P.aqsat?{pw:P.aqsat}:{}));if(!j.data)throw new Error("برنامج الأقساط لسه مابعتش نسخة");V.res.aqsat=aqsatCalc(JSON.parse(j.data));})().catch(e=>ERR.aqsat=e.message));
  if(L.sales)jobs.push((async()=>{const j=await call(L.sales,"mobGet",{hash:"",pw:P.sales||""});if(!j.snap)throw new Error("برنامج المبيعات لسه مابعتش نسخة");V.res.sales=salesCalc(JSON.parse(j.snap));})().catch(e=>ERR.sales=e.message));
  await Promise.all(jobs);
  V.res.at=new Date().toISOString();persist();BUSY=false;render();
  if(manual)toast(Object.keys(ERR).length?"اتحدّث بعضه بس":"اتحدّث ✓");
}

/* ---------- الشكل ---------- */
function toast(t){const r=document.getElementById("toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(t)}</div>`;clearTimeout(toast._t);toast._t=setTimeout(()=>r.innerHTML="",2600);}
function setSync(dot,text){document.getElementById("syncDot").className="dot "+(dot||"");document.getElementById("syncText").textContent=text;}
function render(){
  const m=document.getElementById("main");
  if(locked){setSync("bad","مقفول 🔒");m.innerHTML=lockView();setTimeout(()=>{const i=document.getElementById("pin");i&&i.focus();},50);return;}
  const L=V.links||{};
  if(editing||!(L.acc||L.aqsat||L.sales)){setSync("warn","الإعدادات");m.innerHTML=setupView();return;}
  const at=V.res&&V.res.at;setSync(BUSY?"":Object.keys(ERR).length?"warn":"ok",BUSY?"بيحدّث…":at?"اتحدّث "+new Date(at).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"}):"");
  m.innerHTML=dashView();
}
function lockView(){const isNew=!LS.get("vault");return `<form class="lock panel" data-form="unlock"><div class="pb lockbox"><img src="${document.querySelector("header.band img").src}" alt="" style="width:76px;height:76px;object-fit:contain;border-radius:12px;background:#fff;margin:0 auto">
  <h2>لوحة المدير 🔒</h2><p class="muted">${isNew?"اعمل رقم سري للوحة (4 أرقام أو أكتر). أكواد الربط هتتشفّر بيه على التليفون ده.":"اكتب الرقم السري"}</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="${isNew?"new-password":"current-password"}" aria-label="الرقم السري">
  ${isNew?`<input id="pin2" type="password" inputmode="numeric" autocomplete="new-password" aria-label="الرقم السري تاني" placeholder="اكتبه تاني">`:""}
  ${lockMsg?`<div class="banner bad">${esc(lockMsg)}</div>`:""}
  <button class="btn gold" type="submit">${isNew?"اعمل الرقم السري":"افتح"}</button>
  ${isNew?"":`<button class="btn" type="button" data-act="forget">نسيت الرقم السري</button>`}</div></form>`;}
function setupView(){const L=V.links||{},P=V.pws||{};const code=c=>c?esc(c.url+"#"+c.key):"";
  return `<form class="panel" data-form="setup"><div class="ph"><h2>ربط البرامج</h2><span class="note">كل كود بيتحفظ على التليفون ده بس ومتشفّر</span></div><div class="pb form">
   <label class="f full">كود ربط الحسابات<input id="cAcc" dir="ltr" autocomplete="off" value="${code(L.acc)}" placeholder="https://script.google.com/macros/s/…/exec#…"><span class="note">نفس «كود الموبايل» بتاع برنامج الحسابات</span></label>
   <label class="f full">كود ربط الأقساط<input id="cAqsat" dir="ltr" autocomplete="off" value="${code(L.aqsat)}" placeholder="https://script.google.com/macros/s/…/exec#…"></label>
   <label class="f full">كلمة سر موبايل الأقساط<input id="pAqsat" type="password" autocomplete="off" value="${esc(P.aqsat||"")}"></label>
   <label class="f full">كود ربط المبيعات<input id="cSales" dir="ltr" autocomplete="off" value="${code(L.sales)}" placeholder="https://script.google.com/macros/s/…/exec#…"></label>
   <label class="f full">كلمة سر موبايل المبيعات<input id="pSales" type="password" autocomplete="off" value="${esc(P.sales||"")}"></label>
   <div class="banner bad full" id="setErr" hidden></div>
   <div class="full" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn gold" type="submit">💾 احفظ واعرض الأرقام</button>${(L.acc||L.aqsat||L.sales)?`<button class="btn" type="button" data-act="cancelEdit">رجوع</button>`:""}</div>
   <p class="note full">سيب أي برنامج فاضي لو مش عايزه في اللوحة. اللوحة بتقرا بس — مش بتعدّل أي حاجة في أي برنامج.</p></div></form>`;}
function kpi(label,val,sub,cls){return `<div class="kpi ${cls||""}"><span>${label}</span><b class="money">${val}</b><small>${sub||""}</small></div>`;}
function errLine(k){return ERR[k]?`<div class="banner bad"><b>${SOURCES[k]}:</b><span>${esc(ERR[k])} — الأرقام دي من آخر مرة اتحدّثت</span></div>`:"";}
function dashView(){
  const R=V.res||{},A=R.acc,Q=R.aqsat,S=R.sales,L=V.links||{};
  const t=todayISO(),mName=MONTHS[+t.slice(5,7)];
  let h=`<div class="dhead"><h2>${esc(mName)} ${t.slice(0,4)}</h2><button class="btn small" type="button" data-act="edit">⚙ الربط</button></div>`;
  h+=Object.keys(ERR).map(errLine).join("");
  /* الفلوس */
  if(L.acc||L.aqsat){
    h+=`<div class="grid kpis">`;
    if(A)h+=kpi("الفلوس في الخزنة",money(A.cash),A.treasuries.filter(x=>Math.abs(x.balance)>0.5).map(x=>`${esc(x.name)} ${short(x.balance)}`).join(" · ")||"كل الخزن",A.cash<0?"late":"ok");
    if(Q)h+=kpi("اتحصّل الشهر ده",money(Q.collected),"أقساط ومقدمات","ok");
    if(Q)h+=kpi("أقساط مستحقة الشهر ده",money(Q.monthLeft),`${Q.monthCount} قسط · اتدفع ${short(Q.monthPaid)} من ${short(Q.monthDue)}`);
    if(Q)h+=kpi("أقساط متأخرة",money(Q.late),`${Q.lateCount} قسط على ${Q.lateClients} عميل`,Q.late>0.5?"late":"");
    if(A)h+=kpi("علينا للمقاولين",money(A.con),"المستحق اللي لسه مادفعناهوش","");
    if(A)h+=kpi("علينا للموردين",money(A.sup),A.labor>0.5?`وللعمالة ${short(A.labor)}`:"","");
    if(Q&&Q.chequeCount)h+=kpi("شيكات العملاء اللي معانا",money(Q.cheques),`${Q.chequeCount} شيك لسه ماتصرفش`);
    if(A&&A.oweGet>0.5)h+=kpi("لينا عند مقاولين وموردين",money(A.oweGet),"دفعنالهم أكتر من شغلهم");
    h+=`</div><div class="sep"></div>`;
  }
  /* المبيعات والوحدات */
  const U=(S&&S.units)||(Q&&Q.units);
  if(U||S||Q){
    h+=`<div class="grid kpis">`;
    if(U)h+=kpi("وحدات متاحة",U.available,`${U.sold} مباعة${U.reserved?` · ${U.reserved} محجوزة`:""} من ${U.all}`,"ok");
    if(Q)h+=kpi("عقود الشهر ده",Q.newContracts,Q.newContracts?`بقيمة ${short(Q.newValue)}`:"في برنامج الأقساط");
    if(S)h+=kpi("المبيعات: اشتروا الشهر ده",S.bought,`${S.quotes} عرض سعر · ${S.newLeads} عميل جديد`);
    if(S)h+=kpi("متابعات العملاء",S.due,S.late?`${S.late} متأخرة · ${S.open} بنتابعهم`:`${S.open} عميل بنتابعهم`,S.late?"late":"");
    h+=`</div><div class="sep"></div>`;
    if(Q&&Q.towers.length)h+=`<div class="panel scroll"><div class="ph"><h2>الوحدات في كل عمارة</h2></div><table><thead><tr><th>العمارة</th><th class="n">الوحدات</th><th class="n">متاحة</th><th class="n">مباعة</th><th>اتباع</th></tr></thead><tbody>${Q.towers.map(tw=>{const pc=tw.all?Math.round(100*tw.sold/tw.all):0;return `<tr><td><b>${esc(tw.name)}</b></td><td class="n">${tw.all}</td><td class="n" style="color:var(--ok);font-weight:800">${tw.available}</td><td class="n">${tw.sold}</td><td><div class="ubar"><i style="width:${pc}%"></i></div><small class="muted">${pc}%</small></td></tr>`;}).join("")}</tbody></table></div><div class="sep"></div>`;
  }
  /* المشاريع */
  if(A&&A.projects.length){
    h+=`<div class="panel scroll"><div class="ph"><h2>المشاريع</h2><span class="note">التكلفة لحد دلوقتي ونسبة التنفيذ</span></div><table><thead><tr><th>المشروع</th><th class="n">التكلفة</th><th class="n">اتدفع</th><th class="n hide-sm">باقي</th><th>التنفيذ</th></tr></thead><tbody>${A.projects.map(p=>{const pr=p.progress==null?null:Math.round(p.progress);
      return `<tr><td><b>${esc(p.name)}</b>${p.budget?`<br><small class="muted">الميزانية ${short(p.budget)}</small>`:""}</td><td class="n">${short(p.cost)}</td><td class="n">${short(p.paid)}</td><td class="n hide-sm">${short(p.rem)}</td><td>${pr==null?`<small class="muted">مش متسجلة</small>`:`<div class="ubar"><i style="width:${Math.max(0,Math.min(100,pr))}%"></i></div><small class="muted">${pr}%</small>`}</td></tr>`;}).join("")}</tbody></table></div><div class="sep"></div>`;
  }
  if(A&&A.top.length)h+=`<div class="panel"><div class="ph"><h2>أكبر مستحقات علينا</h2></div><div class="list">${A.top.map(x=>`<div class="row"><div class="grow"><b>${esc(x.name)}</b><small>${esc(x.kind)}</small></div><span class="amt">${money(x.rem)}</span></div>`).join("")}</div></div>`;
  if(!A&&!Q&&!S)h+=BUSY?`<div class="loading"><div class="spin"></div><b>بيجمع الأرقام…</b></div>`:`<div class="empty">لسه مفيش أرقام — دوس تحديث.</div>`;
  const ages=[A&&A.at&&["الحسابات",A.at],Q&&Q.savedAt&&["الأقساط",Q.savedAt],S&&S.savedAt&&["المبيعات",S.savedAt]].filter(Boolean);
  if(ages.length)h+=`<p class="note">آخر نسخة من اللاب: ${ages.map(([n,a])=>`${n} ${esc(String(a).replace("T"," ").slice(0,16))}`).join(" · ")}</p>`;
  return h;
}

/* ---------- الأحداث ---------- */
document.addEventListener("submit",async ev=>{
  const f=ev.target.closest("form[data-form]");if(!f)return;ev.preventDefault();const g=id=>document.getElementById(id);
  if(f.dataset.form==="unlock"){const pin=g("pin").value;
    if(!LS.get("vault")){if(pin.length<4){lockMsg="الرقم السري لازم 4 أرقام على الأقل";render();return;}if(pin!==g("pin2").value){lockMsg="الرقمين مش زي بعض";render();return;}}
    const r=await openVault(pin);if(r==="bad"){lockMsg="الرقم السري غلط";render();return;}
    lockMsg="";locked=false;if(r==="new")persist();render();load();return;}
  if(f.dataset.form==="setup"){const er=g("setErr");const links={},bad=[];
    for(const [k,id] of [["acc","cAcc"],["aqsat","cAqsat"],["sales","cSales"]]){const v=g(id).value.trim();if(!v)continue;const c=parseCode(v);if(!c)bad.push(SOURCES[k]);else links[k]=c;}
    if(bad.length){er.hidden=false;er.textContent="كود الربط مش مظبوط: "+bad.join("، ");return;}
    if(!Object.keys(links).length){er.hidden=false;er.textContent="حط كود واحد على الأقل";return;}
    V.links=links;V.pws={aqsat:g("pAqsat").value,sales:g("pSales").value};V.res={};editing=false;await persist();render();load(true);return;}
});
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
  if(a==="edit"){editing=true;render();}
  if(a==="cancelEdit"){editing=false;render();}
  if(a==="forget"){if(confirm("هيتمسح كل أكواد الربط من التليفون ده وتحطها تاني. تكمل؟")){LS.del("vault");V=null;lockMsg="";render();}}
});
document.getElementById("refreshBtn").addEventListener("click",()=>load(true));
document.getElementById("lockBtn").addEventListener("click",()=>{locked=true;V=null;VKEY=null;render();});
let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{if(document.hidden){hiddenAt=Date.now();return;}
  if(!locked&&hiddenAt&&Date.now()-hiddenAt>5*60000){locked=true;V=null;VKEY=null;render();return;}if(!locked)load();});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();

</script>
</body>
</html>
