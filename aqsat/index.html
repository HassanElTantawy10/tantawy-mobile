<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1B3A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الأقساط">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>أقساط الطنطاوي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: navy letterhead band → section tabs → one working column of ledgers; on a phone the tabs move to a bottom bar */
:root{
  --navy:#1B3A5C; --navy-2:#24496f; --gold:#C9A227; --gold-soft:#F4E9C4;
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF2F7; --ink:#14202E; --muted:#5B6878; --line:#D9E0E8;
  --late:#B42318; --late-bg:#FDECEA; --ok:#0F7A4B; --ok-bg:#E6F4EC; --soon:#A15C07; --soon-bg:#FFF3DC;
  --info:#1D5FA8; --info-bg:#E5EFFA;
  --display:"Amiri","Tajawal",serif; --body:"Tajawal","Segoe UI",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#16314e; --navy-2:#1e3d60; --gold:#D8B23A; --gold-soft:#3a3218;
  --bg:#0E1622; --surface:#152131; --surface-2:#1C2B3E; --ink:#E6EDF5; --muted:#9AAABD; --line:#2A3A50;
  --late:#FF8A7A; --late-bg:#3A1A18; --ok:#5FD39A; --ok-bg:#12301F; --soon:#F2B65A; --soon-bg:#3A2A10;
  --info:#7DB3F0; --info-bg:#132C47; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#16314e; --navy-2:#1e3d60; --gold:#D8B23A; --gold-soft:#3a3218;
  --bg:#0E1622; --surface:#152131; --surface-2:#1C2B3E; --ink:#E6EDF5; --muted:#9AAABD; --line:#2A3A50;
  --late:#FF8A7A; --late-bg:#3A1A18; --ok:#5FD39A; --ok-bg:#12301F; --soon:#F2B65A; --soon-bg:#3A2A10;
  --info:#7DB3F0; --info-bg:#132C47; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.num,.money,td.n,.kpi b{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;border-bottom:2px solid var(--gold)}
header.band .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
header.band img{height:46px;width:auto;border-radius:6px;background:#fff;padding:2px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--display);font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:#C9D4E2;font-size:11.5px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:#DCE5F0;flex-wrap:wrap;justify-content:flex-end}
.dot{width:9px;height:9px;border-radius:50%;background:#9AA8B8;display:inline-block}
.dot.ok{background:#4ADE80}.dot.warn{background:#FBBF24}.dot.bad{background:#F87171}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 14px;font-weight:700;min-height:40px}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1B1B1B}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn.small{padding:5px 10px;min-height:34px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;color:var(--muted);padding:12px 14px;font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--navy);border-bottom-color:var(--gold)}
:root[data-theme="dark"] nav.tabs button[aria-current="page"]{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-current="page"]{color:var(--ink)}}
main{padding-block:18px 96px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{color:var(--muted);font-size:13px}
.kpi b{font-size:23px;line-height:1.25;font-weight:800}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi.late b{color:var(--late)}.kpi.ok b{color:var(--ok)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>h2,.panel>.ph{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph h2{margin:0;font-size:16px}
.panel .pb{padding:12px 16px}
.two{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--surface-2);color:var(--muted);font-weight:700;font-size:12.5px;text-align:right;padding:8px 10px;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:left;direction:ltr;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
tr.group td{background:var(--gold-soft);font-weight:800;color:var(--ink)}
tr.total td{background:var(--navy);color:#fff;font-weight:800}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.p-late{background:var(--late-bg);color:var(--late)}.p-paid{background:var(--ok-bg);color:var(--ok)}
.p-soon,.p-partial{background:var(--soon-bg);color:var(--soon)}.p-future{background:var(--surface-2);color:var(--muted)}
.p-pend{background:var(--info-bg);color:var(--info)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .grow small{color:var(--muted)}
.row .amt{font-weight:800;direction:ltr;white-space:nowrap}
.row button.linkish{all:unset;cursor:pointer;flex:1;min-width:0;display:block}
.row button.linkish b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row button.linkish small{display:block;color:var(--muted)}
td.unit{white-space:nowrap}
@media (max-width:700px){.hide-sm{display:none}td,th{padding:8px 7px}}
.muted{color:var(--muted)}
bdi.d,bdi.u{white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.search{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-height:42px;width:100%}
.search input{flex:1;min-width:0}
input.money{font-size:19px;font-weight:800;text-align:left;direction:ltr}
input.date{text-align:left;direction:ltr}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:13.5px;color:var(--muted)}
.form{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form .full{grid-column:1/-1}
@media (max-width:560px){.form{grid-template-columns:minmax(0,1fr)}}
.client-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.client-head h2{margin:0;font-family:var(--display);font-size:24px;line-height:1.3}
.client-head .acts{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
.facts div{background:var(--surface);padding:10px 12px;min-width:0}
.facts span{display:block;color:var(--muted);font-size:12.5px}
.facts b{font-size:17px;direction:ltr;display:block;text-align:right}
@media (max-width:760px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.banner{border-radius:var(--r);padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.banner.info{background:var(--info-bg);color:var(--info)}
.banner.warn{background:var(--soon-bg);color:var(--soon)}
.banner.bad{background:var(--late-bg);color:var(--late)}
.monthbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.monthbar h2{margin:0;font-family:var(--display);font-size:22px;min-width:150px;text-align:center}
.sheet-back{position:fixed;inset:0;background:rgba(8,15,26,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:3px solid var(--gold)}
@media (min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0 0 4px;font-family:var(--display);font-size:22px}
.sheet .sub{color:var(--muted);margin-bottom:14px}
.sheet .foot{display:flex;gap:10px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);font-weight:700;border-inline-start:4px solid var(--gold)}
.loading{display:flex;flex-direction:column;gap:10px;align-items:center;padding:60px 16px;color:var(--muted);text-align:center}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.note{font-size:12.5px;color:var(--muted)}
.dchips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center}
.dchip{font:inherit;font-size:13px;min-height:34px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer}
.dchip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1B3A5C;font-weight:700}
.dcustom{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dcustom input{width:84px;min-height:34px;font:inherit;font-size:16px;padding:3px 8px;border-radius:10px;border:1px solid var(--line);background:transparent;color:inherit;text-align:center}
.sep{height:14px}
@media (max-width:700px){
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.tabs .wrap{justify-content:space-around;gap:0}
  nav.tabs button{padding:10px 6px;font-size:12.5px;border-bottom:0;border-top:3px solid transparent;flex:1}
  nav.tabs button[aria-current="page"]{border-top-color:var(--gold)}
  header.band img{height:38px}
  .brand b{font-size:17px}
  .brand small{display:none}
}
</style>

</head>

<script>
"use strict";
/* ---------- where the data lives ----------
   الكود هنا بس — البيانات في جوجل درايف بتاعك، والموبايل بيكلّمها عن طريق سكربت جوجل (Apps Script) بتاعك.
   كود الربط (رابط السكربت + المفتاح) بيتحفظ على التليفون ده بس. */
const MONTHS = ["","يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const LS = {get(k){try{return JSON.parse(localStorage.getItem("aqsat_"+k));}catch(e){return null;}},set(k,v){try{localStorage.setItem("aqsat_"+k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem("aqsat_"+k);}catch(e){}}};
let CFG = LS.get("cfg"), D = null, liveAt = "", pending = [], outbox = LS.get("outbox") || [], tab = "home", currentClient = null, monthKey = null, loadErr = null, busy = false, lastOk = LS.get("lastOk") || "";

/* ---------- house helpers (from the company standard) ---------- */
function safeEvalFormula(expr){const a="٠١٢٣٤٥٦٧٨٩";let s=String(expr).replace(/[٠-٩]/g,d=>a.indexOf(d));s=s.replace(/,/g,"").replace(/[^0-9+\-*/(). ]/g,"");let i=0;const peek=()=>s[i];const skip=()=>{while(s[i]===" ")i++;};function E(){skip();let v=T();skip();while(peek()==="+"||peek()==="-"){const op=s[i++];const r=T();v=op==="+"?v+r:v-r;skip();}return v;}function T(){skip();let v=F();skip();while(peek()==="*"||peek()==="/"){const op=s[i++];const r=F();v=op==="*"?v*r:(r===0?0:v/r);skip();}return v;}function F(){skip();if(peek()==="+"){i++;return F();}if(peek()==="-"){i++;return -F();}if(peek()==="("){i++;const v=E();skip();if(peek()===")")i++;return v;}const st=i;while(i<s.length&&/[0-9.]/.test(s[i]))i++;const n=parseFloat(s.slice(st,i));return isNaN(n)?0:n;}try{const r=E();return isFinite(r)?r:0;}catch(e){return 0;}}
const formatMoneyDisplay=n=>{if(n===""||n===null||n===undefined)return"";const v=typeof n==="number"?n:parseFloat(n);return isNaN(v)?"":v.toLocaleString("en-US",{maximumFractionDigits:2});};
function parseFlexibleDate(input){const a="٠١٢٣٤٥٦٧٨٩";let s=String(input).trim().replace(/[٠-٩]/g,d=>a.indexOf(d));if(!s)return"";const hasSep=/[/\-.\s]/.test(s);const digits=s.replace(/\D/g,"");let dd,mm,yyyy;if(/^\d{4}-\d{2}-\d{2}$/.test(s)){[yyyy,mm,dd]=s.split("-");}else if(!hasSep&&digits.length===8){dd=digits.slice(0,2);mm=digits.slice(2,4);yyyy=digits.slice(4);}else if(!hasSep&&digits.length===6){dd=digits.slice(0,2);mm=digits.slice(2,4);yyyy="20"+digits.slice(4);}else{const p=s.split(/[/\-.\s]+/).filter(Boolean);if(p.length!==3)return"";[dd,mm,yyyy]=p;if(dd.length===4)[dd,yyyy]=[yyyy,dd];if(yyyy.length===2)yyyy="20"+yyyy;}dd=String(dd).padStart(2,"0");mm=String(mm).padStart(2,"0");const d=+dd,m=+mm,y=+yyyy;if(!(y>=1900&&y<=2200&&m>=1&&m<=12&&d>=1&&d<=31))return"";const pr=new Date(`${yyyy}-${mm}-${dd}T00:00:00`);if(pr.getMonth()+1!==m||pr.getDate()!==d)return"";return`${yyyy}-${mm}-${dd}`;}
const dmy = iso => iso ? String(iso).slice(0,10).split("-").reverse().join("-") : "—";
const dmh = iso => `<bdi class="d">${dmy(iso)}</bdi>`;
const money = n => (Math.round((+n||0)*100)/100).toLocaleString("en-US",{maximumFractionDigits:2});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[ئ]/g,"ي").replace(/ؤ/g,"و").toLowerCase().trim();
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function addDays(iso,n){const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function daysBetween(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);}
function countAr(n,one,two,few,many){n=+n;if(n===1)return `${one} واحد`;if(n===2)return two;if(n>=3&&n<=10)return `${n} ${few}`;return `${n} ${many}`;}
const instCount = n => countAr(n,"قسط","قسطين","أقساط","قسط");
function weekday(iso){return DAYS[new Date(iso+"T00:00:00").getDay()];}

/* ---------- the same rules as the desktop program ---------- */
const find = (arr,id) => (arr||[]).find(x=>x.id===id);
const left = i => Math.max(Math.round(((+i.amount||0)-(+i.paidAmount||0))*100)/100,0);
function isPaid(i){return !!i.paid || (+i.paidAmount||0) >= (+i.amount||0)-0.01;}
function status(i){if(isPaid(i))return"paid";const d=daysBetween(todayISO(),i.dueDate);if(d<0)return"late";if((+i.paidAmount||0)>0)return"partial";if(d<=(+D.settings.reminderDays||5))return"soon";return"future";}
const STATUS = {paid:"مدفوع",late:"متأخر",soon:"مستحق قريب",future:"قادم",partial:"مدفوع جزئي"};
const clientsById = () => Object.fromEntries((D.clients||[]).map(c=>[c.id,c]));
function unitText(c){if(!c)return"";const u=find(D.units,c.unitId);if(!u)return"";const t=find(D.towers,u.towerId);return t?`${t.name} / ${u.number}`:String(u.number||"");}
function towerName(c){const u=c&&find(D.units,c.unitId);const t=u&&find(D.towers,u.towerId);return t?t.name:"بدون برج";}
function insts(cid){return (D.installments||[]).filter(i=>i.clientId===cid).sort((a,b)=>(a.dueDate||"").localeCompare(b.dueDate||"")||(a.index||0)-(b.index||0));}
function overdue(cid,asOf){const t=asOf||todayISO();return insts(cid).filter(i=>(i.dueDate||"")<t&&left(i)>0.005);}
function nextOpen(cid){const t=todayISO();return insts(cid).find(i=>(i.dueDate||"")>=t&&left(i)>0.005);}
function downParts(c){return (c.downPayments||[]).filter(p=>(+p.amount||0)>0).sort((a,b)=>(a.date||"").localeCompare(b.date||""));}
function arrears(cid,before){let a=0,n=0;for(const i of insts(cid)){if((i.dueDate||"")<before){const l=left(i);if(l>0.005){a+=l;n++;}}}return [Math.round(a*100)/100,n];}
function payments(cid){const out=[];for(const i of insts(cid))for(const p of (i.payments||[]))out.push([p.date||"",+p.amount||0]);return out;}
function promiseStatus(c,n){const pd=n.promiseDate;if(!pd)return null;const st=(n.at||"").slice(0,10);const paid=payments(c.id).filter(([d])=>d>=st&&d<=pd).reduce((s,[,a])=>s+a,0);const tg=+n.promiseAmount||0;const kept=tg?paid>=tg-0.01:paid>0;const t=todayISO();if(kept)return"kept";if(t>pd)return"broken";if(t===pd)return"today";return"open";}
const PROMISE = {kept:"اتنفذ",broken:"اتخلف",today:"ميعاده النهارده",open:"مستني"};
const CHEQUE = {held:"في الخزنة",deposited:"اتودّع البنك",cleared:"اتصرف",bounced:"مرتجع"};
function clientTotals(c){const is=insts(c.id);const paid=(+c.down||0)+is.reduce((s,i)=>s+(+i.paidAmount||0),0);const rem=is.reduce((s,i)=>s+left(i),0);const late=overdue(c.id);return {paid,rem,late,lateAmt:late.reduce((s,i)=>s+left(i),0)};}
function overdueClients(){const out=[];for(const c of D.clients||[]){const l=overdue(c.id);if(l.length)out.push({c,late:l,amt:l.reduce((s,i)=>s+left(i),0),oldest:l[0].dueDate});}return out.sort((a,b)=>b.amt-a.amt);}
function pendingCheques(cid){return (D.cheques||[]).filter(ch=>(ch.status==="held"||ch.status==="deposited")&&(!cid||ch.clientId===cid)).sort((a,b)=>(a.dueDate||"").localeCompare(b.dueDate||""));}
function chequeLine(ch,withClient){const c=find(D.clients,ch.clientId);const b=(ch.bank||"").trim();const bank=b?(/^(ال)?بنك/.test(b)?b:"بنك "+b):"";return [withClient?`${c?c.name:"—"} (${unitText(c)})`:"",`شيك ${ch.number||"—"}`,bank,`${money(ch.amount)} ج`,`استحقاق ${dmy(ch.dueDate)}`].filter(Boolean).join(" — ");}

/* ---------- the Google script ---------- */
async function api(op, body, cfg){
  cfg = cfg || CFG;
  if(!cfg || !cfg.url) throw {code:"no_cfg"};
  const ctl = typeof AbortController!=="undefined" ? new AbortController() : null;
  const tm = setTimeout(()=>{ try{ctl&&ctl.abort();}catch(e){} }, 40000);
  let r;
  try{ r = await fetch(cfg.url,{method:"POST",body:JSON.stringify(Object.assign({op,key:cfg.key},body||{})),signal:ctl?ctl.signal:undefined}); }
  catch(e){ throw {code:"offline",message:e&&e.name==="AbortError"?"سكربت جوجل اتأخر في الرد":"مفيش اتصال بسكربت جوجل"}; }
  finally{ clearTimeout(tm); }
  if(!r.ok) throw {code:"http",message:"السيرفر رد بـ "+r.status};
  let j; try{ j = await r.json(); }catch(e){ throw {code:"bad_reply",message:"رد مش مفهوم — اتأكد من كود الربط"}; }
  if(!j.ok) throw {code:"script",message:j.error||"رد غلط"};
  return j;
}
function parseCode(raw){
  raw = String(raw||"").trim();
  const m = /^(https:\/\/script\.google\.com\/macros\/s\/[^#?\s]+\/exec)(?:\?[^#]*)?#(.+)$/.exec(raw);
  return m ? {url:m[1], key:decodeURIComponent(m[2])} : null;
}
async function flushOutbox(){
  for(const e of outbox.filter(x=>!x.sent)){
    await api("entry_put",{entry:e.entry});      // same id if repeated → the program records it once
    e.sent = new Date().toISOString(); LS.set("outbox",outbox);
  }
}
async function load(manual){
  if(busy) return;
  if(!CFG){ render(); return; }
  busy = true; setSync("", "بيحدّث…");
  try{
    if(!D){ const cached = LS.get("base"); if(cached){ D = cached.data; liveAt = cached.at; render(); } }
    await flushOutbox();
    const j = await api("snap_get",{have:liveAt});
    if(j.data){ D = JSON.parse(j.data); liveAt = j.at; LS.set("base",{data:D,at:liveAt}); }
    else if(!j.same && !D){ throw {code:"no_live"}; }
    D.settings = D.settings || {};
    const done = new Set(D.webApplied||[]);
    const rej = Object.fromEntries((D.webRejected||[]).map(r=>[r.id,r.why]));
    const ent = (await api("entries")).entries || [];
    const seen = new Set();
    pending = [];
    for(const e of ent){ if(!e||!e.id||done.has(e.id)||seen.has(e.id)) continue; seen.add(e.id); pending.push(e); }
    outbox = outbox.filter(o=>!done.has(o.entry.id) && !rej[o.entry.id]);
    for(const o of outbox){ if(!seen.has(o.entry.id)){ seen.add(o.entry.id); pending.push(Object.assign({_unsent:!o.sent},o.entry)); } }
    for(const r of (D.webRejected||[])){ const o=(LS.get("mine")||[]).find(x=>x.id===r.id); if(o && Date.now()-new Date(o.at||0).getTime()<3*864e5) pending.push(Object.assign({_rejected:r.why},o)); }
    LS.set("outbox",outbox);
    loadErr = null; lastOk = new Date().toISOString(); LS.set("lastOk",lastOk);
    if(manual) toast("اتحدّث ✓");
  }catch(e){
    loadErr = e;
    if(D){ pending = outbox.map(o=>Object.assign({_unsent:!o.sent},o.entry)); }
    if(manual) toast(e.code==="offline"?"مفيش نت — بيعرض آخر نسخة اتحمّلت":"ما اتحدّثش: "+(e.message||e.code));
  }finally{ busy = false; render(); }
}
async function sendEntry(entry){
  entry.id = entry.id || ("w"+Date.now().toString(36)+Math.random().toString(36).slice(2,7));
  entry.at = entry.at || new Date().toISOString().slice(0,19);
  entry.via = "phone";
  outbox.push({entry,sent:null}); LS.set("outbox",outbox);
  const mine = (LS.get("mine")||[]).slice(-50); mine.push(entry); LS.set("mine",mine);
  pending.push(Object.assign({_unsent:true},entry));
  try{ await flushOutbox(); pending.forEach(p=>{ if(p.id===entry.id) p._unsent=false; }); return true; }
  catch(e){ return false; }
}

function setSync(dot,text){const d=document.getElementById("syncDot");d.className="dot "+(dot==="ok"?"ok":dot==="warn"?"warn":dot==="bad"?"bad":"");document.getElementById("syncText").textContent=text;}
function syncState(){
  if(!CFG){setSync("bad","مش مربوط");return;}
  if(loadErr&&!D){setSync("bad","مش متوصل");return;}
  const saved=D&&D._meta&&D._meta.savedAt; if(!saved){setSync("warn","");return;}
  const ageMin=Math.round((Date.now()-new Date(saved.replace(" ","T")).getTime())/60000);
  const when=ageMin<1?"دلوقتي":ageMin<60?`من ${ageMin} دقيقة`:ageMin<1440?`من ${Math.round(ageMin/60)} ساعة`:dmy(saved.slice(0,10));
  const unsent=outbox.filter(o=>!o.sent).length, wait=pending.filter(p=>!p._rejected).length;
  const off=loadErr&&loadErr.code==="offline";
  setSync(off?"warn":(ageMin<1440?"ok":"warn"),(off?"من غير نت · ":"")+`آخر حفظ في البرنامج ${when}`+(unsent?` · ${unsent} مستني نت`:wait?` · ${wait} في الانتظار`:""));
}

  ${chs.length?`<div class="sep"></div><div class="panel"><div class="ph"><h2>الشيكات</h2></div><div class="list">${chs.map(ch=>`<div class="row"><div class="grow"><b>${esc(chequeLine(ch,false))}</b></div><span class="pill ${ch.status==="bounced"?"p-late":ch.status==="cleared"?"p-paid":"p-soon"}">${CHEQUE[ch.status]}</span></div>`).join("")}</div></div>`:""}
  <div class="sep"></div><div class="panel"><div class="ph"><h2>المتابعة ووعود السداد</h2></div><div class="list">${fu.length?fu.map(n=>{const st=promiseStatus(c,n);return `<div class="row"><div class="grow"><b>${esc(n.text||"—")}</b><small>${esc((n.at||"").slice(0,16).replace("T"," "))}${n.promiseDate?` · وعد يوم ${dmh(n.promiseDate)}${n.promiseAmount?` بـ ${money(n.promiseAmount)}`:""}`:""}</small></div>${st?`<span class="pill ${st==="kept"?"p-paid":st==="broken"?"p-late":"p-soon"}">${PROMISE[st]}</span>`:""}</div>`;}).join(""):`<div class="empty">لسه مفيش متابعة للعميل ده</div>`}</div></div>`;
}

function monthView(){
  const t=todayISO();monthKey=monthKey||t.slice(0,7);
  const [y,m]=monthKey.split("-").map(Number);const lo=`${monthKey}-01`;const cut=lo<t?lo:t;
  const rows=(D.installments||[]).filter(i=>(i.dueDate||"").slice(0,7)===monthKey&&find(D.clients,i.clientId)).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const seen=new Set();let tDue=0,tPaid=0,tLeft=0,tArr=0;
  const body=rows.map(i=>{const c=find(D.clients,i.clientId);let arr=null;if(!seen.has(c.id)){seen.add(c.id);arr=arrears(c.id,cut);tArr+=arr[0];}tDue+=+i.amount||0;tPaid+=+i.paidAmount||0;tLeft+=left(i);const req=left(i)+(arr?arr[0]:0);
    return `<tr class="click" data-client="${c.id}"><td><b>${esc(c.name)}</b></td><td><bdi class="u">${esc(unitText(c))}</bdi></td><td>${i.index}</td><td class="n">${dmh(i.dueDate)}</td><td class="n">${money(i.amount)}</td><td class="n">${money(i.paidAmount)}</td><td class="n">${money(left(i))}</td><td class="n" style="${arr&&arr[0]?"color:var(--late);font-weight:800":""}">${arr?(arr[0]?`${money(arr[0])}<br><small>${instCount(arr[1])}</small>`:"—"):"(فوق)"}</td><td class="n"><b>${money(req)}</b></td><td>${pill(status(i))}</td></tr>`;}).join("");
  const extra=(D.clients||[]).filter(c=>!seen.has(c.id)).map(c=>({c,a:arrears(c.id,cut)})).filter(r=>r.a[0]>0);
  const extraRows=extra.map(r=>{tArr+=r.a[0];return `<tr class="click" data-client="${r.c.id}" style="background:var(--late-bg)"><td><b>${esc(r.c.name)}</b></td><td><bdi class="u">${esc(unitText(r.c))}</bdi></td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td class="n" style="color:var(--late);font-weight:800">${money(r.a[0])}<br><small>${instCount(r.a[1])}</small></td><td class="n"><b>${money(r.a[0])}</b></td><td><span class="pill p-late">متأخرات بس</span></td></tr>`;}).join("");
  return `<div class="monthbar"><button class="btn" data-act="mprev" type="button">→ الشهر اللي قبله</button><h2>${MONTHS[m]} ${y}</h2><button class="btn" data-act="mnext" type="button">الشهر اللي بعده ←</button>${monthKey!==t.slice(0,7)?`<button class="btn small" data-act="mnow" type="button">الشهر الحالي</button>`:""}</div>
  <div class="grid kpis"><div class="kpi"><span>أقساط الشهر</span><b>${money(tDue)}</b><small>${instCount(rows.length)}</small></div><div class="kpi ok"><span>اتحصّل منها</span><b>${money(tPaid)}</b><small>${tDue?Math.round(100*tPaid/tDue)+"%":""}</small></div><div class="kpi late"><span>متأخرات سابقة</span><b>${money(tArr)}</b><small>${monthKey>t.slice(0,7)?"لحد النهارده":"قبل أول الشهر"}</small></div><div class="kpi"><span>إجمالي المطلوب</span><b>${money(tLeft+tArr)}</b><small>المتبقي + المتأخرات</small></div></div>
  <div class="sep"></div>
  <div class="panel scroll"><table><thead><tr><th>العميل</th><th>الوحدة</th><th>القسط</th><th class="n">الاستحقاق</th><th class="n">المبلغ</th><th class="n">المدفوع</th><th class="n">المتبقي</th><th class="n">متأخرات سابقة</th><th class="n">إجمالي المطلوب</th><th>الحالة</th></tr></thead>
  <tbody>${body}${extraRows}${!body&&!extraRows?`<tr><td colspan="10" class="empty">مفيش أقساط في الشهر ده</td></tr>`:""}<tr class="total"><td colspan="4">الإجمالي</td><td class="n">${money(tDue)}</td><td class="n">${money(tPaid)}</td><td class="n">${money(tLeft)}</td><td class="n">${money(tArr)}</td><td class="n">${money(tLeft+tArr)}</td><td></td></tr></tbody></table></div>`;
}

function chequesView(){
  const t=todayISO();const pc=pendingCheques();const done=(D.cheques||[]).filter(c=>c.status==="cleared"||c.status==="bounced").sort((a,b)=>(b.clearedDate||b.bouncedDate||"").localeCompare(a.clearedDate||a.bouncedDate||"")).slice(0,20);
  const waiting=new Set(pending.filter(p=>p.type==="cheque_status").map(p=>p.chequeId));
  const row=ch=>{const late=ch.status==="held"&&ch.dueDate<t;return `<div class="row"><div class="grow"><b>${esc(chequeLine(ch,true))}</b><small>${CHEQUE[ch.status]}${late?" · ميعاده فات ولسه ما اتودعش":""}</small></div>${waiting.has(ch.id)?`<span class="pill p-pend">في الانتظار</span>`:`${ch.status==="held"?`<button class="btn small" data-chq="deposited" data-id="${ch.id}" type="button">اتودّع</button>`:""}<button class="btn small gold" data-chq="cleared" data-id="${ch.id}" type="button">اتصرف</button><button class="btn small" data-chq="bounced" data-id="${ch.id}" type="button">اترفض</button>`}</div>`;};
  return `<div class="panel"><div class="ph"><h2>تحت التحصيل</h2><span class="note">${countAr(pc.length,"شيك","شيكين","شيكات","شيك")} · ${money(pc.reduce((s,c)=>s+(+c.amount||0),0))} ج</span></div><div class="list">${pc.length?pc.map(row).join(""):`<div class="empty">مفيش شيكات تحت التحصيل. تقدر تضيف شيك من صفحة العميل.</div>`}</div></div>
  ${done.length?`<div class="sep"></div><div class="panel"><div class="ph"><h2>آخر الشيكات اللي اتقفلت</h2></div><div class="list">${done.map(ch=>`<div class="row"><div class="grow"><b>${esc(chequeLine(ch,true))}</b></div><span class="pill ${ch.status==="bounced"?"p-late":"p-paid"}">${CHEQUE[ch.status]} ${dmh(ch.clearedDate||ch.bouncedDate)}</span></div>`).join("")}</div></div>`:""}`;
}
function promisesView(){
  const t=todayISO();const all=[];for(const c of D.clients||[])for(const n of c.followups||[]){const st=promiseStatus(c,n);if(st)all.push({c,n,st});}
  const grp=(title,list)=>list.length?`<div class="panel"><div class="ph"><h2>${title}</h2></div><div class="list">${list.map(p=>`<div class="row"><button class="linkish" data-client="${p.c.id}" type="button"><b>${esc(p.c.name)} — <bdi class="u">${esc(unitText(p.c))}</bdi></b><small>وعد يوم ${dmh(p.n.promiseDate)}${p.n.promiseAmount?` بـ ${money(p.n.promiseAmount)}`:""} · ${esc(p.n.text||"")}</small></button><span class="pill ${p.st==="kept"?"p-paid":p.st==="broken"?"p-late":"p-soon"}">${PROMISE[p.st]}</span></div>`).join("")}</div></div><div class="sep"></div>`:"";
  const by=s=>all.filter(p=>p.st===s).sort((a,b)=>a.n.promiseDate.localeCompare(b.n.promiseDate));
  const out=grp("ميعادها النهارده",by("today"))+grp("اتخلفت",by("broken").filter(p=>daysBetween(p.n.promiseDate,t)<=60).reverse())+grp("جاية",by("open"))+grp("اتنفذت (آخر 30 يوم)",by("kept").filter(p=>daysBetween(p.n.promiseDate,t)<=30).reverse());
  return out||`<div class="panel"><div class="empty">مفيش وعود سداد. سجّل وعد من صفحة العميل ← «متابعة / وعد».</div></div>`;
}

/* ---------- forms (bottom sheets) ---------- */
function openSheet(html,onSubmit){
  const root=document.getElementById("sheetRoot");
  root.innerHTML=`<div class="sheet-back" id="sb"><form class="sheet" id="sheetForm" novalidate>${html}<div id="formErr" class="banner bad" hidden></div><div class="foot"><button class="btn gold" type="submit" id="sheetOk">سجّل</button><button class="btn" type="button" id="sheetCancel">إلغاء</button></div></form></div>`;
  const f=document.getElementById("sheetForm");
  wireInputs(f);
  f.addEventListener("keydown",e=>{if(e.key!=="Enter"||e.target.tagName==="TEXTAREA"||e.target.type==="submit")return;const fs=[...f.querySelectorAll("input,select,textarea")].filter(x=>!x.disabled&&!x.hidden&&x.offsetParent);const k=fs.indexOf(e.target);if(k>-1&&k<fs.length-1){e.preventDefault();fs[k+1].focus();}});
  const close=()=>{root.innerHTML="";};
  document.getElementById("sheetCancel").onclick=close;
  document.getElementById("sb").addEventListener("click",e=>{if(e.target.id==="sb")close();});
  f.addEventListener("submit",async e=>{e.preventDefault();const err=document.getElementById("formErr");err.hidden=true;let entry;try{entry=onSubmit(f);}catch(x){err.textContent=x.message;err.hidden=false;return;}
    const ok=document.getElementById("sheetOk");ok.disabled=true;ok.textContent="بيتبعت…";
    const sent=await sendEntry(entry);close();render();
    toast(sent?"اتبعت ✓ — هيتسجل في البرنامج أول ما الكمبيوتر يشوفه":"اتحفظ على التليفون — هيتبعت أول ما النت يرجع");
  });
  const first=f.querySelector("input:not([type=hidden]),select,textarea");if(first)setTimeout(()=>first.focus(),30);
}
function wireInputs(scope){
  scope.querySelectorAll("input.money").forEach(el=>{
    el.setAttribute("inputmode","decimal");
    el.addEventListener("input",()=>{if(el.value.startsWith("="))return;const fromEnd=el.value.length-el.selectionStart;const cl=el.value.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^0-9.]/g,"");const p=cl.split(".");const safe=p.length>1?p[0]+"."+p.slice(1).join(""):cl;el.value=safe===""?"":(safe.endsWith(".")?formatMoneyDisplay(p[0])+".":formatMoneyDisplay(safe));const pos=Math.max(0,el.value.length-fromEnd);try{el.setSelectionRange(pos,pos);}catch(e){}});
    const commit=()=>{if(el.value.startsWith("="))el.value=formatMoneyDisplay(Math.round(safeEvalFormula(el.value.slice(1))*100)/100);};
    el.addEventListener("blur",commit);el.addEventListener("keydown",e=>{if(e.key==="Enter"&&el.value.startsWith("=")){e.preventDefault();e.stopPropagation();commit();}});
  });
  scope.querySelectorAll("input.date").forEach(el=>{
    el.setAttribute("inputmode","numeric");
    el.addEventListener("input",()=>{const d=el.value.replace(/[٠-٩]/g,x=>"٠١٢٣٤٥٦٧٨٩".indexOf(x)).replace(/\D/g,"").slice(0,8);let o=d.slice(0,2);if(d.length>2)o+="-"+d.slice(2,4);if(d.length>4)o+="-"+d.slice(4,8);el.value=o;});
  });
}
const mval=el=>parseFloat(String(el.value).replace(/,/g,""))||0;
function instOptions(c,sel){const open=insts(c.id).filter(i=>left(i)>0.005);return `<option value="">تلقائي — أقدم قسط مفتوح</option>`+open.map(i=>`<option value="${i.id}" ${i.id===sel?"selected":""}>قسط ${i.index} — ${dmh(i.dueDate)} — متبقي ${money(left(i))}${status(i)==="late"?" (متأخر)":""}</option>`).join("");}

function payForm(c){
  const first=overdue(c.id)[0]||nextOpen(c.id);
  openSheet(`<h3>تسجيل دفعة</h3><div class="sub">${esc(c.name)} — <bdi class="u">${esc(unitText(c))}</bdi></div>
  <div class="form">
    <label class="f full" for="pInst">على القسط<select id="pInst">${instOptions(c,first&&first.id)}</select></label>
    <label class="f" for="pAmt">المبلغ<input id="pAmt" class="money" value="${first?formatMoneyDisplay(left(first)):""}" placeholder="0 — أو ابدأ بـ = لمعادلة"></label>
    <label class="f" for="pDate">تاريخ الدفع<input id="pDate" class="date" value="${dmy(todayISO())}" placeholder="يوم-شهر-سنة"></label>
    <label class="f" for="pMethod">طريقة الدفع<select id="pMethod"><option value="cash">نقدي</option><option value="transfer">تحويل</option><option value="cheque">شيك</option></select></label>
    <label class="f" for="pChq">رقم الشيك (لو شيك)<input id="pChq" dir="ltr"></label>
  </div><p class="note">لو المبلغ أكبر من القسط، الباقي بينزل على الأقساط اللي بعده.</p>`,f=>{
    const amt=mval(f.pAmt);if(amt<=0)throw new Error("اكتب المبلغ.");
    const d=parseFlexibleDate(f.pDate.value);if(!d)throw new Error("التاريخ مش صح — اكتبه يوم-شهر-سنة، مثلًا 16102026.");
    const rem=insts(c.id).reduce((s,i)=>s+left(i),0);if(amt>rem+0.01)throw new Error(`المبلغ أكبر من كل المتبقي على العميل (${money(rem)}).`);
    return {type:"payment",clientId:c.id,instId:f.pInst.value||null,amount:amt,date:d,method:f.pMethod.value,chequeNo:f.pChq.value.trim()};
  });
  const f=document.getElementById("sheetForm");f.pInst.addEventListener("change",()=>{const i=find(D.installments,f.pInst.value);if(i)f.pAmt.value=formatMoneyDisplay(left(i));});
}
function followForm(c){
  openSheet(`<h3>متابعة / وعد سداد</h3><div class="sub">${esc(c.name)} — <bdi class="u">${esc(unitText(c))}</bdi></div>
  <div class="form"><label class="f full" for="fText">اللي حصل<textarea id="fText" rows="2" placeholder="كلمته وقال هيدفع آخر الأسبوع"></textarea></label>
  <label class="f" for="fDate">وعد يدفع يوم (اختياري)<input id="fDate" class="date" placeholder="يوم-شهر-سنة"></label>
  <label class="f" for="fAmt">بمبلغ (اختياري)<input id="fAmt" class="money" placeholder="0"></label></div>`,f=>{
    const text=f.fText.value.trim();const raw=f.fDate.value.trim();const d=raw?parseFlexibleDate(raw):"";
    if(raw&&!d)throw new Error("تاريخ الوعد مش صح — اكتبه يوم-شهر-سنة.");
    if(!text&&!d)throw new Error("اكتب اللي حصل أو ميعاد الوعد.");
    return {type:"followup",clientId:c.id,text,promiseDate:d||null,amount:mval(f.fAmt)};
  });
}
function chequeForm(c){
  const first=overdue(c.id)[0]||nextOpen(c.id);
  openSheet(`<h3>شيك جديد</h3><div class="sub">${esc(c.name)} — <bdi class="u">${esc(unitText(c))}</bdi> · الشيك مش بيتحسب فلوس غير لما تعلّم عليه «اتصرف».</div>
  <div class="form"><label class="f full" for="cInst">على القسط<select id="cInst">${instOptions(c,first&&first.id)}</select></label>
  <label class="f" for="cNum">رقم الشيك<input id="cNum" dir="ltr"></label><label class="f" for="cBank">البنك<input id="cBank"></label>
  <label class="f" for="cAmt">المبلغ<input id="cAmt" class="money" value="${first?formatMoneyDisplay(left(first)):""}"></label>
  <label class="f" for="cDue">تاريخ الاستحقاق<input id="cDue" class="date" value="${first?dmy(first.dueDate):""}" placeholder="يوم-شهر-سنة"></label></div>`,f=>{
    if(!f.cNum.value.trim())throw new Error("اكتب رقم الشيك.");const amt=mval(f.cAmt);if(amt<=0)throw new Error("اكتب مبلغ الشيك.");
    const d=parseFlexibleDate(f.cDue.value);if(!d)throw new Error("تاريخ الاستحقاق مش صح.");
    return {type:"cheque",clientId:c.id,instId:f.cInst.value||null,number:f.cNum.value.trim(),bank:f.cBank.value.trim(),amount:amt,dueDate:d,receivedDate:todayISO()};
  });
  const f=document.getElementById("sheetForm");f.cInst.addEventListener("change",()=>{const i=find(D.installments,f.cInst.value);if(i){f.cAmt.value=formatMoneyDisplay(left(i));f.cDue.value=dmy(i.dueDate);}});
}
function chequeStatusForm(ch,st){
  const c=find(D.clients,ch.clientId);const label={deposited:"اتودّع البنك",cleared:"اتصرف",bounced:"اترفض (مرتجع)"}[st];
  openSheet(`<h3>الشيك ${label}</h3><div class="sub">${esc(chequeLine(ch,true))}</div>
  ${st==="cleared"?`<p class="note">هيتسجل دفعة ${money(ch.amount)} ج على أقساط ${esc(c?c.name:"")} بتاريخ الصرف.</p>`:st==="bounced"?`<p class="note">لو كان متسجل «اتصرف» قبل كده، الدفعة بتتشال من الأقساط.</p>`:""}
  <div class="form"><label class="f" for="sDate">التاريخ<input id="sDate" class="date" value="${dmy(todayISO())}"></label></div>`,f=>{
    const d=parseFlexibleDate(f.sDate.value);if(!d)throw new Error("التاريخ مش صح.");
    return {type:"cheque_status",chequeId:ch.id,clientId:ch.clientId,status:st,date:d};
  });
}

/* ---------- events ---------- */
function toast(msg){const r=document.getElementById("toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>{r.innerHTML="";},3800);}
function setTab(t){tab=t;if(t!=="clients")currentClient=null;document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===t?"page":"false"));render();window.scrollTo(0,0);}
function openClient(id){tab="clients";currentClient=id;document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab==="clients"?"page":"false"));render();window.scrollTo(0,0);}
function bindCommon(){
  document.querySelectorAll("[data-client]").forEach(el=>{el.addEventListener("click",()=>openClient(el.dataset.client));el.addEventListener("keydown",e=>{if(e.key==="Enter")openClient(el.dataset.client);});});
  document.querySelectorAll("[data-act]").forEach(el=>el.addEventListener("click",()=>{const a=el.dataset.act;const c=currentClient&&find(D.clients,currentClient);
    if(a==="reload")load(true);else if(a==="connect")connect();else if(a==="unlink"){CFG=null;LS.del("cfg");LS.del("base");D=null;render();}else if(a==="back"){currentClient=null;render();}else if(a==="pay")payForm(c);else if(a==="follow")followForm(c);else if(a==="cheque")chequeForm(c);
    else if(a==="mprev"||a==="mnext"){let [y,m]=monthKey.split("-").map(Number);m+=a==="mnext"?1:-1;if(m<1){m=12;y--;}if(m>12){m=1;y++;}monthKey=`${y}-${String(m).padStart(2,"0")}`;render();}
    else if(a==="mnow"){monthKey=null;render();}}));
  document.querySelectorAll("[data-chq]").forEach(el=>el.addEventListener("click",()=>{const ch=find(D.cheques,el.dataset.id);if(ch)chequeStatusForm(ch,el.dataset.chq);}));
  document.querySelectorAll("[data-days]").forEach(el=>el.addEventListener("click",()=>setDueDays(el.dataset.days)));
  const dd=document.getElementById("dueDaysIn");
  if(dd){const go=()=>{const v=String(dd.value).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).trim();if(!v)return;if(!setDueDays(v))toast("اكتب عدد أيام من 1 لـ 366");};
    dd.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();go();}});dd.addEventListener("change",go);}
  const s=document.getElementById("clientSearch");
  if(s){s.addEventListener("input",()=>{clientQuery=s.value;const pos=s.selectionStart;render();const n=document.getElementById("clientSearch");n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}});}
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(b)setTab(b.dataset.tab);});
document.getElementById("refreshBtn").addEventListener("click",()=>load(true));
window.addEventListener("online",()=>load());
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&(e.code==="KeyF")){e.preventDefault();if(D){if(tab!=="clients"||currentClient){tab="clients";currentClient=null;setTab("clients");}const s=document.getElementById("clientSearch");if(s)s.focus();}}
  if(e.key==="Escape"&&document.getElementById("sheetRoot").innerHTML){document.getElementById("sheetRoot").innerHTML="";}
  if(e.key==="F5"&&!e.ctrlKey){e.preventDefault();load();}
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&D&&!busy)load();});
setInterval(()=>{if(!document.hidden&&!busy&&!document.getElementById("sheetRoot").innerHTML)load();},90000);
/* one-tap setup: a link ending in #c=<code> links this phone and the hash is never sent anywhere */
(function(){const m=/[#&]c=([^&]+)/.exec(location.hash||"");if(m){const cfg=parseCode(decodeURIComponent(m[1]));if(cfg){CFG=cfg;LS.set("cfg",cfg);}try{history.replaceState(null,"",location.pathname);}catch(e){}}})();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
load();
</script>
