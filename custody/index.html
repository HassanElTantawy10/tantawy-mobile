<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="العهدة">
<meta name="robots" content="noindex,nofollow">
<title>العهدة</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --navy:#1B3A5C; --navy-2:#24507D; --gold:#C9A227; --gold-soft:#F5E9C0;
  --slate:#0F172A; --slate-2:#1E293B; --bg:#F1F5F9; --line:#E2E8F0;
  --ink:#0F172A; --mut:#64748B; --amber:#B45309; --amber-bg:#FEF3C7;
  --emer:#047857; --emer-bg:#D1FAE5; --blue:#1D4ED8; --blue-bg:#DBEAFE;
  --red:#B91C1C; --red-bg:#FEE2E2;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.num{direction:ltr; text-align:left; font-variant-numeric:tabular-nums; unicode-bidi:isolate}
.app{display:flex; min-height:100vh}

/* ---------- الشريط الجانبي ---------- */
.sidebar{background:var(--slate); color:#fff; width:250px; flex:0 0 250px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column}
.side-head{display:flex; align-items:center; gap:11px; padding:16px 16px; border-bottom:1px solid var(--slate-2)}
.side-logo{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:9px;padding:3px;flex:0 0 46px}
.side-name{font-weight:700;font-size:14.5px;line-height:1.3}
.side-sub{font-size:10.5px;color:#94A3B8}
.back-btn{display:none;align-items:center;gap:8px;margin:10px 12px 0;padding:8px 12px;border:1px solid #334155;
  background:var(--slate-2);color:#CBD5E1;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600}
.back-btn:hover{background:#334155;color:#fff}
.nav{padding:10px 10px; overflow-y:auto; flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:3px;color:#CBD5E1;text-decoration:none;border-radius:9px;font-size:13.5px;cursor:pointer;transition:.15s;border:none;background:none;width:100%;text-align:right}
.nav a:hover{background:var(--slate-2);color:#fff}
.nav a.on{background:var(--navy);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
.nav .ico{width:19px;text-align:center;opacity:.9;font-size:15px}
.nav .badge{margin-inline-start:auto;background:#334155;color:#E2E8F0;border-radius:20px;padding:0 7px;font-size:11px;font-weight:600}
.side-foot{padding:10px 14px;border-top:1px solid var(--slate-2);font-size:11px;color:#64748B;display:flex;justify-content:space-between;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#22C55E;display:inline-block}

/* ---------- المحتوى ---------- */
.main{flex:1; min-width:0; padding:20px 24px 60px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1.page{font-size:22px;font-weight:800;color:var(--navy);margin:0}
.sub{color:var(--mut);font-size:12.5px;margin:2px 0 0}
.spacer{flex:1}

.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#CBD5E1;background:#F8FAFC}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3F2E00}
.btn.gold:hover{background:#B8931F}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.navy:hover{background:#16304C}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut);padding:6px 9px}
.btn.ghost:hover{background:#E2E8F0;color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--red);border-color:#FCA5A5}
.btn.danger:hover{background:var(--red-bg)}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card.pad{padding:16px 18px}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-t{font-weight:700;color:var(--navy);font-size:14.5px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px;position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--gold)}
.kpi.amber:after{background:#D97706}.kpi.emer:after{background:#059669}.kpi.blue:after{background:#2563EB}.kpi.navy:after{background:var(--navy)}
.kpi .lbl{font-size:12px;color:var(--mut);font-weight:600;margin-bottom:4px}
.kpi .val{font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-.4px}
.kpi .hint{font-size:11.5px;color:var(--mut);margin-top:3px}
.cur{font-size:13px;font-weight:600;color:var(--mut);margin-inline-start:3px}

table{width:100%;border-collapse:collapse}
thead th{background:var(--navy);color:#fff;padding:10px 12px;text-align:right;font-size:12.5px;font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:2}
thead th.num{text-align:left}
tbody td{padding:9px 12px;border-top:1px solid var(--line);font-size:13px;vertical-align:middle}
tbody tr:nth-child(even){background:#F8FAFC}
tbody tr:hover{background:#F1F5F9}
tbody tr.clk{cursor:pointer}
.tbl-wrap{overflow:auto;border-radius:0 0 14px 14px;max-height:70vh}
tfoot td{padding:10px 12px;border-top:2px solid var(--navy);font-weight:800;background:#F8FAFC;font-size:13.5px}

.chip{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.emer{background:var(--emer-bg);color:var(--emer)}
.chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.red{background:var(--red-bg);color:var(--red)}
.chip.gray{background:#F1F5F9;color:var(--mut)}
.chip.gold{background:var(--gold-soft);color:#7A5C00}

.search{position:relative;flex:0 0 300px;max-width:100%}
.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 36px 9px 12px;background:#fff}
.search:before{content:"⌕";position:absolute;inset-inline-start:12px;top:6px;font-size:18px;color:var(--mut)}
input,select,textarea{border:1px solid #CBD5E1;border-radius:9px;padding:8px 11px;background:#fff;width:100%;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.18)}
label{display:block;font-size:12.5px;font-weight:600;color:#334155;margin-bottom:5px}
.f{margin-bottom:13px}
.money{font-size:17px;font-weight:700;text-align:left;direction:ltr;padding:10px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* ---------- كارت الطرف ---------- */
.party-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.avatar{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;flex:0 0 56px}
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px;margin-bottom:18px}
.acc{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer;transition:.15s;position:relative}
.acc:hover{border-color:var(--gold);box-shadow:0 3px 10px rgba(15,23,42,.07)}
.acc.on{border-color:var(--navy);box-shadow:0 0 0 2px rgba(27,58,92,.13)}
.acc .an{font-weight:700;color:var(--navy);font-size:13.5px;margin-bottom:3px}
.acc .am{font-size:11.5px;color:var(--mut);margin-bottom:9px}
.acc .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px}
.acc .row b{font-weight:700}
.bar{height:6px;background:#E2E8F0;border-radius:4px;overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#E0BC4A)}
.bar.done>i{background:linear-gradient(90deg,#059669,#34D399)}
.bar.prog>i{background:linear-gradient(90deg,#1D4ED8,#60A5FA)}
.bar.over>i{background:linear-gradient(90deg,#DC2626,#F87171)}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:9px 15px;cursor:pointer;font-weight:600;font-size:13px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:8px 8px 0 0}
.tabs button:hover{background:#F1F5F9;color:var(--ink)}
.tabs button.on{color:var(--navy);border-bottom-color:var(--gold);background:#fff}

.empty{text-align:center;padding:44px 20px;color:var(--mut)}
.empty .big{font-size:36px;opacity:.35;margin-bottom:8px}

/* ---------- المودال ---------- */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:80;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:0 22px 50px rgba(0,0,0,.28);animation:pop .16s ease-out}
.modal.wide{max-width:880px}
@keyframes pop{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:2px solid var(--gold)}
.modal-h .t{font-weight:800;color:var(--navy);font-size:16px;flex:1}
.modal-b{padding:18px 20px;max-height:66vh;overflow-y:auto}
.modal-f{display:flex;gap:9px;justify-content:flex-start;padding:13px 20px;border-top:1px solid var(--line);background:#F8FAFC;border-radius:0 0 16px 16px}
.x{border:none;background:#F1F5F9;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;color:var(--mut);line-height:1}
.x:hover{background:#E2E8F0;color:var(--ink)}

.calc-box{background:#F8FAFC;border:1px dashed #CBD5E1;border-radius:10px;padding:11px 14px;margin-top:10px;font-size:13px}
.calc-box .ln{display:flex;justify-content:space-between;padding:3px 0}
.calc-box .ln.tot{border-top:1px solid #CBD5E1;margin-top:5px;padding-top:7px;font-weight:800;color:var(--navy);font-size:15px}

.toast{position:fixed;bottom:22px;inset-inline-start:22px;background:var(--slate);color:#fff;padding:11px 18px;border-radius:11px;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:99;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:9px;animation:pop .18s}
.toast.ok{background:#065F46}.toast.err{background:#991B1B}

.note{background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:9px 13px;font-size:12.5px;color:#78350F;margin-bottom:12px}
.hint-k{font-size:11.5px;color:var(--mut);margin-top:4px}
kbd{background:#F1F5F9;border:1px solid #CBD5E1;border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-size:11px;font-family:inherit;color:#334155}


/* ---------- إضافات ---------- */
.nav .badge.red{background:#B91C1C;color:#fff}
.kpi.gold:after{background:var(--gold)}
.alert{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border-radius:9px;margin-bottom:5px;cursor:pointer;font-size:13px;border-inline-start:3px solid transparent;transition:.15s}
.alert:hover{background:#F1F5F9}
.alert.red{background:#FEF2F2;border-color:#DC2626;color:#7F1D1D}
.alert.amber{background:#FFFBEB;border-color:#D97706;color:#78350F}
.alert.blue{background:#EFF6FF;border-color:#2563EB;color:#1E3A8A}
.mini-l{font-size:11.5px;color:var(--mut);font-weight:600}
.mini-v{font-size:18px;font-weight:800}
.res{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.res:hover,.res.on{background:#F1F5F9;border-color:var(--line)}
.res .t{flex:1;min-width:0}
.res .t b{display:block;color:var(--navy)}
.res .t span{font-size:11.5px;color:var(--mut)}



/* ---------- شاشة القفل ---------- */
.lock{position:fixed;inset:0;background:linear-gradient(135deg,#0F172A,#1B3A5C);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.lock-box{background:#fff;border-radius:18px;padding:34px 38px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.lock-box img{width:84px;margin-bottom:14px}
.lock-box h2{margin:0 0 4px;font-size:18px;color:var(--navy)}
.lock-box p{margin:0 0 18px;font-size:12.5px;color:var(--mut)}
.lock-box input{text-align:center;font-size:18px;letter-spacing:3px;padding:11px}
.lock-err{color:var(--red);font-size:12.5px;margin-top:9px;min-height:18px;font-weight:600}
.crash{position:fixed;inset-inline:16px;bottom:16px;background:#7F1D1D;color:#fff;border-radius:12px;padding:13px 17px;z-index:150;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.crash button{margin-inline-start:10px;background:#fff;color:#7F1D1D;border:none;border-radius:8px;padding:5px 13px;font-weight:700;cursor:pointer;font-family:inherit}
.proj-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px}
.proj-card .h{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.proj-card .h b{font-size:15px;color:var(--navy)}
.proj-row{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-bottom:1px dashed #E2E8F0}
.proj-row:last-child{border:none}


/* ---------- التحديد المتعدد وقائمة الزر الأيمن ---------- */
tbody tr.selrow,tbody tr.selrow:nth-child(even){background:#DBEAFE !important}
tbody tr.selrow td{border-top-color:#93C5FD}
tbody tr.selrow td:first-child{box-shadow:inset 3px 0 0 #1D4ED8 !important}
tbody tr.selectable{cursor:default;user-select:none}
.selbar{position:sticky;top:62px;z-index:19;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:#1D4ED8;color:#fff;padding:9px 18px;font-size:13px;font-weight:600;
  box-shadow:0 2px 8px rgba(29,78,216,.25)}
.selbar b{font-size:15px}
.selbar .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}
.selbar .btn:hover{background:rgba(255,255,255,.28)}
.selbar .btn.danger{background:#fff;color:#B91C1C;border-color:#fff}
.ctx{position:fixed;z-index:300;background:#fff;border:1px solid var(--line);border-radius:11px;
  box-shadow:0 12px 34px rgba(15,23,42,.22);padding:5px;min-width:230px;overflow:hidden}
.ctx .ctx-h{padding:7px 12px;font-size:11.5px;color:var(--mut);font-weight:700;border-bottom:1px solid var(--line);margin-bottom:4px}
.ctx button{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;text-align:right;
  padding:8px 12px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--ink)}
.ctx button:hover{background:#F1F5F9}
.ctx button.danger{color:var(--red)}
.ctx button.danger:hover{background:var(--red-bg)}
.ctx button:disabled{opacity:.35;cursor:default}
.ctx button:disabled:hover{background:none}
.ctx .sep{height:1px;background:var(--line);margin:4px 0}
.ctx .k{margin-inline-start:auto;font-size:11px;color:var(--mut)}

/* ---------- تمييز السداد ---------- */
.chip.pay{background:#047857;color:#fff;font-weight:800;letter-spacing:.3px;padding:2px 11px;box-shadow:0 1px 2px rgba(4,120,87,.3)}
.chip.pay:before{content:"●";font-size:8px;margin-inline-end:2px;opacity:.8}
.chip.adv{background:#B45309;color:#fff;font-weight:800;padding:2px 11px}
.chip.late{background:#1D4ED8;color:#fff;font-weight:800;padding:2px 11px}
.chip.nodate{background:#F1F5F9;color:#94A3B8;font-weight:600;border:1px dashed #CBD5E1}
tbody tr.payrow,tbody tr.payrow:nth-child(even){background:#F0FDF4}
tbody tr.inrow,tbody tr.inrow:nth-child(even){background:#ECFDF5}
tbody tr.inrow td:first-child{box-shadow:inset 3px 0 0 #059669}
tbody tr.payrow:hover{background:#DCFCE7}
tbody tr.payrow td{border-top-color:#BBF7D0}
tbody tr.payrow td:first-child{box-shadow:inset 3px 0 0 #047857}
tbody tr.payrow .paid-cell{color:#047857;font-weight:800;font-size:13.5px}
tbody tr.basisrow,tbody tr.basisrow:nth-child(even){background:#FAFAF9}
tbody tr.basisrow td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
tbody tr.adjrow,tbody tr.adjrow:nth-child(even){background:#EFF6FF;font-style:italic}


/* شريط آخر الحركات فوق الدفتر */
.last-bar{display:flex;gap:0;align-items:stretch;flex-wrap:wrap;background:#F8FAFC;border-bottom:1px solid var(--line);padding:0 8px}
.last-cell{padding:10px 14px;border-inline-end:1px solid var(--line);min-width:160px}
.last-cell:last-of-type{border-inline-end:none}
.last-cell.paid{background:#F0FDF4}
.last-l{font-size:11px;color:var(--mut);font-weight:700;margin-bottom:2px}
.last-v{font-size:13.5px;color:var(--ink)}
.last-d{font-size:11px;color:var(--mut);margin-top:2px}

/* شريط الإجمالي الثابت فوق */
.acc-sticky{position:sticky;top:0;z-index:20;background:#F8FAFC;border-bottom:1px solid var(--line);
  box-shadow:0 2px 8px rgba(15,23,42,.06)}

/* الاستيراد */
.imp-tabs{display:flex;gap:4px;margin-bottom:12px}
.imp-tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px;cursor:pointer;font-weight:600;font-size:13px}
.imp-tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#impPaste{font-family:monospace;font-size:12px;direction:ltr;text-align:left;min-height:150px}
.imp-prev{max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.imp-prev table{font-size:12px}
.imp-prev td,.imp-prev th{padding:5px 8px}
.map-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;margin-bottom:6px;font-size:12.5px}

/* ---------- سند الصرف ---------- */
.voucher{border:2px solid var(--navy);border-radius:10px;padding:16px 18px}
.v-tbl{margin-bottom:12px}
.v-tbl td{border:1px solid var(--line);padding:8px 11px;font-size:13.5px}
.v-l{width:105px;background:#F8FAFC;font-weight:700;color:var(--navy);white-space:nowrap}
.v-amt{display:inline-block;background:var(--gold-soft);border:1px solid var(--gold);border-radius:7px;padding:3px 14px;font-size:20px;font-weight:800;color:#3F2E00}
.v-bal{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#F8FAFC;border:1px solid var(--line);border-radius:8px;padding:8px 13px;font-size:12.5px;color:#334155}
.cutline{border-top:2px dashed #94A3B8;margin-top:22px;padding-top:6px;text-align:center;font-size:10.5px;color:#94A3B8}

/* ---------- الطباعة ---------- */
.letterhead{display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--gold);padding-bottom:14px;margin-bottom:20px}
.lh-logo{width:88px;height:auto;object-fit:contain}
.lh-ar{font-weight:800;font-size:18px;color:var(--navy);line-height:1.35}
.lh-en{font-size:10px;color:#94A3B8;letter-spacing:.04em;margin-top:3px}
.doc-title{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;border-radius:8px;padding:10px 16px;margin-bottom:18px;font-weight:700}
.doc-ref{font-size:11px;opacity:.85;font-weight:400}
.sign-row{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:46px;break-inside:avoid}
.sign-line{border-top:1px solid #94A3B8;padding-top:8px;color:#64748B;font-size:13px;text-align:center}
.doc-footer{text-align:center;font-size:10.5px;color:#94A3B8;margin-top:26px}
/* ===== مقاسات الطباعة — جداول البيانات في كل التقارير (#printArea table.pt) =====
   pt = جدول بيانات (ليه عناوين أعمدة). السندات والمستخلصات (جداول من غير عناوين) فاضلة بمقاسها. */
#printArea table.pt{width:100%;max-width:100%;border-collapse:collapse;font-size:10.5px}
#printArea table.pt thead th{position:static;padding:5px 6px;font-size:10px;line-height:1.35;white-space:normal;vertical-align:bottom}
#printArea table.pt tbody td{padding:4px 6px;font-size:10.5px;line-height:1.45;vertical-align:top}
#printArea table.pt tfoot td{padding:5px 6px;font-size:11px}
#printArea table.pt td,#printArea table.pt th{overflow-wrap:break-word}
#printArea .num,#printArea td.dt{white-space:nowrap}
#printArea table.pt .chip{font-size:9.5px;padding:1px 7px}
#printArea table.pt tbody tr.payrow .paid-cell{font-size:11px}
/* التوقيعات والسطر الأخير مايتفصلوش لوحدهم في صفحة فاضية */
#printArea .sign-row,#printArea .keepnext{break-after:avoid}
#printArea .doc-footer{break-before:avoid}
/* لو الجدول لسه أعرض من الورقة — البرنامج بيزوّد الدرجة لوحده (fitPrint) */
#printArea table.pf1 thead th{font-size:9.5px;padding:4px 4px}
#printArea table.pf1 tbody td,#printArea table.pf1 tfoot td{font-size:9.5px;padding:3px 4px}
#printArea table.pf2 thead th{font-size:8.5px;padding:3px 3px}
#printArea table.pf2 tbody td,#printArea table.pf2 tfoot td{font-size:8.5px;padding:3px 3px}
#printArea table.pf2 .chip{font-size:8px;padding:0 5px}
#printArea table.pf3 thead th{font-size:7.5px;padding:2px 2px}
#printArea table.pf3 tbody td,#printArea table.pf3 tfoot td{font-size:7.5px;padding:2px 2px}
#printArea table.pf3 .chip{font-size:7px;padding:0 4px}
#printArea table.pf4 .num,#printArea table.pf4 td.dt{white-space:normal}
/* القاعدة: كل مشروع لوحده — عنوان المشروع وإجماليه جوه الجداول */
tr.projhead td{background:#EEF2F7;color:var(--navy);font-weight:800;font-size:13px;border-top:2px solid var(--gold);padding-top:9px;padding-bottom:9px}
tr.projhead td .pc{font-weight:500;font-size:11.5px;color:var(--mut);margin-inline-start:8px}
tr.projsub td{background:#F8FAFC;font-weight:800;border-top:1px solid #94A3B8;color:var(--navy)}
tr.projsub td:first-child{color:var(--mut);font-weight:700}
tfoot tr.projgrand td{background:#FFFBEB;border-top:3px double var(--navy);font-size:14px}
.projsum td.pn{font-weight:800;color:var(--navy)}
@media print{tr.projhead td,tr.projsub td,tfoot tr.projgrand td{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@keyframes flashrow{0%,45%{background:#FDE68A}100%{background:transparent}}
tr.flashrow td{animation:flashrow 2.4s ease-out}
#printArea{display:none}
/* وضع الطباعة: بنخفي البرنامج ونظهر الورقة بنفسنا — مش مستنيين المتصفح يفعّل ستايل الطباعة.
   ده اللي بيخلي حفظ PDF في نسخة الويندوز يطلع التقرير مش شاشة البرنامج. */
body.printing .app{display:none !important}
body.printing #printArea{display:block !important;padding:0;background:#fff}
body.printing{background:#fff}
body.printing #modalRoot,body.printing #ctxRoot,body.printing #toastRoot,body.printing .no-print{display:none !important}
@page{size:A4;margin:13mm}
@media print{
  .no-print{display:none !important}
  body{background:#fff}
  .app{display:none !important}
  #printArea{display:block !important;padding:0}
  thead th{background:var(--navy) !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tbody tr:nth-child(even){background:#F8FAFC !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc-title,.chip,.kpi:after,.v-amt,.v-l,.voucher,tr.payrow,tr.payrow td,.chip.pay{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tbody tr.payrow,tbody tr.payrow td{background:#F0FDF4 !important}
  .acc-sticky{position:static !important;box-shadow:none !important}
  tr,.avoid-break{break-inside:avoid}
  thead{display:table-header-group}
  tfoot{display:table-row-group}
  table{break-before:auto}
  h1,h2,h3,.doc-title{break-after:avoid}
  .tbl-wrap{max-height:none;overflow:visible}
}
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:static}

  .nav a{width:auto}
  .main{padding:16px 14px 50px}
  .grid2,.grid3{grid-template-columns:1fr}
}

.btn{min-height:38px}
.mbar{position:fixed;top:0;inset-inline:0;z-index:40;background:var(--slate);color:#fff;height:calc(54px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;gap:10px}
.mbar img{width:34px;height:34px;border-radius:9px;flex:0 0 34px}
.mbar .mt{flex:1;min-width:0;line-height:1.25}
.mbar .mt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar .mt span{font-size:11px;color:#94A3B8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mback{background:#1E293B;border:none;color:#fff;width:34px;height:34px;border-radius:9px;font-size:18px;font-family:inherit}
.msync{display:flex;align-items:center;gap:6px;background:#1E293B;border:none;color:#CBD5E1;border-radius:20px;padding:5px 10px;font-size:11.5px;font-family:inherit;white-space:nowrap}
.msync i{width:8px;height:8px;border-radius:50%;background:#22C55E;display:inline-block}
.msync.busy i{background:var(--gold);animation:pulse 1s infinite}
.msync.err i{background:#EF4444}
@keyframes pulse{50%{opacity:.3}}
.mtabs{position:fixed;bottom:0;inset-inline:0;z-index:40;background:#fff;border-top:1px solid var(--line);height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr)}
.mtabs button{border:none;background:none;font-family:inherit;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;position:relative}
.mtabs button .i{font-size:19px;line-height:1}
.mtabs button.on{color:var(--navy)}
.mtabs button.on .i{transform:scale(1.1)}
.mtabs .madd .i{background:var(--gold);color:#3F2E00;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin-top:-18px;box-shadow:0 4px 12px rgba(201,162,39,.45);font-weight:800}
.mtabs em{position:absolute;top:6px;inset-inline-start:calc(50% + 6px);background:#B91C1C;color:#fff;border-radius:10px;font-style:normal;font-size:10px;padding:0 5px;min-width:16px;line-height:16px}
.mmain{padding:12px 12px 24px;max-width:720px;margin:0 auto}
.mkpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mkpis .kpi{padding:10px 12px;border-radius:12px}
.mkpis .kpi .val{font-size:18px}
.mkpis .kpi .lbl{font-size:11.5px;margin-bottom:2px}
.msec{font-weight:800;color:var(--navy);font-size:13.5px;margin:14px 2px 8px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.mcard.grand{background:#FFFBEB;border-color:#FDE68A}
.mch{font-weight:800;color:var(--navy);font-size:14.5px;margin-bottom:6px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
.mrow:last-child{border:none}
.mrow.tot{font-weight:800;border-top:1px solid #CBD5E1;border-bottom:none;margin-top:4px;padding-top:7px}
.mbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mbtns.sticky{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));background:var(--bg);padding:10px 0;margin:0;z-index:5}
.mbtns.sticky .btn{flex:1;justify-content:center;min-height:44px;font-size:14px}
.btn.wide{width:100%;justify-content:center;margin-top:8px}
.mchips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.mchips button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink)}
.mchips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.mmove{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;border-inline-start:3px solid #CBD5E1}
.mmove.in{border-inline-start-color:#059669}
.mmove.rej{opacity:.55;text-decoration:line-through}
.mm1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mm1 .dt{font-size:12px;color:var(--mut);font-weight:600}
.mm1 b{font-size:15.5px}
.pin{color:#047857}.pout{color:var(--ink)}
.mm2{font-size:13.5px;margin-top:4px;line-height:1.5}
.mm2 .sm{display:block;font-size:11.5px;color:var(--mut)}
.mm3{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:4px;gap:8px}
.mflash{animation:mflash 2.4s ease-out}
@keyframes mflash{0%,45%{background:#FDE68A}100%{background:inherit}}
.mfab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));inset-inline-start:16px;width:54px;height:54px;border-radius:50%;border:none;background:var(--gold);color:#3F2E00;font-size:28px;font-weight:800;box-shadow:0 6px 16px rgba(201,162,39,.5);z-index:30}
.mtabs2{position:sticky;top:calc(54px + env(safe-area-inset-top));background:var(--bg);z-index:10;margin:0 -12px 10px;padding:0 12px;overflow-x:auto;flex-wrap:nowrap}
.mtabs2 button{flex:1 0 auto}
.mform .f{margin-bottom:11px}
.grid2m{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3m{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mform .meth-tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
.mform .meth-tabs button{flex:0 0 auto;padding:8px 12px;font-size:13px}
.type-tabs button{padding:11px 6px;font-size:14px}
.tpl-bar{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
.tpl-chip{flex:0 0 auto;padding:6px 12px;font-size:13px}
/* النوافذ بتطلع من تحت وبعرض الشاشة */
.ov{align-items:flex-end;padding:0}
.modal{max-width:100% !important;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom)}
.modal-b{max-height:70vh}
.modal-f .btn{flex:1;justify-content:center;min-height:44px}
.toast{bottom:calc(76px + env(safe-area-inset-bottom));inset-inline:16px;justify-content:center}
.lock{padding:16px}
.lock-box{padding:26px 20px}
.co-item{min-height:52px}
td,th{font-size:13.5px}
@media screen{
  html[data-theme=dark] .mtabs{background:#0B1220;border-color:#1E293B}
  html[data-theme=dark] .mtabs button.on{color:#F3D77A}
  html[data-theme=dark] .mcard,html[data-theme=dark] .mmove,html[data-theme=dark] .mchips button{background:var(--card);border-color:var(--line);color:var(--ink)}
  html[data-theme=dark] .mcard.grand{background:rgba(201,162,39,.10);border-color:rgba(201,162,39,.35)}
  html[data-theme=dark] .mch,html[data-theme=dark] .msec{color:var(--hd)}
  html[data-theme=dark] .mchips button.on{background:#2A5A8C;border-color:#2A5A8C;color:#fff}
  html[data-theme=dark] .pout{color:var(--ink)}
  html[data-theme=dark] .pin{color:#34D399}
  html[data-theme=dark] .mbar{background:#060B16}
}

</style>
</head>

  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) { const t = s.split('-'); yyyy = t[0]; mm = t[1]; dd = t[2]; }
  else if (!hasSep && digits.length === 8) { dd = digits.slice(0, 2); mm = digits.slice(2, 4); yyyy = digits.slice(4); }
  else if (!hasSep && digits.length === 6) { dd = digits.slice(0, 2); mm = digits.slice(2, 4); yyyy = '20' + digits.slice(4); }
  else {
    const parts = s.split(/[/\-.\s]+/).filter(Boolean);
    if (parts.length !== 3) return '';
    dd = parts[0]; mm = parts[1]; yyyy = parts[2];
    if (dd.length === 4) { const t = dd; dd = yyyy; yyyy = t; }
    if (yyyy.length === 2) yyyy = '20' + yyyy;
  }
  dd = String(dd).padStart(2, '0'); mm = String(mm).padStart(2, '0');
  const d = +dd, m = +mm, y = +yyyy;
  if (!(y >= 1900 && y <= 2200 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return '';
  const probe = new Date(yyyy + '-' + mm + '-' + dd + 'T00:00:00');
  if (probe.getMonth() + 1 !== m || probe.getDate() !== d) return '';

}

      const dec = parts.length > 1 ? parts.slice(1).join('').slice(0, 4) : null;

      el.value = (neg ? '-' : '') + intFmt + (dec !== null ? '.' + dec : '');

   ===================================================================== */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function hashPw(pw, saltB64) {
  const salt = saltB64 ? Uint8Array.from(atob(saltB64), c => c.charCodeAt(0)) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pw)), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 120000, hash: 'SHA-256' }, key, 256);
  return { salt: b64(salt), hash: b64(bits) };
}
async function checkPw(pw, rec) { if (!rec) return false; const h = await hashPw(pw, rec.salt); return h.hash === rec.hash; }

const live = m => !(m.type === 'out' && m.status === 'rejected');
const projMoves = pid => C.moves.filter(m => m.projectId === pid || (m.type === 'xfer' && m.toProjectId === pid));

/* أثر الحركة على عهدة (مشروع، شخص): + يعني دخل للعهدة، − يعني خرج منها */
function effect(m, pid, personId) {
  if (!live(m)) return 0;
  const a = num(m.amount);
  let e = 0;
  if (m.type === 'xfer') {
    if (m.projectId === pid && (personId == null || m.personId === personId)) e -= a;
    if (m.toProjectId === pid && (personId == null || m.toPersonId === personId)) e += a;
    return e;
  }
  if (m.projectId !== pid) return 0;
  if (personId != null && m.personId !== personId) return 0;
  return m.type === 'in' ? a : -a;
}
/* ملخص عهدة مشروع (أو شخص جوه مشروع) */
function custodySum(pid, personId) {
  const s = { got: 0, spent: 0, back: 0, xin: 0, xout: 0, bal: 0, pending: 0, pendingAmt: 0, last: '', n: 0 };
  projMoves(pid).forEach(m => {
    if (m.type === 'xfer') {
      const out = m.projectId === pid && (personId == null || m.personId === personId);
      const inn = m.toProjectId === pid && (personId == null || m.toPersonId === personId);
      if (out && inn) { /* نقل جوه نفس المشروع ونفس الشخص — مالوش أثر */ }
      else if (out) s.xout += num(m.amount); else if (inn) s.xin += num(m.amount); else return;
    } else {
      if (m.projectId !== pid || (personId != null && m.personId !== personId)) return;
      if (m.type === 'in') s.got += num(m.amount);
      else if (m.type === 'ret') s.back += num(m.amount);
      else if (m.type === 'out') {
        if (m.status === 'rejected') return;
        s.spent += num(m.amount);
        if (m.status === 'pending') { s.pending++; s.pendingAmt += num(m.amount); }
      }
    }
    s.n++;
    if ((m.date || '') > s.last) s.last = m.date;
  });
  s.bal = r2(s.got + s.xin - s.spent - s.back - s.xout);
  ['got', 'spent', 'back', 'xin', 'xout', 'pendingAmt'].forEach(k => s[k] = r2(s[k]));
  return s;
}
function peopleInProject(pid) {
  const ids = new Set();
  projMoves(pid).forEach(m => {
    if (m.projectId === pid && m.personId) ids.add(m.personId);
    if (m.type === 'xfer' && m.toProjectId === pid && m.toPersonId) ids.add(m.toPersonId);
  });
  return C.people.filter(p => ids.has(p.id));
}
function projectsOfPerson(personId) {
  const ids = new Set();
  C.moves.forEach(m => {
    if (m.personId === personId) ids.add(m.projectId);
    if (m.type === 'xfer' && m.toPersonId === personId) ids.add(m.toProjectId);
  });
  return C.projects.filter(p => ids.has(p.id));
}
function personTotal(personId) {
  const t = { got: 0, spent: 0, back: 0, xin: 0, xout: 0, bal: 0, pending: 0, last: '' };
  projectsOfPerson(personId).forEach(p => {
    const s = custodySum(p.id, personId);
    ['got', 'spent', 'back', 'xin', 'xout', 'bal', 'pending'].forEach(k => t[k] += s[k]);
    if (s.last > t.last) t.last = s.last;
  });
  ['got', 'spent', 'back', 'xin', 'xout', 'bal'].forEach(k => t[k] = r2(t[k]));
  return t;
}

/* ---------- حساب مبلغ المصروف حسب الطريقة ---------- */
function outAmount(f) {
  switch (f.method) {
    case 'unit': return r2(num(f.qty) * num(f.price));
    case 'daily': return r2(num(f.workers) * num(f.days) * num(f.rate));
    case 'pct': return r2(num(f.base) * num(f.pct) / 100);
    case 'extract': return r2(num(f.paid));
    default: return r2(num(f.amount));
  }
}

function extractsOf(pid, partyId, exceptId) {

/* التراكمي السابق: آخر مستخلص قبل ده بالتاريخ */
function prevCumFor(pid, partyId, date, selfId, selfCreated) {
  const list = extractsOf(pid, partyId, selfId);
  let prev = 0;
  list.forEach(e => {
    const before = (e.date || '') < (date || '') || ((e.date || '') === (date || '') && (selfCreated == null || (e.createdAt || 0) < selfCreated));
    if (before) prev = num(e.cum);
  });
  return prev;
}
function extractCalc(f, pid, selfId, selfCreated) {
  const prevCum = prevCumFor(pid, f.partyId, f.date, selfId, selfCreated);
  const cum = num(f.cum);
  const works = r2(cum - prevCum);
  const ret = r2(works * num(f.retPct) / 100);
  const adv = r2(num(f.advDed));
  const ded = r2(num(f.ded));
  const net = r2(works - ret - adv - ded);
  return { prevCum, cum, works, ret, adv, ded, net };
}
function contractOf(pid, partyId) { return (C.contracts || {})[pid + '|' + partyId] || null; }
/* موقف مقاول/مورد جوه مشروع */
function partySum(pid, partyId, exceptId) {
  const s = { n: 0, cum: 0, works: 0, ret: 0, advDed: 0, ded: 0, net: 0, paidX: 0, pay: 0, adv: 0, retRel: 0, other: 0, last: '' };
  C.moves.forEach(m => {
    if (m.type !== 'out' || !live(m) || m.projectId !== pid || m.partyId !== partyId || m.id === exceptId) return;
    if ((m.date || '') > s.last) s.last = m.date;
    switch (m.method) {
      case 'extract': {
        const x = extractCalc(m, pid, m.id, m.createdAt);
        s.n++; s.works += x.works; s.ret += x.ret; s.advDed += x.adv; s.ded += x.ded; s.net += x.net; s.paidX += num(m.amount);
        if (x.cum > s.cum) s.cum = x.cum;
        break;
      }
      case 'advance': s.adv += num(m.amount); break;
      case 'pay': s.pay += num(m.amount); break;
      case 'retrel': s.retRel += num(m.amount); break;
      default: s.other += num(m.amount);
    }
  });
  Object.keys(s).forEach(k => { if (typeof s[k] === 'number') s[k] = r2(s[k]); });
  s.due = r2(s.net - s.paidX - s.pay);          // لسه مستحق له من المستخلصات
  s.advOut = r2(s.adv - s.advDed);              // سلفة لسه ماتخصمتش
  s.retHeld = r2(s.ret - s.retRel);             // محتجز لسه عندنا
  const k = contractOf(pid, partyId);
  s.contract = k ? r2(num(k.value) + num(k.changes)) : 0;
  s.remain = s.contract ? r2(s.contract - s.cum) : 0;
  return s;
}
function partiesInProject(pid) {
  const ids = new Set(C.moves.filter(m => m.projectId === pid && m.partyId && m.type === 'out').map(m => m.partyId));
  Object.keys(C.contracts || {}).forEach(k => { const [p, q] = k.split('|'); if (p === pid) ids.add(q); });

const hm = s => { const m = /^(\d{1,2}):(\d{2})/.exec(String(s || '')); return m ? (+m[1]) * 60 + (+m[2]) : null; };

/* ---------- الكلام مع سكربت جوجل ---------- */
async function call(op, body, cfg) {
  try { return await call1(op, body, cfg); }
  catch (e) { if (!/رد مش مفهوم|السيرفر رد/.test(e.message)) throw e; await new Promise(r => setTimeout(r, 2000)); return call1(op, body, cfg); }
}
async function call1(op, body, cfg) {
  cfg = cfg || M.cfg; if (!cfg || !cfg.url) throw new Error('الموبايل مش مربوط');
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const tm = setTimeout(() => { try { ctl && ctl.abort(); } catch (e) { } }, 40000);
  let r;
  try { r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify(Object.assign({ op, key: cfg.key }, body || {})), signal: ctl ? ctl.signal : undefined }); }
  catch (e) { throw new Error(e && e.name === 'AbortError' ? 'سكربت جوجل اتأخر في الرد' : 'مفيش نت أو سكربت جوجل مش بيرد'); }
  finally { clearTimeout(tm); }
  if (!r.ok) throw new Error('السيرفر رد بـ ' + r.status);
  let j; try { j = await r.json(); } catch (e) { throw new Error('رد مش مفهوم — اتأكد من كود الربط'); }
  if (!j.ok) throw new Error(j.error || 'رد غلط');
  return j;
}
function parseLink(code) {
  let s = String(code || '').trim();
  const h = /#link=([^&\s]+)/.exec(s); if (h) s = decodeURIComponent(h[1]);
  s = s.replace(/\s+/g, '');
  const m = /^(https:\/\/script\.google\.com\/(?:a\/[^/]+\/)?macros\/s\/[A-Za-z0-9_-]+\/exec)#([A-Za-z0-9]{16,})$/.exec(s);
  return m ? { url: m[1], key: m[2] } : null;
}

const appliedRev = id => ((M.base && M.base.mobApplied) || {})[id] || 0;
/* أي حركة اللاب دخّلها (بأي نسخة) بقى اللاب هو المرجع ليها */
function entryState(e) {
  if (appliedRev(e.id) > 0 || e.locked) return 'done';
  if (e.sentRev >= e.rev) return 'sent';
  return 'local';
}
function pendingEntries() {
  const mine = M.outbox.filter(e => e.coId === M.coId && !e.del && entryState(e) !== 'done').map(e => ({ id: e.id, rev: e.rev, data: e.data, state: entryState(e), mine: true }));
  const ids = new Set(M.outbox.map(e => e.id));
  const others = (M.meta.inbox || []).filter(it => !ids.has(it.id) && !appliedRev(it.id)).map(it => ({ id: it.id, rev: it.rev, data: it.data, state: 'sent', mine: false }));
  return mine.concat(others);
}
function entryToMove(p, people, parties) {
  const d = p.data || {};
  const pick = (list, id, name, extra) => {
    if (id && list.some(x => x.id === id)) return id;
    const n = String(name || '').trim(); if (!n) return '';
    const ex = list.find(x => norm(x.name) === norm(n)); if (ex) return ex.id;
    const t = Object.assign({ id: 'tmp:' + norm(n), name: n, _tmp: true }, extra || {}); list.push(t); return t.id;
  };
  const m = Object.assign({}, d, { id: p.id, src: 'mobile', _pend: p.state, _mine: p.mine, status: d.type === 'out' ? (d.status || 'ok') : undefined });
  m.personId = pick(people, d.personId, d._personName);
  if (d.type === 'xfer') m.toPersonId = pick(people, d.toPersonId, d._toPersonName);
  if (d.partyId || d._partyName) m.partyId = pick(parties, d.partyId, d._partyName, { kind: '' });
  m.amount = d.type === 'out' ? outAmount(d) : r2(d.amount);

}

  C = Object.assign({}, emptyBase(), b, { people, parties, moves, trash: [], dupOk: [] });
  C.settings = Object.assign({ cats: [], units: [] }, b.settings || {});
}

/* ---------- المزامنة ---------- */
async function sendOutbox() {
  const todo = M.outbox.filter(e => e.sentRev < e.rev);
  if (!todo.length) return 0;
  const r = await call('mobPut', { entries: todo.map(e => ({ id: e.id, rev: e.rev, coId: e.coId, del: !!e.del, data: e.data, by: 'mobile' })) });
  let n = 0;
  todo.forEach(e => {
    const st = r.results && r.results[e.id];
    if (st === 'ok' || st === 'deleted' || st === 'old') { e.sentRev = e.rev; e.err = ''; n++; }
    else if (st === 'applied') { e.sentRev = e.rev; e.locked = true; e.err = 'اللاب كان دخّلها قبل التعديل ده — التعديل ماتسجلش. عدّلها من اللاب.'; }
  });
  M.outbox = M.outbox.filter(e => !(e.del && e.sentRev >= e.rev));
  lsSet('outbox', M.outbox);
  return n;
}

function cancelAdd() { M.draft = null; go(M.prevView || 'home', M.prevSub || {}); }
function useTpl(id) {
  const x = byId(C.templates, id); if (!x) return; readDraft();
  const keep = { projectId: M.draft.projectId, date: M.draft.date };
  M.draft = Object.assign({ status: 'ok' }, JSON.parse(JSON.stringify(x)), keep); delete M.draft.id; delete M.draft.name;
  if (!M.draft._personName) M.draft._personName = lastUsed().person || '';
  render(); setTimeout(() => { const f = $('#fQty') || $('#fAmt') || $('#fWorkers'); if (f) { f.focus(); f.select(); } }, 60);
}
function fLive() {
  if (!M.draft || !$('#fCalc')) return; readDraft();
  const D = M.draft; let h = '';
  const L = (a, b, c) => `<div class="ln ${c || ''}"><span>${a}</span><span class="num">${b}</span></div>`;
  const amt = D.type === 'out' ? outAmount(D) : num(D.amount);
  if (D.type === 'out' && ['unit', 'daily', 'pct'].includes(D.method)) h += L({ unit: `${fmt2(D.qty)} ${esc(D.unit || '')} × ${fmt2(D.price)}`, daily: `${fmt2(D.workers)} × ${fmt2(D.days)} × ${fmt2(D.rate)}`, pct: `${fmt2(D.pct)}% من ${fmt2(D.base)}` }[D.method], '');
  h += L('الإجمالي', fmt2(amt), 'tot');
  const pe = C.people.find(p => norm(p.name) === norm(D._personName || ''));
  if (pe && D.projectId) {
    let before = custodySum(D.projectId, pe.id).bal;
    if (D._edit) { const old = byId(C.moves, D._edit); if (old) before = r2(before - effect(old, D.projectId, pe.id)); }
    const after = r2(D.type === 'in' ? before + amt : before - amt);
    h += `<div class="ln sub"><span>عهدة ${esc(pe.name)}: قبل ${balWord(before, true)}</span><span>بعد ${balWord(after, true)}</span></div>`;
  } else if (D._personName) h += `<div class="hint-k">«${esc(D._personName)}» اسم جديد — هيتضاف على اللاب</div>`;
  $('#fCalc').innerHTML = `<div class="calc-box">${h}</div>`;
}
async function saveEntry(again) {
  readDraft();
  const D = M.draft, err = t => { $('#fErr').innerHTML = `<div class="err-box">${t}</div>`; $('#fErr').scrollIntoView({ block: 'center' }); };
  if (!D.projectId) return err('اختار المشروع');
  const date = parseFlexibleDate(D.date); if (!date) return err('التاريخ مش مظبوط. اكتبه كده: 01022026');
  if (!String(D._personName || '').trim()) return err('اكتب اسم صاحب العهدة');
  if (D.type === 'out' && ['advance', 'pay'].includes(D.method) && !String(D._partyName || '').trim()) return err('اكتب اسم المقاول');
  const amt = D.type === 'out' ? outAmount(D) : r2(D.amount);
  if (!(amt > 0)) return err('اكتب المبلغ');
  const data = { projectId: D.projectId, date, type: D.type, _personName: String(D._personName).trim(), note: String(D.note || '').trim(), createdAt: D.createdAt || Date.now() };
  const pe = C.people.find(p => !p._tmp && norm(p.name) === norm(data._personName)); if (pe) data.personId = pe.id;
  if (D.type === 'in') { data.amount = amt; data.source = String(D.source || '').trim(); }
  else if (D.type === 'ret') data.amount = amt;
  else {
    Object.assign(data, { method: D.method, item: String(D.item || '').trim(), cat: D.cat || '', invNo: String(D.invNo || '').trim(), status: D.status || 'ok' });
    ({ unit: ['qty', 'unit', 'price'], daily: ['workers', 'days', 'rate'], pct: ['base', 'pct'] }[D.method] || ['amount']).forEach(k => data[k] = k === 'unit' ? String(D.unit || '').trim() : r2(D[k]));
    if (String(D._partyName || '').trim()) { data._partyName = D._partyName.trim(); const pa = C.parties.find(p => !p._tmp && norm(p.name) === norm(data._partyName)); if (pa) data.partyId = pa.id; }
    if (!data.item) data.item = METHODS[D.method].t;
  }
  /* تكرار؟ نفس اليوم ونفس المبلغ ونفس البيان في نفس المشروع */
  if (!D._edit && !D._dupOk) {
    const dup = C.moves.find(m => m.projectId === data.projectId && m.date === date && r2(m.amount) === amt && m.type === data.type && norm(m.item || '') === norm(data.item || ''));
    if (dup) { M.draft._dupOk = true; return err(`⚠ فيه حركة بنفس اليوم ونفس المبلغ${data.item ? ' ونفس البيان' : ''} (${esc(personName(dup.personId))}). لو دي حاجة تانية دوس «احفظ» تاني.`); }
  }
  let e;
  if (D._edit) { e = M.outbox.find(x => x.id === D._edit); if (!e) return err('الحركة دي مش موجودة'); if (entryState(e) === 'done') return err('اللاب دخّلها خلاص — عدّلها من اللاب'); e.data = data; e.rev++; e.err = ''; }
  else { e = { id: 'mb' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), rev: 1, sentRev: 0, coId: M.coId, data, at: new Date().toISOString() }; M.outbox.push(e); }
  lsSet('outbox', M.outbox);
  lsSet('last_' + M.coId, { pid: data.projectId, type: data.type, method: data.method || lastUsed().method, person: data._personName });
  compose();
  toast(D._edit ? 'اتعدّل ✓' : 'اتسجل ✓', 'ok');
  if (again) { const keep = { projectId: data.projectId, type: data.type, method: data.method || 'lump', date: dsp(date), _personName: data._personName, status: 'ok', cat: data.cat || '', unit: data.unit || '', source: data.source || '' }; M.draft = keep; render(); setTimeout(() => { const f = $('#fItem') || $('#fAmt'); if (f) f.focus(); }, 60); }
  else { M.draft = null; M.flash = e.id; go('project', { pid: data.projectId }); }
  sendSoon();
}
let sendT = null;
function sendSoon() { clearTimeout(sendT); sendT = setTimeout(() => refresh(false), 800); }
function delEntry(id) {
  const e = M.outbox.find(x => x.id === id); if (!e) return;
  askYesNo('مسح', 'هتمسح الحركة دي من الموبايل؟ (لسه اللاب مادخّلهاش)', () => {
    if (e.sentRev > 0) { e.del = true; e.rev++; } else M.outbox = M.outbox.filter(x => x.id !== id);
    lsSet('outbox', M.outbox); compose(); render(); toast('اتمسحت', 'ok'); sendSoon();
  }, 'امسح', true);
}

/* ---------- اللي اتبعت ---------- */
MV.out = () => {
  const mine = M.outbox.filter(e => e.coId === M.coId && !e.del).sort((a, b) => (b.at || '').localeCompare(a.at || ''));
  const grp = { local: [], sent: [], done: [] }; mine.forEach(e => grp[entryState(e)].push(e));
  const line = e => { const d = e.data, a = d.type === 'out' ? outAmount(d) : num(d.amount); return `<div class="mmove" onclick="${entryState(e) === 'done' ? '' : `moveSheet('${e.id}')`}"><div class="mm1"><span class="dt">${dsp(d.date)}</span><span class="chip ${d.type === 'in' ? 'emer' : d.type === 'ret' ? 'blue' : 'gray'}">${d.type === 'out' ? 'مصروف' : TYPES[d.type].t}</span><span class="spacer"></span><b class="num">${fmt2(a)}</b></div>
    <div class="mm2">${esc(d.item || d.note || '')}</div><div class="mm3"><span>${esc(projName(d.projectId))} · ${esc(d._personName || '')}</span></div>${e.err ? `<div class="err-box" style="margin-top:6px">${esc(e.err)}</div>` : ''}</div>`; };
  return `${grp.local.length ? `<div class="msec">⏳ لسه مااتبعتش (${grp.local.length})</div><div class="hint-k" style="margin:-4px 0 8px">هتتبعت لوحدها أول ما النت يرجع</div>${grp.local.map(line).join('')}<button class="btn navy wide" onclick="refresh(true)">📤 ابعت دلوقتي</button>` : ''}
    ${grp.sent.length ? `<div class="msec">📱 وصلت جوجل — مستنية اللاب (${grp.sent.length})</div><div class="hint-k" style="margin:-4px 0 8px">اللاب بيدخّلها لوحده لما يكون مفتوح ومربوط. لحد كده تقدر تعدّلها أو تمسحها.</div>${grp.sent.map(line).join('')}` : ''}
    ${grp.done.length ? `<div class="msec">✓ اتسجلت على اللاب (آخر 3 أيام)</div>${grp.done.map(line).join('')}` : ''}
    ${!mine.length ? emptyBox('📤', 'مفيش حركات اتسجلت من الموبايل لسه.<br>دوس ＋ تحت عشان تسجل.') : ''}`;
};
/* ---------- المزيد ---------- */
MV.more = () => {
  const u = DB.ui, [cls, st] = syncText();
  return `<div class="mcard"><div class="mch">🔄 المزامنة</div><div class="mrow"><span>الحالة</span><b>${esc(st)}</b></div>${M.err ? `<div class="err-box">${esc(M.err)}</div>` : ''}
      <div class="mrow"><span>آخر نسخة من اللاب</span><b>${M.meta.at ? dspTime(M.meta.at) : '—'}</b></div><div class="mrow"><span>آخر مرة اللاب اتصل</span><b>${M.lapAt ? dspTime(M.lapAt) : '—'}</b></div>
      <button class="btn gold wide" onclick="refresh(true)">🔄 زامن دلوقتي</button></div>
    <div class="mcard"><div class="mch">🌓 الوضع الغامق</div><div class="meth-tabs">${[['auto', '🌓 بالتوقيت'], ['dark', '🌙 غامق'], ['light', '☀ فاتح']].map(([k, t]) => `<button class="${u.theme === k ? 'on' : ''}" onclick="DB.ui.theme='${k}';lsSet('ui',DB.ui);render()">${t}</button>`).join('')}</div><div class="hint-k">بالتوقيت: غامق من ${esc(u.from)} لحد ${esc(u.to)}</div></div>
    <div class="mcard"><div class="mch">🏢 الشركة</div><div class="mrow"><span>${esc(coName())}</span></div>
      <div class="mbtns">${M.cos.length > 1 ? `<button class="btn" onclick="lsSet('unlock',null);M.coId=null;loginSel=null;screenLogin()">🔁 تبديل الشركة</button>` : ''}<button class="btn" onclick="lockApp()">🔒 قفل</button></div></div>
    <div class="mcard"><div class="mch">📲 على الشاشة الرئيسية</div><div class="hint-k">آيفون: زرار المشاركة ⬆ ← «Add to Home Screen». أندرويد: ⋮ ← «Add to Home screen» أو «Install app». بيفتح زي البرنامج ومن غير نت كمان.</div></div>
    <div class="mcard"><div class="mch">⚙ الربط</div><div class="hint-k">التليفون ده مربوط بسكربت جوجل بتاع العهدة. لو فصلته هتحتاج لينك الموبايل تاني من اللاب.</div><button class="btn danger" onclick="unlink()">افصل الربط من التليفون ده</button></div>
    <div class="hint-k" style="text-align:center">برنامج العهدة — موبايل ${MVER}</div>`;
};
function unlink() {
  const pend = M.outbox.filter(e => entryState(e) === 'local').length;
  askYesNo('فصل الربط', `هيتمسح الربط والبيانات من التليفون ده.${pend ? `<div class="warn-box">⚠ فيه ${pend} حركة لسه مااتبعتش وهتضيع!</div>` : ''}`, () => {
    try { Object.keys(localStorage).filter(k => k.startsWith('custody_m_')).forEach(k => localStorage.removeItem(k)); } catch (e) { }
    location.reload();
  }, 'افصل', true);
}
const dspTime = iso => { if (!iso) return '—'; const d = new Date(iso); if (isNaN(d)) return String(iso).replace('T', ' ').slice(0, 16); return dsp(iso.slice(0, 10)) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

/* ---------- التشغيل ---------- */
(function init() {
  applyTheme();
  const h = location.hash;
  if (/#link=/.test(h)) {
    const p = parseLink(h);
    history.replaceState(null, '', location.pathname + location.search);   // الكود مايفضلش في العنوان
    if (p) { screenLink(''); doLink(h); return; }
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  if (!M.cfg) return screenLink('');
  screenLogin();
  call('mobInit').then(r => { M.cos = r.companies || []; M.lapAt = r.lapAt || ''; lsSet('cos', M.cos); lsSet('lapAt', M.lapAt); if (!M.coId) screenLogin(); }).catch(() => { });
})();

</script>
